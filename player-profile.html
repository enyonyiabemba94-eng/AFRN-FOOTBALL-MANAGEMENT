<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN Football Management - Player Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><style>:root{--navy:#071a33;--blue:#0d47a1;--bg:#f4f7fb;--muted:#667085;--border:#e1e6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172033}main{padding:14px;max-width:760px;margin:auto}.back{border:0;background:#fff;padding:10px 13px;border-radius:11px;font-weight:800;margin-bottom:12px}.hero{background:linear-gradient(135deg,#06152b,#0d47a1);color:#fff;border-radius:20px;padding:18px;display:flex;gap:15px;align-items:center}.photo{width:92px;height:92px;border-radius:18px;object-fit:cover;background:#eef2f7;border:3px solid #fff}.avatar{width:92px;height:92px;border-radius:18px;background:#fff2;display:flex;align-items:center;justify-content:center;font-size:38px}.name{font-size:22px;font-weight:900}.id{font-size:11px;opacity:.8;margin-top:5px;word-break:break-all}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{background:#ffffff22;border:1px solid #ffffff33;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.section{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 3px 12px #14213d10}.section h3{margin:0 0 10px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#f7f9fc;border-radius:10px;padding:9px;font-size:12px}.item b{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.row{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}.row:last-child{border-bottom:0}.status{padding:10px;border-radius:10px;background:#eef4ff;color:#174ea6;font-size:12px;font-weight:700}.free{background:#e9f7ef;color:#0f5132}.error{background:#fdecec;color:#842029}@media(max-width:520px){.name{font-size:19px}}</style></head><body><main><button class="back" id="back">← Rudi</button><div id="app"><div class="section">⏳ Inapakia profile...</div></div></main><script>const db=window.supabaseClient;const PHOTO_BUCKET='AFRN PLAYER PHOTOS';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('sw-TZ',{day:'2-digit',month:'short',year:'numeric'}):'—';const getPlayerPhotoUrl=v=>{const value=String(v??'').trim();if(!value)return '';if(/^https?:\/\//i.test(value))return value;const path=value.replace(/^\/+/, '').replace(/^AFRN%20PLAYER%20PHOTOS\//i,'').replace(/^AFRN PLAYER PHOTOS\//i,'');const {data}=db.storage.from(PHOTO_BUCKET).getPublicUrl(path);return data?.publicUrl||''};const qs=new URLSearchParams(location.search),id=qs.get('id');document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='./players.html';async function load(){if(!db||!id){document.getElementById('app').innerHTML='<div class="section error">❌ Player ID haipo.</div>';return}const {data:p,error}=await db.from('players').select('*').eq('id',id).maybeSingle();if(error||!p){document.getElementById('app').innerHTML='<div class="section error">❌ Mchezaji hakupatikana.</div>';return}const [{data:contracts},{data:transfers}]=await Promise.all([db.from('player_contracts').select('*').eq('player_id',p.id).order('end_date',{ascending:false}),db.from('transfers').select('*').eq('player_id',p.id).order('transfer_date',{ascending:false})]);const clubIds=[p.club_id,...(contracts||[]).map(c=>c.club_id),...(transfers||[]).flatMap(t=>[t.from_club_id,t.to_club_id])].filter(Boolean);let clubs=[];if(clubIds.length){const {data}=await db.from('clubs').select('id,name,division,afrn_club_id,logo_url').in('id',[...new Set(clubIds)]);clubs=data||[]}const clubMap=Object.fromEntries(clubs.map(c=>[c.id,c]));const today=new Date().toISOString().slice(0,10);const validContracts=(contracts||[]).filter(c=>(!c.start_date||c.start_date<=today)&&(!c.end_date||c.end_date>=today)&&!['EXPIRED','CANCELLED','TERMINATED'].includes(String(c.status||'').toUpperCase()));const active=validContracts.find(c=>['ACTIVE','EXPIRING','EXPIRING SOON','APPROVED','COMPLETED'].includes(String(c.status||'').toUpperCase()));const free=!p.club_id||!active;const full=[p.first_name,p.middle_name,p.last_name].filter(Boolean).join(' ')||'Mchezaji';const currentClub=clubMap[p.club_id];const photoUrl=getPlayerPhotoUrl(p.photo_url);const photo=photoUrl?`<img class="photo" src="${esc(photoUrl)}" alt="${esc(full)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"> <div class="avatar" style="display:none">⚽</div>`:'<div class="avatar">⚽</div>';const clubName=id=>clubMap[id]?.name||'—';document.getElementById('app').innerHTML=`<section class="hero">${photo}<div><div class="name">${esc(full)}</div><div class="id">AFRN Player ID: ${esc(p.player_id_number||'—')}</div><div class="chips"><span class="chip">${esc(p.position||'—')}</span><span class="chip">${esc(p.status||'—')}</span>${free?'<span class="chip">🟢 FREE AGENT</span>':''}</div></div></section><section class="section"><h3>👤 Taarifa Binafsi</h3><div class="grid"><div class="item"><b>Tarehe ya kuzaliwa</b>${fmt(p.date_of_birth)}</div><div class="item"><b>Uraia</b>${esc(p.nationality||'—')}</div><div class="item"><b>Namba ya jezi</b>${esc(p.jersey_number||'—')}</div><div class="item"><b>Simu</b>${esc(p.phone||'—')}</div><div class="item"><b>Anwani</b>${esc(p.address||'—')}</div><div class="item"><b>Status ya usajili</b>${esc(p.registration_approval_status||'—')}</div></div></section><section class="section"><h3>🏟️ Klabu ya Sasa</h3><div class="status ${free?'free':''}">${esc(currentClub?.name||'Hakuna klabu — Free Agent')}${currentClub?.division?' · '+esc(currentClub.division):''}</div></section><section class="section"><h3>📄 Mikataba (${contracts?.length||0})</h3>${contracts?.length?contracts.map(c=>`<div class="row"><b>${esc(c.contract_number||'Mkataba')}</b><br>${fmt(c.start_date)} → ${fmt(c.end_date)} · ${esc(c.status||'—')} · ${esc(clubName(c.club_id))}</div>`).join(''):'<div class="row">Hakuna mkataba uliorekodiwa.</div>'}</section><section class="section"><h3>🔄 Historia ya Uhamisho (${transfers?.length||0})</h3>${transfers?.length?transfers.map(t=>`<div class="row"><b>${fmt(t.transfer_date)}</b> · ${esc(t.transfer_type||'Transfer')} · ${esc(t.status||'—')}<br><b>${esc(clubName(t.from_club_id))}</b> → <b>${esc(clubName(t.to_club_id))}</b>${t.contract_start_date||t.contract_end_date?`<br>Contract: ${fmt(t.contract_start_date)} → ${fmt(t.contract_end_date)}`:''}</div>`).join(''):'<div class="row">Hakuna transfer iliyorekodiwa.</div>'}</section>`}load();</script><script>(async()=>{try{if(!db||!id)return;const r=await db.from('match_events').select('event_type,minute,description,match_id').eq('player_id',id);if(r.error)throw r.error;const ev=(r.data||[]).filter(e=>/yellow|yc|njano|red|rc|nyekundu/i.test(String(e.event_type||'')));const y=ev.filter(e=>/yellow|yc|njano/i.test(String(e.event_type||''))).length,rn=ev.filter(e=>/red|rc|nyekundu/i.test(String(e.event_type||''))).length;const box=document.createElement('section');box.className='section';box.innerHTML='<h3>🟥 Nidhamu ya Mchezaji</h3><div class="grid"><div class="item"><b>🟨 Yellow Cards</b>'+y+'</div><div class="item"><b>🟥 Red Cards</b>'+rn+'</div><div class="item"><b>Jumla ya Kadi</b>'+(y+rn)+'</div><div class="item"><b>Status</b>'+(rn?'🟥 RED CARD — REVIEW':y>=2?'⚠️ KADI — REVIEW':'🟢 ACTIVE')+'</div></div>'+(ev.length?ev.sort((a,b)=>Number(b.minute||0)-Number(a.minute||0)).map(e=>'<div class="row">'+(/red|rc|nyekundu/i.test(String(e.event_type||''))?'🟥 Red Card':'🟨 Yellow Card')+' · Minute '+esc(e.minute??'—')+(e.description?' · '+esc(e.description):'')+'</div>').join(''):'<div class="row">Hakuna kadi iliyorekodiwa.</div>')+'<div style="margin-top:10px"><a href="disciplinary.html" style="font-weight:800;color:#0d47a1;text-decoration:none">→ Fungua Disciplinary Center</a></div>';document.getElementById('app')?.appendChild(box)}catch(e){console.warn('AFRN disciplinary profile:',e.message)}})();</script><script src="./afrn-player-photo-global.js"></script></body></html>
