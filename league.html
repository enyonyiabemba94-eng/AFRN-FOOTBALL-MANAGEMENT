<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFRN Football Management — Ligi</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./afrn-standings-engine.js"></script>
<style>
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}header{background:linear-gradient(135deg,#06152b,#0d47a1);color:#fff;padding:17px 14px}header h1{margin:0;font-size:21px}header p{margin:5px 0;font-size:12px}nav{background:#fff;padding:9px;display:flex;gap:7px;overflow:auto}nav a{padding:9px 12px;text-decoration:none;color:#172033;font-weight:bold;white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:12px}.status,.card{background:#fff;border-radius:15px;border:1px solid #d9e0ea;box-shadow:0 3px 15px #14213d10}.status{padding:12px;margin-bottom:14px;border-left:4px solid #0d47a1;font-size:13px}.card{padding:16px;margin-bottom:15px}.hero{display:flex;gap:13px;align-items:center}.logo{width:68px;height:68px;object-fit:contain;border-radius:12px}.muted{color:#687386;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px}th{background:#071a33;color:#fff;padding:10px;text-align:center}td{padding:9px;border-bottom:1px solid #edf0f4;text-align:center}td:nth-child(2){text-align:left;font-weight:bold}.club{display:flex;align-items:center;gap:8px}.club img{width:30px;height:30px;object-fit:contain}.pts{font-weight:900;color:#0d47a1}.week{background:#eef4ff;color:#0d47a1;padding:10px;border-radius:9px;margin:16px 0 8px;font-weight:900}.match{display:grid;grid-template-columns:90px 1fr 70px 1fr 80px;gap:7px;align-items:center;padding:11px 5px;border-bottom:1px solid #edf0f4;font-size:12px}.home{text-align:right;font-weight:bold}.away{text-align:left;font-weight:bold}.score{text-align:center;font-size:16px;font-weight:900}.date{text-align:center;color:#687386}.btn{border:0;border-radius:8px;padding:7px 9px;font-weight:bold;background:#e8edf5;cursor:pointer}.empty{text-align:center;padding:28px;color:#687386;border:1px dashed #cbd3df;border-radius:11px}@media(max-width:650px){.match{grid-template-columns:58px 1fr 58px 1fr 55px;font-size:10px}.btn{font-size:9px;padding:6px}.card{padding:12px}}
</style></head>
<body>
<header><div class="wrap"><h1>⚽ AFRN FOOTBALL MANAGEMENT</h1><p>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</p></div></header>
<nav><a href="./index.html">🏠 Dashboard</a><a href="./divisions.html">🏆 Madaraja</a><a href="./competitions.html">🏆 Mashindano</a><a href="./matches.html">🏟️ Mechi</a><a href="./reports.html">📊 Ripoti</a></nav>
<main class="wrap"><div id="status" class="status">⏳ Inapakia ligi...</div><section id="hero" class="card">Inapakia...</section>
<section class="card"><h2>📊 Msimamo wa Ligi</h2><div id="standings"><div class="empty">Inapakia...</div></div></section>
<section class="card"><h2>🏟️ Mechi Zilizochezwa</h2><div class="muted">Mechi za ligi hii pekee, zimepangwa kwa Wiki / Matchday.</div><div id="results"><div class="empty">Inapakia...</div></div></section></main>
<script>
const db=window.supabaseClient;
const id=new URLSearchParams(location.search).get("id"),$=x=>document.getElementById(x);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const played=s=>window.AFRNStandings?.playedStatus?window.AFRNStandings.playedStatus(s):["completed","finished","played","full_time","ft"].includes(String(s??"").toLowerCase().trim());
let C,teams=[],matches=[],clubs=[];
const cn=id=>(clubs.find(c=>String(c.id)===String(id))||{}).name||"Timu";
const club=id=>clubs.find(c=>String(c.id)===String(id))||{};
function editMatch(id){location.href="./matches.html?edit="+encodeURIComponent(id)}
function week(m){return m.match_week??m.week??m.matchday??m.round??"Haijawekwa"}
async function load(){
 if(!id)throw Error("Competition ID haipo.");
 let r=await db.from("competitions").select("*").eq("id",id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error("Ligi haijapatikana.");C=r.data;
 r=await db.from("competition_teams").select("id,competition_id,club_id,group_name").eq("competition_id",id);if(r.error)throw r.error;teams=r.data||[];
 r=await db.from("matches").select("*").eq("competition_id",id).order("match_week",{ascending:true}).order("match_date",{ascending:true}).order("match_time",{ascending:true});if(r.error)throw r.error;matches=r.data||[];
 const ids=[...new Set([...teams.map(x=>x.club_id),...matches.flatMap(x=>[x.home_team_id,x.away_team_id])].filter(Boolean))];
 r=ids.length?await db.from("clubs").select("id,name,logo_url").in("id",ids):{data:[],error:null};if(r.error)throw r.error;clubs=r.data||[];
 $("hero").innerHTML='<div class="hero"><img class="logo" src="'+esc(C.logo_url||"./afrn-logo.png")+'"><div><h2 style="margin:0">🏆 '+esc(C.name)+'</h2><div class="muted">'+esc(C.season||"—")+' · '+esc(C.status||"—")+' · '+teams.length+' timu</div><div class="muted">'+esc(C.start_date||"—")+' → '+esc(C.end_date||"—")+'</div></div></div>';
 renderStandings();renderResults();$("status").textContent="✅ Ligi imepakiwa — data ya competition hii pekee.";
}
function renderStandings(){
 const pm=matches.filter(m=>played(m.status)),rows=window.AFRNStandings.buildStandings({teams,matches:pm,events:[],clubName:cn});
 $("standings").innerHTML=rows.length?'<div class="table-wrap"><table><thead><tr><th>#</th><th>KLABU</th><th>PTS</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th></tr></thead><tbody>'+rows.map((r,i)=>{const c=club(r.club_id);return '<tr><td>'+(i+1)+'</td><td><div class="club"><img src="'+esc(c.logo_url||"./afrn-logo.png")+'"><span>'+esc(r.name)+'</span></div></td><td class="pts">'+r.PTS+'</td><td>'+r.P+'</td><td>'+r.W+'</td><td>'+r.D+'</td><td>'+r.L+'</td><td><b>'+r.GF+'-'+r.GA+'</b></td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">Hakuna timu kwenye ligi.</div>';
}
function renderResults(){
 const pm=matches.filter(m=>played(m.status));if(!pm.length){$("results").innerHTML='<div class="empty">Hakuna mechi iliyochezwa bado kwenye ligi hii.</div>';return}
 const g={};pm.forEach(m=>(g[String(week(m))]??=[]).push(m));
 const keys=Object.keys(g).sort((a,b)=>Number(a)-Number(b));
 $("results").innerHTML=keys.map(w=>'<div class="week">📅 Wiki / Matchday '+esc(w)+'</div>'+g[w].map(m=>'<div class="match"><div class="date">'+esc(m.match_date||"—")+'<br>'+esc(m.match_time||"")+'</div><div class="home">'+esc(cn(m.home_team_id))+'</div><div class="score">'+esc((m.home_score??0)+" - "+(m.away_score??0))+'</div><div class="away">'+esc(cn(m.away_team_id))+'</div><button class="btn" onclick="editMatch(\''+esc(m.id)+'\')">✏️ Edit</button></div>').join("")).join("");
}
load().catch(e=>{$("status").textContent="❌ "+(e.message||e);$("hero").innerHTML='<div class="empty">Imeshindikana kupakia ligi.</div>';});
</script></body></html>
