<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Badili Password</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px #0001}h1{text-align:center;font-size:24px}p{color:#667085;text-align:center}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#0b5ed7;color:#fff;font-weight:700;font-size:16px}.msg{margin-top:14px;padding:11px;border-radius:9px;display:none}.error{background:#fff0f0;color:#b42318}.ok{background:#ecfdf3;color:#027a48}</style></head><body><div class="card"><h1>⚽ AFRN</h1><p>Badili password ya akaunti yako</p><form id="f"><label>Password mpya</label><input id="p1" type="password" minlength="8" required><label>Rudia password</label><input id="p2" type="password" minlength="8" required><button id="b">🔐 Badili Password</button></form><div id="m" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=window.supabaseClient,m=document.getElementById('m'),b=document.getElementById('b');function show(t,ok=false){m.textContent=t;m.className='msg '+(ok?'ok':'error');m.style.display='block'}c.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')show('Weka password mpya kisha bonyeza Badili Password.',true)});document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('p1').value,d=document.getElementById('p2').value;if(a.length<8)return show('⚠️ Password iwe na angalau herufi 8.');if(a!==d)return show('⚠️ Password hazifanani.');b.disabled=true;b.textContent='⏳ Inabadilisha...';const {error}=await c.auth.updateUser({password:a});if(error){show('❌ '+error.message);b.disabled=false;b.textContent='🔐 Badili Password';return}show('✅ Password imebadilishwa. Unaelekezwa kwenye login...',true);await c.auth.signOut();setTimeout(()=>location.href='login.html',1200)}</script></body></html>
