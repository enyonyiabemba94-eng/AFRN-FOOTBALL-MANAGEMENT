<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFRN Football Management - Clubs</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#071a33;--blue:#0d47a1;--gold:#f5b400;--bg:#f4f7fb;--white:#fff;--text:#172033;--muted:#687386;--danger:#c62828;--ok:#16834b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    header{background:linear-gradient(135deg,#06152b,#0d47a1);color:white;padding:18px 16px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #0002}
    header h1{margin:0;font-size:20px} header p{margin:5px 0 0;font-size:12px;opacity:.82}
    main{max-width:1050px;margin:auto;padding:16px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .toolbar input,.toolbar select{flex:1;min-width:150px;padding:12px;border:1px solid #d6dce5;border-radius:10px;background:white}
    button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
    .primary{background:var(--blue);color:white}.gold{background:var(--gold);color:#161616}.danger{background:#fee;color:var(--danger)}
    .status{padding:10px 12px;border-radius:10px;background:white;margin-bottom:15px;font-size:13px;border-left:4px solid var(--blue)}
    .status.ok{border-left-color:var(--ok)} .status.err{border-left-color:var(--danger);color:var(--danger)}
    .division{margin:22px 0}.division-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .division-title h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .card{background:white;border-radius:16px;padding:14px;box-shadow:0 3px 12px #14213d10;border:1px solid #e7ebf1}
    .club-top{display:flex;gap:12px;align-items:center}.logo{width:64px;height:64px;border-radius:14px;object-fit:contain;background:#f0f3f8;border:1px solid #e2e7ef}
    .club-name{font-size:17px;font-weight:800;margin:0}.club-id{font-size:11px;color:var(--muted);margin-top:4px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}.chip{background:#eef4ff;color:#174ea6;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px}.detail{background:#f7f9fc;border-radius:9px;padding:8px}.detail b{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
    .kit{display:flex;gap:8px;align-items:center}.swatch{width:18px;height:18px;border-radius:50%;border:1px solid #aaa;background:#ddd}
    .actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:9px}
    .empty{background:white;border:1px dashed #cbd3df;padding:25px;text-align:center;border-radius:14px;color:var(--muted)}
    dialog{width:min(650px,94vw);border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px #0005}
    dialog::backdrop{background:#00112a99}.modal{padding:18px}.modal h2{margin:0 0 15px}
    form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
    label{font-size:12px;font-weight:700}.field{margin-top:5px;width:100%;padding:11px;border:1px solid #d4dbe6;border-radius:9px;background:#fff}
    .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.hint{font-size:11px;color:var(--muted);line-height:1.4}
    @media(max-width:600px){form{grid-template-columns:1fr}.full{grid-column:auto}.details{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<header>
  <h1>⚽ AFRN FOOTBALL MANAGEMENT</h1>
  <p>Clubs / Vilabu — usajili na kumbukumbu za klabu</p>
</header>

<main>
  <div id="status" class="status">Inaunganisha na Supabase...</div>

  <div class="toolbar">
    <input id="search" placeholder="🔎 Tafuta jina la klabu au Club ID">
    <select id="filterDivision">
      <option value="">Daraja zote</option>
      <option value="1">Daraja la 1</option>
      <option value="2">Daraja la 2</option>
      <option value="3">Daraja la 3</option>
      <option value="4">Daraja la 4</option>
    </select>
    <select id="filterZone"><option value="">Zone zote</option></select>
    <button class="primary" id="addBtn">＋ Ongeza Klabu</button>
  </div>

  <div id="clubsContainer"></div>
</main>

<dialog id="clubDialog">
  <div class="modal">
    <h2 id="modalTitle">＋ Ongeza Klabu</h2>
    <form id="clubForm">
      <input type="hidden" id="editId">

      <div class="full">
        <label>Jina la Klabu *</label>
        <input class="field" id="name" required>
      </div>

      <div>
        <label>Daraja *</label>
        <select class="field" id="division" required>
          <option value="1">Daraja la 1</option><option value="2">Daraja la 2</option>
          <option value="3">Daraja la 3</option><option value="4">Daraja la 4</option>
        </select>
      </div>

      <div>
        <label>Zone *</label>
        <input class="field" id="zone" placeholder="Mfano: Zone A" required>
      </div>

      <div>
        <label>Idadi ya Makombe 🏆</label>
        <input class="field" id="trophies" type="number" min="0" value="0">
      </div>

      <div>
        <label>Mwaka wa Kuanzishwa</label>
        <input class="field" id="founded" type="number" min="1900" max="2100">
      </div>

      <div>
        <label>Rangi ya Jezi — Nyumbani</label>
        <input class="field" id="homeKit" placeholder="Mfano: Kijani / Nyeupe">
      </div>

      <div>
        <label>Rangi ya Jezi — Ugenini</label>
        <input class="field" id="awayKit" placeholder="Mfano: Bluu / Nyeupe">
      </div>

      <div>
        <label>Simu</label>
        <input class="field" id="phone" type="tel">
      </div>

      <div>
        <label>Email</label>
        <input class="field" id="email" type="email">
      </div>

      <div class="full">
        <label>Logo URL *</label>
        <input class="field" id="logoUrl" type="url" placeholder="https://..." required>
        <div class="hint">Logo ni sehemu ya lazima. Unaweza kutumia URL ya picha iliyopo kwenye Supabase Storage.</div>
      </div>

      <div class="full form-actions">
        <button type="button" id="cancelBtn">Ghairi</button>
        <button class="primary" type="submit">💾 Hifadhi Klabu</button>
      </div>
    </form>
  </div>
</dialog>

<script>
/*
  AFRN CLUBS PAGE
  ------------------------------------------------------------
  Supabase project iliyopo:
  https://jjqhvruppafpumcthmwe.supabase.co

  Muhimu:
  - Hatuundi database mpya.
  - Hatuifuti table ya clubs.
  - Ukurasa huu unatumia table "clubs".
  - Kama majina ya columns kwenye database yako yanatofautiana,
    badilisha OBJECT "COLUMN_MAP" hapa chini tu.
*/

const SUPABASE_URL = "https://jjqhvruppafpumcthmwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G";

const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const TABLE = "clubs";

/*
  COLUMN_MAP:
  Haya ndiyo majina ambayo page inategemea kwenye table ya clubs.
  Kama table yako tayari ina majina haya, usibadilishe kitu.
*/
const COLUMN_MAP = {
  id: "id",
  name: "name",
  logo: "logo_url",
  division: "division",
  zone: "zone",
  trophies: "trophies",
  homeKit: "home_kit",
  awayKit: "away_kit",
  phone: "phone",
  email: "mail",
  founded: "founded"
};

let clubs = [];

const $ = id => document.getElementById(id);
const statusBox = $("status");

function setStatus(message, type="") {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function divisionLabel(v) {
  return `Daraja la ${v || "-"}`;
}

function clubIdDisplay(id) {
  if (typeof id === "string" && id.startsWith("AFRN-C")) return id;
  return id ?? "-";
}

function colorFromText(text) {
  const colors = ["#e53935","#1e88e5","#43a047","#f9a825","#8e24aa","#00897b","#6d4c41","#546e7a"];
  let n = 0;
  for (const c of String(text || "")) n = (n * 31 + c.charCodeAt(0)) >>> 0;
  return colors[n % colors.length];
}

function normalizeClub(row) {
  return {
    raw: row,
    id: row[COLUMN_MAP.id],
    name: row[COLUMN_MAP.name],
    logo: row[COLUMN_MAP.logo],
    division: row[COLUMN_MAP.division],
    zone: row[COLUMN_MAP.zone],
    trophies: row[COLUMN_MAP.trophies] ?? 0,
    homeKit: row[COLUMN_MAP.homeKit],
    awayKit: row[COLUMN_MAP.awayKit],
    phone: row[COLUMN_MAP.phone],
    email: row[COLUMN_MAP.email],
    founded: row[COLUMN_MAP.founded]
  };
}

async function loadClubs() {
  setStatus("Inapakia vilabu...");
  const { data, error } = await db.from(TABLE).select("*").order(COLUMN_MAP.name, {ascending:true});

  if (error) {
    console.error(error);
    setStatus("Imeshindikana kusoma table ya clubs: " + error.message, "err");
    $("clubsContainer").innerHTML =
      `<div class="empty">Angalia COLUMN_MAP na majina halisi ya columns kwenye table <b>clubs</b>.</div>`;
    return;
  }

  clubs = (data || []).map(normalizeClub);
  buildZoneFilter();
  renderClubs();
  setStatus(`Supabase imeunganishwa • Vilabu ${clubs.length}`, "ok");
}

function buildZoneFilter() {
  const select = $("filterZone");
  const current = select.value;
  const zones = [...new Set(clubs.map(c => c.zone).filter(Boolean))].sort();
  select.innerHTML = `<option value="">Zone zote</option>` +
    zones.map(z => `<option value="${esc(z)}">${esc(z)}</option>`).join("");
  select.value = current;
}

function renderClubs() {
  const q = $("search").value.trim().toLowerCase();
  const div = $("filterDivision").value;
  const zone = $("filterZone").value;

  const filtered = clubs.filter(c =>
    (!q || String(c.name||"").toLowerCase().includes(q) || String(c.id||"").toLowerCase().includes(q)) &&
    (!div || String(c.division) === div) &&
    (!zone || String(c.zone) === zone)
  );

  const container = $("clubsContainer");
  if (!filtered.length) {
    container.innerHTML = `<div class="empty">Hakuna klabu inayolingana na utafutaji wako.</div>`;
    return;
  }

  container.innerHTML = [1,2,3,4].map(d => {
    const list = filtered.filter(c => String(c.division) === String(d));
    if (!list.length) return "";
    return `
      <section class="division">
        <div class="division-title">
          <h2>${["","🥇","🥈","🥉","🏅"][d]} ${divisionLabel(d)}</h2>
          <span class="count">${list.length} klabu</span>
        </div>
        <div class="grid">${list.map(card).join("")}</div>
      </section>`;
  }).join("");

  filtered.filter(c => ![1,2,3,4].includes(Number(c.division))).forEach(()=>{});
}

function card(c) {
  const fallback = colorFromText(c.name);
  return `
  <article class="card">
    <div class="club-top">
      <img class="logo" src="${esc(c.logo)}" alt="Logo ${esc(c.name)}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div style="display:none;width:64px;height:64px;border-radius:14px;background:${fallback};color:#fff;align-items:center;justify-content:center;font-weight:900;font-size:22px">
        ${esc((c.name||"?").slice(0,2).toUpperCase())}
      </div>
      <div>
        <h3 class="club-name">${esc(c.name)}</h3>
        <div class="club-id">ID: <b>${esc(clubIdDisplay(c.id))}</b></div>
      </div>
    </div>

    <div class="chips">
      <span class="chip">${esc(divisionLabel(c.division))}</span>
      <span class="chip">Zone: ${esc(c.zone || "-")}</span>
      <span class="chip">🏆 ${esc(c.trophies ?? 0)}</span>
    </div>

    <div class="details">
      <div class="detail"><b>👕 JEZI NYUMBANI</b><span class="kit"><i class="swatch"></i>${esc(c.homeKit || "-")}</span></div>
      <div class="detail"><b>👕 JEZI UGENINI</b><span class="kit"><i class="swatch"></i>${esc(c.awayKit || "-")}</span></div>
      <div class="detail"><b>📅 ILIANZISHWA</b>${esc(c.founded || "-")}</div>
      <div class="detail"><b>📞 SIMU</b>${esc(c.phone || "-")}</div>
      <div class="detail" style="grid-column:1/-1"><b>✉️ EMAIL</b>${esc(c.email || "-")}</div>
    </div>

    <div class="actions">
      <button class="gold" onclick="editClub('${esc(c.id)}')">✏️ Hariri</button>
      <button class="danger" onclick="deleteClub('${esc(c.id)}','${esc(c.name)}')">🗑️ Futa</button>
    </div>
  </article>`;
}

function openAdd() {
  $("clubForm").reset();
  $("editId").value = "";
  $("modalTitle").textContent = "＋ Ongeza Klabu";
  $("trophies").value = 0;
  $("clubDialog").showModal();
}

function openEdit(c) {
  $("editId").value = c.id;
  $("name").value = c.name || "";
  $("division").value = c.division || "1";
  $("zone").value = c.zone || "";
  $("trophies").value = c.trophies ?? 0;
  $("founded").value = c.founded || "";
  $("homeKit").value = c.homeKit || "";
  $("awayKit").value = c.awayKit || "";
  $("phone").value = c.phone || "";
  $("email").value = c.email || "";
  $("logoUrl").value = c.logo || "";
  $("modalTitle").textContent = "✏️ Hariri Klabu";
  $("clubDialog").showModal();
}

window.editClub = function(id) {
  const c = clubs.find(x => String(x.id) === String(id));
  if (c) openEdit(c);
};

window.deleteClub = async function(id, name) {
  if (!confirm(`Una uhakika unataka kufuta "${name}"?`)) return;
  setStatus("Inafuta klabu...");
  const { error } = await db.from(TABLE).delete().eq(COLUMN_MAP.id, id);
  if (error) {
    console.error(error);
    setStatus("Kufuta kumeshindikana: " + error.message, "err");
    return;
  }
  await loadClubs();
};

$("clubForm").addEventListener("submit", async e => {
  e.preventDefault();

  const editId = $("editId").value.trim();
  const payload = {
    [COLUMN_MAP.name]: $("name").value.trim(),
    [COLUMN_MAP.logo]: $("logoUrl").value.trim(),
    [COLUMN_MAP.division]: Number($("division").value),
    [COLUMN_MAP.zone]: $("zone").value.trim(),
    [COLUMN_MAP.trophies]: Number($("trophies").value || 0),
    [COLUMN_MAP.homeKit]: $("homeKit").value.trim(),
    [COLUMN_MAP.awayKit]: $("awayKit").value.trim(),
    [COLUMN_MAP.phone]: $("phone").value.trim(),
    [COLUMN_MAP.email]: $("email").value.trim(),
    [COLUMN_MAP.founded]: $("founded").value ? Number($("founded").value) : null
  };

  if (!payload[COLUMN_MAP.name] || !payload[COLUMN_MAP.logo] || !payload[COLUMN_MAP.zone]) {
    alert("Jina, Logo na Zone ni lazima.");
    return;
  }

  setStatus(editId ? "Inasasisha klabu..." : "Inahifadhi klabu...");

  let result;
  if (editId) {
    result = await db.from(TABLE).update(payload).eq(COLUMN_MAP.id, editId);
  } else {
    result = await db.from(TABLE).insert(payload);
  }

  if (result.error) {
    console.error(result.error);
    setStatus("Kuhifadhi kumeshindikana: " + result.error.message, "err");
    alert("Supabase imerudisha kosa:\n\n" + result.error.message +
      "\n\nKama kosa linataja column isiyopatikana, tutalinganisha COLUMN_MAP na table yako ya clubs.");
    return;
  }

  $("clubDialog").close();
  await loadClubs();
});

$("addBtn").onclick = openAdd;
$("cancelBtn").onclick = () => $("clubDialog").close();
$("search").oninput = renderClubs;
$("filterDivision").onchange = renderClubs;
$("filterZone").onchange = renderClubs;

loadClubs();
</script>
</body>
</html>
