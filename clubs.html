<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN Football Management - Vilabu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}.brand{max-width:1200px;margin:auto}.brand h1{margin:0;font-size:20px}.brand p{margin:5px 0 0;font-size:12px}nav{background:#fff;border-bottom:1px solid #ddd}.nav{max-width:1200px;margin:auto;padding:10px;display:flex;gap:6px;overflow:auto}.nav a{padding:10px;text-decoration:none;color:#071a33;font-weight:bold;white-space:nowrap;border-radius:8px}.nav a.active{background:#eaf2ff}.wrap{max-width:1200px;margin:22px auto;padding:0 15px}.toolbar,.profile{background:#fff;border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 5px 20px #071a3312}.toolbar{display:flex;gap:10px}.search,input,select{padding:11px;border:1px solid #d9e1ec;border-radius:9px;box-sizing:border-box}.search{flex:1}button,.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.btn{background:#0d6efd;color:white;text-decoration:none}.division{background:#fff;margin:15px 0;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #071a3312}.dh{color:#fff;padding:16px;display:flex;justify-content:space-between}.d1{background:#b8860b}.d2{background:#6b7280}.d3{background:#8b4513}.d4{background:#0756b8}.grid{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.club{border:1px solid #e1e7ef;border-radius:11px;padding:13px;cursor:pointer}.club:hover{border-color:#0d6efd}.club h4{margin:0 0 6px}.muted{color:#6b7280;font-size:12px}.trophies{margin-top:20px;border-top:2px solid #e1e7ef;padding-top:16px}.trophy{border:1px solid #e1e7ef;background:#f8fafc;border-radius:11px;padding:12px;margin:8px 0}.trophy-head{display:flex;justify-content:space-between;gap:8px}.actions{white-space:nowrap}.actions button{padding:7px 9px;margin-left:4px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:15px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field input,.field select{width:100%}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:650px){.toolbar{flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><h1>⚽ AFRN FOOTBALL MANAGEMENT</h1><p>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</p></div></header><nav><div class="nav"><a href="index.html">🏠 Dashboard</a><a class="active" href="clubs.html">⚽ Vilabu</a><a href="divisions.html">🏆 Madaraja</a><a href="players.html">👤 Wachezaji</a><a href="contracts.html">📄 Mikataba</a><a href="transfers.html">🔄 Uhamisho</a></div></nav><main class="wrap"><h2>🏆 Vilabu na Historia ya Mataji</h2><div class="toolbar"><input id="search" class="search" placeholder="🔎 Tafuta klabu..."><button class="btn" onclick="loadClubs()">🔄 Refresh</button><a class="btn" href="add-club.html">➕ Ongeza Klabu</a></div><div id="clubs">⏳ Inapakia...</div><div id="profile"></div></main><div id="modal" class="modal"><div class="box"><h3 id="mt">➕ Ongeza Kombe</h3><div class="field"><label>Jina la Kombe *</label><input id="tn"></div><div class="field"><label>Tarehe ya kubeba kombe *</label><input id="td" type="date"></div><div class="field"><label>Uwanja *</label><input id="ts"></div><div class="field"><label>Aina / Mashindano</label><input id="tc"></div><div class="field"><label>Nafasi</label><select id="tp"><option value="1">🥇 Bingwa</option><option value="2">🥈 Nafasi ya Pili</option><option value="3">🥉 Nafasi ya Tatu</option></select></div><div class="ma"><button onclick="closeModal()">Ghairi</button><button class="btn" onclick="saveTrophy()">💾 Hifadhi</button></div></div></div><script>let db,clubs=[],current=null,editIndex=-1;function getDB(){return window.afrnSupabase||window.supabaseClient||window.sb||window.supabase}function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function div(v){v=String(v||'').toUpperCase();return ['I','II','III','IV'].includes(v)?v:{1:'I',2:'II',3:'III',4:'IV'}[v]||''}async function loadClubs(){db=getDB();let r=await db.from('clubs').select('*').order('name');if(r.error){document.getElementById('clubs').innerHTML='❌ '+esc(r.error.message);return}clubs=r.data||[];render()}function render(){let q=document.getElementById('search').value.toUpperCase();let html='';[['I','🥇 DARAJA LA I','d1'],['II','🥈 DARAJA LA II','d2'],['III','🥉 DARAJA LA III','d3'],['IV','🏅 DARAJA LA IV','d4']].forEach(x=>{let a=clubs.filter(c=>div(c.division)===x[0]&&(!q||String(c.name).toUpperCase().includes(q)));html+='<section class="division"><div class="dh '+x[2]+'"><b>'+x[1]+'</b><span>'+a.length+' timu</span></div><div class="grid">'+(a.length?a.map((c,i)=>'<div class="club" onclick="openClub(\''+c.id+'\')"><h4>'+esc((i+1)+'. '+c.name)+'</h4><div class="muted">📍 '+esc(c.zone||'Haijawekwa')+'</div><div class="muted">🏆 Mataji: '+Number(c.trophies||0)+'</div></div>').join(''):'<div class="muted">Hakuna timu.</div>')+'</div></section>'});document.getElementById('clubs').innerHTML=html}async function openClub(id){current=clubs.find(c=>String(c.id)===String(id));if(!current)return;let r=await db.from('players').select('*').eq('club_id',current.id);let h=Array.isArray(current.trophy_history)?current.trophy_history:[];let legacy=Number(current.trophy_legacy_count||0);if(legacy&&!h.length){h=Array.from({length:legacy},(_,i)=>({name:'Taji la Zamani #'+(i+1),date:'',stadium:'',competition:'',position:1,legacy_placeholder:true}));let u=await db.from('clubs').update({trophy_history:h,trophy_legacy_count:0,trophies:h.length}).eq('id',current.id);if(!u.error){current.trophy_history=h;current.trophy_legacy_count=0;current.trophies=h.length}}document.getElementById('clubs').style.display='none';document.getElementById('profile').innerHTML='<div class="profile"><button onclick="back()">← Rudi</button><h2>⚽ '+esc(current.name)+'</h2><p>📍 '+esc(current.zone||'')+' | 🏆 Mataji: '+h.length+'</p><div class="trophies"><div class="trophy-head"><h3>🏆 HISTORIA YA MATAJI ('+h.length+')</h3><button class="btn" onclick="openTrophy(-1)">➕ Ongeza Kombe</button></div>'+(h.length?h.map((t,i)=>'<div class="trophy"><div class="trophy-head"><div><b>🏆 '+esc(t.name||('Taji la Zamani #'+(i+1)))+'</b><div class="muted">📅 '+(t.date?esc(t.date):'Tarehe haijawekwa')+' &nbsp; 🏟️ '+(t.stadium?esc(t.stadium):'Uwanja haujawekwa')+'</div><div class="muted">'+esc(t.competition||'Mashindano hayajawekwa')+' • '+(['','🥇 Bingwa','🥈 Nafasi ya Pili','🥉 Nafasi ya Tatu'][Number(t.position)||1])+'</div></div><div class="actions"><button onclick="event.stopPropagation();openTrophy('+i+')">✏️</button><button onclick="event.stopPropagation();deleteTrophy('+i+')">🗑️</button></div></div></div>').join(''):'<p class="muted">Hakuna historia ya mataji.</p>')+'</div></div>'}function back(){document.getElementById('profile').innerHTML='';document.getElementById('clubs').style.display='block';render()}function openTrophy(i){editIndex=i;let t=i>=0?(current.trophy_history||[])[i]:{};document.getElementById('mt').textContent=i>=0?'✏️ Hariri Kombe':'➕ Ongeza Kombe';document.getElementById('tn').value=t.name||'';document.getElementById('td').value=t.date||'';document.getElementById('ts').value=t.stadium||'';document.getElementById('tc').value=t.competition||'';document.getElementById('tp').value=t.position||1;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}async function saveTrophy(){let name=tn.value.trim(),date=td.value,stadium=ts.value.trim();if(!name||!date||!stadium){alert('Jina la kombe, tarehe na uwanja vinahitajika.');return}let h=(current.trophy_history||[]).slice();let item={name,date,stadium,competition:tc.value.trim(),position:Number(tp.value),legacy_placeholder:false};if(editIndex>=0)h[editIndex]=item;else h.push(item);let r=await db.from('clubs').update({trophy_history:h,trophy_legacy_count:0,trophies:h.length}).eq('id',current.id);if(r.error){alert('Imeshindikana: '+r.error.message);return}current.trophy_history=h;current.trophies=h.length;closeModal();openClub(current.id)}async function deleteTrophy(i){if(!confirm('Futa historia hii ya kombe?'))return;let h=(current.trophy_history||[]).slice();h.splice(i,1);let r=await db.from('clubs').update({trophy_history:h,trophy_legacy_count:0,trophies:h.length}).eq('id',current.id);if(r.error){alert('Imeshindikana: '+r.error.message);return}current.trophy_history=h;current.trophies=h.length;openClub(current.id)}document.getElementById('search').addEventListener('input',render);loadClubs();</script></body></html>
