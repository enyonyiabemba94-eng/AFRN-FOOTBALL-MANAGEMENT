<style>

:root{
--navy:#071a33;
--blue:#0d47a1;
--gold:#f5b400;
--green:#16834b;
--red:#c62828;
--bg:#f4f7fb;
--white:#fff;
--text:#172033;
--muted:#687386;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
background:linear-gradient(135deg,#06152b,#0d47a1);

}

}

nav{

display:flex;

overflow-x:auto;
border-bottom:1px solid #ddd;

nav a{
text-decoration:none;
white-space:nowrap;

}

nav a.active{

}

main{

margin:auto;
padding:16px;
}

.status{
padding:11px 13px;

background:white;

margin-bottom:15px;
font-size:13px;
}

.status.ok{

}

.status.err{

}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.toolbar input,
.toolbar select{
flex:1;
min-width:180px;
padding:12px;
border:1px solid #d6dce5;
border-radius:10px;
background:white;
}

button{
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:700;
cursor:pointer;
}

.primary{
background:var(--blue);
color:white;
}

.success{

color:white;
}

.secondary{
background:#e9eef6;
color:var(--text);
}

.danger{

.cards{
display:grid;

gap:12px;

}

.stat{

padding:15px;
border-radius:14px;

}

.stat small{

}

}

.section{

.section-title{

}

.section-title h2{

font-size:18px;

.transfer-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(330px,1fr));

.transfer-card{

border:1px solid #e3e8ef;

.player-name{

}

.player-id{

margin-top:4px;
}

.route{
display:grid;
grid-template-columns:1fr 35px 1fr;
align-items:center;
gap:8px;
margin:14px 0;
}

.club-box{
background:#f6f8fb;
border-radius:10px;
padding:10px;
text-align:center;
font-size:12px;
font-weight:700;
}

.arrow{
text-align:center;
font-size:20px;
color:var(--blue);
}

.chips{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.chip{
padding:5px 8px;
border-radius:999px;
background:#eef4ff;
color:#174ea6;
font-size:11px;
font-weight:700;
}

.chip.green{
background:#dff5e9;
color:#12633a;
}

.chip.red{
background:#fee4e4;
color:#a51f1f;
}

.details{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:12px;
}

.detail{
background:#f7f9fc;
padding:8px;
border-radius:9px;
font-size:12px;
}

.detail b{
display:block;
font-size:10px;
color:var(--muted);
margin-bottom:3px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:13px;
}

.actions button{
flex:1;
}

.empty{
background:white;
padding:30px;
text-align:center;
border:1px dashed #cbd3df;
border-radius:14px;
color:var(--muted);
}

dialog{
width:min(720px,94vw);
border:0;
border-radius:18px;
padding:0;
box-shadow:0 20px 60px #0006;
}

dialog::backdrop{
background:#00112a99;
}

.modal{
padding:20px;
}

.modal h2{
margin:0 0 15px;
}

form{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.full{
grid-column:1/-1;
}

label{
font-size:12px;
font-weight:700;
display:block;
}

.field{
width:100%;
margin-top:5px;
padding:11px;
border:1px solid #d4dbe6;
border-radius:9px;
background:white;
font:inherit;
}

textarea.field{
min-height:90px;
resize:vertical;
}

.player-preview{
display:none;
margin-top:10px;
padding:10px;
background:#f7f9fc;
border-radius:12px;
border:1px solid #e1e6ed;
}

.preview-row{
display:flex;
gap:10px;
align-items:center;
}

.preview-photo{
width:65px;
height:75px;
object-fit:cover;
border-radius:10px;
background:#eef2f7;
}

.notice{
display:none;
padding:10px;
margin-top:10px;
border-radius:9px;
background:#fff3cd;
color:#664d03;
font-size:12px;
}

.form-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:8px;
}

@media(max-width:700px){

.cards{
grid-template-columns:1fr 1fr;
}

form{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.transfer-grid{
grid-template-columns:1fr;
}

}

@media(max-width:450px){

.cards{
grid-template-columns:1fr;
}

.route{
grid-template-columns:1fr;
}

.arrow{
transform:rotate(90deg);
}

}

</style>

</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jjqhvruppafpumcthmwe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   TABLES
===================================================== */

const TRANSFERS_TABLE =
"transfers";

const PLAYERS_TABLE =
"players";

const CLUBS_TABLE =
"clubs";


/* =====================================================
   VARIABLES
===================================================== */

let transfers = [];

let players = [];

let clubs = [];


/* =====================================================
   SHORTCUT
===================================================== */

const $ =
id =>
document.getElementById(id);


/* =====================================================
   STATUS
===================================================== */

function setStatus(
message,
type=""
){

$("status").textContent =
message;

$("status").className =
"status " + type;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

return String(
value ?? ""
)
.replace(
/[&<>"']/g,
function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

});

}


/* =====================================================
   PLAYER NAME
===================================================== */

function playerName(player){

if(!player)
return "Mchezaji hajulikani";

return [

player.first_name,
player.middle_name,
player.last_name

]
.filter(Boolean)
.join(" ")
||
"Mchezaji";

}


/* =====================================================
   CLUB
===================================================== */

function clubName(id){

const club =
clubs.find(
c =>
String(c.id) ===
String(id)
);

return club
? club.name
: "Klabu haijulikani";

}


/* =====================================================
   PLAYER PHOTO
===================================================== */

function playerPhoto(player){

if(
player &&
player.photo_url
){

return player.photo_url;

}

return "data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="200"
height="240">

<rect
width="100%"
height="100%"
fill="#eef2f7"/>

<text
x="50%"
y="50%"
text-anchor="middle"
dominant-baseline="middle"
font-size="70">

👤

</text>

</svg>
`);

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

setStatus(
"⏳ Inapakia wachezaji, vilabu na transfers..."
);


/* PLAYERS */

const playersResult =
await db
.from(PLAYERS_TABLE)
.select(`
id,
club_id,
first_name,
middle_name,
last_name,
player_id_number,
position,
photo_url,
status
`)
.order(
"first_name"
);


if(playersResult.error){

setStatus(
"❌ Players: " +
playersResult.error.message,
"err"
);

return;

}


/* CLUBS */

const clubsResult =
await db
.from(CLUBS_TABLE)
.select(
"id,name,division"
)
.order(
"name"
);


if(clubsResult.error){

setStatus(
"❌ Clubs: " +
clubsResult.error.message,
"err"
);

return;

}


/* TRANSFERS */

const transfersResult =
await db
.from(TRANSFERS_TABLE)
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(transfersResult.error){

setStatus(
"❌ Transfers: " +
transfersResult.error.message,
"err"
);

console.error(
transfersResult.error
);

return;

}


players =
playersResult.data || [];

clubs =
clubsResult.data || [];

transfers =
transfersResult.data || [];


loadPlayerOptions();

loadClubOptions();

renderTransfers();

updateDashboard();


setStatus(
"✅ Supabase imeunganishwa • " +
players.length +
" wachezaji • " +
clubs.length +
" vilabu • " +
transfers.length +
" transfers",
"ok"
);

}


/* =====================================================
   PLAYER OPTIONS
===================================================== */

function loadPlayerOptions(){

const select =
$("playerId");

select.innerHTML =
`
<option value="">
Chagua Mchezaji
</option>
`;


players.forEach(
player => {

const option =
document.createElement(
"option"
);

option.value =
player.id;

option.textContent =
playerName(player) +
(
player.player_id_number
?
" — " +
player.player_id_number
:
""
);

select.appendChild(
option
);

});

}


/* =====================================================
   CLUB OPTIONS
===================================================== */

function loadClubOptions(){

const from =
$("fromClubId");

const to =
$("toClubId");


const html =
`
<option value="">
Chagua klabu
</option>
` +
clubs.map(
club =>
`
<option value="${esc(club.id)}">
${esc(club.name)}
${club.division
? " — Daraja " +
esc(club.division)
: ""}
</option>
`
)
.join("");


from.innerHTML =
html;

to.innerHTML =
html;

}


/* =====================================================
   PLAYER PREVIEW
===================================================== */

function showPlayerPreview(){

const id =
$("playerId").value;

const player =
players.find(
p =>
String(p.id) ===
String(id)
);


if(!player){

$("playerPreview").style.display =
"none";

return;

}


$("previewPhoto").src =
playerPhoto(player);

$("previewName").textContent =
playerName(player);

$("previewClub").textContent =
"⚽ Klabu ya sasa: " +
clubName(player.club_id);

$("previewPosition").textContent =
"🏃 Nafasi: " +
(player.position || "-");


$("playerPreview").style.display =
"block";


if(player.club_id){

$("fromClubId").value =
player.club_id;

}

checkConflict();

}


/* =====================================================
   CONFLICT CHECK
===================================================== */

function checkConflict(){

const playerId =
$("playerId").value;

const start =
$("contractStart").value;

const end =
$("contractEnd").value;


const notice =
$("conflictNotice");


if(
!playerId ||
!start ||
!end
){

notice.style.display =
"none";

return;

}


const conflicts =
transfers.filter(
t => {

if(
String(t.player_id) !==
String(playerId)
)
return false;


const tStart =
t.contract_start ||
"0000-01-01";

const tEnd =
t.contract_end ||
"9999-12-31";


return (
start <= tEnd &&
end >= tStart
);

});


if(conflicts.length){

notice.style.display =
"block";

notice.innerHTML =
`
⚠️ <b>Tahadhari:</b>
Mchezaji ana transfer yenye
kipindi kinachogongana.
<br>
${conflicts.map(
t =>
esc(
clubName(t.from_club_id)
) +
" → " +
esc(
clubName(t.to_club_id)
)
).join("<br>")}
`;

}else{

notice.style.display =
"none";

}

}


/* =====================================================
   RENDER
===================================================== */

function renderTransfers(){

const container =
$("transfersContainer");

const search =
$("search")
.value
.trim()
.toLowerCase();

const filterStatus =
$("filterStatus")
.value;


const filtered =
transfers.filter(
t => {

const player =
players.find(
p =>
String(p.id) ===
String(t.player_id)
);

const text = [

playerName(player),

player?.player_id_number,

clubName(t.from_club_id),

clubName(t.to_club_id),

t.transfer_type,

t.status

]
.join(" ")
.toLowerCase();


return (

(!search ||
text.includes(search))

&&

(!filterStatus ||
String(t.status) ===
filterStatus)

);

});


$("transferCount").textContent =
filtered.length +
" records";


if(!filtered.length){

container.innerHTML =
`
<div class="empty">
Hakuna transfer inayopatikana.
</div>
`;

return;

}


container.innerHTML =
filtered
.map(
transferCard
)
.join("");

}


/* =====================================================
   TRANSFER CARD
===================================================== */

function transferCard(t){

const player =
players.find(
p =>
String(p.id) ===
String(t.player_id)
);


const status =
t.status ||
"DRAFT";


let statusClass =
"";


if(
status === "COMPLETED" ||
status === "APPROVED"
){

statusClass =
"green";

}

if(
status === "REJECTED"
){

statusClass =
"red";

}


return `

<article class="transfer-card">

<div class="player-row">

<img
class="player-photo"
src="${esc(
playerPhoto(player)
)}"
alt="Picha ya mchezaji">

<div>

<h3 class="player-name">
${esc(
playerName(player)
)}
</h3>

<div class="player-id">
Player ID:
${esc(
player?.player_id_number || "-"
)}
</div>

</div>

</div>


<div class="route">

<div class="club-box">

📤

<br>

${esc(
clubName(t.from_club_id)
)}

</div>


<div class="arrow">
→
</div>


<div class="club-box">

📥

<br>

${esc(
clubName(t.to_club_id)
)}

</div>

</div>


<div class="chips">

<span class="chip">
${esc(
t.transfer_type || "-"
)}
</span>

<span class="chip ${statusClass}">
${esc(status)}
</span>

</div>


<div class="details">

<div class="detail">

<b>TRANSFER DATE</b>

${esc(
t.transfer_date || "-"
)}

</div>


<div class="detail">

<b>POSITION</b>

${esc(
player?.position || "-"
)}

</div>


<div class="detail">

<b>CONTRACT START</b>

${esc(
t.contract_start || "-"
)}

</div>


<div class="detail">

<b>CONTRACT END</b>

${esc(
t.contract_end || "-"
)}

</div>

</div>


<div class="actions">

<button
class="secondary"

/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

$("totalTransfers")
.textContent =
transfers.length;


$("pendingTransfers")
.textContent =
transfers.filter(
t =>
String(t.status)
.toUpperCase() ===
"PENDING"
).length;


$("approvedTransfers")
.textContent =
transfers.filter(
t =>
String(t.status)
.toUpperCase() ===
"APPROVED"
).length;


$("completedTransfers")
.textContent =
transfers.filter(
t =>
String(t.status)
.toUpperCase() ===
"COMPLETED"
).length;

}


/* =====================================================
   RESET
===================================================== */

function resetForm(){

$("transferForm").reset();

$("editId").value = "";

$("modalTitle").textContent =
"＋ Sajili Transfer";

$("playerPreview").style.display =
"none";

$("conflictNotice").style.display =
"none";

$("transferDate").value =
new Date()
.toISOString()
.slice(0,10);

}


/* =====================================================
   ADD
===================================================== */

$("addBtn").onclick =
function(){

resetForm();

$("transferDialog")
.showModal();

};


/* =====================================================
   CANCEL
===================================================== */

$("cancelBtn").onclick =
function(){

$("transferDialog")
.close();

};


/* =====================================================
   PLAYER CHANGE
===================================================== */

$("playerId").onchange =
showPlayerPreview;


/* =====================================================
   DATE CHANGE
===================================================== */

$("contractStart").onchange =
checkConflict;

$("contractEnd").onchange =
checkConflict;


/* =====================================================
   SAVE
===================================================== */

$("transferForm").onsubmit =
async function(e){

e.preventDefault();


const editId =
$("editId").value.trim();


const playerId =
$("playerId").value;


const fromClubId =
$("fromClubId").value;


const toClubId =
$("toClubId").value;


const transferType =
$("transferType").value;


const transferDate =
$("transferDate").value;


const contractStart =
$("contractStart").value ||
null;


const contractEnd =
$("contractEnd").value ||
null;


const transferStatus =
$("transferStatus").value;


const notes =
$("notes").value.trim();


if(
!playerId ||
!fromClubId ||
!toClubId ||
!transferDate
){

alert(
"Jaza taarifa zote muhimu."
);

return;

}


if(
String(fromClubId) ===
String(toClubId)
){

alert(
"Klabu inayomtoa na inayompokea haiwezi kuwa klabu moja."
);

return;

}


if(
contractStart &&
contractEnd &&
contractEnd < contractStart
){

alert(
"Contract End haiwezi kuwa kabla ya Contract Start."
);

return;

}


const payload = {

player_id:
playerId,

from_club_id:
fromClubId,

to_club_id:
toClubId,

transfer_type:
transferType,

transfer_date:
transferDate,

contract_start:
contractStart,

contract_end:
contractEnd,

status:
transferStatus,

notes:
notes || null

};


setStatus(
editId
?
"⏳ Inasasisha transfer..."
:
"⏳ Inahifadhi transfer..."
);


let result;


if(editId){

result =
await db
.from(TRANSFERS_TABLE)
.update(payload)
.eq(
"id",
editId
);

}else{

result =
await db
.from(TRANSFERS_TABLE)
.insert(
payload
);

}


if(result.error){

console.error(
result.error
);

setStatus(
"❌ " +
result.error.message,
"err"
);

alert(
result.error.message
);

return;

}


$("transferDialog")
.close();


await loadData();


setStatus(
"✅ Transfer imehifadhiwa vizuri.",
"ok"
);

};


/* =====================================================
   EDIT
===================================================== */

async function editTransfer(id){

const transfer =
transfers.find(
t =>
String(t.id) ===
String(id)
);


if(!transfer)
return;


$("editId").value =
transfer.id;


$("playerId").value =
transfer.player_id;


$("fromClubId").value =
transfer.from_club_id || "";


$("toClubId").value =
transfer.to_club_id || "";


$("transferType").value =
transfer.transfer_type ||
"Permanent Transfer";


$("transferDate").value =
transfer.transfer_date ||
"";


$("contractStart").value =
transfer.contract_start ||
"";


$("contractEnd").value =
transfer.contract_end ||
"";


$("transferStatus").value =
transfer.status ||
"DRAFT";


$("notes").value =
transfer.notes ||
"";


showPlayerPreview();


$("modalTitle").textContent =
"✏️ Hariri Transfer";


$("transferDialog")
.showModal();

}


/* =====================================================
   DELETE
===================================================== */

async function deleteTransfer(id){

const transfer =
transfers.find(
t =>
String(t.id) ===
String(id)
);


if(!transfer)
return;


const player =
players.find(
p =>
String(p.id) ===
String(transfer.player_id)
);


const yes =
confirm(
"Una uhakika unataka kufuta transfer ya:\n\n" +
playerName(player) +
"\n\n" +
clubName(transfer.from_club_id) +
" → " +
clubName(transfer.to_club_id) +
"?"
);


if(!yes)
return;


setStatus(
"⏳ Inafuta transfer..."
);


const result =
await db
.from(TRANSFERS_TABLE)
.delete()
.eq(
"id",
id
);


if(result.error){

setStatus(
"❌ " +
result.error.message,
"err"
);

alert(
result.error.message
);

return;

}


await loadData();


setStatus(
"✅ Transfer imefutwa.",
"ok"
);

}

   FILTERS
===================================================== */

$("search").oninput =
renderTransfers;

$("filterStatus").onchange =
renderTransfers;


/* =====================================================
   START
===================================================== */

loadData();

</script>

</body>

</html>
