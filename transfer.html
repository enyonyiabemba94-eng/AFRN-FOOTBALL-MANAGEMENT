<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AFRN Football Management - Transfers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

:root{
--navy:#071a33;
--blue:#0d47a1;
--gold:#f5b400;
--green:#16834b;
--red:#c62828;
--bg:#f4f7fb;
--white:#fff;
--text:#172033;
--muted:#687386;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
background:linear-gradient(135deg,#06152b,#0d47a1);
color:white;
padding:18px 16px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 3px 12px #0002;
}

header h1{
margin:0;
font-size:20px;
}

header p{
margin:5px 0 0;
font-size:12px;
opacity:.85;
}

nav{
background:#fff;
display:flex;
gap:7px;
padding:10px;
overflow-x:auto;
border-bottom:1px solid #ddd;
}

nav a{
text-decoration:none;
white-space:nowrap;
padding:9px 12px;
border-radius:9px;
color:#172033;
font-size:13px;
font-weight:bold;
}

nav a.active{
background:var(--blue);
color:white;
}

main{
max-width:1150px;
margin:auto;
padding:16px;
}

.status{
background:white;
padding:11px 13px;
border-radius:10px;
border-left:4px solid var(--blue);
margin-bottom:15px;
font-size:13px;
}

.status.ok{
border-left-color:var(--green);
}

.status.err{
border-left-color:var(--red);
color:var(--red);
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.toolbar input,
.toolbar select{
flex:1;
min-width:180px;
padding:11px;
border:1px solid #d5dce7;
border-radius:9px;
background:white;
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:bold;
cursor:pointer;
}

.primary{
background:var(--blue);
color:white;
}

.secondary{
background:#e9eef6;
color:var(--text);
}

.danger{
background:#fee;
color:var(--red);
}

.success{
background:var(--green);
color:white;
}

.cards{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:white;
border:1px solid #e4e9f0;
border-radius:14px;
padding:15px;
box-shadow:0 3px 12px #14213d0d;
}

.stat small{
color:var(--muted);
font-weight:bold;
}

.stat b{
display:block;
font-size:25px;
margin-top:6px;
}

.transfer-card{
background:white;
border:1px solid #e3e8ef;
border-radius:15px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 12px #14213d0d;
}

.transfer-top{
display:flex;
gap:13px;
align-items:center;
}

.player-photo{
width:75px;
height:75px;
object-fit:cover;
border-radius:14px;
background:#eef2f7;
border:1px solid #dce2eb;
padding:3px;
}

.player-name{
font-size:17px;
font-weight:800;
margin:0;
}

.player-id{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.transfer-route{
display:grid;
grid-template-columns:1fr 55px 1fr;
gap:10px;
align-items:center;
margin:15px 0;
}

.club-box{
background:#f7f9fc;
border-radius:10px;
padding:11px;
text-align:center;
}

.club-box small{
display:block;
font-size:10px;
color:var(--muted);
font-weight:bold;
margin-bottom:5px;
}

.arrow{
text-align:center;
font-size:24px;
font-weight:bold;
color:var(--blue);
}

.chips{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.chip{
padding:5px 9px;
border-radius:999px;
font-size:11px;
font-weight:bold;
background:#eef4ff;
color:#174ea6;
}

.chip.green{
background:#dff5e8;
color:#146c3b;
}

.chip.red{
background:#fee2e2;
color:#a61b1b;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:13px;
}

.empty{
background:white;
border:1px dashed #cbd3df;
border-radius:14px;
padding:30px;
text-align:center;
color:var(--muted);
}

dialog{
width:min(700px,94vw);
border:0;
border-radius:18px;
padding:0;
box-shadow:0 20px 60px #0005;
}

dialog::backdrop{
background:#00112a99;
}

.modal{
padding:20px;
}

.modal h2{
margin:0 0 17px;
}

form{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.full{
grid-column:1/-1;
}

label{
font-size:12px;
font-weight:bold;
display:block;
}

.field{
width:100%;
padding:11px;
margin-top:5px;
border:1px solid #d4dbe6;
border-radius:9px;
background:white;
font:inherit;
}

.player-preview{
display:none;
margin-top:10px;
background:#f7f9fc;
border:1px solid #e1e6ee;
border-radius:12px;
padding:10px;
align-items:center;
gap:10px;
}

.preview-photo{
width:65px;
height:65px;
object-fit:cover;
border-radius:10px;
background:#eef2f7;
}

.preview-name{
font-weight:bold;
}

.preview-info{
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.form-actions{
grid-column:1/-1;
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:8px;
}

.notice{
background:#fff8df;
border-left:4px solid var(--gold);
padding:10px;
border-radius:8px;
font-size:12px;
display:none;
}

@media(max-width:700px){

.cards{
grid-template-columns:1fr 1fr;
}

form{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.form-actions{
grid-column:auto;
}

.transfer-route{
grid-template-columns:1fr;
}

.arrow{
transform:rotate(90deg);
}

}

</style>

</head>

<main>

<div id="status"
class="status">

</div>


<div class="cards">

</div>

<div class="stat">

<b id="pendingTransfers">0</b>
</div>

<div class="stat">

<b id="approvedTransfers">0</b>
</div>

<div class="stat">

<div class="toolbar">

<input

placeholder="🔎 Tafuta mchezaji, Player ID au klabu">

<select id="filterType">

<option value="">

<option value="">

<script>

/* =========================
   SUPABASE
========================= */

const db =
window.supabaseClient;


/* =========================
   TABLE
========================= */

const TRANSFERS_TABLE =
"transfers";

const PLAYERS_TABLE =
"players";

const CLUBS_TABLE =
"clubs";


let transfers = [];
let players = [];
let clubs = [];


const $ =
id => document.getElementById(id);


/* =========================
   STATUS
========================= */

function setStatus(
message,
type=""
){

$("status").textContent =
message;

$("status").className =
"status " + type;

}


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

return String(
value ?? ""
).replace(
/[&<>"']/g,
function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c];

}
);

}


/* =========================
   PLAYER NAME
========================= */

function playerName(player){

if(!player)
return "Mchezaji hajulikani";

return [

player.first_name,
player.middle_name,
player.last_name

]
.filter(Boolean)
.join(" ") ||

"Mchezaji";

}


/* =========================
   CLUB NAME
========================= */

function clubName(id){

const club =
clubs.find(
c =>
String(c.id) ===
String(id)
);

return club
? club.name
: "Klabu haijulikani";

}


/* =========================
   PLAYER
========================= */

function getPlayer(id){

return players.find(
p =>
String(p.id) ===
String(id)
);

}


/* =========================
   DATE
========================= */

function today(){

return new Date()
.toISOString()
.slice(0,10);

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

if(!db){

setStatus(
"❌ Supabase client haijapatikana. Hakikisha supabase-config.js ipo.",
"err"
);

return;

}


setStatus(
"⏳ Inapakia data..."
);


const [

playersResult,
clubsResult,
transfersResult

] = await Promise.all([

db
.from(PLAYERS_TABLE)
.select("*"),

db
.from(CLUBS_TABLE)
.select("*")
.order("name"),

db
.from(TRANSFERS_TABLE)
.select("*")
.order(
"created_at",
{ascending:false}
)

]);


/* PLAYERS */

if(playersResult.error){

setStatus(
"❌ Players: " +
playersResult.error.message,
"err"
);

return;

}


/* CLUBS */

if(clubsResult.error){

setStatus(
"❌ Clubs: " +
clubsResult.error.message,
"err"
);

return;

}


/* TRANSFERS */

if(transfersResult.error){

setStatus(
"❌ Transfers: " +
transfersResult.error.message,
"err"
);

console.error(
transfersResult.error
);

return;

}


players =
playersResult.data || [];

clubs =
clubsResult.data || [];

transfers =
transfersResult.data || [];


loadPlayerOptions();

loadClubOptions();

render();

updateStats();


setStatus(
"✅ Supabase imeunganishwa • " +
players.length +
" wachezaji • " +
clubs.length +
" vilabu • " +
transfers.length +
" transfers",
"ok"
);

}


/* =========================
   PLAYER OPTIONS
========================= */

function loadPlayerOptions(){

const select =
$("playerId");

select.innerHTML =
`
<option value="">
Chagua mchezaji
</option>
`;


players
.sort(
(a,b)=>
playerName(a)
.localeCompare(
playerName(b)
)
)
.forEach(
player => {

select.innerHTML += `

<option value="${esc(player.id)}">

${esc(
playerName(player)
)}

${player.player_id_number
? " — " +
esc(player.player_id_number)
: ""}

</option>

`;

}
);

}


/* =========================
   CLUB OPTIONS
========================= */

function loadClubOptions(){

const from =
$("fromClubId");

const to =
$("toClubId");


from.innerHTML =
`
<option value="">
Chagua klabu
</option>
`;


to.innerHTML =
`
<option value="">
Chagua klabu
</option>
`;


clubs.forEach(
club => {

from.innerHTML += `
<option value="${esc(club.id)}">
${esc(club.name)}
</option>
`;

to.innerHTML += `
<option value="${esc(club.id)}">
${esc(club.name)}
</option>
`;

}
);

}


/* =========================
   PLAYER PREVIEW
========================= */

function playerPreview(){

const player =
getPlayer(
$("playerId").value
);


if(!player){

$("playerPreview")
.style.display =
"none";

return;

}


$("previewName")
.textContent =
playerName(player);


const club =
clubName(
player.club_id
);


$("previewInfo")
textContent =
"⚽ " + club;


$("previewPhoto").src =
player.photo_url ||
"";


$("playerPreview")
.style.display =
"flex";


/* Automatically select current club */

if(player.club_id){

$("fromClubId").value =
player.club_id;

}


checkConflict();

}


/* =========================
   CONFLICT
========================= */

function checkConflict(){

const playerId =
$("playerId").value;

const start =
$("contractStart").value;

const end =
$("contractEnd").value;


const notice =
$("conflictNotice");


if(
!playerId ||
!start ||
!end
){

notice.style.display =
"none";

return;

}


const conflicts =
transfers.filter(
t =>

String(t.player_id) ===
String(playerId)

&&

t.contract_start

&&

t.contract_end

&&

start <=
t.contract_end

&&

end >=
t.contract_start

);


if(conflicts.length){

notice.style.display =
"block";

notice.innerHTML =

"⚠️ <b>Mkataba/transfer unaonekana kuingiliana.</b><br>" +

conflicts.map(
t =>

esc(
clubName(
t.from_club_id
)
) +

" → " +

esc(
clubName(
t.to_club_id
)
)

).join("<br>");

}else{

notice.style.display =
"none";

}

}


/* =========================
   RENDER
========================= */

function render(){

const box =
$("transfersContainer");


const search =
$("search")
.value
.trim()
.toLowerCase();


const type =
$("filterType")
.value;


const status =
$("filterStatus")
.value;


const filtered =
transfers.filter(
t => {

const player =
getPlayer(
t.player_id
);


const text = (

playerName(player) +
" " +

(player?.player_id_number || "") +
" " +

clubName(t.from_club_id) +
" " +

clubName(t.to_club_id)

).toLowerCase();


return (

!search ||
text.includes(search)

)

&&

(

!type ||
t.transfer_type ===
type

)

&&

(

!status ||
t.status ===
status

);

}
);


if(!filtered.length){

box.innerHTML = `

<div class="empty">

📭 Hakuna transfer
inayopatikana.

</div>

`;

return;

}


box.innerHTML =
filtered
.map(
transferCard
)
.join("");

}


/* =========================
   CARD
========================= */

function transferCard(t){

const player =
getPlayer(
t.player_id
);


const photo =
player?.photo_url ||
"";


const status =
t.status ||
"DRAFT";


let statusClass =
"";


if(status === "COMPLETED")
statusClass =
"green";

if(status === "CANCELLED")
statusClass =
"red";


return `

<article class="transfer-card">

<div class="transfer-top">

${
photo

?

`
<img
class="player-photo"
src="${esc(photo)}"
alt="${esc(playerName(player))}">
`

:

`
<div
class="player-photo"
style="
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
">
👤
</div>
`

}

<div>

<h3 class="player-name">

${esc(
playerName(player)
)}

</h3>

<div class="player-id">

Player ID:
<b>
${esc(
player?.player_id_number ||
"-"
)}
</b>

</div>

</div>

</div>


<div class="transfer-route">

<div class="club-box">

<small>
KLABU INAYOMTOA
</small>

<b>
${esc(
clubName(t.from_club_id)
)}
</b>

</div>


<div class="arrow">
→
</div>


<div class="club-box">

<small>
KLABU INAYOPOKEA
</small>

<b>
${esc(
clubName(t.to_club_id)
)}
</b>

</div>

</div>


<div class="chips">

<span class="chip">

🔄 ${esc(
t.transfer_type ||
"-"
)}

</span>


<span class="chip">

📅 ${esc(
t.transfer_date ||
"-"
)}

</span>


<span class="chip ${statusClass}">

${esc(status)}

</span>

</div>


<div class="actions">

<button
class="secondary"
onclick="editTransfer('${esc(t.id)}')">

✏️ Hariri

</button>


<button
class="danger"
onclick="deleteTransfer('${esc(t.id)}')">

🗑️ Futa

</button>

</div>

</article>

`;

}


/* =========================
   STATS
========================= */

function updateStats(){

$("totalTransfers")
.textContent =
transfers.length;


$("pendingTransfers")
.textContent =
transfers.filter(
t =>
t.status === "PENDING"
).length;


$("approvedTransfers")
.textContent =
transfers.filter(
t =>
t.status === "APPROVED"
).length;


$("completedTransfers")
.textContent =
transfers.filter(
t =>
t.status === "COMPLETED"
).length;

}


/* =========================
   ADD
========================= */

$("addBtn").onclick =
function(){

$("transferForm").reset();

$("editId").value =
"";

$("modalTitle")
.textContent =
"＋ Sajili Transfer";

$("playerPreview")
.style.display =
"none";

$("conflictNotice")
.style.display =
"none";

$("transferDate").value =
today();

$("transferStatus").value =
"PENDING";

$("transferDialog")
.showModal();

};


/* =========================
   CANCEL
========================= */

$("cancelBtn").onclick =
function(){

$("transferDialog")
.close();

};


/* =========================
   PLAYER CHANGE
========================= */

$("playerId").onchange =
playerPreview;


/* =========================
   DATE CHANGE
========================= */

$("contractStart").onchange =
checkConflict;

$("contractEnd").onchange =
checkConflict;


/* =========================
   SAVE
========================= */

$("transferForm").onsubmit =
async function(e){

e.preventDefault();


const editId =
$("editId")
.value
.trim();


const playerId =
$("playerId")
.value;


const fromClubId =
$("fromClubId")
.value;


const toClubId =
$("toClubId")
.value;


const transferType =
$("transferType")
.value;


const transferDate =
$("transferDate")
.value;


const contractStart =
$("contractStart")
.value ||
null;


const contractEnd =
$("contractEnd")
.value ||
null;


const status =
$("transferStatus")
.value;


const fee =
$("transferFee")
.value === ""
? null
: Number(
$("transferFee").value
);


const notes =
$("notes")
.value
.trim() ||
null;


if(
!playerId ||
!fromClubId ||
!toClubId ||
!transferDate
){

alert(
"Jaza taarifa zote muhimu."
);

return;

}


if(
String(fromClubId) ===
String(toClubId)
){

alert(
"Klabu inayomtoa na klabu inayompokea haiwezi kuwa klabu moja."
);

return;

}


if(
contractStart &&
contractEnd &&
contractEnd < contractStart
){

alert(
"Contract End haiwezi kuwa kabla ya Contract Start."
);

return;

}


const payload = {

player_id:
playerId,

from_club_id:
fromClubId,

to_club_id:
toClubId,

transfer_type:
transferType,

transfer_date:
transferDate,

contract_start:
contractStart,

contract_end:
contractEnd,

status:
status,

transfer_fee:
fee,

notes:
notes

};


setStatus(
editId
?
"⏳ Inasasisha transfer..."
:
"⏳ Inahifadhi transfer..."
);


let result;


if(editId){

result =
await db
.from(TRANSFERS_TABLE)
.update(payload)
.eq(
"id",
editId
);

}else{

result =
await db
.from(TRANSFERS_TABLE)
.insert(
payload
);

}


if(result.error){

console.error(
result.error
);

setStatus(
"❌ " +
result.error.message,
"err"
);

alert(
result.error.message
);

return;

}


$("transferDialog")
.close();


await loadData();

};


/* =========================
   EDIT
========================= */

function editTransfer(id){

const transfer =
transfers.find(
t =>
String(t.id) ===
String(id)
);


if(!transfer)
return;


$("editId").value =
transfer.id;


$("playerId").value =
transfer.player_id;


$("fromClubId").value =
transfer.from_club_id;


$("toClubId").value =
transfer.to_club_id;


$("transferType").value =
transfer.transfer_type ||
"Permanent Transfer";


$("transferDate").value =
transfer.transfer_date ||
"";


$("contractStart").value =
transfer.contract_start ||
"";


$("contractEnd").value =
transfer.contract_end ||
"";


$("transferStatus").value =
transfer.status ||
"PENDING";


$("transferFee").value =
transfer.transfer_fee ??
"";


$("notes").value =
transfer.notes ||
"";


$("modalTitle")
.textContent =
"✏️ Hariri Transfer";


playerPreview();


$("transferDialog")
.showModal();

}


/* =========================
   DELETE
========================= */

async function deleteTransfer(id){

const transfer =
transfers.find(
t =>
String(t.id) ===
String(id)
);


if(!transfer)
return;


const player =
getPlayer(
transfer.player_id
);


const ok =
confirm(

"Una uhakika unataka kufuta transfer ya:\n\n" +

playerName(player) +

"\n\n" +

clubName(
transfer.from_club_id
) +

" → " +

clubName(
transfer.to_club_id
) +

"?"

);


if(!ok)
return;


setStatus(
"⏳ Inafuta transfer..."
);


const result =
await db
.from(TRANSFERS_TABLE)
.delete()
.eq(
"id",
id
);


if(result.error){

setStatus(
"❌ " +
result.error.message,
"err"
);

alert(
result.error.message
);

return;

}


await loadData();

}


/* =========================
   FILTERS
========================= */

$("search").oninput =
render;

$("filterType").onchange =
render;

$("filterStatus").onchange =
render;


/* =========================
   START
========================= */

loadData();

</script>

</body>

</html>
