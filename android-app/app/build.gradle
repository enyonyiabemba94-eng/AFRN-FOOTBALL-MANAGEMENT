plugins { id 'com.android.application' }

android {
    namespace 'tz.afrn.footballmanagement'
    compileSdk 35

    defaultConfig {
        applicationId 'tz.afrn.footballmanagement'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty('AFRN_STORE_FILE')
            def storePasswordValue = project.findProperty('AFRN_STORE_PASSWORD')
            def keyAliasValue = project.findProperty('AFRN_KEY_ALIAS')
            def keyPasswordValue = project.findProperty('AFRN_KEY_PASSWORD')
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.findProperty('AFRN_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
