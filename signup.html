<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>AFRN — Fungua Akaunti</title><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a;padding:20px}.card{width:min(440px,100%);margin:auto;background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 35px #0001}.brand{text-align:center}.logo{width:78px;height:78px;object-fit:contain;border-radius:18px;background:#071a33;padding:7px}.brand h1{font-size:22px;margin:8px 0 4px}.brand p{font-size:12px;color:#667085;font-weight:700}label{display:block;font-weight:700;margin:13px 0 6px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;box-sizing:border-box}.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#0b5ed7;color:#fff;font-size:16px;font-weight:700}.link{display:block;text-align:center;margin-top:12px;color:#0b5ed7;text-decoration:none;font-weight:700}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;line-height:1.45}.ok{display:block;background:#ecfdf3;color:#027a48}.err{display:block;background:#fff0f0;color:#b42318}.note{margin-top:14px;background:#fff8e6;padding:11px;border-radius:9px;font-size:12px;color:#7a5b00}</style></head><body><div class="card"><div class="brand"><img class="logo" src="./IMG-20260319-WA0093.jpg" alt="AFRN"><h1>AFRN FOOTBALL MANAGEMENT</h1><p>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</p></div><form id="form"><label>Jina kamili</label><input id="name" required><label>Namba ya simu</label><input id="phone" type="tel"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><label>Rudia Password</label><input id="confirm" type="password" minlength="8" required><button class="btn" id="btn" type="submit">📝 Fungua Akaunti</button></form><div id="msg" class="msg"></div><div class="note">📧 Baada ya kufungua akaunti, thibitisha email yako kupitia link tutakayotuma. Akaunti yako ni ya kawaida (Mtumiaji) na haihitaji approval ya AFRN.</div><a class="link" href="./login.html">← Tayari nina akaunti — Ingia</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}const c=window.supabase.createClient('https://jjqhvruppafpumcthmwe.supabase.co','sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G');const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('btn');const show=(t,ok=false)=>{m.textContent=t;m.className='msg '+(ok?'ok':'err')};f.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('password').value;if(pw!==document.getElementById('confirm').value)return show('❌ Password mbili hazifanani.');b.disabled=true;b.textContent='⏳ Inafungua akaunti...';try{const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim().toLowerCase();const r=await c.auth.signUp({email,password:pw,options:{data:{full_name:name,phone}}});if(r.error)throw r.error;if(r.data.session&&r.data.user){const p=await c.from('profiles').upsert({id:r.data.user.id,full_name:name,phone,role:'user'},{onConflict:'id'});if(p.error)throw p.error;await c.auth.signOut({scope:'local'});show('✅ Akaunti imefunguliwa na iko kwenye Pending Approval. Subiri AFRN iidhinishe.',true)}else show('✅ Akaunti imeanzishwa. Angalia email yako, ithibitishe, kisha ingia. Itawekwa Pending Approval mpaka AFRN iidhinishe.',true);f.reset()}catch(x){show('❌ '+(x.message||x))}finally{b.disabled=false;b.textContent='📝 Fungua Akaunti'}}});});</script>
<script src="./afrn-player-photo-global.js"></script>
</body></html>
