<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN - Ongeza / Hariri Klabu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}main{max-width:900px;margin:25px auto;padding:15px}.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:18px;box-shadow:0 4px 15px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}input,select{padding:12px;border:1px solid #d9e1ec;border-radius:9px}.full{grid-column:1/-1}.btn{padding:12px 17px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#0d6efd;color:#fff}.secondary{background:#eef2f6}.status{margin-top:14px;padding:12px;border-radius:9px;display:none}.status.show{display:block}.error{background:#fdecec;color:#b42318}.success{background:#e9f7ef;color:#067647}.editing{background:#fff7e6;padding:12px;border-radius:9px;display:none;margin:12px 0}nav a{color:#fff;margin-right:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><h2>⚽ AFRN FOOTBALL MANAGEMENT</h2><div>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</div><nav><a href="index.html">Dashboard</a><a href="clubs.html">Vilabu</a><a href="add-club.html">Ongeza Klabu</a></nav></header><main><section class="card"><h2 id="title">➕ ONGEZA KLABU</h2><p id="desc">Sajili klabu mpya.</p><div id="editing" class="editing">✏️ Unahariri klabu. AFRN Club ID haitabadilishwa.</div><div class="grid"><div class="field"><label>Jina la Klabu *</label><input id="clubName"></div><div class="field"><label>Daraja *</label><select id="division"><option value="">Chagua</option><option value="1">DARAJA LA I</option><option value="2">DARAJA LA II</option><option value="3">DARAJA LA III</option><option value="4">DARAJA LA IV</option></select></div><div class="field"><label>Zone</label><input id="zone"></div><div class="field"><label>Simu</label><input id="phone"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Mwaka ulioanzishwa</label><input id="foundedYear" type="number"></div><div class="field"><label>Status</label><select id="status"><option value="active">ACTIVE</option><option value="inactive">INACTIVE</option></select></div><div class="field"><label>AFRN Club ID</label><div id="clubId">Itatengenezwa</div></div><div class="field full"><label>Logo URL</label><input id="logoUrl"></div></div><p><button id="save" class="btn primary">💾 Hifadhi Klabu</button> <button id="clear" class="btn secondary">↺ Safisha</button></p><div id="msg" class="status"></div></section><section class="card"><h3>📋 Klabu zilizopo</h3><div id="list">Inapakia...</div></section></main><script>
const db=window.supabaseClient;const $=id=>document.getElementById(id);let editingId=null,editingClubId=null;
const clean=v=>String(v??'').trim();
async function getClubs(){if(!db)throw new Error('Supabase client haipatikani.');const r=await db.from('clubs').select('id,name,afrn_club_id,division,zone,phone,email,founded_year,status,logo_url').order('name');if(r.error)throw r.error;return r.data||[]}
function nextId(rows){let n=0;rows.forEach(x=>{const m=String(x.afrn_club_id||'').match(/^AFRN-CLB-(\d{5})$/i);if(m)n=Math.max(n,+m[1])});return 'AFRN-CLB-'+String(n+1).padStart(5,'0')}
function msg(t,type){$("msg").textContent=t;$("msg").className='status show '+type}
function startEdit(c){editingId=c.id;editingClubId=c.afrn_club_id||'';$('title').textContent='✏️ HARIRI KLABU';$('desc').textContent='Badilisha taarifa za klabu iliyopo.';$('editing').style.display='block';$('clubName').value=c.name||'';$('division').value=String(c.division||'');$('zone').value=c.zone||'';$('phone').value=c.phone||'';$('email').value=c.email||'';$('foundedYear').value=c.founded_year||'';$('status').value=c.status||'active';$('logoUrl').value=c.logo_url||'';$('clubId').textContent=editingClubId||'Haijawekwa';$('save').textContent='💾 Hifadhi Mabadiliko';scrollTo(0,0)}
function reset(){editingId=null;editingClubId=null;$('title').textContent='➕ ONGEZA KLABU';$('desc').textContent='Sajili klabu mpya.';$('editing').style.display='none';$('clubName').value='';$('division').value='';$('zone').value='';$('phone').value='';$('email').value='';$('foundedYear').value='';$('status').value='active';$('logoUrl').value='';$('save').textContent='💾 Hifadhi Klabu';getClubs().then(r=>$('clubId').textContent=nextId(r)).catch(()=>{})}
async function save(){try{const name=clean($('clubName').value),division=clean($('division').value);if(!name||!division)return msg('Jina la klabu na daraja ni lazima.','error');const rows=await getClubs();if(rows.some(c=>clean(c.name).toLowerCase()===name.toLowerCase()&&c.id!==editingId))return msg('Klabu yenye jina hilo tayari ipo.','error');const payload={name,division,zone:clean($('zone').value)||null,phone:clean($('phone').value)||null,email:clean($('email').value)||null,founded_year:clean($('foundedYear').value)?Number($('foundedYear').value):null,status:clean($('status').value)||'active',logo_url:clean($('logoUrl').value)||null};if(editingId){const r=await db.from('clubs').update(payload).eq('id',editingId);if(r.error)throw r.error;msg('✅ Taarifa za klabu zimehaririwa: '+editingClubId,'success')}else{payload.afrn_club_id=nextId(rows);const r=await db.from('clubs').insert(payload);if(r.error)throw r.error;msg('✅ Klabu imeongezwa: '+payload.afrn_club_id,'success')}await renderList();if(!editingId)reset()}catch(e){msg('❌ Imeshindikana: '+e.message,'error')}}
async function renderList(){try{const rows=await getClubs();$('list').innerHTML=rows.map(c=>'<div style="padding:10px;border-bottom:1px solid #eee"><strong>'+esc(c.name)+'</strong> — '+esc(c.afrn_club_id||'—')+' — Daraja '+esc(c.division||'—')+' <button class="btn secondary" data-id="'+esc(c.id)+'">✏️ Hariri</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const c=rows.find(x=>String(x.id)===String(b.dataset.id));if(c)startEdit(c)})}catch(e){$('list').textContent='Imeshindikana: '+e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('edit');if(id){try{const r=await db.from('clubs').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('Taarifa za klabu hazijapatikana.');startEdit(r.data)}catch(e){msg('❌ Taarifa za klabu hazijapatikana: '+e.message,'error')}}else{try{$('clubId').textContent=nextId(await getClubs())}catch(e){}}await renderList()});$('save').onclick=save;$('clear').onclick=reset;
</script></body></html>
