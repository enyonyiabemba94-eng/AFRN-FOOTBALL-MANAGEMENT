<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN - Ongeza / Hariri Klabu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}main{max-width:900px;margin:25px auto;padding:15px}.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:18px;box-shadow:0 4px 15px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}input,select{padding:12px;border:1px solid #d9e1ec;border-radius:9px}.full{grid-column:1/-1}.btn{padding:12px 17px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#0d6efd;color:#fff}.secondary{background:#eef2f6}.status{margin-top:14px;padding:12px;border-radius:9px;display:none}.status.show{display:block}.error{background:#fdecec;color:#b42318}.success{background:#e9f7ef;color:#067647}.editing{background:#fff7e6;padding:12px;border-radius:9px;display:none;margin:12px 0}nav a{color:#fff;margin-right:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><h2>⚽ AFRN FOOTBALL MANAGEMENT</h2><div>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</div><nav><a href="index.html">Dashboard</a><a href="clubs.html">Vilabu</a><a id="addClubNav" href="add-club.html">Ongeza Klabu</a></nav></header><main><section class="card"><h2 id="title">➕ ONGEZA KLABU</h2><p id="desc">Sajili klabu mpya.</p><div id="editing" class="editing">✏️ Unahariri klabu. AFRN Club ID haitabadilishwa.</div><div class="grid"><div class="field"><label>Jina la Klabu *</label><input id="clubName"></div><div class="field"><label>Daraja *</label><select id="division"><option value="">Chagua</option><option value="1">DARAJA LA I</option><option value="2">DARAJA LA II</option><option value="3">DARAJA LA III</option><option value="4">DARAJA LA IV</option></select></div><div class="field"><label>Zone</label><input id="zone"></div><div class="field"><label>Simu</label><input id="phone"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Mwaka ulioanzishwa</label><input id="foundedYear" type="number"></div><div class="field"><label>Status</label><select id="status"><option value="active">ACTIVE</option><option value="inactive">INACTIVE</option></select></div><div class="field"><label>AFRN Club ID</label><div id="clubId">Itatengenezwa</div></div><div class="field full"><label>Logo URL</label><input id="logoUrl"></div></div><p><button id="save" class="btn primary">💾 Hifadhi Klabu</button> <button id="clear" class="btn secondary">↺ Safisha</button></p><div id="msg" class="status"></div></section><section class="card"><h3>📋 Klabu zilizopo</h3><div id="list">Inapakia...</div></section></main><script>
function getDB(){if(window.supabaseClient&&typeof window.supabaseClient.from==='function')return window.supabaseClient;if(window.afrnSupabase&&typeof window.afrnSupabase.from==='function')return window.afrnSupabase;if(window.sb&&typeof window.sb.from==='function')return window.sb;throw new Error('Supabase client haipatikani.');}
const $=id=>document.getElementById(id);let editingId=null,editingClubId=null;const clean=v=>String(v??'').trim();
async function identity(){const db=getDB();const {data:{user},error}=await db.auth.getUser();if(error||!user)return null;const {data,error:pe}=await db.from('profiles').select('id,role,club_id,full_name').eq('id',user.id).maybeSingle();if(pe)throw pe;return data||null}
function isAfrnAdmin(me){return ['super_admin','superadmin','admin','administrator','afrn_admin','secretary_general'].includes(String(me?.role||'').toLowerCase())}
function deny(){document.body.innerHTML='<main style="max-width:650px;margin:60px auto;padding:20px"><section style="background:#fff;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0001;text-align:center"><h2>🔒 Access Denied</h2><p>Club Admin hana ruhusa ya kuongeza au kuhariri klabu.</p><a href="clubs.html">← Rudi Vilabu</a></section></main>'}
async function guard(){const me=await identity();if(!isAfrnAdmin(me)){deny();throw new Error('NO_CLUB_MANAGEMENT_ACCESS')}document.getElementById('addClubNav').style.display='inline'}
async function getClubs(){const r=await getDB().from('clubs').select('id,name,afrn_club_id,division,zone,phone,email,founded_year,status,logo_url').order('name');if(r.error)throw r.error;return r.data||[]}
function nextId(rows){let n=0;rows.forEach(x=>{const m=String(x.afrn_club_id||'').match(/^AFRN-CLB-(\d{5})$/i);if(m)n=Math.max(n,+m[1])});return 'AFRN-CLB-'+String(n+1).padStart(5,'0')}
function msg(t,type){$("msg").textContent=t;$("msg").className='status show '+type}
function startEdit(c){editingId=c.id;editingClubId=c.afrn_club_id||'';$('title').textContent='✏️ HARIRI KLABU';$('desc').textContent='Badilisha taarifa za klabu iliyopo.';$('editing').style.display='block';$('clubName').value=c.name||'';$('division').value=String(c.division||'');$('zone').value=c.zone||'';$('phone').value=c.phone||'';$('email').value=c.email||'';$('foundedYear').value=c.founded_year||'';$('status').value=c.status||'active';$('logoUrl').value=c.logo_url||'';$('clubId').textContent=editingClubId||'Haijawekwa';$('save').textContent='💾 Hifadhi Mabadiliko';scrollTo(0,0)}
function reset(){editingId=null;editingClubId=null;$('title').textContent='➕ ONGEZA KLABU';$('desc').textContent='Sajili klabu mpya.';$('editing').style.display='none';$('clubName').value='';$('division').value='';$('zone').value='';$('phone').value='';$('email').value='';$('foundedYear').value='';$('status').value='active';$('logoUrl').value='';$('save').textContent='💾 Hifadhi Klabu';getClubs().then(r=>$('clubId').textContent=nextId(r)).catch(()=>{})}
async function save(){try{const me=await identity();if(!isAfrnAdmin(me))return deny();const db=getDB(),name=clean($('clubName').value),division=clean($('division').value);if(!name||!division)return msg('Jina la klabu na daraja ni lazima.','error');const rows=await getClubs();if(rows.some(c=>clean(c.name).toLowerCase()===name.toLowerCase()&&c.id!==editingId))return msg('Klabu yenye jina hilo tayari ipo.','error');const payload={name,division,zone:clean($('zone').value)||null,phone:clean($('phone').value)||null,email:clean($('email').value)||null,founded_year:clean($('foundedYear').value)?Number($('foundedYear').value):null,status:clean($('status').value)||'active',logo_url:clean($('logoUrl').value)||null};if(editingId){const r=await db.from('clubs').update(payload).eq('id',editingId);if(r.error)throw r.error;msg('✅ Taarifa za klabu zimehaririwa: '+editingClubId,'success')}else{payload.afrn_club_id=nextId(rows);const r=await db.from('clubs').insert(payload);if(r.error)throw r.error;msg('✅ Klabu imeongezwa: '+payload.afrn_club_id,'success')}await renderList();if(!editingId)reset()}catch(e){if(e.message==='NO_CLUB_MANAGEMENT_ACCESS')return;msg('❌ Imeshindikana: '+e.message,'error')}}
async function renderList(){try{const me=await identity();if(!isAfrnAdmin(me))return deny();const rows=await getClubs();$('list').innerHTML=rows.map(c=>'<div style="padding:10px;border-bottom:1px solid #eee"><strong>'+esc(c.name)+'</strong> — '+esc(c.afrn_club_id||'—')+' — Daraja '+esc(c.division||'—')+' <button class="btn secondary" data-id="'+esc(c.id)+'">✏️ Hariri</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const c=rows.find(x=>String(x.id)===String(b.dataset.id));if(c)startEdit(c)})}catch(e){if(e.message!=='NO_CLUB_MANAGEMENT_ACCESS')$('list').textContent='Imeshindikana: '+e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
async function findClub(id,name){const db=getDB();if(id){const r=await db.from('clubs').select('*').eq('id',id).limit(1);if(!r.error&&r.data&&r.data[0])return r.data[0]}if(name){const cleanName=decodeURIComponent(name).replace(/^\s*\d+\.\s*/,'').trim();const r=await db.from('clubs').select('*').ilike('name',cleanName).limit(1);if(!r.error&&r.data&&r.data[0])return r.data[0]}return null}
document.addEventListener('DOMContentLoaded',async()=>{try{await guard();const q=new URLSearchParams(location.search),id=q.get('edit'),name=q.get('editName');const c=await findClub(id,name);if(id||name){if(!c)throw new Error('Klabu haikupatikana. ID: '+(id||'—')+' / Jina: '+(name||'—'));startEdit(c)}else{$('clubId').textContent=nextId(await getClubs())}await renderList()}catch(e){if(e.message!=='NO_CLUB_MANAGEMENT_ACCESS')msg('❌ '+e.message,'error')}});$('save').onclick=save;$('clear').onclick=reset;
</script>
<script src="./afrn-player-photo-global.js"></script>
</body></html>
