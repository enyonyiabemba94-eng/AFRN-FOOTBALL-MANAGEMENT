<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AFRN Football Management - Transfers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

:root{
--navy:#071a33;
--blue:#0d47a1;
--green:#198754;
--red:#dc3545;
--orange:#f59e0b;
--gray:#667085;
--bg:#f4f7fb;
--border:#d9e1ec;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:#172033;
}

header{
background:var(--navy);
color:white;
padding:18px;
}

header h2,
header p{
margin:0;
}

header p{
margin-top:6px;
opacity:.9;
}

main{
max-width:1150px;
margin:auto;
padding:18px;
}

.card{
background:white;
padding:16px;
margin:12px 0;
border-radius:12px;
box-shadow:0 2px 8px #0000000d;
}

.btn{
border:0;
border-radius:9px;
padding:10px 14px;
font-weight:700;
cursor:pointer;
margin:3px;
text-decoration:none;
display:inline-block;
}

.primary{
background:var(--blue);
color:white;
}

.secondary{
background:#e9eef5;
color:#172033;
}

.danger{
background:var(--red);
color:white;
}

.green{
background:var(--green);
color:white;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

label{
display:block;
font-weight:700;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:11px;
border:1px solid var(--border);
border-radius:8px;
font:inherit;
}

textarea{
min-height:90px;
}

.transfer-card{
display:grid;
grid-template-columns:105px 1fr auto;
gap:18px;
align-items:center;
}

.player-photo{
width:100px;
height:100px;
object-fit:cover;
border-radius:8px;
border:2px solid #dfe5ec;
background:#e9eef5;
}

.player-name{
margin:0 0 10px;
font-size:20px;
}

.info{
margin:6px 0;
line-height:1.5;
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:700;
}

.permanent{
background:#dbeafe;
color:#1e3a8a;
}

.loan{
background:#fff3cd;
color:#664d03;
}

.active{
background:#d1e7dd;
color:#0f5132;
}

.expired{
background:#f8d7da;
color:#842029;
}

.preview{
display:none;
text-align:center;
margin-top:10px;
padding:15px;
background:#f8fafc;
border:1px solid var(--border);
border-radius:12px;
}

.preview img{
width:130px;
height:130px;
object-fit:cover;
border-radius:8px;
}

.notice{
display:none;
margin-top:10px;
padding:12px;
border-radius:9px;
background:#fff3cd;
color:#664d03;
}

.actions{
display:flex;
flex-wrap:wrap;
justify-content:flex-end;
gap:5px;
}

.muted{
color:var(--gray);
}

.hidden{
display:none!important;
}


/* ==========================
   LICENCE
========================== */

.license-card{
width:360px;
max-width:100%;
background:#fff;
border:1px solid #cbd5e1;
border-radius:12px;
padding:15px;
margin:15px auto;
box-shadow:0 4px 14px #0002;
}

.license-top{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid var(--navy);
padding-bottom:8px;
margin-bottom:10px;
}

.license-logo{
font-weight:800;
font-size:15px;
color:var(--navy);
}

.license-title{
font-size:14px;
font-weight:800;
}

.license-content{
display:grid;
grid-template-columns:90px 1fr;
gap:12px;
}

.license-photo{
width:88px;
height:105px;
object-fit:cover;
border-radius:6px;
border:1px solid #cbd5e1;
}

.license-info{
font-size:12px;
line-height:1.45;
}

.license-info strong{
color:#071a33;
}

.license-footer{
border-top:1px solid #d9e1ec;
margin-top:10px;
padding-top:9px;
display:flex;
justify-content:space-between;
gap:10px;
}

.signature{
text-align:center;
font-size:10px;
min-width:120px;
}

.signature-line{
height:30px;
border-bottom:1px solid #222;
margin-bottom:4px;
}

.chairman-signature{
font-family:cursive;
font-size:15px;
font-weight:700;
}

.license-actions{
text-align:center;
margin-top:10px;
}


/* ==========================
   MODAL
========================== */

dialog{
width:min(800px,95vw);
border:0;
border-radius:14px;
padding:0;
box-shadow:0 15px 50px #0005;
}

dialog::backdrop{
background:#0008;
}

.modal-body{
padding:20px;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
margin-bottom:15px;
}

.modal-head h3{
margin:0 0 15px;
}


/* ==========================
   MOBILE
========================== */

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.transfer-card{
grid-template-columns:80px 1fr;
}

.player-photo{
width:75px;
height:75px;
}

.transfer-card .actions{
grid-column:1/-1;
}

.license-card{
width:100%;
}

}

</style>
</head>

<body>

<header>

<h2>⚽ AFRN FOOTBALL MANAGEMENT</h2>

<p>
🔄 Uhamisho • 📄 Mikataba • 🪪 Licence
</p>

</header>


<main>

<h2>🔄 Uhamisho wa Wachezaji</h2>

<p>
Usimamizi wa transfer, mkataba na licence za wachezaji.
</p>

<button
class="btn primary"
id="addTransferBtn">

＋ Ongeza Transfer

</button>


<div
id="status"
class="card">

⏳ Inaanzisha mfumo...

</div>


<div class="card">

<label>
🔎 Tafuta Transfer
</label>

<input
id="search"
placeholder="Jina la mchezaji, klabu au transfer number...">

</div>


<div id="transfersContainer"></div>

</main>


<!-- ==========================
     TRANSFER DIALOG
========================== -->

<dialog id="transferDialog">

<div class="modal-body">

<div class="modal-head">

<h3>
＋ Ongeza Transfer
</h3>

<button
class="btn secondary"
type="button"
id="closeDialog">

✕

</button>

</div>


<form id="transferForm">

<div class="grid">


<div>

<label>
Mchezaji *
</label>

<select
id="playerId"
required>

<option value="">
Chagua Mchezaji
</option>

</select>


<div
id="playerPreview"
class="preview">

<img
id="previewPhoto">

<h3 id="previewName"></h3>

<p id="previewClub"></p>

</div>

</div>


<div>

<label>
Klabu anayotoka *
</label>

<select
id="fromClub"
required>

<option value="">
Chagua Klabu
</option>

</select>

</div>


<div>

<label>
Klabu ya sasa / anayokwenda *
</label>

<select
id="toClub"
required>

<option value="">
Chagua Klabu
</option>

</select>

</div>


<div>

<label>
Aina ya Transfer
</label>

<select
id="transferType">

<option value="Permanent">
Uhamisho wa kudumu
</option>

<option value="Loan">
Mkopo
</option>

</select>

</div>


<div>

<label>
Tarehe ya Transfer
</label>

<input
id="transferDate"
type="date">

</div>


<div>

<label>
Transfer Number
</label>

<input
id="transferNumber"
placeholder="TR-2026-001">

</div>


<div
id="loanTypeBox"
class="hidden">

<label>
Aina ya Mkopo
</label>

<select
id="loanType">

<option value="Months">
Mkopo wa miezi
</option>

<option value="League">
Mkopo wa Ligi
</option>

</select>

</div>


<div
id="loanEndBox"
class="hidden">

<label>
Mwisho wa Mkopo
</label>

<input
id="loanEndDate"
type="date">

</div>


<div
id="leagueNameBox"
class="hidden">

<label>
Jina la Ligi
</label>

<input
id="leagueName"

</div>


<div>

<label>
Mwisho wa Mkataba
</label>

id="contractEndDate"
type="date">

<div>

Miaka ya Mkataba
</label>

<div>

Status

</div>


<div>

<label>

</label>

</div>


<div>

<label>

</label>

<input id="fromSecretary">

<div>

<label>

<div>

</label>

<label>
Hati ya Transfer

id="documentFile"
type="file"

</div>

id="loanNotice"

</div>

Maelezo
</label>

id="notes"
placeholder="Maelezo ya transfer..."></textarea>


<div class="actions">

💾 Hifadhi Transfer

</button>

</button>

</div>

</form>

</div>

</dialog>


<script>

/* ==================================================
   CONFIG
================================================== */

const db =
window.supabaseClient;

const TRANSFER_TABLE =
"transfers";

const CONTRACT_TABLE =
"player_contracts";

const LICENSE_TABLE =
"player_licenses";

const STORAGE_BUCKET =
"AFRN FILES";

const TRANSFER_FOLDER =
"transfers";

const CONTRACT_FOLDER =
"contracts";

let transfers = [];

let players = [];

let clubs = [];


const $ =
id =>
document.getElementById(id);


/* ==================================================
   FALLBACK PHOTO
================================================== */

const FALLBACK =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

<svg xmlns="http://www.w3.org/2000/svg"
width="300"
height="300">

<rect
width="100%"
height="100%"
fill="#e9eef5"/>

<text
x="50%"
y="50%"
dominant-baseline="middle"
text-anchor="middle"
font-family="Arial"
font-size="24"
fill="#667085">

Picha haipo

</text>

</svg>

`);


/* ==================================================
   PLAYER NAME
================================================== */

function playerName(p){

if(!p)
return "Mchezaji";

return [

p.first_name,
p.middle_name,
p.last_name

]
.filter(Boolean)
.join(" ")

|| "Mchezaji";

}


/* ==================================================
   CLUB NAME
================================================== */

function clubName(id){

if(!id)
return "Klabu haijawekwa";

const c =
clubs.find(
x =>
String(x.id) ===
String(id)
);

return c?.name ||
"Klabu haijawekwa";

}


/* ==================================================
   PLAYER
================================================== */

function getPlayer(id){

return players.find(
p =>
String(p.id) ===
String(id)
);

}


/* ==================================================
   PHOTO
================================================== */

function getPhoto(p){

if(
p &&
p.photo_url &&
String(p.photo_url).trim()
){

return p.photo_url;

}

return FALLBACK;

}


/* ==================================================
   LOAD PLAYERS
================================================== */

async function loadPlayers(){

const result =
await db
.from("players")
.select("*");

if(result.error){

$("status").textContent =
"❌ Players: " +
result.error.message;

return false;

}

players =
result.data || [];

const select =
$("playerId");

select.innerHTML =
`
<option value="">
Chagua Mchezaji
</option>
`;

players.forEach(p=>{

const option =
document.createElement("option");

option.value =
p.id;

option.textContent =
playerName(p);

select.appendChild(option);

});

return true;

}


/* ==================================================
   LOAD CLUBS
================================================== */

async function loadClubs(){

const result =
await db
.from("clubs")
.select("*");

if(result.error){

$("status").textContent =
"❌ Clubs: " +
result.error.message;

return false;

}

clubs =
result.data || [];

const from =
$("fromClub");

const to =
$("toClub");

from.innerHTML =
`
<option value="">
Chagua Klabu
</option>
`;

to.innerHTML =
`
<option value="">
Chagua Klabu
</option>
`;

clubs.forEach(c=>{

let a =
document.createElement("option");

a.value =
c.id;

a.textContent =
c.name;

from.appendChild(a);


let b =
document.createElement("option");

b.value =
c.id;

b.textContent =
c.name;

to.appendChild(b);

});

return true;

}


/* ==================================================
   PLAYER PREVIEW
================================================== */

function showPlayer(){

const p =
getPlayer(
$("playerId").value
);

if(!p){

$("playerPreview")
.style.display =
"none";

return;

}

$("previewName")
.textContent =
playerName(p);

$("previewPhoto")
.src =
getPhoto(p);

$("previewPhoto").onerror =
function(){

this.onerror =
null;

this.src =
FALLBACK;

};

$("previewClub")
.textContent =
"Klabu ya sasa: " +
clubName(p.club_id);

$("playerPreview")
.style.display =
"block";

}


/* ==================================================
   LOAN UI
================================================== */

function loanUI(){

const loan =
$("transferType").value ===
"Loan";

if(loan){

$("loanTypeBox")
.classList
.remove("hidden");

$("loanNotice")
.style.display =
"block";

$("loanNotice").innerHTML =
`
🟡 <b>Huu ni uhamisho wa mkopo.</b>
`;

}
else{

$("loanTypeBox")
.classList
.add("hidden");

$("loanEndBox")
.classList
.add("hidden");

$("leagueNameBox")
.classList
.add("hidden");

$("loanNotice")
.style.display =
"none";

}

}


/* ==================================================
   LOAN TYPE
================================================== */

function loanTypeUI(){

if(
$("transferType").value !==
"Loan"
)
return;

const type =
$("loanType").value;

if(type === "League"){

$("loanEndBox")
.classList
.add("hidden");

$("leagueNameBox")
.classList
.remove("hidden");

$("loanNotice").innerHTML =
`
🏆 <b>MKOP0 WA LIGI</b><br>
Mchezaji atarejea baada ya ligi kumalizika.
`;

}
else{

$("loanEndBox")
.classList
.remove("hidden");

$("leagueNameBox")
.classList
.add("hidden");

$("loanNotice").innerHTML =
`
📅 <b>Mkopo wa miezi</b>
`;

}

}


/* ==================================================
   LOAD TRANSFERS
================================================== */

async function loadTransfers(){

$("status").textContent =
"⏳ Inapakia transfers...";

const result =
await db
.from(TRANSFER_TABLE)
.select("*")
.order(
"created_at",
{
ascending:false
}
);

if(result.error){

$("status").textContent =
"❌ " +
result.error.message;

return false;

}

transfers =
result.data || [];

$("status").textContent =
"✅ Transfers: " +
transfers.length;

render();

return true;

}


/* ==================================================
   RENDER
================================================== */

function render(){

const box =
$("transfersContainer");

if(!transfers.length){

box.innerHTML =
`
<div class="card muted">

Hakuna transfer bado.

</div>
`;

return;

}

box.innerHTML =
transfers.map(t=>{

const p =
getPlayer(
t.player_id
);

const from =
clubName(
t.from_club
);

const to =
clubName(
t.to_club
);

const loan =
String(
t.transfer_type || ""
)
.toLowerCase()
===
"loan";

const typeBadge =
loan
?
`
<span class="badge loan">
🟡 Mkopo
</span>
`
:
`
<span class="badge permanent">
🔵 Kudumu
</span>
`;

let loanInfo = "";

if(loan){

if(
t.loan_type ===
"League"
){

loanInfo =
`
<p class="info">
🏆 <b>Mkopo wa Ligi:</b>
${t.league_name || "-"}
</p>
`;

}
else{

loanInfo =
`
<p class="info">
📅 <b>Mwisho wa Mkopo:</b>
${t.loan_end_date || "-"}
</p>
`;

}

}


return `

<div class="card transfer-card">

<img
class="player-photo"
src="${getPhoto(p)}"
alt="${playerName(p)}"
onerror="
this.onerror=null;
this.src='${FALLBACK}'
">


<div>

<h3 class="player-name">
${playerName(p)}
</h3>

<p class="info">
<b>Klabu anayotoka:</b>
${from}
</p>

<p class="info">
<b>Klabu ya sasa:</b>
${to}
</p>

<p class="info">
${typeBadge}
</p>

<p class="info">
📅 <b>Transfer:</b>
${t.transfer_date || "-"}
</p>

${loanInfo}

${
t.contract_end_date
?
`
<p class="info">
📄 <b>Mkataba unaisha:</b>
${t.contract_end_date}
</p>
`
:
""
}

${
t.transfer_number
?
`
<p class="info">
🔢 <b>Transfer No:</b>
${t.transfer_number}
</p>
`
:
""
}

<span class="badge active">
${t.status || "Active"}
</span>

</div>


<div class="actions">

<button
class="btn green"
onclick="
createLicense('${t.id}')
">

🪪 Licence

</button>


<button
class="btn primary"
onclick="
createContract('${t.id}')
">

📄 Mkataba

</button>


<button
class="btn danger"
onclick="
deleteTransfer('${t.id}')
">

🗑️ Futa

</button>

</div>

</div>

`;

}).join("");

}


/* ==================================================
   SAVE TRANSFER
================================================== */

async function saveTransfer(e){

e.preventDefault();

const playerId =
$("playerId").value;

const fromClub =
$("fromClub").value;

const toClub =
$("toClub").value;

if(!playerId){

alert(
"Chagua mchezaji."
);

return;

}

if(!fromClub){

alert(
"Chagua klabu anayotoka."
);

return;

}

if(!toClub){

alert(
"Chagua klabu ya sasa."
);

return;

}

if(
String(fromClub) ===
String(toClub)
){

alert(
"Klabu anayotoka na klabu ya sasa " +
"haziwezi kuwa moja."
);

return;

}


let documentUrl =
null;

const file =
$("documentFile").files[0];

if(file){

$("status").textContent =
"⏳ Inapakia hati...";

const ext =
file.name
.split(".")
.pop()
.toLowerCase();

const path =
TRANSFER_FOLDER +
"/transfer_" +
Date.now() +
"." +
ext;

const upload =
await db.storage
.from(STORAGE_BUCKET)
.upload(
path,
file,
{
upsert:true,
contentType:file.type
}
);

if(upload.error){

$("status").textContent =
"❌ " +
upload.error.message;

return;

}

documentUrl =
db.storage
.from(STORAGE_BUCKET)
.getPublicUrl(path)
.data.publicUrl;

}


const isLoan =
$("transferType").value ===
"Loan";


const payload = {

player_id:
playerId,

from_club:
fromClub,

to_club:
toClub,

transfer_date:
$("transferDate").value ||
null,

transfer_number:
$("transferNumber")
.value
.trim() ||
null,

status:
$("transferStatus").value,

document_url:
documentUrl,

notes:
$("notes")
.value
.trim() ||
null,

transfer_type:
$("transferType").value,

loan_end_date:
isLoan &&
$("loanType").value ===
"Months"
?
$("loanEndDate").value ||
null
:
null,

contract_end_date:
$("contractEndDate").value ||
null,

contract_years:
$("contractYears").value
?
Number(
$("contractYears").value
)
:
null,

from_chairman:
$("fromChairman").value.trim() ||
null,

from_secretary:
$("fromSecretary").value.trim() ||
null,

to_chairman:
$("toChairman").value.trim() ||
null,

to_secretary:
$("toSecretary").value.trim() ||
null,

federation_chairman:
$("federationChairman").value.trim() ||
null,

federation_secretary:
$("federationSecretary").value.trim() ||
null

};


$("status").textContent =
"⏳ Inahifadhi transfer...";


const result =
await db
.from(TRANSFER_TABLE)
.insert(payload);


if(result.error){

$("status").textContent =
"❌ " +
result.error.message;

return;

}


$("transferDialog")
.close();


$("status").textContent =
"✅ Transfer imehifadhiwa.";

await loadTransfers();

}


/* ==================================================
   CREATE CONTRACT
================================================== */

async function createContract(transferId){

const t =
transfers.find(
x =>
String(x.id) ===
String(transferId)
);

if(!t){

alert(
"Transfer haipatikani."
);

return;

}


const p =
getPlayer(
t.player_id
);

================================================== */

async function deleteTransfer(
transferId
){

const transfer =
transfers.find(
t =>
String(t.id) ===
String(transferId)
);

if(!transfer){

alert(
"Transfer haipatikani."
);

return;

}


const p =
getPlayer(
transfer.player_id
);


const confirmed =
confirm(

"⚠️ FUTA TRANSFER KABISA?\n\n" +

"Mchezaji: " +
playerName(p) +

"\n\nKlabu anayotoka: " +
clubName(
transfer.from_club
) +

"\n\nKlabu ya sasa: " +
clubName(
transfer.to_club
) +

"\n\n" +

"Transfer itaondolewa kwenye database.\n" +

"Mkataba na licence zinazohusiana " +
"zitaondolewa pia.\n\n" +

"⚠️ Mchezaji mwenyewe hatafutwa.\n\n" +

"Endelea?"

);


if(!confirmed)
return;


try{

$("status").textContent =
"⏳ Inafuta...";


/*
========================================
1. DELETE CONTRACT
========================================
*/

if(
transfer.player_id &&
transfer.to_club
){

let q =
db
.from(CONTRACT_TABLE)
.delete()
.eq(
"player_id",
transfer.player_id
)
.eq(
"club_id",
transfer.to_club
);

if(
transfer.transfer_date
){

q =
q.eq(
"start_date",
transfer.transfer_date
);

}

const result =
await q;

if(result.error){

console.warn(
"Mkataba haukufutwa:",
result.error.message
);

}

}


/*
========================================
2. DELETE LICENCE
========================================
*/

if(
transfer.player_id &&
transfer.to_club
){

let q =
db
.from(LICENSE_TABLE)
.delete()
.eq(
"player_id",
transfer.player_id
)
.eq(
"club_id",
transfer.to_club
);

if(
transfer.transfer_date
){

q =
q.eq(
"registration_date",
transfer.transfer_date
);

}

const result =
await q;

if(result.error){

console.warn(
"Licence haikufutwa:",
result.error.message
);

}

}


/*
========================================
3. DELETE TRANSFER
========================================
*/

const result =
await db
.from(TRANSFER_TABLE)
.delete()
.eq(
"id",
transferId
);


if(result.error){

throw result.error;

}


/*
========================================
4. RELOAD DATABASE
========================================
*/

await loadTransfers();


$("status").textContent =
"✅ Transfer imefutwa kabisa.";

alert(
"✅ Transfer imeondolewa kwenye database."
);

}
catch(error){

console.error(
error
);

$("status").textContent =
"❌ " +
error.message;

alert(
"❌ Kufuta kumeshindikana:\n\n" +
error.message
);

}

}

return (

clubName(

)

||

clubName(
t.to_club
)
.toLowerCase()
.includes(q)

||

String(
t.transfer_number ||
""
)
.toLowerCase()
.includes(q)

);

});

render();

transfers =
original;

};
