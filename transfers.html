<script>
  /* =====================================================
   TRANSFER CERTIFICATE
   OPEN / CLOSE
====================================================== */

function openTransferCertificate(transfer) {

  if (!transfer) {

    alert("❌ Taarifa za uhamisho hazipo.");

    return;

  }


  const player =
    players.find(
      p => p.id === transfer.player_id
    );


  if (!player) {

    alert("❌ Mchezaji wa uhamisho hakupatikana.");

    return;

  }


  const fromClub =
    clubs.find(
      c => c.id === transfer.from_club_id
    );


  const toClub =
    clubs.find(
      c => c.id === transfer.to_club_id
    );


  fillTransferCertificate(
    transfer,
    player,
    fromClub,
    toClub
  );


  const dialog =
    $("certificateDialog");


  if (dialog) {

    dialog.showModal();

  }

}


function closeTransferCertificate() {

  const dialog =
    $("certificateDialog");


  if (
    dialog &&
    dialog.open
  ) {

    dialog.close();

  }

}
  function fillTransferCertificate(
  transfer,
  player,
  fromClub,
  toClub
) {

  /* =====================================================
     PLAYER
  ====================================================== */

  $("certificatePlayerName")
    .textContent =
    getPlayerName(player);


  $("certificatePlayerId")
    .textContent =
    player.id || "-";


  $("certificateDob")
    .textContent =
    player.date_of_birth ||
    player.dob ||
    "-";


  $("certificatePosition")
    .textContent =
    player.position ||
    "-";


  /* =====================================================
     CLUBS
  ====================================================== */

  $("certificateFromClub")
    .textContent =
    fromClub?.name ||
    "Klabu haijawekwa";


  $("certificateToClub")
    .textContent =
    toClub?.name ||
    "Klabu haijawekwa";


  /* =====================================================
     TRANSFER NUMBER
  ====================================================== */

  $("certificateTransferNumber")
    .textContent =
    transfer.transfer_number ||
    "-";


  /* =====================================================
     TRANSFER TYPE
  ====================================================== */

  $("certificateTransferType")
    .textContent =
    transfer.transfer_type === "loan"

      ? "📋 Mkopo"

      : "🔄 Uhamisho wa Kudumu";


  /* =====================================================
     ONE TRANSFER DATE
  ====================================================== */

  $("certificateTransferDate")
    .textContent =
    transfer.transfer_date ||
    "-";


  $("certificateDate")
    .textContent =
    transfer.transfer_date ||
    "-";


  /* =====================================================
     LOAN END DATE
  ====================================================== */

  const loanRow =
    $("certificateLoanRow");


  if (
    transfer.transfer_type === "loan" &&
    transfer.loan_end_date
  ) {

    loanRow.classList.remove(
      "hidden"
    );


    $("certificateLoanEnd")
      .textContent =
      transfer.loan_end_date;

  }

  else {

    loanRow.classList.add(
      "hidden"
    );

  }

  }
  /* =====================================================
   PRINT TRANSFER CERTIFICATE
====================================================== */

function printTransferCertificate() {

  const dialog =
    $("certificateDialog");


  if (!dialog) {

    alert(
      "❌ Certificate haijapatikana."
    );

    return;

  }


  window.print();

}
  
/* =====================================================
   CLOSE CERTIFICATE BUTTON
====================================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      event.target.id ===
      "closeCertificateBtn"
    ) {

      closeTransferCertificate();

    }


    if (
      event.target.id ===
      "printCertificateBtn"
    ) {

      printTransferCertificate();

    }

  }
);
  
const TRANSFERS_TABLE = "transfers";
const PLAYERS_TABLE = "players";
const CLUBS_TABLE = "clubs";
const CONTRACTS_TABLE = "player_contracts";

const STORAGE_BUCKET = "AFRN FILES";
const STORAGE_FOLDER = "transfers";

let db = window.supabaseClient;

let players = [];
let clubs = [];
let transfers = [];
let contracts = [];


/* =====================================================
   SHORTCUT
====================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   FALLBACK PHOTO
====================================================== */

const FALLBACK_PHOTO =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="200"
      height="200"
    >

      <rect
        width="100%"
        height="100%"
        fill="#e9eef5"
      />

      <text
        x="50%"
        y="52%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-size="80"
      >
        👤
      </text>

    </svg>
  `);


/* =====================================================
   PLAYER NAME
====================================================== */

function getPlayerName(player) {

  if (!player) {

    return "Mchezaji";

  }

  return [

    player.first_name,
    player.middle_name,
    player.last_name

  ]

    .filter(Boolean)

    .join(" ")

    || "Mchezaji";

}


/* =====================================================
   CLUB NAME
====================================================== */

function getClubName(clubId) {

  const club =
    clubs.find(
      club =>
        String(club.id) ===
        String(clubId)
    );

  return club?.name ||
    "Klabu haijawekwa";

}


/* =====================================================
   TODAY
====================================================== */

function getToday() {

  return new Date()
    .toISOString()
    .slice(0, 10);

}
  /* =====================================================
   LOAD TRANSFER DATA
====================================================== */

async function loadTransferData() {

  if (!db) {

    $("systemStatus").textContent =
      "❌ Supabase haijaunganishwa.";

    return;

  }


  $("systemStatus").textContent =
    "⏳ Inapakia taarifa...";


  const [

    playersResult,
    clubsResult,
    transfersResult,
    contractsResult

  ] = await Promise.all([

    db
      .from(PLAYERS_TABLE)
      .select("*"),

    db
      .from(CLUBS_TABLE)
      .select("*"),

    db
      .from(TRANSFERS_TABLE)
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      ),

    db
      .from(CONTRACTS_TABLE)
      .select("*")

  ]);


  if (playersResult.error) {

    console.error(
      "PLAYERS ERROR:",
      playersResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Players: " +
      playersResult.error.message;

    return;

  }


  if (clubsResult.error) {

    console.error(
      "CLUBS ERROR:",
      clubsResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Clubs: " +
      clubsResult.error.message;

    return;

  }


  if (transfersResult.error) {

    console.error(
      "TRANSFERS ERROR:",
      transfersResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Transfers: " +
      transfersResult.error.message;

    return;

  }


  if (contractsResult.error) {

    console.error(
      "CONTRACTS ERROR:",
      contractsResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Contracts: " +
      contractsResult.error.message;

    return;

  }


  players =
    playersResult.data || [];


  clubs =
    clubsResult.data || [];


  transfers =
    transfersResult.data || [];


  contracts =
    contractsResult.data || [];


  loadPlayerOptions();

  loadClubOptions();


  $("systemStatus").textContent =
    "✅ Players: " +
    players.length +
    " • Clubs: " +
    clubs.length +
    " • Uhamisho: " +
    transfers.length;

}
  /* =====================================================
   LOAD PLAYERS INTO SELECT
====================================================== */

function loadPlayerOptions() {

  const select =
    $("transferPlayerId");


  if (!select) {
    return;
  }


  select.innerHTML = `
    <option value="">
      Chagua Mchezaji
    </option>
  `;


  players.forEach(player => {

    const option =
      document.createElement("option");


    option.value =
      player.id;


    option.textContent =
      getPlayerName(player);


    select.appendChild(option);

  });

}


/* =====================================================
   LOAD CLUBS INTO SELECT
====================================================== */

function loadClubOptions() {

  const from =
    $("fromClubId");

  const to =
    $("toClubId");


  if (!from || !to) {
    return;
  }


  from.innerHTML = `
    <option value="">
      Chagua Klabu
    </option>
  `;


  to.innerHTML = `
    <option value="">
      Chagua Klabu
    </option>
  `;


  clubs.forEach(club => {

    const fromOption =
      document.createElement("option");


    fromOption.value =
      club.id;


    fromOption.textContent =
      club.name;


    from.appendChild(
      fromOption
    );


    const toOption =
      document.createElement("option");


    toOption.value =
      club.id;


    toOption.textContent =
      club.name;


    to.appendChild(
      toOption
    );

  });

  }
  /* =====================================================
   PLAYER SELECTED
====================================================== */

function showSelectedPlayer() {

  const playerId =
    $("transferPlayerId").value;


  const player =
    players.find(
      p =>
        String(p.id) ===
        String(playerId)
    );


  if (!player) {

    $("playerTransferPreview")
      .classList.add("hidden");

    $("fromClubId").value = "";

    $("toClubId").innerHTML = `
      <option value="">
        Chagua Klabu Anayoenda
      </option>
    `;

    return;

  }


  /* =====================================================
     PLAYER PREVIEW
  ===================================================== */

  $("transferPlayerName")
    .textContent =
    getPlayerName(player);


  $("transferPlayerPhoto")
    .src =
    player.photo_url ||
    FALLBACK_PHOTO;


  $("transferCurrentClub")
    .textContent =
    player.club_id

      ? "⚽ Klabu ya sasa: " +
        getClubName(
          player.club_id
        )

      : "🆓 Free Agent";


  $("playerTransferPreview")
    .classList.remove("hidden");


  /* =====================================================
     CURRENT CLUB — AUTOMATIC
  ===================================================== */

  $("fromClubId").value =
    player.club_id || "";


  /* =====================================================
     TO CLUB
  ===================================================== */

  const toSelect =
    $("toClubId");


  toSelect.innerHTML = `
    <option value="">
      Chagua Klabu Anayoenda
    </option>
  `;


  clubs.forEach(club => {

    if (
      String(club.id) ===
      String(player.club_id)
    ) {

      return;

    }


    const option =
      document.createElement("option");


    option.value =
      club.id;


    option.textContent =
      club.name;


    toSelect.appendChild(
      option
    );

  });


  checkTransferConflict();

  }
  /* =====================================================
   TRANSFER TYPE
====================================================== */

function handleTransferType() {

  const type =
    $("transferType").value;


  const loanBox =
    $("loanEndBox");


  const loanEndDate =
    $("loanEndDate");


  if (type === "loan") {

    loanBox.classList.remove(
      "hidden"
    );


    loanEndDate.required =
      true;

  }

  else {

    loanBox.classList.add(
      "hidden"
    );


    loanEndDate.required =
      false;


    loanEndDate.value =
      "";

  }


  checkTransferConflict();

}


/* =====================================================
   AUTOMATIC TRANSFER NUMBER
====================================================== */

async function generateTransferNumber() {

  const year =
    new Date()
      .getFullYear();


  const count =
    transfers.length + 1;


  const number =
    String(count)
      .padStart(
        3,
        "0"
      );


  return (
    "AFRN-TR-" +
    year +
    "-" +
    number
  );

  }
  /* =====================================================
   CONFLICT CHECK
====================================================== */

function checkTransferConflict() {

  const playerId =
    $("transferPlayerId").value;


  const fromClubId =
    $("fromClubId").value;


  const toClubId =
    $("toClubId").value;


  const date =
    $("transferDate").value;


  const notice =
    $("transferConflict");


  if (!notice) {
    return;
  }


  /* CLEAR NOTICE */

  notice.style.display =
    "none";


  notice.className =
    "notice";


  notice.innerHTML =
    "";


  if (!playerId) {
    return;
  }


  /* =====================================================
     SAME CLUB CHECK
  ===================================================== */

  if (
    fromClubId &&
    toClubId &&
    String(fromClubId) ===
    String(toClubId)
  ) {

    notice.className =
      "notice error";


    notice.style.display =
      "block";


    notice.innerHTML =
      "⚠️ Klabu anayotoka na " +
      "klabu anayoenda haziwezi " +
      "kuwa klabu moja.";


    return;

  }


  /* =====================================================
     DATE CHECK
  ===================================================== */

  if (!date) {
    return;
  }


  /* =====================================================
     ACTIVE CONTRACT CHECK
  ===================================================== */

  const activeContract =
    contracts.find(
      contract => {

        if (
          String(
            contract.player_id
          ) !==
          String(playerId)
        ) {

          return false;

        }


        if (
          String(
            contract.status || ""
          ).toLowerCase() !==
          "active"
        ) {

          return false;

        }


        if (
          contract.end_date &&
          contract.end_date <
          date
        ) {

          return false;

        }


        return true;

      }
    );


  if (
    activeContract &&
    activeContract.club_id &&
    fromClubId &&
    String(
      activeContract.club_id
    ) !==
    String(fromClubId)
  ) {

    notice.className =
      "notice error";


    notice.style.display =
      "block";


    const player =
      players.find(
        p =>
          String(p.id) ===
          String(playerId)
      );


    notice.innerHTML =

      "⚠️ <strong>Mkataba unaingiliana.</strong><br>" +

      getPlayerName(player) +

      " ana mkataba Active na " +

      "<strong>" +

      getClubName(
        activeContract.club_id
      ) +

      "</strong>." +

      "<br><br>" +

      "Hakikisha huu ni " +

      "<strong>uhamisho/mkopo halali</strong>.";

  }

  }
  /* =====================================================
   OPEN TRANSFER FORM
====================================================== */

async function openTransferForm() {

  /* SAFISHA FORM */

  $("transferForm").reset();


  /* PLAYER PREVIEW */

  $("playerTransferPreview")
    .classList.add("hidden");


  /* CONFLICT */

  $("transferConflict").style.display =
    "none";

  $("transferConflict").className =
    "notice";

  $("transferConflict").innerHTML =
    "";


  /* CURRENT CLUB */

  $("fromClubId").value =
    "";


  /* TO CLUB */

  $("toClubId").innerHTML = `
    <option value="">
      Chagua Klabu Anayoenda
    </option>
  `;


  /* TODAY */

  $("transferDate").value =
    getToday();


  /* DEFAULT TYPE */

  $("transferType").value =
    "permanent";


  $("loanEndBox")
    .classList.add("hidden");


  $("loanEndDate").required =
    false;


  $("loanEndDate").value =
    "";


  /* TRANSFER NUMBER */

  $("transferNumber").value =
    await generateTransferNumber();


  /* LOAD OPTIONS */

  loadPlayerOptions();

  loadClubOptions();


  /* OPEN */

  $("transferDialog")
    .showModal();

}


/* =====================================================
   CLOSE TRANSFER FORM
====================================================== */

function closeTransferForm() {

  $("transferDialog")
    .close();

}


/* =====================================================

if (addTransferBtn) {

}

}

}

  /* =====================================================
   SAVE TRANSFER
====================================================== */

$("transferForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      /* ================================================
         BASIC VALIDATION
      ================================================ */

      const playerId =
        $("transferPlayerId").value;


      const fromClubId =
        $("fromClubId").value;


      const toClubId =
        $("toClubId").value;


      const transferDate =
        $("transferDate").value;


      const transferNumber =
        $("transferNumber").value;


      const transferStatus =
        $("transferStatus").value;


      const transferType =
        $("transferType").value;


      const loanEndDate =
        $("loanEndDate").value;


      const notes =
        $("transferNotes").value;


      const file =
        $("transferDocument").files[0];


      if (!playerId) {

        alert(
          "⚠️ Chagua mchezaji kwanza."
        );

        return;

      }


      if (!fromClubId) {

        alert(
          "⚠️ Klabu anayotoka haijawekwa."
        );

        return;

      }


      if (!toClubId) {

        alert(
          "⚠️ Chagua klabu anayoenda."
        );

        return;

      }


      if (
        String(fromClubId) ===
        String(toClubId)
      ) {

        alert(
          "⚠️ Klabu anayotoka na " +
          "anayoenda haziwezi kuwa moja."
        );

        return;

      }


      if (!transferDate) {

        alert(
          "⚠️ Weka tarehe ya uhamisho."
        );

        return;

      }


      if (
        transferType === "loan" &&
        !loanEndDate
      ) {

        alert(
          "⚠️ Weka tarehe ya mwisho wa mkopo."
        );

        return;

      }


      /* ================================================
         UPLOAD DOCUMENT
      ================================================ */

      let documentUrl = null;


      if (file) {

        const extension =
          file.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          "transfer-" +
          Date.now() +
          "." +
          extension;


        const filePath =
          STORAGE_FOLDER +
          "/" +
          fileName;


        const uploadResult =
          await db.storage
            .from(STORAGE_BUCKET)
            .upload(
              filePath,
              file,
              {
                upsert:false
              }
            );


        if (uploadResult.error) {

          console.error(
            "DOCUMENT UPLOAD ERROR:",
            uploadResult.error
          );


          alert(
            "❌ Hati haikuweza kupakiwa:\n" +
            uploadResult.error.message
          );

          return;

        }


        const publicResult =
          db.storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(
              filePath
            );


        documentUrl =
          publicResult.data.publicUrl;

  }
      /* =====================================================
   TRANSFER DATA
====================================================== */

const transferData = {

  player_id:
    playerId,

  from_club_id:
    fromClubId,

  to_club_id:
    toClubId,

  transfer_date:
    transferDate,

  transfer_number:
    transferNumber,

  status:
    transferStatus,

  document_url:
    documentUrl,

  notes:
    notes,

  transfer_type:
    transferType,

  loan_end_date:
    transferType === "loan"
      ? loanEndDate
      : null

};

/* =====================================================
   SAVE TO SUPABASE
====================================================== */

const result =
  await db
    .from(TRANSFERS_TABLE)
    .insert(
      transferData
    )
    .select()
    .single();


if (result.error) {

  console.error(
    "TRANSFER SAVE ERROR:",
    result.error
  );


  alert(
    "❌ Uhamisho haukuhifadhiwa:\n" +
    result.error.message
  );

  return;

}


/* =====================================================
   SUCCESS
====================================================== */

alert(
  "✅ Uhamisho umehifadhiwa kikamilifu."
);


$("transferDialog")
  .close();


$("transferForm")
  .reset();


await loadTransferData();

});
  /* =====================================================

  const searchInput =
  $("searchTransfer");

const search = "";


  container.innerHTML = "";

    transfers.filter(transfer => {

      const player =
        players.find(
          p =>
            String(p.id) ===
            String(transfer.player_id)
        );


      const fromClub =
        getClubName(
          transfer.from_club_id
        );


      const toClub =
        getClubName(
          transfer.to_club_id
        );


      const playerName =
        getPlayerName(player);


      const transferNumber =
        String(
          transfer.transfer_number || ""
        );

        playerName,
        fromClub,
        toClub,
        transferNumber,
        transfer.status,
        transfer.transfer_type

            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
            align-items:center;
          "
        >

          <div>

            <h3 style="margin:0 0 6px;">
              👤 ${playerName}
            </h3>

            <div>
              🏠 ${fromClub}
              →
              ⚽ ${toClub}
            </div>

          </div>


          <div>

            <strong>

          </div>

        </div>


        <hr

            border-top:1px solid #d9e1ec;

        >


        <div

            display:grid;
            grid-template-columns:
              repeat(auto-fit,minmax(180px,1fr));

          "
        >

          <div>
            📄
            <strong
                  ${transfer.transfer_number || "-"}

  </div>


  <div>
    📅

  </div>


  <div>
    📌
    <strong>
      ${status}
    </strong>
  </div>

</div>


${
  transfer.loan_end_date

      <div style="margin-top:8px;">
        📅 Mwisho wa Mkopo:
        <strong>

}


${

${

    const status =

    if (status) {

}

startTransferSystem();
