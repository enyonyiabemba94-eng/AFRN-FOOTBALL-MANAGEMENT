<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    AFRN Football Management - Uhamisho
  </title>

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

  <!-- AFRN Supabase Config -->

  <style>

    :root {
      --navy: #071a33;
      --blue: #0d47a1;
      --green: #198754;
      --red: #dc3545;
      --gray: #667085;
      --light: #f4f7fb;
      --border: #d9e1ec;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: #172033;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 18px;
    }

    header h2 {
      margin: 0;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
      margin: 3px;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .secondary {
      background: #e9eef5;
      color: #172033;
    }

    .danger {
      background: var(--red);
      color: white;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .notice {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-top: 10px;
      background: #fff3cd;
      color: #664d03;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

  <header>

    <h2>

  <main>

    <h2>

  <!-- =====================================================
     TRANSFER FORM
====================================================== -->

<dialog id="transferDialog">

  <div style="
    padding:20px;
    max-height:90vh;
    overflow-y:auto;
  ">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #d9e1ec;

      margin-bottom:15px;
    ">

      <h3 style="margin:0;">

      <button
        type="button"

    <form id="transferForm">

      <!-- PLAYER -->

        <div>

          💾 Hifadhi Uhamisho

  <!-- =====================================================

<script>

const TRANSFERS_TABLE = "transfers";
const PLAYERS_TABLE = "players";
const CLUBS_TABLE = "clubs";
const CONTRACTS_TABLE = "player_contracts";

const STORAGE_BUCKET = "AFRN FILES";
const STORAGE_FOLDER = "transfers";


let db = window.supabaseClient;

let players = [];
let clubs = [];
let transfers = [];
let contracts = [];


/* =====================================================
   SHORTCUT
====================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   FALLBACK PLAYER PHOTO
====================================================== */

const FALLBACK_PHOTO =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="200"
      height="200"
    >
      <rect
        width="100%"
        height="100%"
        fill="#e9eef5"
      />

      <text
        x="50%"
        y="52%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-size="80"
      >
        👤
      </text>

    </svg>
  `);


/* =====================================================
   PLAYER NAME
====================================================== */

function getPlayerName(player) {

  return [

    player?.first_name,
    player?.middle_name,
    player?.last_name

  ]

  .filter(Boolean)

  .join(" ")

  || "Mchezaji";

}


/* =====================================================
   CLUB NAME
====================================================== */

function getClubName(clubId) {

  const club =
    clubs.find(
      c => c.id === clubId
    );

  return club?.name ||
    "Klabu haijawekwa";

}


/* =====================================================
   TODAY
====================================================== */

function getToday() {

  return new Date()
    .toISOString()
    .slice(0, 10);

}


/* =====================================================
   LOAD ALL DATA
====================================================== */

async function loadTransferData() {

  if (!db) {

    $("systemStatus").textContent =
      "❌ Supabase haijaunganishwa.";

    return;

  }


  $("systemStatus").textContent =
    "⏳ Inapakia taarifa...";


  const [

    playersResult,
    clubsResult,
    transfersResult,
    contractsResult

  ] = await Promise.all([

    db
      .from(PLAYERS_TABLE)
      .select("*"),

    db
      .from(CLUBS_TABLE)
      .select("*"),

    db
      .from(TRANSFERS_TABLE)
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      ),

    db
      .from(CONTRACTS_TABLE)
      .select("*")

  ]);


  if (playersResult.error) {

    console.error(
      playersResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Players: " +
      playersResult.error.message;

    return;

  }


  if (clubsResult.error) {

    console.error(
      clubsResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Clubs: " +
      clubsResult.error.message;

    return;

  }


  if (transfersResult.error) {

    console.error(
      transfersResult.error
    );

    $("systemStatus").textContent =
      "❌ Tatizo kwenye Transfers: " +
      transfersResult.error.message;

    return;

  }


  players =
    playersResult.data || [];


  clubs =
    clubsResult.data || [];


  transfers =
    transfersResult.data || [];


  contracts =
    contractsResult.data || [];


  loadPlayerOptions();

  loadClubOptions();

  renderTransfers();


  $("systemStatus").textContent =
    "✅ Players: " +
    players.length +
    " • Clubs: " +
    clubs.length +
    " • Uhamisho: " +
    transfers.length;

}


/* =====================================================
   LOAD PLAYERS INTO SELECT
====================================================== */

function loadPlayerOptions() {

  const select =
    $("transferPlayerId");

  select.innerHTML = `
    <option value="">
      Chagua Mchezaji
    </option>
  `;

  players.forEach(player => {

    const option =
      document.createElement("option");

    option.value =
      player.id;

    option.textContent =
      getPlayerName(player);

    select.appendChild(
      option
    );

  });

}
  /* ================================================
   PLAYER SELECTED
================================================ */

$("transferPlayerId")
.addEventListener(
  "change",
  function () {

    const player =
      players.find(
        p =>
          p.id ===
          this.value
      );


    if (!player) {

      return;

    }


    /* =====================================================
   KLUBU YA SASA YA MCHEZAJI - AUTOMATIC
===================================================== */

const currentClub =
  clubs.find(
    club =>
      club.id ===
      player.club_id
  );


$("fromClubId").value =
  player.club_id || "";


$("fromClubName").textContent =
  player.club_id

    ? "⚽ " +
      (
        currentClub?.name ||
        "Klabu haijawekwa"
      )

    : "🆓 Free Agent";


    /* ============================================
   KLUBU ANAYOENDA
============================================ */

const toSelect =
  $("toClubId");


toSelect.innerHTML = `

  <option value="">
    Chagua Klabu Anayoenda
  </option>

`;


clubs.forEach(club => {

  /* Usionyeshe klabu yake ya sasa */

  if (
    club.id ===
    player.club_id
  ) {

    return;

  }


  const option =
    document.createElement(
      "option"
    );


  option.value =
    club.id;


  option.textContent =
    club.name;


  toSelect.appendChild(
    option
  );

});


/* =====================================================
   LOAD CLUBS INTO SELECTS
====================================================== */

function loadClubOptions() {

  const from =
    $("fromClubId");

  const to =
    $("toClubId");


  from.innerHTML =
    `
      <option value="">
        Chagua Klabu
      </option>
    `;


  to.innerHTML =
    `
      <option value="">
        Chagua Klabu
      </option>
    `;


  clubs.forEach(club => {

    const optionFrom =
      document.createElement(
        "option"
      );


    optionFrom.value =
      club.id;


    optionFrom.textContent =
      club.name;


    from.appendChild(
      optionFrom
    );


    const optionTo =
      document.createElement(
        "option"
      );


    optionTo.value =
      club.id;


    optionTo.textContent =
      club.name;


    to.appendChild(
      optionTo
    );

  });

}


/* =====================================================
   PLAYER SELECTED
====================================================== */

function showSelectedPlayer() {

  const playerId =
    $("transferPlayerId").value;


  const player =
    players.find(
      p => p.id === playerId
    );


  if (!player) {

    $("playerTransferPreview")
      .classList.add("hidden");

    $("fromClubId").value = "";

    $("fromClubName").textContent =
      "Chagua Mchezaji Kwanza";

    $("toClubId").innerHTML = `
      <option value="">
        Chagua Klabu Anayoenda
      </option>
    `;

    return;

  }


  /* ============================================
     PLAYER PREVIEW
  ============================================ */

  $("transferPlayerName")
    .textContent =
    getPlayerName(player);


  $("transferPlayerPhoto")
    .src =
    player.photo_url ||
    FALLBACK_PHOTO;


  $("transferCurrentClub")
    .textContent =
    player.club_id

      ? "⚽ Klabu ya sasa: " +
        getClubName(
          player.club_id
        )

      : "🆓 Free Agent";


  $("playerTransferPreview")
    .classList.remove("hidden");


  /* ============================================
     KLUBU YA SASA - AUTOMATIC
  ============================================ */

  const currentClub =
    clubs.find(
      club =>
        club.id ===
        player.club_id
    );


  $("fromClubId").value =
    player.club_id || "";


  $("fromClubName").textContent =
    player.club_id

      ? "⚽ " +
        (
          currentClub?.name ||
          "Klabu haijawekwa"
        )

      : "🆓 Free Agent";


  /* ============================================
     KLUBU ANAYOENDA - CHAGUA
  ============================================ */

  const toSelect =
    $("toClubId");


  toSelect.innerHTML = `
    <option value="">
      Chagua Klabu Anayoenda
    </option>
  `;


  clubs.forEach(club => {

    /* Ondoa klabu yake ya sasa */

    if (
      club.id ===
      player.club_id
    ) {

      return;

    }


    const option =
      document.createElement(
        "option"
      );


    option.value =
      club.id;


    option.textContent =
      club.name;


    toSelect.appendChild(
      option
    );

  });


  checkTransferConflict();

}


/* =====================================================
   TRANSFER TYPE
====================================================== */

function handleTransferType() {

  const type =
    $("transferType").value;


  const loanBox =
    $("loanEndBox");


  if (type === "loan") {

    loanBox.classList.remove(
      "hidden"
    );

    $("loanEndDate").required =
      true;

  }

  else {

    loanBox.classList.add(
      "hidden"
    );

    $("loanEndDate").required =
      false;

    $("loanEndDate").value =
      "";

  }


  checkTransferConflict();

}


/* =====================================================
   AUTOMATIC TRANSFER NUMBER
====================================================== */

async function generateTransferNumber() {

  const year =
    new Date()
      .getFullYear();


  const count =
    transfers.length + 1;


  const number =
    String(count)
      .padStart(
        3,
        "0"
      );


  return (
    "AFRN-TR-" +
    year +
    "-" +
    number
  );

}


/* =====================================================
   CONFLICT CHECK
====================================================== */

function checkTransferConflict() {

  const playerId =
    $("transferPlayerId").value;


  const fromClub =
    $("fromClubId").value;


  const toClub =
    $("toClubId").value;


  const date =
    $("transferDate").value;


  const notice =
    $("transferConflict");


  notice.style.display =
    "none";


  notice.className =
    "notice";


  notice.innerHTML =
    "";


  if (!playerId) {
    return;
  }


  if (
    fromClub &&
    toClub &&
    fromClub === toClub
  ) {

    notice.className =
      "notice error";


    notice.style.display =
      "block";


    notice.innerHTML =
      "⚠️ Klabu anayotoka na " +
      "klabu anayoenda haziwezi " +
      "kuwa klabu moja.";


    return;

  }


  /* =====================================================
   CHECK ACTIVE CONTRACT
====================================================== */

const playerId =
  $("transferPlayerId").value;


const fromClubId =
  $("fromClubId").value;


const date =
  $("transferDate").value;


const notice =
  $("transferConflict");


/* CHECK ACTIVE CONTRACT */

if (!date) {

  return;

}


const activeContract =
  contracts.find(contract => {

    if (
      contract.player_id !==
      playerId
    ) {

      return false;

    }


    if (
      String(
        contract.status || ""
      ).toLowerCase() !==
      "active"
    ) {

      return false;

    }


    if (
      contract.end_date &&
      contract.end_date <
      date
    ) {

      return false;

    }


    return true;

  });


if (
  activeContract &&
  activeContract.club_id &&
  fromClubId &&
  activeContract.club_id !==
  fromClubId
) {

  notice.className =
    "notice error";


  notice.style.display =
    "block";


  notice.innerHTML =

    "⚠️ <strong>Mkataba unaingiliana.</strong><br>" +

    getPlayerName(
      players.find(
        p =>
          p.id ===
          playerId
      )
    ) +

    " ana mkataba Active na " +

    "<strong>" +

    getClubName(
      activeContract.club_id
    ) +

    "</strong>." +

    "<br><br>" +

    "Hakikisha huu ni " +

    "<strong>uhamisho/mkopo halali</strong>.";

}


/* =====================================================
   OPEN FORM
====================================================== */

async function openTransferForm() {

  /* SAFISHA FORM */

  $("transferForm").reset();


  /* FICHA PREVIEW */

  $("playerTransferPreview")
    .classList.add("hidden");


  /* FICHA CONFLICT */

  $("transferConflict")
    .style.display =
    "none";


  /* KLUBU YA SASA */

  $("fromClubId").value =
    "";

  $("fromClubName").textContent =
    "Chagua Mchezaji Kwanza";


  /* KLUBU ANAYOENDA */

  $("toClubId").innerHTML = `

    <option value="">
      Chagua Klabu Anayoenda
    </option>

  `;


  /* TAREHE YA LEO */

  $("transferDate").value =
    getToday();


  /* DEFAULT: PERMANENT */

  $("transferType").value =
    "permanent";


  $("loanEndBox")
    .classList.add("hidden");


  $("loanEndDate").required =
    false;


  $("loanEndDate").value =
    "";


  /* TRANSFER NUMBER */

  $("transferNumber").value =
    await generateTransferNumber();


  /* LOAD PLAYERS */

  loadPlayerOptions();


  /* FUNGUA FORM */

  $("transferDialog")
    .showModal();

}

/* =====================================================
   CLOSE FORM
====================================================== */

function closeTransferForm() {

  $("transferDialog")
    .close();

}


/* =====================================================
   EVENTS
====================================================== */

$("addTransferBtn")
  .addEventListener(
    "click",
    openTransferForm
  );


$("closeTransferBtn")
  .addEventListener(
    "click",
    closeTransferForm
  );


$("cancelTransferBtn")
  .addEventListener(
    "click",
    closeTransferForm
  );


$("transferPlayerId")
  .addEventListener(
    "change",
    showSelectedPlayer
  );


$("transferType")
  .addEventListener(
    "change",
    handleTransferType
  );


$("toClubId")
  .addEventListener(
    "change",
    checkTransferConflict
  );


$("transferDate")
  .addEventListener(
    "change",
    checkTransferConflict
  );


/* =====================================================
   START
====================================================== */

loadTransferData();

  </script>

<script>

async function uploadTransferDocument(file) {

  if (!file) {
    return null;
  }

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const fileName =
    "transfer-" +
    Date.now() +
    "." +
    extension;

  const filePath =
    STORAGE_FOLDER +
    "/" +
    fileName;


  const uploadResult =
    await db.storage
      .from(STORAGE_BUCKET)
      .upload(
        filePath,
        file,
        {
          upsert: false
        }
      );


  if (uploadResult.error) {

    throw uploadResult.error;

  }


  const publicResult =
    db.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(
        filePath
      );


  return publicResult
    ?.data
    ?.publicUrl || null;

}


/* =====================================================
   SAVE TRANSFER
====================================================== */

async function saveTransfer(event) {

  event.preventDefault();


  const playerId =
    $("transferPlayerId").value;

  const fromClubId =
    $("fromClubId").value;

  const toClubId =
    $("toClubId").value;

  const transferType =
    $("transferType").value;

  const transferDate =
    $("transferDate").value;

  const loanEndDate =
    $("loanEndDate").value;

  const transferNumber =
    $("transferNumber").value;

  const transferStatus =
    $("transferStatus").value;

  const notes =
    $("transferNotes").value.trim();

  const file =
    $("transferDocument").files[0];

    /* =====================================================
     VALIDATE
  ====================================================== */

  if (!playerId) {

    alert("⚠️ Chagua mchezaji.");

    return;

  }


  if (!fromClubId) {

    alert(
      "⚠️ Klabu anayocheza sasa haijapatikana."
    );

    return;

  }


  if (!toClubId) {

    alert(
      "⚠️ Chagua klabu anayoenda."
    );

    return;

  }


  if (fromClubId === toClubId) {

    alert(
      "⚠️ Mchezaji hawezi kuhamishwa kwenda klabu ileile."
    );

    return;

  }


  if (!transferDate) {

    alert(
      "⚠️ Weka tarehe ya uhamisho."
    );

    return;

  }


  if (
    transferType === "loan" &&
    !loanEndDate
  ) {

    alert(
      "⚠️ Weka tarehe ya mwisho wa mkopo."
    );

    return;

  }


  /* ================================================
   CHECK EXISTING ACTIVE CONTRACT
================================================= */

const activeContracts =
  contracts.filter(contract => {

    if (
      contract.player_id !==
      playerId
    ) {

      return false;

    }

    if (
      String(
        contract.status || ""
      ).toLowerCase() !==
      "active"
    ) {

      return false;

    }

    if (
      contract.end_date &&
      contract.end_date <
      transferDate
    ) {

      return false;

    }

    return true;

  });


/* ================================================
   CHECK ACTIVE CONTRACT RESULT
================================================= */

if (
  activeContracts.length > 0
) {

  const activeContract =
    activeContracts[0];


  const player =
    players.find(
      p =>
        p.id ===
        playerId
    );


  const confirmed =
    confirm(

      "⚠️ Mkataba unaingiliana.\n\n" +

      getPlayerName(
        player
      ) +

      " ana mkataba Active na " +

      getClubName(
        activeContract.club_id
      ) +

      ".\n\n" +

      "Hakikisha huu ni " +
      "uhamisho/mkopo halali.\n\n" +

      "Bonyeza OK kuendelea."

    );


  if (!confirmed) {

    return;

  }

    }

  /* =====================================================
   UPLOAD TRANSFER DOCUMENT
===================================================== */

let documentUrl = null;


if (file) {

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    "transfer-" +
    Date.now() +
    "." +
    extension;


  const filePath =
    STORAGE_FOLDER +
    "/" +
    fileName;


  const uploadResult =
    await db.storage
      .from(STORAGE_BUCKET)
      .upload(
        filePath,
        file,
        {
          upsert: false
        }
      );


  if (uploadResult.error) {

    alert(
      "❌ Hati haikuweza kupakiwa:\n" +
      uploadResult.error.message
    );

    return;

  }


  const publicResult =
    db.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(
        filePath
      );


  documentUrl =
    publicResult.data.publicUrl;

}  

  /* =====================================================
   SAVE TRANSFER
===================================================== */

const transferData = {

  player_id:
    playerId,

  from_club_id:
    fromClubId,

  to_club_id:
    toClubId,

  transfer_date:
    transferDate,

  transfer_number:
    transferNumber,

  status:
    transferStatus,

  document_url:
    documentUrl,

  notes:
    notes,

  transfer_type:
    transferType,

  loan_end_date:
    transferType === "loan"
      ? loanEndDate
      : null

};


const result =
  await db
    .from(TRANSFERS_TABLE)
    .insert(
      transferData
    )
    .select()
    .single();


if (result.error) {

  console.error(
    "TRANSFER SAVE ERROR:",
    result.error
  );

  alert(
    "❌ Uhamisho haukuhifadhiwa:\n" +
    result.error.message
  );

  return;

  }


  /* ================================================
   BASIC VALIDATION
================================================ */

if (!playerId) {

  alert(
    "⚠️ Chagua mchezaji kwanza."
  );

  return;

}


/* ================================================
   SUCCESS
================================================= */

alert(
  "✅ Uhamisho umehifadhiwa kikamilifu."
);


$("transferDialog").close();


$("transferForm").reset();


await loadTransferData();

  }


/* ================================================
   VALIDATE CLUBS
================================================ */

if (!fromClubId) {

  alert(
    "⚠️ Klabu anayocheza sasa haijapatikana."
  );

  return;

}


if (!toClubId) {

  alert(
    "⚠️ Chagua klabu anayoenda."
  );

  return;

}


if (fromClubId === toClubId) {

  alert(
    "⚠️ Mchezaji hawezi kuhamishwa kwenda klabu ileile."
  );

  return;

}


/* ================================================
   VALIDATE TRANSFER DATE
================================================ */

if (!transferDate) {

  alert(
    "⚠️ Weka tarehe ya uhamisho."
  );

  return;

}


/* ================================================
   VALIDATE LOAN
================================================ */

if (
  transferType === "loan" &&
  !loanEndDate
) {

  alert(
    "⚠️ Weka tarehe ya mwisho wa mkopo."
  );

  return;

}

  /* ================================================
   CHECK EXISTING ACTIVE CONTRACT
================================================= */

const activeContracts =
  contracts.filter(contract => {

    /* Mkataba lazima uwe wa huyu mchezaji */
    if (
      contract.player_id !==
      playerId
    ) {

      return false;

    }


    /* Mkataba lazima uwe Active */
    if (
      String(
        contract.status || ""
      ).toLowerCase() !==
      "active"
    ) {

      return false;

    }


    /* Kama mkataba uliisha kabla ya
       tarehe ya uhamisho, hauhesabiki */
    if (
      contract.end_date &&
      contract.end_date <
      transferDate
    ) {

      return false;

    }


    return true;

  });


/* ================================================
   CHECK WRONG CLUB
================================================= */

const wrongClubContract =
  activeContracts.find(
    contract =>

      contract.club_id &&
      contract.club_id !==
      fromClubId
  );


/* ================================================
   PLAYER HAS ACTIVE CONTRACT
================================================= */

if (
  wrongClubContract
) {

  const player =
    players.find(
      p =>
        p.id ===
        playerId
    );


  const currentContractClub =
    getClubName(
      wrongClubContract.club_id
    );


  const confirmed =
    confirm(

      "⚠️ MCHEZAJI ANA MKATABA ACTIVE\n\n" +

      getPlayerName(player) +

      " bado ana mkataba na:\n\n" +

      currentContractClub +

      "\n\n" +

      "Uhamisho huu lazima uwe " +
      "uhamisho/mkopo halali.\n\n" +

      "Je, una uhakika unataka kuendelea?"

    );


  /* Kama amesema HAPANA,
     tunasimamisha kuhifadhi */

  if (!confirmed) {
    return;
  }

}


/* =====================================================
   SAVE TRANSFER
===================================================== */

const transferData = {

  player_id:
    playerId,

  from_club_id:
    fromClubId,

  to_club_id:
    toClubId,

  transfer_date:
    transferDate,

  transfer_number:
    transferNumber,

  status:
    transferStatus,

  document_url:
    documentUrl,

  notes:
    notes,

  transfer_type:
    transferType,

  loan_end_date:
    transferType === "loan"
      ? loanEndDate
      : null

};


const result =
  await db
    .from("transfers")
    .insert(
      transferData
    );


if (result.error) {

  console.error(
    "TRANSFER SAVE ERROR:",
    result.error
  );

  alert(
    "❌ Uhamisho haukuhifadhiwa:\n" +
    result.error.message
  );

  return;

}


/* =====================================================
   UPDATE PLAYER CLUB
===================================================== */

const playerUpdate =
  await db
    .from("players")
    .update({
      club_id:
        toClubId
    })
    .eq(
      "id",
      playerId
    );


if (playerUpdate.error) {

  console.error(
    "PLAYER CLUB UPDATE ERROR:",
    playerUpdate.error
  );

  alert(
    "⚠️ Uhamisho umehifadhiwa, " +
    "lakini klabu ya mchezaji " +
    "haikuweza kusasishwa:\n" +
    playerUpdate.error.message
  );

  return;

}


/* =====================================================
   SUCCESS
===================================================== */

alert(
  "✅ Uhamisho umehifadhiwa " +
  "na klabu ya mchezaji imesasishwa."
);


$("transferDialog").close();


$("transferForm").reset();


await loadTransferData();
/* ================================================
   RENDER TRANSFERS
================================================ */

function renderTransfers(list = transfers) {

  const container =
    $("transfersContainer");

  if (!list.length) {

    container.innerHTML = `
      <div class="card" style="text-align:center;">
        📭 Hakuna uhamisho uliopatikana.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  list.forEach(transfer => {

    const player =
      players.find(
        p => p.id === transfer.player_id
      );

    const fromClub =
      clubs.find(
        c => c.id === transfer.from_club_id
      );

    const toClub =
      clubs.find(
        c => c.id === transfer.to_club_id
      );


    const name =
      getPlayerName(player);

    const photo =
      player?.photo_url ||
      FALLBACK_PHOTO;


    const type =
      transfer.transfer_type === "loan"
        ? "📋 Loan"
        : "🔄 Permanent";


    const loanDate =
      transfer.transfer_type === "loan" &&
      transfer.loan_end_date
        ? " → " + transfer.loan_end_date
        : "";


    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div style="
        display:grid;
        grid-template-columns:70px 1fr;
        gap:15px;
        align-items:center;
      ">

        <img
          src="${photo}"
          style="
            width:70px;
            height:70px;
            object-fit:cover;
            border-radius:50%;
          "
          onerror="
            this.src='${FALLBACK_PHOTO}'
          "
        >

        <div>

          <h3 style="margin:0 0 6px;">
            👤 ${name}
          </h3>

          <div>
            🏠 ${fromClub?.name || "-"}
            →
            ⚽ ${toClub?.name || "-"}
          </div>

          <div class="muted">
            📄 ${transfer.transfer_number || "-"}
          </div>

          <div class="muted">
            📅 ${transfer.transfer_date || "-"}
            ${loanDate}
          </div>

          <div style="margin-top:6px;">
            ${type}
            &nbsp; • &nbsp;
            📌 ${transfer.status || "-"}
          </div>

        </div>

      </div>

    `;


    container.appendChild(card);

  });

      }
  
/* ================================================
   SEARCH TRANSFERS
================================================ */

$("searchTransfer").addEventListener(
  "input",
  function () {

    const q =
      this.value
        .trim()
        .toLowerCase();

    /* ============================================
       KAMA SEARCH NI TUPU
    ============================================ */

    if (!q) {

      renderTransfers(
        transfers
      );

      return;

    }


    /* ============================================
       SEARCH
    ============================================ */

    const results =
      transfers.filter(
        transfer => {


          /* PLAYER */

          const player =
            players.find(
              p =>
                p.id ===
                transfer.player_id
            );


          /* FROM CLUB */

          const fromClub =
            clubs.find(
              c =>
                c.id ===
                transfer.from_club_id
            );


          /* TO CLUB */

          const toClub =
            clubs.find(
              c =>
                c.id ===
                transfer.to_club_id
            );


                /* ======================================
   TAARIFA ZOTE ZA KUTAFUTA
====================================== */

const text = [

  getPlayerName(
    player
  ),

  fromClub?.name,

  toClub?.name,

  transfer.transfer_number,

  transfer.transfer_date,

  transfer.status,

  transfer.transfer_type,

  transfer.loan_end_date

]

.filter(Boolean)

.join(" ")

.toLowerCase();


          /* ======================================
   ANGALIA KAMA IMEPATIKANA
====================================== */

return text.includes(
  q
);

}


/* ============================================
   ONESHA MATOKEO
============================================ */

renderTransfers(
  results
);

}
);


/* ================================================
   INITIAL LOAD
================================================ */

loadTransferData()
  .then(() => {

    console.log(
      "AFRN TRANSFERS DATA LOADED"
    );

  })
  .catch(error => {

    console.error(
      "AFRN TRANSFERS ERROR:",
      error
    );

    $("systemStatus").innerHTML =
      "❌ Kuna tatizo kwenye mfumo:<br>" +
      error.message;

  });

</script>
