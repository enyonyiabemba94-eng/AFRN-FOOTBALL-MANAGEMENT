<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Competition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./afrn-standings-engine.js"></script>
<style>
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}header{background:linear-gradient(135deg,#06152b,#0d47a1);color:#fff;padding:16px}nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:9px}nav a{padding:9px 12px;text-decoration:none;color:#172033;font-weight:700;white-space:nowrap}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9e0ea;border-radius:15px;padding:16px;margin-bottom:14px}.hero{display:flex;gap:14px;align-items:center}.logo{width:70px;height:70px;object-fit:contain;border-radius:12px;border:1px solid #ddd}.muted{color:#687386;font-size:12px}.tabs{display:flex;gap:7px;overflow:auto}.tab{border:0;background:#e8edf5;padding:10px 13px;border-radius:9px;font-weight:800;white-space:nowrap}.tab.active{background:#0d47a1;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#071a33;color:#fff;padding:9px;white-space:nowrap}td{padding:9px;border-bottom:1px solid #edf0f4;white-space:nowrap}td:nth-child(2){font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9f8ef;color:#16834b;font-size:10px;font-weight:800}.empty{text-align:center;padding:28px;color:#687386}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #d9e0ea;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#0d47a1}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="wrap"><b>⚽ AFRN FOOTBALL MANAGEMENT</b><div class="muted" style="color:#fff">Mashindano na historia rasmi</div></div></header>
<nav><a href="./index.html">🏠 Dashboard</a><a href="./competitions.html">🏆 Mashindano</a><a href="./matches.html">🏟️ Mechi</a></nav>
<main class="wrap"><a href="./competitions.html">← Rudi kwenye Mashindano</a><section id="hero" class="card">Inapakia...</section><section id="tabs" class="card"></section><section id="content" class="card">Inapakia...</section></main>
<script>
const db = window.supabaseClient || window.supabase.createClient(
  "https://jjqhvruppafpumcthmwe.supabase.co",
  "sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G"
);
const id = new URLSearchParams(location.search).get("id");
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
let C = null, teams = [], matches = [], events = [], clubs = [], players = [], awards = [], tab = "MECHI";

const played = s => window.AFRNStandings && window.AFRNStandings.playedStatus
  ? window.AFRNStandings.playedStatus(s)
  : ["completed","finished","played","full_time","ft"].includes(String(s ?? "").trim().toLowerCase());

const name = id => (clubs.find(c => String(c.id) === String(id)) || {}).name || "Timu";

async function load(){
  if(!id){
    $("hero").innerHTML = '<div class="empty">Competition ID haipo.</div>';
    $("content").innerHTML = '<div class="empty">Fungua History kupitia ukurasa wa Mashindano.</div>';
    return;
  }

  const cr = await db.from("competitions").select("*").eq("id", id).maybeSingle();
  if(cr.error) throw cr.error;
  if(!cr.data){
    $("hero").innerHTML = '<div class="empty">Mashindano hayajapatikana.</div>';
    $("content").innerHTML = '<div class="empty">Competition haijapatikana.</div>';
    return;
  }
  C = cr.data;

  const tr = await db.from("competition_teams")
    .select("id,competition_id,club_id,group_name")
    .eq("competition_id", id);
  if(tr.error) throw tr.error;

  const mr = await db.from("matches")
    .select("*")
    .eq("competition_id", id)
    .order("match_date", {ascending:true})
    .order("match_time", {ascending:true});
  if(mr.error) throw mr.error;

  const clr = await db.from("clubs")
    .select("id,name,logo_url,afrn_club_id");
  if(clr.error) throw clr.error;
  const pr = await db.from("players")
    .select("id,club_id,first_name,middle_name,last_name,position,status")
    .order("first_name", {ascending:true});
  if(pr.error) throw pr.error;
  const ar = await db.from("competition_awards")
    .select("*")
    .eq("competition_id", id);
  if(ar.error) throw ar.error;

  teams = tr.data || [];
  matches = mr.data || [];
  clubs = clr.data || [];
  players = pr.data || [];
  awards = ar.data || [];
  events = [];

  const matchIds = matches.map(m => m.id).filter(Boolean);
  if(matchIds.length){
    const er = await db.from("match_events")
      .select("match_id,club_id,event_type,player_id,minute")
      .in("match_id", matchIds);
    if(er.error) throw er.error;
    events = er.data || [];
  }

  $("hero").innerHTML = `
    <div class="hero">
      <img class="logo" src="${esc(C.logo_url || "./afrn-logo.png")}" onerror="this.style.display='none'">
      <div>
        <h2 style="margin:0">🏆 ${esc(C.name)}</h2>
        <div class="muted">${esc(C.season || "—")} · ${esc(C.format || C.competition_type || "—")} ·
          <span class="badge">${esc(C.status || "—")}</span>
        </div>
        <div class="muted">${esc(C.start_date || "—")} → ${esc(C.end_date || "—")}</div>
      </div>
    </div>`;

  const tabs = ["MECHI","MAKUNDI","MSIMAMO","KNOCKOUT","TIMU","WAFUNGAJI","KADI","TAKWIMU","TUZO"];
  $("tabs").innerHTML = '<div class="tabs">' +
    tabs.map(t => `<button class="tab ${t===tab?"active":""}" onclick="showTab('${t}')">${t}</button>`).join("") +
    '</div>';
  render();
}

function showTab(t){
  tab = t;
  $("tabs").querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.textContent === t));
  render();
}

function render(){
  if(tab === "MSIMAMO") standings();
  else if(tab === "MAKUNDI") groups();
  else if(tab === "TIMU") teamsView();
  else if(tab === "MECHI") matchesView();
  else if(tab === "KADI") cards();
  else if(tab === "WAFUNGAJI") scorers();
  else if(tab === "TAKWIMU") stats();
  else if(tab === "TUZO") awardsView();
  else if(tab === "KNOCKOUT") knockout();
}

function editHistoryMatch(matchId){ location.href="./matches.html?edit="+encodeURIComponent(matchId); }
function addKnockout(stage){ location.href="./matches.html?competition="+encodeURIComponent(id)+"&stage="+encodeURIComponent(stage); }

function matchesView(){
  $("content").innerHTML = `
    <h3>🏟️ Mechi</h3>
    <div class="table-wrap"><table><thead><tr>
      <th>Tarehe</th><th>Mechi</th><th>Matokeo</th><th>Hali</th>
    </tr></thead><tbody>
      ${matches.map(m => `<tr>
        <td>${esc(m.match_date || "—")}</td>
        <td>${esc(name(m.home_team_id))} vs ${esc(name(m.away_team_id))}</td>
        <td><b>${played(m.status) ? esc(m.home_score ?? 0)+" - "+esc(m.away_score ?? 0) : "—"}</b></td>
        <td>${esc(m.status || "Scheduled")}</td>
      </tr>`).join("")}
    </tbody></table></div>`;
}

function groups(){
  const gs = [...new Set(teams.map(t => t.group_name).filter(Boolean))].sort();
  $("content").innerHTML = gs.length
    ? gs.map(g => `<div style="margin-bottom:16px"><h3>GROUP ${esc(g)}</h3>
        ${teams.filter(t => t.group_name === g).map(t => `<div style="padding:9px;border-bottom:1px solid #eee">${esc(name(t.club_id))}</div>`).join("")}
      </div>`).join("")
    : '<div class="empty">Hakuna makundi.</div>';
}

function teamsView(){
  $("content").innerHTML = '<h3>👥 Timu</h3>' +
    teams.map(t => `<div style="padding:10px;border-bottom:1px solid #eee">
      <b>${esc(name(t.club_id))}</b>
      <div class="muted">Group ${esc(t.group_name || "—")}</div>
    </div>`).join("");
}

function standings(){
  if(!window.AFRNStandings){
    $("content").innerHTML = '<div class="empty">Engine ya msimamo haijapakia.</div>';
    return;
  }
  const rows = window.AFRNStandings.buildStandings({teams,matches,events,clubName:name});
  $("content").innerHTML = `
    <h3>📊 Msimamo</h3>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>KLABU</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>PTS</th>
    </tr></thead><tbody>
    ${rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}</td><td>${r.GA}</td><td><b>${r.PTS}</b></td></tr>`).join("")}
    </tbody></table></div>`;
}

function knockout(){
  const stageNames = {
    PRELIM:"PRELIMINARY", R16:"HATUA YA 16 BORA", QF:"ROBO FAINALI",
    SF:"NUSU FAINALI", "3RD":"MCHUJO WA NAFASI YA 3", FINAL:"FINALI"
  };
  const order = {PRELIM:0,R16:1,QF:2,SF:3,"3RD":4,FINAL:5};
  const groups = {};
  matches.forEach(m => {
    const z = String(m.notes || "").match(/AFRN_STAGE=([A-Z0-9]+)/);
    if(z) (groups[z[1]] ||= []).push(m);
  });
  const keys = Object.keys(groups).sort((a,b) => (order[a] ?? 99) - (order[b] ?? 99));
  if(!keys.length){
    $("content").innerHTML = '<div class="empty"><h3>⚔️ Knockout</h3><p>Hakuna mechi za knockout zilizotengenezwa.</p></div>';
    return;
  }
  let html = `<h3>⚔️ KNOCKOUT</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="btn-primary" onclick="addKnockout('FINAL')">➕ Ongeza FAINALI</button><button class="secondary small-btn" onclick="addKnockout('3RD')">➕ Ongeza MSHINDI WA 3</button></div>`;
  keys.forEach(stage => {
    const rows = groups[stage].slice().sort((a,b) => {
      const aa = Number(String(a.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      const bb = Number(String(b.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      return aa - bb;
    });
    html += `<div style="margin:16px 0"><h3>${esc(stageNames[stage] || stage)}</h3>`;
    rows.forEach((m,i) => {
      const result = played(m.status) ? `${esc(m.home_score ?? 0)} - ${esc(m.away_score ?? 0)}` : "vs";
      html += `<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:8px 0">
        <div class="muted">MECHI #${esc(m.match_number || i+1)} · ${esc(m.match_date || "—")} ${esc(m.match_time || "")}</div>
        <b>${esc(name(m.home_team_id))}</b> <strong style="margin:0 8px">${result}</strong> <b>${esc(name(m.away_team_id))}</b>
        <div class="muted">Hali: ${esc(m.status || "scheduled")}${m.notes && /AFRN_DECISION=PENALTIES/.test(m.notes) ? " · 🥅 Ushindi kwa penalti" : ""}</div>
        <div style="margin-top:9px"><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit Mechi</button></div>
      </div>`;
    });
    html += "</div>";
  });
  $("content").innerHTML = html;
}

const awardTypes = [
  ["MVP","Mchezaji Bora"],
  ["TOP_SCORER","Mfungaji Bora"],
  ["BEST_GOALKEEPER","Kipa Bora"],
  ["BEST_DEFENDER","Beki Bora"],
  ["BEST_YOUNG_PLAYER","Chipukizi Bora"],
  ["BEST_COACH","Coach Bora"]
];
function playerLabel(p){
  return [p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ") || "Mchezaji";
}
async function saveAward(type){
  const playerEl=document.getElementById("award-player-"+type);
  const coachEl=document.getElementById("award-coach-"+type);
  const playerId=playerEl ? playerEl.value || null : null;
  const coachName=coachEl ? coachEl.value.trim() || null : null;
  const payload={competition_id:id,award_type:type,player_id:playerId,coach_name:coachName};
  const r=await db.from("competition_awards").upsert(payload,{onConflict:"competition_id,award_type"}).select().single();
  if(r.error){alert("Imeshindikana kuhifadhi: "+r.error.message);return;}
  const i=awards.findIndex(a=>a.award_type===type);
  if(i>=0) awards[i]=r.data; else awards.push(r.data);
  awardsView();
}
function awardsView(){
  const labels=Object.fromEntries(awardTypes);
  const current=t=>awards.find(a=>a.award_type===t)||{};
  const playerOptions=(selected)=>'<option value="">-- Chagua mchezaji --</option>'+players.map(p=>'<option value="'+esc(p.id)+'" '+(String(selected||"")===String(p.id)?"selected":"")+'>'+esc(playerLabel(p))+' — '+esc(name(p.club_id))+'</option>').join("");
  $("content").innerHTML='<h3>🏅 TUZO ZA UPENDO WA WAKIMBIZI CUP 2026</h3>'+
    '<div class="muted" style="margin-bottom:12px">Chagua washindi wa tuzo na bonyeza HIFADHI. Unaweza kuwabadilisha baadaye.</div>'+
    awardTypes.map(([type,label])=>{
      const a=current(type);
      const isCoach=type==="BEST_COACH";
      return '<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:9px 0"><b>🏅 '+label+'</b>'+
        (isCoach
          ? '<input id="award-coach-'+type+'" value="'+esc(a.coach_name||"")+'" placeholder="Jina la coach" style="width:100%;box-sizing:border-box;margin:9px 0;padding:10px">'
          : '<select id="award-player-'+type+'" style="width:100%;margin:9px 0;padding:10px">'+playerOptions(a.player_id)+'</select>')+
        '<button class="secondary small-btn" onclick="saveAward(\''+type+'\')">💾 HIFADHI</button></div>';
    }).join("")+
    '<div style="margin-top:16px;padding:12px;background:#f7f9fc;border-radius:12px"><b>🏆 Bingwa:</b> FEBA ESPOIR &nbsp; | &nbsp; <b>🥈:</b> GHI1 BILOMBE FC &nbsp; | &nbsp; <b>🥉:</b> ASKU O3</div>';
}

function cards(){
  const c = events.filter(e => {
    const t = String(e.event_type || "").toLowerCase();
    return t.includes("yellow") || t.includes("red");
  });
  $("content").innerHTML = '<h3>🟨🟥 Kadi</h3>' +
    (c.length ? c.map(e => `<div style="padding:9px;border-bottom:1px solid #eee">${String(e.event_type).toLowerCase().includes("red")?"🟥":"🟨"} ${esc(name(e.club_id))} · dakika ${esc(e.minute || "—")}</div>`).join("")
    : '<div class="empty">Hakuna kadi.</div>');
}

function scorers(){
  const goals = events.filter(e => String(e.event_type || "").toLowerCase().includes("goal"));
  $("content").innerHTML = `<h3>⚽ Wafungaji</h3><div class="empty">${goals.length} matukio ya magoli yameandikwa.</div>`;
}

function stats(){
  const p = matches.filter(m => played(m.status));
  const g = p.reduce((s,m) => s + (Number(m.home_score)||0) + (Number(m.away_score)||0), 0);
  $("content").innerHTML = `
    <h3>📊 Takwimu</h3><div class="grid">
      <div class="stat"><b>${teams.length}</b>TIMU</div>
      <div class="stat"><b>${matches.length}</b>MECHI</div>
      <div class="stat"><b>${p.length}</b>ZILIZOCHEZWA</div>
      <div class="stat"><b>${g}</b>MAGOLI</div>
    </div>`;
}

load().catch(e => {
  console.error("AFRN history:", e);
  $("hero").innerHTML = '<div class="empty">❌ Imeshindikana kupakia competition.</div>';
  $("content").innerHTML = '<div class="empty">❌ Imeshindikana kupakia data.<br><small>'+esc(e.message || e)+'</small></div>';
});
</script>
<script src="./afrn-player-photo-global.js"></script>
</body></html>
