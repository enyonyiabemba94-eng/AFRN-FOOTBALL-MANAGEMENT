<script>
const db = window.supabaseClient || window.supabase.createClient(
  "https://jjqhvruppafpumcthmwe.supabase.co",
  "sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G"
);
const id = new URLSearchParams(location.search).get("id");
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
let C = null, teams = [], matches = [], events = [], clubs = [], players = [], awards = [], tab = "MECHI";

const played = s => window.AFRNStandings && window.AFRNStandings.playedStatus
  ? window.AFRNStandings.playedStatus(s)
  : ["completed","finished","played","full_time","ft"].includes(String(s ?? "").trim().toLowerCase());

const name = id => (clubs.find(c => String(c.id) === String(id)) || {}).name || "Timu";

async function load(){
  if(!id){
    $("hero").innerHTML = '<div class="empty">Competition ID haipo.</div>';
    $("content").innerHTML = '<div class="empty">Fungua History kupitia ukurasa wa Mashindano.</div>';
    return;
  }

  const cr = await db.from("competitions").select("*").eq("id", id).maybeSingle();
  if(cr.error) throw cr.error;
  if(!cr.data){
    $("hero").innerHTML = '<div class="empty">Mashindano hayajapatikana.</div>';
    $("content").innerHTML = '<div class="empty">Competition haijapatikana.</div>';
    return;
  }
  C = cr.data;

  const tr = await db.from("competition_teams")
    .select("id,competition_id,club_id,group_name")
    .eq("competition_id", id);
  if(tr.error) throw tr.error;

  const mr = await db.from("matches")
    .select("*")
    .eq("competition_id", id)
    .order("match_date", {ascending:true})
    .order("match_time", {ascending:true});
  if(mr.error) throw mr.error;

  const clr = await db.from("clubs")
    .select("id,name,logo_url,afrn_club_id");
  if(clr.error) throw clr.error;
  const pr = await db.from("players")
    .select("id,club_id,first_name,middle_name,last_name,position,status,date_of_birth")
    .order("first_name", {ascending:true});
  if(pr.error) throw pr.error;
  const ar = await db.from("competition_awards")
    .select("*")
    .eq("competition_id", id);
  if(ar.error) throw ar.error;

  teams = tr.data || [];
  matches = mr.data || [];
  clubs = clr.data || [];
  players = pr.data || [];
  awards = ar.data || [];
  events = [];

  const matchIds = matches.map(m => m.id).filter(Boolean);
  if(matchIds.length){
    const er = await db.from("match_events")
      .select("match_id,club_id,event_type,player_id,minute")
      .in("match_id", matchIds);
    if(er.error) throw er.error;
    events = er.data || [];
  }

  $("hero").innerHTML = `
    <div class="hero">
      <img class="logo" src="${esc(C.logo_url || "./afrn-logo.png")}" onerror="this.style.display='none'">
      <div>
        <h2 style="margin:0">🏆 ${esc(C.name)}</h2>
        <div class="muted">${esc(C.season || "—")} · ${esc(C.format || C.competition_type || "—")} · Daraja ${esc(C.division || "—")} ·
          <span class="badge">${esc(C.status || "—")}</span>
        </div>
        <div class="muted">${esc(C.start_date || "—")} → ${esc(C.end_date || "—")}</div>
      </div>
    </div>`;

  const isLeague = String(C.competition_type || C.format || "").toLowerCase().includes("league");
  const tabs = isLeague ? ["MECHI","MSIMAMO","TIMU","WAFUNGAJI","KADI","TAKWIMU","KNOCKOUT"] : ["MECHI","MAKUNDI","MSIMAMO","KNOCKOUT","TIMU","WAFUNGAJI","KADI","TAKWIMU","TUZO"];
  $("tabs").innerHTML = '<div class="tabs">' +
    tabs.map(t => `<button class="tab ${t===tab?"active":""}" onclick="showTab('${t}')">${t}</button>`).join("") +
    '</div>';
  render();
}

function showTab(t){
  tab = t;
  $("tabs").querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.textContent === t));
  render();
}

function render(){
  if(tab === "MSIMAMO") standings();
  else if(tab === "MAKUNDI") groups();
  else if(tab === "TIMU") teamsView();
  else if(tab === "MECHI") matchesView();
  else if(tab === "KADI") cards();
  else if(tab === "WAFUNGAJI") scorers();
  else if(tab === "TAKWIMU") stats();
  else if(tab === "TUZO") awardsView();
  else if(tab === "KNOCKOUT") knockout();
}

function editHistoryMatch(matchId){ location.href="./matches.html?edit="+encodeURIComponent(matchId); }
function addKnockout(stage){ location.href="./matches.html?competition="+encodeURIComponent(id)+"&stage="+encodeURIComponent(stage); }

function stageOf(m){
  const z=String(m?.notes||"").match(/AFRN_STAGE=([A-Z0-9]+)/);
  return z ? z[1] : "";
}
function winnerClubId(m){
  if(!m || !played(m.status)) return null;
  const hs=Number(m.home_score||0), as=Number(m.away_score||0);
  const decision=String(m.notes||"").match(/AFRN_WINNER=(HOME|AWAY)/)?.[1];
  if(decision) return decision==="HOME" ? m.home_team_id : m.away_team_id;
  if(hs>as) return m.home_team_id;
  if(as>hs) return m.away_team_id;
  return null;
}
function competitionPodium(){
  const final=matches.filter(m=>stageOf(m)==="FINAL").sort((a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")))[0]||null;
  const third=matches.filter(m=>stageOf(m)==="3RD").sort((a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")))[0]||null;
  const champion=winnerClubId(final);
  let runnerUp=null;
  if(final && champion) runnerUp=String(final.home_team_id)===String(champion)?final.away_team_id:final.home_team_id;
  return {final,third,champion,runnerUp,thirdPlace:winnerClubId(third)};
}
function podiumHtml(){
  const p=competitionPodium();
  if(!p.champion) return '<div class="muted">🏆 Bingwa bado hajaamuliwa — subiri FAINALI ikamilike.</div>';
  return '<div style="margin-top:16px;padding:12px;background:#f7f9fc;border-radius:12px"><b>🏆 Bingwa:</b> '+esc(name(p.champion))+' &nbsp; | &nbsp; <b>🥈:</b> '+esc(name(p.runnerUp))+' &nbsp; | &nbsp; <b>🥉:</b> '+esc(name(p.thirdPlace))+'</div>';
}

function matchesView(){
  $("content").innerHTML = `
    <h3>🏟️ Mechi</h3>
    <div class="table-wrap"><table><thead><tr>
      <th>Tarehe</th><th>Mechi</th><th>Matokeo</th><th>Hali</th>
    </tr></thead><tbody>
      ${matches.map(m => `<tr>
        <td>${esc(m.match_date || "—")}</td>
        <td>${esc(name(m.home_team_id))} vs ${esc(name(m.away_team_id))}</td>
        <td><b>${played(m.status) ? esc(m.home_score ?? 0)+" - "+esc(m.away_score ?? 0) : "—"}</b></td>
        <td>${esc(m.status || "Scheduled")}<br><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit</button></td>
      </tr>`).join("")}
    </tbody></table></div>`;
}

function groups(){
  const gs = [...new Set(teams.map(t => t.group_name).filter(Boolean))].sort();
  $("content").innerHTML = gs.length
    ? gs.map(g => `<div style="margin-bottom:16px"><h3>GROUP ${esc(g)}</h3>
        ${teams.filter(t => t.group_name === g).map(t => `<div style="padding:9px;border-bottom:1px solid #eee">${esc(name(t.club_id))}</div>`).join("")}
      </div>`).join("")
    : '<div class="empty">Hakuna makundi.</div>';
}

function teamsView(){
  $("content").innerHTML = '<h3>👥 Timu</h3>' +
    teams.map(t => `<div style="padding:10px;border-bottom:1px solid #eee">
      <b>${esc(name(t.club_id))}</b>
      <div class="muted">Group ${esc(t.group_name || "—")}</div>
    </div>`).join("");
}

function standings(){
  if(!window.AFRNStandings){
    $("content").innerHTML = '<div class="empty">Engine ya msimamo haijapakia.</div>';
    return;
  }
  const rows = window.AFRNStandings.buildStandings({teams,matches,events,clubName:name});
  $("content").innerHTML = `
    <h3>📊 Msimamo</h3>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>KLABU</th><th>PTS</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th>
    </tr></thead><tbody>
    ${rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td><b>${r.PTS}</b></td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}-${r.GA}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function knockout(){
  const stageNames = {
    PRELIM:"PRELIMINARY", R16:"HATUA YA 16 BORA", QF:"ROBO FAINALI",
    SF:"NUSU FAINALI", "3RD":"MCHUJO WA NAFASI YA 3", FINAL:"FINALI"
  };
  const order = {PRELIM:0,R16:1,QF:2,SF:3,"3RD":4,FINAL:5};
  const groups = {};
  matches.forEach(m => {
    const z = String(m.notes || "").match(/AFRN_STAGE=([A-Z0-9]+)/);
    if(z) (groups[z[1]] ||= []).push(m);
  });
  const keys = Object.keys(groups).sort((a,b) => (order[a] ?? 99) - (order[b] ?? 99));
  if(!keys.length){
    $("content").innerHTML = '<div class="empty"><h3>⚔️ Knockout</h3><p>Hakuna mechi za knockout zilizotengenezwa.</p></div>';
    return;
  }
  let html = `<h3>⚔️ KNOCKOUT</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="btn-primary" onclick="addKnockout('FINAL')">➕ Ongeza FAINALI</button><button class="secondary small-btn" onclick="addKnockout('3RD')">➕ Ongeza MSHINDI WA 3</button></div>`;
  keys.forEach(stage => {
    const rows = groups[stage].slice().sort((a,b) => {
      const aa = Number(String(a.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      const bb = Number(String(b.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      return aa - bb;
    });
    html += `<div style="margin:16px 0"><h3>${esc(stageNames[stage] || stage)}</h3>`;
    rows.forEach((m,i) => {
      const result = played(m.status) ? `${esc(m.home_score ?? 0)} - ${esc(m.away_score ?? 0)}` : "vs";
      html += `<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:8px 0">
        <div class="muted">MECHI #${esc(m.match_number || i+1)} · ${esc(m.match_date || "—")} ${esc(m.match_time || "")}</div>
        <b>${esc(name(m.home_team_id))}</b> <strong style="margin:0 8px">${result}</strong> <b>${esc(name(m.away_team_id))}</b>
        <div class="muted">Hali: ${esc(m.status || "scheduled")}${m.notes && /AFRN_DECISION=PENALTIES/.test(m.notes) ? " · 🥅 Ushindi kwa penalti" : ""}</div>
        <div style="margin-top:9px"><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit Mechi</button></div>
      </div>`;
    });
    html += "</div>";
  });
  $("content").innerHTML = html;
}

const awardTypes = [
  ["MVP","Mchezaji Bora"],
  ["TOP_SCORER","Mfungaji Bora"],
  ["BEST_GOALKEEPER","Kipa Bora"],
  ["BEST_DEFENDER","Beki Bora"],
  ["BEST_YOUNG_PLAYER","Chipukizi Bora"],
  ["BEST_COACH","Coach Bora"]
];

function playerLabel(p){ return [p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ") || "Mchezaji"; }
function playerAge(p){
  if(!p.date_of_birth) return 999;
  const d=new Date(p.date_of_birth), now=new Date();
  let age=now.getFullYear()-d.getFullYear();
  const md=now.getMonth()-d.getMonth();
  if(md<0 || (md===0 && now.getDate()<d.getDate())) age--;
  return age;
}
function competitionPlayerStats(){
  const map=new Map();
  players.forEach(p=>map.set(String(p.id),{p,apps:0,goals:0,yellow:0,red:0,clean:0,club:p.club_id}));
  const byMatch=new Map();
  matches.forEach(m=>byMatch.set(String(m.id),m));
  events.forEach(e=>{
    const s=map.get(String(e.player_id)); if(!s) return;
    const t=String(e.event_type||"").toLowerCase();
    if(t==="goal" || t.includes("goal")) s.goals++;
    if(t.includes("yellow")) s.yellow++;
    if(t.includes("red")) s.red++;
    if(t==="lineup_starting" || t==="lineup_substitute") s.apps++;
  });
  // Clean sheets are credited to lineup players in goalkeeper/defender positions.
  matches.filter(m=>played(m.status)).forEach(m=>{
    const hs=Number(m.home_score||0), as=Number(m.away_score||0);
    const lineupFor=clubId=>events.filter(e=>String(e.match_id)===String(m.id)&&String(e.club_id)===String(clubId)&&String(e.event_type||"").toLowerCase().startsWith("lineup_")&&e.player_id).map(e=>String(e.player_id));
    if(hs===0) lineupFor(m.away_team_id).forEach(pid=>{const p=players.find(x=>String(x.id)===pid),s=map.get(pid);if(s&&p&&/goalkeeper|keeper|kipa|defender|defence|beki|centre back|full back/i.test(String(p.position||"")))s.clean++;});
    if(as===0) lineupFor(m.home_team_id).forEach(pid=>{const p=players.find(x=>String(x.id)===pid),s=map.get(pid);if(s&&p&&/goalkeeper|keeper|kipa|defender|defence|beki|centre back|full back/i.test(String(p.position||"")))s.clean++;});
  });
  return [...map.values()].filter(s=>s.apps>0 || s.goals>0);
}
function automaticAwards(){
  const ss=competitionPlayerStats();
  const score=(s)=>s.goals*5+s.apps+s.clean*2-s.yellow*0.5-s.red*2;
  const top=(arr,fn)=>arr.slice().sort((a,b)=>fn(b)-fn(a))[0]||null;
  const topScorer=top(ss,s=>s.goals);
  const keepers=ss.filter(s=>/goalkeeper|keeper|kipa/i.test(String(s.p.position||"")));
  const defenders=ss.filter(s=>/defender|defence|beki|centre back|full back/i.test(String(s.p.position||"")));
  const young=ss.filter(s=>playerAge(s.p)<23);
  const mvp=top(ss,score);
  const bestKeeper=top(keepers,s=>s.clean*5+s.apps+s.goals*2-s.yellow);
  const bestDefender=top(defenders,s=>s.clean*4+s.apps+s.goals*3-s.yellow-s.red*2);
  const bestYoung=top(young,s=>score(s));
  const p=competitionPodium();
  return {
    MVP:mvp, TOP_SCORER:topScorer, BEST_GOALKEEPER:bestKeeper,
    BEST_DEFENDER:bestDefender, BEST_YOUNG_PLAYER:bestYoung,
    BEST_COACH:null, champion:p.champion
  };
}
function awardCard(label, s, extra){
  if(!s) return '<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:9px 0"><b>🏅 '+esc(label)+'</b><div class="muted" style="margin-top:8px">Bado hakuna takwimu za kutosha.</div></div>';
  return '<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:9px 0"><b>🏅 '+esc(label)+'</b><div style="margin-top:8px;font-size:16px;font-weight:800">'+esc(playerLabel(s.p))+'</div><div class="muted">'+esc(name(s.p.club_id))+' · Mechi: '+s.apps+' · Magoli: '+s.goals+(extra? ' · '+extra:'')+'</div></div>';
}
function awardStored(type){ return awards.find(x=>x.award_type===type) || null; }
async function saveAwardOverride(type){
  const sel=document.getElementById("award-player-"+type), coach=document.getElementById("award-coach-"+type);
  const playerId=sel ? (sel.value || null) : null, coachName=coach ? (coach.value.trim() || null) : null;
  const payload={competition_id:id,award_type:type,player_id:playerId,coach_name:coachName,notes:"MANUAL_OVERRIDE",updated_at:new Date().toISOString()};
  const old=awardStored(type);
  const r=old ? await db.from("competition_awards").update(payload).eq("id",old.id) : await db.from("competition_awards").insert(payload);
  if(r.error){alert("❌ Imeshindikana kuhifadhi: "+r.error.message);return;}
  const ar=await db.from("competition_awards").select("*").eq("competition_id",id); if(!ar.error) awards=ar.data||[];
  awardsView();
}
async function clearAwardOverride(type){
  const old=awardStored(type); if(!old)return;
  const r=await db.from("competition_awards").delete().eq("id",old.id);
  if(r.error){alert("❌ Imeshindikana kuondoa Override: "+r.error.message);return;}
  awards=awards.filter(x=>x.id!==old.id); awardsView();
}
function awardEditor(type,auto){
  const old=awardStored(type), manual=old&&old.notes==="MANUAL_OVERRIDE";
  if(type==="BEST_COACH"){
    return '<div style="margin-top:10px"><input id="award-coach-'+type+'" value="'+esc(manual?(old.coach_name||""):"")+'" placeholder="Andika jina la Coach rasmi" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd5e2;border-radius:9px"><div style="display:flex;gap:7px;margin-top:8px"><button class="secondary small-btn" onclick="saveAwardOverride(\''+type+'\')">💾 Hifadhi</button>'+(manual?'<button class="secondary small-btn" onclick="clearAwardOverride(\''+type+'\')">↩️ Rudi Automatic</button>':'')+'</div></div>';
  }
  const selected=manual?(old.player_id||""):"";
  const opts=players.filter(p=>p.status!=="inactive").map(p=>'<option value="'+esc(p.id)+'" '+(String(selected)===String(p.id)?'selected':'')+'>'+esc(playerLabel(p))+' — '+esc(name(p.club_id))+'</option>').join("");
  const autoName=auto&&auto[type]&&auto[type].p ? playerLabel(auto[type].p) : "Chagua mchezaji";
  return '<div style="margin-top:10px"><select id="award-player-'+type+'" style="width:100%;padding:10px;border:1px solid #ccd5e2;border-radius:9px"><option value="">'+esc(manual?"Chagua mchezaji (Override)":("Automatic: "+autoName))+'</option>'+opts+'</select><div style="display:flex;gap:7px;margin-top:8px"><button class="secondary small-btn" onclick="saveAwardOverride(\''+type+'\')">💾 Hifadhi Override</button>'+(manual?'<button class="secondary small-btn" onclick="clearAwardOverride(\''+type+'\')">↩️ Rudi Automatic</button>':'')+'</div></div>';
}
function awardCardWithOverride(label,type,s,auto){
  const old=awardStored(type), manual=old&&old.notes==="MANUAL_OVERRIDE";
  let display=s;
  if(manual&&old.player_id){const p=players.find(x=>String(x.id)===String(old.player_id));if(p)display={p,apps:0,goals:0,clean:0};}
  if(manual&&type==="BEST_COACH"){
    return '<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:9px 0"><b>🏅 '+esc(label)+'</b><div style="margin-top:8px;font-size:16px;font-weight:800">👔 '+esc(old.coach_name||"Coach")+'</div><div class="muted">✏️ Manual Override</div>'+awardEditor(type,auto)+'</div>';
  }
  return awardCard(label,display,manual?"✏️ Manual Override":"🤖 Automatic").replace('</div>',''+awardEditor(type,auto)+'</div>');
}
function awardsView(){
  const a=automaticAwards();
  let html='<h3>🏅 TUZO ZA UPENDO WA WAKIMBIZI CUP 2026</h3><div class="muted" style="margin-bottom:12px">Mfumo unahesabu tuzo automatically kutoka kwenye mechi/events. Unaweza kuweka <b>Manual Override</b> kama uamuzi rasmi ni tofauti. Override hubaki hadi uichague tena Automatic.</div>';
  html+=awardCardWithOverride("Mchezaji Bora (MVP)","MVP",a.MVP,a);
  html+=awardCardWithOverride("Mfungaji Bora","TOP_SCORER",a.TOP_SCORER,a);
  html+=awardCardWithOverride("Kipa Bora","BEST_GOALKEEPER",a.BEST_GOALKEEPER,a);
  html+=awardCardWithOverride("Beki Bora","BEST_DEFENDER",a.BEST_DEFENDER,a);
  html+=awardCardWithOverride("Chipukizi Bora (<23)","BEST_YOUNG_PLAYER",a.BEST_YOUNG_PLAYER,a);
  html+=awardCardWithOverride("Coach Bora","BEST_COACH",null,a);
  html+=podiumHtml(); $("content").innerHTML=html;
}

function cards(){
  const c = events.filter(e => {
    const t = String(e.event_type || "").toLowerCase();
    return t.includes("yellow") || t.includes("red");
  });
  $("content").innerHTML = '<h3>🟨🟥 Kadi</h3>' +
    (c.length ? c.map(e => `<div style="padding:9px;border-bottom:1px solid #eee">${String(e.event_type).toLowerCase().includes("red")?"🟥":"🟨"} ${esc(name(e.club_id))} · dakika ${esc(e.minute || "—")}</div>`).join("")
    : '<div class="empty">Hakuna kadi.</div>');
}

function scorers(){
  const goals = events.filter(e => String(e.event_type || "").toLowerCase().includes("goal"));
  $("content").innerHTML = `<h3>⚽ Wafungaji</h3><div class="empty">${goals.length} matukio ya magoli yameandikwa.</div>`;
}

function stats(){
  const p = matches.filter(m => played(m.status));
  const g = p.reduce((s,m) => s + (Number(m.home_score)||0) + (Number(m.away_score)||0), 0);
  $("content").innerHTML = `
    <h3>📊 Takwimu</h3><div class="grid">
      <div class="stat"><b>${teams.length}</b>TIMU</div>
      <div class="stat"><b>${matches.length}</b>MECHI</div>
      <div class="stat"><b>${p.length}</b>ZILIZOCHEZWA</div>
      <div class="stat"><b>${g}</b>MAGOLI</div>
    </div>`;
}

load().catch(e => {
  console.error("AFRN history:", e);
  $("hero").innerHTML = '<div class="empty">❌ Imeshindikana kupakia competition.</div>';
  $("content").innerHTML = '<div class="empty">❌ Imeshindikana kupakia data.<br><small>'+esc(e.message || e)+'</small></div>';
});

<script src="./afrn-player-photo-global.js"></script>
<script>
/* Prevent legacy global League/Knockout centers from appearing on this history page. */
window.__AFRN_COMPETITION_HISTORY__ = true;
</script>
<script>
/* AFRN — Competition Team & Division Manager */
(function(){
  const esc2=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const divName=d=>({'1':'DARAJA LA I','2':'DARAJA LA II','3':'DARAJA LA III','4':'DARAJA LA IV'}[String(d)]||'—');
  async function adminCheck(){
    try{
      const u=await db.auth.getUser(); const uid=u.data?.user?.id;
      if(!uid)return false;
      const p=await db.from('profiles').select('role').eq('id',uid).maybeSingle();
      return ['super_admin','superadmin','admin','administrator','afrn_admin','secretary_general'].includes(String(p.data?.role||'').toLowerCase());
    }catch(e){return false}
  }
  async function manager(){
    if(!C||!id)return;
    const admin=await adminCheck();
    const clubRows=(await db.from('clubs').select('id,name,afrn_club_id,division,zone,status,logo_url').order('name')).data||[];
    const currentIds=new Set(teams.map(t=>String(t.club_id)));
    const division=String(C.division||'');
    const eligible=clubRows.filter(c=>{
      const d=String(c.division||'').trim().toUpperCase();
      return !division || ({I:'1',II:'2',III:'3',IV:'4'}[d]||d)===division;
    });
    let html='<h3>👥 Timu za Mashindano</h3>';
    html+='<div style="padding:12px;background:#f7f9fc;border:1px solid #d9e0ea;border-radius:12px;margin-bottom:12px">';
    html+='<b>🏷️ Daraja la mashindano</b>';
    html+='<div class="muted" style="margin:5px 0 9px">Chagua daraja. Mfumo utaleta klabu za daraja hilo tu.</div>';
    if(admin){
      html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
      html+='<select id="afrnCompetitionDivision" style="flex:1;min-width:190px;padding:10px;border:1px solid #ccd5e2;border-radius:9px"><option value="">Chagua Daraja</option><option value="1">DARAJA LA I</option><option value="2">DARAJA LA II</option><option value="3">DARAJA LA III</option><option value="4">DARAJA LA IV</option></select>';
      html+='<button class="primary" id="saveCompetitionDivision">💾 Hifadhi Daraja</button></div>';
    }else{
      html+='<b style="color:#0d47a1">'+(division?divName(division):'Daraja halijawekwa')+'</b>';
    }
    html+='</div>';
    html+='<div style="padding:12px;background:#fff;border:1px solid #d9e0ea;border-radius:12px;margin-bottom:12px">';
    html+='<b>➕ Ongeza timu</b><div class="muted" style="margin:5px 0 9px">Timu tayari kwenye mashindano hazitaonekana tena.</div>';
    if(admin){
      if(!division) html+='<div class="empty">Kwanza hifadhi <b>Daraja la mashindano</b>, kisha orodha ya timu za daraja hilo itaonekana hapa.</div>';
      else if(!eligible.filter(c=>!currentIds.has(String(c.id))).length) html+='<div class="empty">Hakuna klabu nyingine katika '+divName(division)+'.</div>';
      else html+='<div style="display:grid;gap:8px">'+eligible.filter(c=>!currentIds.has(String(c.id))).map(c=>'<div style="display:flex;align-items:center;gap:9px;padding:9px;border:1px solid #edf0f4;border-radius:10px"><div style="flex:1"><b>'+esc2(c.name)+'</b><div class="muted">'+esc2(c.afrn_club_id||'—')+' · '+divName(c.division)+'</div></div><button class="primary small-btn" onclick="window.afrnAddCompetitionTeam(\''+esc2(c.id)+'\')">➕ Ongeza</button></div>').join('')+'</div>';
    }else html+='<div class="muted">Ni Admin pekee anayeweza kuongeza timu.</div>';
    html+='</div>';
    html+='<div style="margin-top:10px"><b>✅ Timu zilizopo: '+teams.length+'</b></div>';
    if(!teams.length) html+='<div class="empty" style="margin-top:8px">Hakuna timu bado. Ongeza timu hapo juu.</div>';
    else html+='<div style="display:grid;gap:8px;margin-top:8px">'+teams.map(t=>{const c=clubRows.find(x=>String(x.id)===String(t.club_id));return '<div style="display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #e1e6ee;border-radius:10px"><div style="flex:1"><b>'+esc2(c?.name||name(t.club_id))+'</b><div class="muted">'+esc2(c?.afrn_club_id||'—')+' · '+divName(c?.division||division)+(t.group_name?' · Group '+esc2(t.group_name):'')+'</div></div>'+(admin?'<button class="secondary small-btn" onclick="window.afrnRemoveCompetitionTeam(\''+esc2(t.id)+'\')">🗑 Ondoa</button>':'')+'</div>'}).join('')+'</div>';
    if(!String(C.competition_type||C.format||'').toLowerCase().includes('league') && admin && teams.length){
      html+='<div style="margin-top:14px;padding:10px;background:#fffaf0;border:1px solid #f0d58a;border-radius:10px"><b>📌 Makundi</b><div class="muted">Baada ya kuongeza timu, tumia sehemu ya Makundi kwenye Mashindano kuzipanga A–H.</div></div>';
    }
    $("content").innerHTML=html;
    const ds=$("afrnCompetitionDivision"); if(ds){ds.value=division; $("saveCompetitionDivision").onclick=async()=>{const v=ds.value;if(!v){alert("⚠️ Chagua daraja.");return;}const r=await db.from("competitions").update({division:v}).eq("id",id);if(r.error){alert("❌ "+r.error.message);return;}C.division=v;alert("✅ Daraja limehifadhiwa: "+divName(v));manager();};}
  }
  window.afrnAddCompetitionTeam=async function(clubId){
    const d=String(C.division||''); if(!d){alert("⚠️ Kwanza weka Daraja la mashindano.");return;}
    const c=await db.from('clubs').select('id,division').eq('id',clubId).maybeSingle();
    if(c.error) return alert("❌ "+c.error.message);
    const cd=String(c.data?.division||'').trim().toUpperCase(); const normalized={I:'1',II:'2',III:'3',IV:'4'}[cd]||cd;
    if(normalized!==d){alert("❌ Timu hii si ya "+divName(d)+".");return;}
    const x=await db.from('competition_teams').insert({competition_id:id,club_id:clubId,group_name:null});
    if(x.error){alert("❌ Imeshindikana kuongeza timu: "+x.error.message);return;}
    const tr=await db.from('competition_teams').select('id,competition_id,club_id,group_name').eq('competition_id',id); teams=tr.data||[];
    manager();
  };
  window.afrnRemoveCompetitionTeam=async function(rowId){
    if(!confirm("Ondoa timu hii kwenye mashindano?"))return;
    const r=await db.from('competition_teams').delete().eq('id',rowId);
    if(r.error){alert("❌ "+r.error.message);return;}
    const tr=await db.from('competition_teams').select('id,competition_id,club_id,group_name').eq('competition_id',id); teams=tr.data||[];
    manager();
  };
  const oldShowTab=window.showTab;
  window.showTab=function(t){oldShowTab(t);if(t==='TIMU')manager();};
  const oldRender=window.render;
  window.render=function(){oldRender();if(tab==='TIMU')manager();};
  window.addEventListener('load',()=>setTimeout(()=>{if(tab==='TIMU')manager();},0));
})();
</script>
</body></html>
