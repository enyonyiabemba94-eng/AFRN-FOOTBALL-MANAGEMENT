<header><div class="wrap"><b>⚽ AFRN FOOTBALL MANAGEMENT</b><div class="muted" style="color:#fff">Mashindano na historia rasmi</div></div></header>
<nav><a href="./index.html">🏠 Dashboard</a><a href="./competitions.html">🏆 Mashindano</a><a href="./matches.html">🏟️ Mechi</a></nav>
<main class="wrap"><a href="./competitions.html">← Rudi kwenye Mashindano</a><div class="muted" style="margin:8px 0 12px">📌 Hapa ndipo taarifa zote za competition hii zinaonekana. Knockout ni sehemu ya competition hii pekee.</div><section id="hero" class="card">Inapakia...</section><section id="tabs" class="card"></section><section id="content" class="card">Inapakia...</section></main>
<script>
const db = window.supabaseClient || window.supabase.createClient(
  "https://jjqhvruppafpumcthmwe.supabase.co",
  "sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G"
);
const id = new URLSearchParams(location.search).get("id");
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
let C = null, teams = [], matches = [], events = [], clubs = [], players = [], awards = [], tab = "MECHI";

const played = s => window.AFRNStandings && window.AFRNStandings.playedStatus
  ? window.AFRNStandings.playedStatus(s)
  : ["completed","finished","played","full_time","ft"].includes(String(s ?? "").trim().toLowerCase());

const name = id => (clubs.find(c => String(c.id) === String(id)) || {}).name || "Timu";

async function load(){
  if(!id){
    $("hero").innerHTML = '<div class="empty">Competition ID haipo.</div>';
    $("content").innerHTML = '<div class="empty">Fungua History kupitia ukurasa wa Mashindano.</div>';
    return;
  }

  const cr = await db.from("competitions").select("*").eq("id", id).maybeSingle();
  if(cr.error) throw cr.error;
  if(!cr.data){
    $("hero").innerHTML = '<div class="empty">Mashindano hayajapatikana.</div>';
    $("content").innerHTML = '<div class="empty">Competition haijapatikana.</div>';
    return;
  }
  C = cr.data;

  const tr = await db.from("competition_teams")
    .select("id,competition_id,club_id,group_name")
    .eq("competition_id", id);
  if(tr.error) throw tr.error;

  const mr = await db.from("matches")
    .select("*")
    .eq("competition_id", id)
    .order("match_date", {ascending:true})
    .order("match_time", {ascending:true});
  if(mr.error) throw mr.error;

  const clr = await db.from("clubs")
    .select("id,name,logo_url,afrn_club_id");
  if(clr.error) throw clr.error;
  const pr = await db.from("players")
    .select("id,club_id,first_name,middle_name,last_name,position,status,date_of_birth,jersey_number")
    .order("first_name", {ascending:true});
  if(pr.error) throw pr.error;
  const ar = await db.from("competition_awards")
    .select("*")
    .eq("competition_id", id);
  if(ar.error) throw ar.error;

  teams = tr.data || [];
  matches = mr.data || [];
  clubs = clr.data || [];
  players = pr.data || [];
  awards = ar.data || [];
  events = [];

  const matchIds = matches.map(m => m.id).filter(Boolean);
  if(matchIds.length){
    const er = await db.from("match_events")
      .select("match_id,club_id,event_type,player_id,minute,description")
      .in("match_id", matchIds);
    if(er.error) throw er.error;
    events = er.data || [];
  }

  $("hero").innerHTML = `
    <div class="hero">
      <img class="logo" src="${esc(C.logo_url || "./afrn-logo.png")}" onerror="this.style.display='none'">
      <div>
        <h2 style="margin:0">🏆 ${esc(C.name)}</h2>
        <div class="muted">${esc(C.season || "—")} · ${esc(C.format || C.competition_type || "—")} · Daraja ${esc(C.division || "—")} ·
          <span class="badge">${esc(C.status || "—")}</span>
        </div>
        <div class="muted">${esc(C.start_date || "—")} → ${esc(C.end_date || "—")}</div>
      </div>
    </div>`;

  const isLeague = String(C.competition_type || C.format || "").toLowerCase().includes("league");
  const tabs = isLeague ? ["MECHI","MSIMAMO","TIMU","WAFUNGAJI","KADI","TAKWIMU","KNOCKOUT"] : ["MECHI","MAKUNDI","MSIMAMO","KNOCKOUT","TIMU","WAFUNGAJI","KADI","TAKWIMU","TUZO"];
  $("tabs").innerHTML = '<div class="tabs">' +
    tabs.map(t => `<button class="tab ${t===tab?"active":""}" onclick="showTab('${t}')">${t}</button>`).join("") +
    '</div>';
  render();
}

function showTab(t){
  tab = t;
  $("tabs").querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.textContent === t));
  render();
}

function render(){
  if(tab === "MSIMAMO") standings();
  else if(tab === "MAKUNDI") groups();
  else if(tab === "TIMU") teamsView();
  else if(tab === "MECHI") matchesView();
  else if(tab === "KADI") cards();
  else if(tab === "WAFUNGAJI") scorers();
  else if(tab === "TAKWIMU") stats();
  else if(tab === "TUZO") awardsView();
  else if(tab === "KNOCKOUT") knockout();
}

function editHistoryMatch(matchId){ location.href="./matches.html?edit="+encodeURIComponent(matchId)+"&competition="+encodeURIComponent(id); }
function addKnockout(stage){ location.href="./matches.html?competition="+encodeURIComponent(id)+"&stage="+encodeURIComponent(stage); }

function stageOf(m){
  const z=String(m?.notes||"").match(/AFRN_STAGE=([A-Z0-9]+)/);
  return z ? z[1] : "";
}
function winnerClubId(m){
  if(!m || !played(m.status)) return null;
  const hs=Number(m.home_score||0), as=Number(m.away_score||0);
  const decision=String(m.notes||"").match(/AFRN_WINNER=(HOME|AWAY)/)?.[1];
  if(decision) return decision==="HOME" ? m.home_team_id : m.away_team_id;
  if(hs>as) return m.home_team_id;
  if(as>hs) return m.away_team_id;
  return null;
}
function competitionPodium(){
  const final=matches.filter(m=>stageOf(m)==="FINAL").sort((a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")))[0]||null;
  const third=matches.filter(m=>stageOf(m)==="3RD").sort((a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")))[0]||null;
  const champion=winnerClubId(final);
  let runnerUp=null;
  if(final && champion) runnerUp=String(final.home_team_id)===String(champion)?final.away_team_id:final.home_team_id;
  return {final,third,champion,runnerUp,thirdPlace:winnerClubId(third)};
}
function podiumHtml(){
  const p=competitionPodium();
  if(!p.champion) return '<div class="muted">🏆 Bingwa bado hajaamuliwa — subiri FAINALI ikamilike.</div>';
  return '<div style="margin-top:16px;padding:12px;background:#f7f9fc;border-radius:12px"><b>🏆 Bingwa:</b> '+esc(name(p.champion))+' &nbsp; | &nbsp; <b>🥈:</b> '+esc(name(p.runnerUp))+' &nbsp; | &nbsp; <b>🥉:</b> '+esc(name(p.thirdPlace))+'</div>';
}

let selectedMatchWeek = "ALL";

const isLeagueCompetition = () => String(C?.competition_type || C?.format || "").toLowerCase().includes("league");

function matchWeekOf(m){
  const n = Number(m?.match_week);
  if(Number.isFinite(n) && n > 0) return n;
  const z = String(m?.notes || "").match(/(?:AFRN_WEEK|WEEK|Wiki)\s*[=: -]?(\d+)/i);
  return z ? Number(z[1]) : 0;
}

function matchNumberOf(m){
  const n = Number(m?.match_number);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function addCompetitionMatch(){
  location.href="./matches.html?competition="+encodeURIComponent(id);
}

function matchesView(){
  const league = isLeagueCompetition();
  const weeks=[...new Set(matches.map(matchWeekOf).filter(n=>n>0))].sort((a,b)=>a-b);
  const visible=league && selectedMatchWeek!=="ALL"
    ? matches.filter(m=>String(matchWeekOf(m))===String(selectedMatchWeek))
    : matches;

  $("content").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0">🏟️ Mechi</h3>
      <button class="btn-primary" onclick="addCompetitionMatch()">➕ Ongeza Mechi</button>
    </div>
    ${league ? `
    <div class="card" style="margin-top:12px;padding:12px;background:#f7f9fc">
      <label style="font-weight:800">📅 Chagua Wiki / Matchday</label>
      <select id="historyWeekSelect" onchange="selectedMatchWeek=this.value;matchesView()" style="margin-top:7px;width:100%;padding:10px;border:1px solid #d9e0ea;border-radius:9px">
        <option value="ALL">Wiki zote</option>
        ${Array.from({length:34},(_,i)=>i+1).map(w=>`<option value="${w}" ${String(selectedMatchWeek)===String(w)?"selected":""}>Wiki ${w}</option>`).join("")}
      </select>
      ${weeks.length ? '<div class="muted" style="margin-top:7px">Wiki zenye mechi: '+weeks.join(", ")+'</div>' : '<div class="muted" style="margin-top:7px">Bado hakuna Wiki yenye mechi zilizohifadhiwa.</div>'}
    </div>` : ""}
    ${visible.length ? `
    <div class="table-wrap"><table><thead><tr>
      <th>${league ? "Wiki" : "Mechi #"}</th><th>Tarehe</th><th>Mechi</th><th>Uwanja</th><th>Matokeo</th><th>Hali</th>
    </tr></thead><tbody>
      ${visible.map((m,i) => `<tr>
        <td><b>${league ? (matchWeekOf(m)>0 ? "Wiki "+matchWeekOf(m) : "—") : (matchNumberOf(m)>0 ? matchNumberOf(m) : "—")}</b></td>
        <td>${esc(m.match_date || "—")}<br><span class="muted">${esc(m.match_time || "")}</span></td>
        <td>${esc(name(m.home_team_id))} vs ${esc(name(m.away_team_id))}</td>
        <td>${esc(m.venue || "—")}</td>
        <td><b>${played(m.status) ? esc(m.home_score ?? 0)+" - "+esc(m.away_score ?? 0) : "—"}</b></td>
        <td>${esc(m.status || "Scheduled")}<br><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit</button><br><button class="small-btn event-primary" style="margin-top:6px" onclick="openCompetitionEventEditor('${esc(m.id)}')">⚽ Wafungaji/Kadi</button></td>
      </tr>`).join("")}
    </tbody></table></div>`
    : '<div class="empty">'+(league ? 'Hakuna mechi kwenye Wiki hii.' : 'Hakuna mechi zilizohifadhiwa kwenye mashindano haya.')+'</div>'}`;
}

function groups(){
  const gs = [...new Set(teams.map(t => t.group_name).filter(Boolean))].sort();
  $("content").innerHTML = gs.length
    ? gs.map(g => `<div style="margin-bottom:16px"><h3>GROUP ${esc(g)}</h3>
        ${teams.filter(t => t.group_name === g).map(t => `<div style="padding:9px;border-bottom:1px solid #eee">${esc(name(t.club_id))}</div>`).join("")}
      </div>`).join("")
    : '<div class="empty">Hakuna makundi.</div>';
}

function teamsView(){
  $("content").innerHTML = '<h3>👥 Timu</h3>' +
    teams.map(t => `<div style="padding:10px;border-bottom:1px solid #eee">
      <b>${esc(name(t.club_id))}</b>
      <div class="muted">Group ${esc(t.group_name || "—")}</div>
    </div>`).join("");
}

function standings(){
  if(!window.AFRNStandings){
    $("content").innerHTML = '<div class="empty">Engine ya msimamo haijapakia.</div>';
    return;
  }
  const rows = window.AFRNStandings.buildStandings({teams,matches,events,clubName:name});
  $("content").innerHTML = `
    <h3>📊 Msimamo</h3>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>KLABU</th><th>PTS</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th>
    </tr></thead><tbody>
    ${rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td><b>${r.PTS}</b></td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}-${r.GA}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function knockout(){
  const stageNames = {
    PRELIM:"PRELIMINARY", R16:"HATUA YA 16 BORA", QF:"ROBO FAINALI",
    SF:"NUSU FAINALI", "3RD":"MCHUJO WA NAFASI YA 3", FINAL:"FINALI"
  };
  const order = {PRELIM:0,R16:1,QF:2,SF:3,"3RD":4,FINAL:5};
  const groups = {};
  matches.forEach(m => {
    const z = String(m.notes || "").match(/AFRN_STAGE=([A-Z0-9]+)/);
    if(z) (groups[z[1]] ||= []).push(m);
  });
  const keys = Object.keys(groups).sort((a,b) => (order[a] ?? 99) - (order[b] ?? 99));
  if(!keys.length){
    $("content").innerHTML = '<div class="empty"><h3>⚔️ Knockout</h3><p>Hakuna mechi za knockout zilizotengenezwa.</p></div>';
    return;
  }
  let html = `<h3>⚔️ KNOCKOUT</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="btn-primary" onclick="addKnockout('FINAL')">➕ Ongeza FAINALI</button><button class="secondary small-btn" onclick="addKnockout('3RD')">➕ Ongeza MSHINDI WA 3</button></div>`;
  keys.forEach(stage => {
    const rows = groups[stage].slice().sort((a,b) => {
      const aa = Number(String(a.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      const bb = Number(String(b.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      return aa - bb;
    });
    html += `<div style="margin:16px 0"><h3>${esc(stageNames[stage] || stage)}</h3>`;
    rows.forEach((m,i) => {
      const result = played(m.status) ? `${esc(m.home_score ?? 0)} - ${esc(m.away_score ?? 0)}` : "vs";
      html += `<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:8px 0">
        <div class="muted">MECHI #${esc(m.match_number || i+1)} · ${esc(m.match_date || "—")} ${esc(m.match_time || "")}</div>
        <b>${esc(name(m.home_team_id))}</b> <strong style="margin:0 8px">${result}</strong> <b>${esc(name(m.away_team_id))}</b>
        <div class="muted">Hali: ${esc(m.status || "scheduled")}${m.notes && /AFRN_DECISION=PENALTIES/.test(m.notes) ? " · 🥅 Ushindi kwa penalti" : ""}</div>
        <div style="margin-top:9px"><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit Mechi</button></div>
      </div>`;
    });
    html += "</div>";
  });
  $("content").innerHTML = html;
}

const awardTypes = [
  ["MVP","Mchezaji Bora"],
  ["TOP_SCORER","Mfungaji Bora"],
  ["BEST_GOALKEEPER","Kipa Bora"],
  ["BEST_DEFENDER","Beki Bora"],
  ["BEST_YOUNG_PLAYER","Chipukizi Bora"],
  ["BEST_COACH","Coach Bora"]
];

function playerLabel(p){ return [p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ") || "Mchezaji"; }
function playerAge(p){
  if(!p.date_of_birth) return 999;
  const d=new Date(p.date_of_birth), now=new Date();
  let age=now.getFullYear()-d.getFullYear();
  const md=now.getMonth()-d.getMonth();
  if(md<0 || (md===0 && now.getDate()<d.getDate())) age--;
  return age;
}
function competitionPlayerStats(){
  const map=new Map();
  players.forEach(p=>map.set(String(p.id),{p,apps:0,goals:0,yellow:0,red:0,clean:0,club:p.club_id}));
  const byMatch=new Map();
  matches.forEach(m=>byMatch.set(String(m.id),m));
  events.forEach(e=>{
    const s=map.get(String(e.player_id)); if(!s) return;
    const t=String(e.event_type||"").toLowerCase();
    if(t==="goal") s.goals++;
    if(t.includes("yellow")) s.yellow++;
    if(t.includes("red")) s.red++;
    if(t==="lineup_starting" || t==="lineup_substitute") s.apps++;
  });
  // Clean sheets are credited to lineup players in goalkeeper/defender positions.
  matches.filter(m=>played(m.status)).forEach(m=>{
    const hs=Number(m.home_score||0), as=Number(m.away_score||0);
    const lineupFor=clubId=>events.filter(e=>String(e.match_id)===String(m.id)&&String(e.club_id)===String(clubId)&&String(e.event_type||"").toLowerCase().startsWith("lineup_")&&e.player_id).map(e=>String(e.player_id));
    if(hs===0) lineupFor(m.away_team_id).forEach(pid=>{const p=players.find(x=>String(x.id)===pid),s=map.get(pid);if(s&&p&&/goalkeeper|keeper|kipa|defender|defence|beki|centre back|full back/i.test(String(p.position||"")))s.clean++;});
    if(as===0) lineupFor(m.home_team_id).forEach(pid=>{const p=players.find(x=>String(x.id)===pid),s=map.get(pid);if(s&&p&&/goalkeeper|keeper|kipa|defender|defence|beki|centre back|full back/i.test(String(p.position||"")))s.clean++;});
  });
  return [...map.values()].filter(s=>s.apps>0 || s.goals>0);
}
function automaticAwards(){
  const ss=competitionPlayerStats();
  const score=(s)=>s.goals*5+s.apps+s.clean*2-s.yellow*0.5-s.red*2;
  const top=(arr,fn)=>arr.slice().sort((a,b)=>fn(b)-fn(a))[0]||null;
  const topScorer=top(ss,s=>s.goals);
  const keepers=ss.filter(s=>/goalkeeper|keeper|kipa/i.test(String(s.p.position||"")));
  const defenders=ss.filter(s=>/defender|defence|beki|centre back|full back/i.test(String(s.p.position||"")));
  const young=ss.filter(s=>playerAge(s.p)<23);
  const mvp=top(ss,score);
  const bestKeeper=top(keepers,s=>s.clean*5+s.apps+s.goals*2-s.yellow);
  const bestDefender=top(defenders,s=>s.clean*4+s.apps+s.goals*3-s.yellow-s.red*2);
  const bestYoung=top(young,s=>score(s));
  const p=competitionPodium();
  return {
    MVP:mvp, TOP_SCORER:topScorer, BEST_GOALKEEPER:bestKeeper,
    BEST_DEFENDER:bestDefender, BEST_YOUNG_PLAYER:bestYoung,
    BEST_COACH:null, champion:p.champion
  };
}
function awardCard(label, s, extra){
  if(!s) return '<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:9px 0"><b>🏅 '+esc(label)+'</b><div class="muted" style="margin-top:8px">Bado hakuna takwimu za kutosha.</div></div>';
  return '<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:9px 0"><b>🏅 '+esc(label)+'</b><div style="margin-top:8px;font-size:16px;font-weight:800">'+esc(playerLabel(s.p))+'</div><div class="muted">'+esc(name(s.p.club_id))+' · Mechi: '+s.apps+' · Magoli: '+s.goals+(extra? ' · '+extra:'')+'</div></div>';
}
function awardStored(type){ return awards.find(x=>x.award_type===type) || null; }
async function saveAwardOverride(type){
  const sel=document.getElementById("award-player-"+type), coach=document.getElementById("award-coach-"+type);
  const playerId=sel ? (sel.value || null) : null, coachName=coach ? (coach.value.trim() || null) : null;
  const payload={competition_id:id,award_type:type,player_id:playerId,coach_name:coachName,notes:"MANUAL_OVERRIDE",updated_at:new Date().toISOString()};
  const old=awardStored(type);

async function saveCompetitionGoals(matchId){
 try{
  const m=matches.find(x=>String(x.id)===String(matchId));if(!m)throw new Error("Mechi haijapatikana.");
  if(!played(m.status))throw new Error("Kwanza weka hali ya mechi kuwa Finished.");

  scorers.forEach((sel,i)=>{
    const playerId=sel.value,clubId=sel.dataset.club,assistId=assists[i]?.value||"";
    if(!playerId)throw new Error("Chagua mfungaji kwa kila goli.");
    const p=players.find(x=>String(x.id)===String(playerId));
    if(!p||String(p.club_id)!==String(clubId))throw new Error("Mfungaji lazima awe wa timu husika.");
    if(assistId&&assistId===playerId)throw new Error("Mfungaji hawezi kuwa assist wa goli lake mwenyewe.");
    let ap=null;
    if(assistId){ap=players.find(x=>String(x.id)===String(assistId));if(!ap||String(ap.club_id)!==String(clubId))throw new Error("Assist lazima awe mchezaji wa timu hiyo hiyo.");}
    rows.push({clubId,player:p,assist:ap});
  });
  const minuteText=(document.getElementById("compGoalMinutes")?.value||"").trim();
  const minutes=minuteText?minuteText.split(",").map(x=>x.trim()):[];
  if(minutes.some(x=>x&&!/^\d+$/.test(x)||x&&(+x<1||+x>130)))throw new Error("Dakika za goli lazima ziwe kati ya 1 na 130.");
  if(minutes.length&&minutes.length!==rows.length)throw new Error("Weka dakika moja kwa kila goli au acha sehemu ya dakika wazi.");
  const payload=[];
  rows.forEach((r,i)=>{
    const minute=minutes[i]?Number(minutes[i]):null;
    const who="Mchezaji: "+[r.player.first_name,r.player.middle_name,r.player.last_name].filter(Boolean).join(" ");
    payload.push({match_id:matchId,player_id:r.player.id,club_id:r.clubId,event_type:"goal",minute,description:[who,"Imethibitishwa na msimamizi"].join(" | ")});
    if(r.assist)payload.push({match_id:matchId,player_id:r.assist.id,club_id:r.clubId,event_type:"assist",minute,description:["Assist kwa goli la "+[r.player.first_name,r.player.middle_name,r.player.last_name].filter(Boolean).join(" "),"Imethibitishwa na msimamizi"].join(" | ")});
  });
  const del=await db.from("match_events").delete().eq("match_id",matchId).in("event_type",["goal","assist"]);
  if(del.error)throw del.error;
  const ins=await db.from("match_events").insert(payload);
  if(ins.error)throw ins.error;
  alert("✅ Wafungaji na assist zimehifadhiwa kulingana na matokeo.");
  await load();openCompetitionEventEditor(matchId);
 }catch(e){console.error(e);alert("❌ Imeshindikana kuhifadhi wafungaji: "+e.message);}
}
function updateCompetitionEventPlayers(){
 const sel=document.getElementById("compEventPlayer"),club=document.getElementById("compEventClub");if(!sel||!club)return;
 const available=players.filter(p=>String(p.club_id)===String(club.value)&&String(p.status||"").toLowerCase()!=="inactive");
 sel.innerHTML='<option value="">Chagua mchezaji</option>'+available.map(p=>'<option value="'+esc(p.id)+'">'+esc([p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ")||"Mchezaji")+(p.jersey_number!=null?' · #'+esc(p.jersey_number):"")+'</option>').join("");
}
function toggleNewCompetitionPlayer(show){
 const box=document.getElementById("newCompetitionPlayerBox");if(!box)return;
 box.style.display=(show===false||box.style.display==="block")&&show!==true?"none":"block";
 if(box.style.display==="block")document.getElementById("newCompPlayerFirst")?.focus();
}
async function addCompetitionEventPlayer(){
 try{
  const clubId=document.getElementById("compEventClub")?.value||"";
  const first=document.getElementById("newCompPlayerFirst")?.value.trim()||"";
  const last=document.getElementById("newCompPlayerLast")?.value.trim()||"";
  const middle=document.getElementById("newCompPlayerMiddle")?.value.trim()||"";
  const jerseyText=document.getElementById("newCompPlayerJersey")?.value.trim()||"";
  const position=document.getElementById("newCompPlayerPosition")?.value.trim()||"";
  if(!clubId)throw new Error("Chagua timu kwanza.");
  if(!first||!last)throw new Error("Jaza jina la kwanza na jina la mwisho.");
  if(jerseyText&&(!Number.isInteger(Number(jerseyText))||Number(jerseyText)<1||Number(jerseyText)>999))throw new Error("Namba ya jezi iwe kati ya 1 na 999.");
  const payload={club_id:clubId,first_name:first,last_name:last};
  if(middle)payload.middle_name=middle;
  if(jerseyText)payload.jersey_number=Number(jerseyText);
  if(position)payload.position=position;
  const result=await db.from("players").insert(payload).select("id,club_id,first_name,middle_name,last_name,position,status,date_of_birth,jersey_number").single();
  if(result.error)throw result.error;
  players.push(result.data);
  players.sort((a,b)=>String(a.first_name||"").localeCompare(String(b.first_name||"")));
  updateCompetitionEventPlayers();
  const sel=document.getElementById("compEventPlayer");if(sel)sel.value=String(result.data.id);
  ["newCompPlayerFirst","newCompPlayerLast","newCompPlayerMiddle","newCompPlayerJersey","newCompPlayerPosition"].forEach(id=>{const el=document.getElementById(id);if(el)el.value=""});
  const box=document.getElementById("newCompetitionPlayerBox");if(box)box.style.display="none";
  alert("✅ Mchezaji amesajiliwa kwenye timu na amechaguliwa kwa tukio hili.");
 }catch(e){console.error(e);alert("❌ Imeshindikana kusajili mchezaji: "+(e.message||e));}
}
async function saveCompetitionEvent(matchId){
 try{
  const m=matches.find(x=>String(x.id)===String(matchId));if(!m)throw new Error("Mechi haijapatikana.");
  if(!played(m.status))throw new Error("Kwanza weka hali ya mechi kuwa Finished.");
  const type=document.getElementById("compEventType").value,clubId=document.getElementById("compEventClub").value;
  const playerId=document.getElementById("compEventPlayer")?.value||"",personName=document.getElementById("compEventPerson")?.value.trim()||"";
  const minuteText=document.getElementById("compEventMinute").value,notes=document.getElementById("compEventNotes").value.trim();
  if(!clubId)throw new Error("Chagua timu.");
  if(![String(m.home_team_id),String(m.away_team_id)].includes(String(clubId)))throw new Error("Timu hiyo si sehemu ya mechi hii.");
  if(minuteText&&(!Number.isInteger(Number(minuteText))||Number(minuteText)<1||Number(minuteText)>130))throw new Error("Dakika lazima iwe kati ya 1 na 130.");
  let player=null;
  if(!eventIsPerson(type)){if(!playerId)throw new Error("Chagua mchezaji.");player=players.find(p=>String(p.id)===String(playerId));if(!player||String(player.club_id)!==String(clubId))throw new Error("Mchezaji si wa timu uliyochagua.");}
  if(personName.length>160)throw new Error("Jina limezidi herufi 160.");
  const playerName=player?[player.first_name,player.middle_name,player.last_name].filter(Boolean).join(" "):"";
  const who=eventIsPerson(type)?((type.startsWith("coach_")?"Kadi kwa kocha":"Kadi kwa shabiki")+(personName?" — "+personName:"")):("Mchezaji: "+playerName+(player?.jersey_number!=null?" | Namba ya jezi: "+player.jersey_number:""));
  const result=await db.from("match_events").insert({match_id:matchId,player_id:player?.id||null,club_id:clubId,event_type:type,minute:minuteText?Number(minuteText):null,description:[notes,who,"Imethibitishwa na msimamizi"].filter(Boolean).join(" | ")});
  if(result.error)throw result.error;
  alert("✅ "+eventTypeLabel(type)+" limehifadhiwa.");await load();openCompetitionEventEditor(matchId);
 }catch(e){console.error(e);alert("❌ Imeshindikana kuhifadhi tukio: "+e.message);}
}
