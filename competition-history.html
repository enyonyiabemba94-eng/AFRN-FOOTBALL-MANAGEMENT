<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AFRN — Competition History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<style>
:root{--navy:#071a33;--blue:#0d47a1;--green:#16834b;--red:#c62828;--gold:#f5b400;--bg:#f4f7fb;--text:#172033;--muted:#687386;--border:#d9e0ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,#06152b,#0d47a1);color:#fff;padding:17px 15px}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:12px;opacity:.88}
.wrap{max-width:1250px;margin:auto;padding:0 12px}nav{background:#fff;display:flex;gap:7px;overflow:auto;padding:9px 10px;border-bottom:1px solid #ddd}nav a{white-space:nowrap;text-decoration:none;color:var(--text);padding:9px 12px;border-radius:9px;font-size:13px;font-weight:bold}nav a.active{background:var(--blue);color:#fff}
main{max-width:1250px;margin:auto;padding:14px}.status,.card{background:#fff;border:1px solid var(--border);border-radius:15px;box-shadow:0 3px 12px #14213d10}.status{padding:11px 14px;margin-bottom:14px;border-left:4px solid var(--blue);font-size:13px}.status.ok{border-left-color:var(--green)}.status.err{border-left-color:var(--red);color:var(--red)}
.card{padding:16px;margin-bottom:14px}.back{display:inline-block;margin-bottom:10px;text-decoration:none;color:var(--blue);font-weight:800;font-size:13px}.hero{display:flex;gap:14px;align-items:center}.logo{width:70px;height:70px;object-fit:contain;border:1px solid var(--border);border-radius:12px;background:#f5f7fa}.hero h2{margin:0;font-size:21px}.meta{font-size:12px;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center}.stat b{display:block;font-size:22px;color:var(--blue)}.stat span{font-size:11px;color:var(--muted);font-weight:bold}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--navy);color:#fff;padding:9px;white-space:nowrap;text-align:center}td{padding:8px;border-bottom:1px solid #edf0f4;text-align:center;white-space:nowrap}td:nth-child(2){text-align:left;font-weight:800}.section-title{font-size:16px;font-weight:900;margin-bottom:10px}.group-title{margin:15px 0 8px;color:var(--blue);font-weight:900}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3ff;color:var(--blue);font-size:10px;font-weight:800}.played{background:#e8f7ef;color:var(--green)}.pending{background:#fff8df;color:#8a6500}.empty{text-align:center;color:var(--muted);padding:24px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:18px}.logo{width:58px;height:58px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚽ AFRN FOOTBALL MANAGEMENT</h1><p>Association / Football Federation for Refugees in Nyarugusu</p></div></header>
<nav><a href="./index.html">🏠 Dashboard</a><a href="./competitions.html" class="active">🏆 Ligi na Mashindano</a><a href="./matches.html">🏟️ Mechi</a><a href="./reports.html">📊 Ripoti</a></nav>
<main>
<a class="back" href="./competitions.html">← Rudi kwenye Ligi na Mashindano</a>
<div id="status" class="status">⏳ Inapakia history...</div>
<section id="hero" class="card"><div class="empty">Inapakia competition...</div></section>
<section id="stats" class="card" style="display:none"></section>
<section id="standings" class="card" style="display:none"></section>
<section id="results" class="card" style="display:none"></section>
</main>
<script>
const db=window.supabaseClient||window.supabase.createClient("https://jjqhvruppafpumcthmwe.supabase.co","sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G");
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const playedStatus=s=>["completed","finished","played"].includes(String(s||"").toLowerCase());
const dateText=v=>v?String(v).slice(0,10):"—";
const params=new URLSearchParams(location.search);
const competitionId=params.get("id");

async function loadHistory(){
 if(!competitionId){$("status").textContent="❌ Competition ID haipo."; $("status").className="status err"; return;}
 try{
  const [cr,tr,mr,clubr]=await Promise.all([
   db.from("competitions").select("id,name,competition_type,season,status,logo_url,organizer,start_date,end_date").eq("id",competitionId).maybeSingle(),
   db.from("competition_teams").select("id,competition_id,club_id,group_name,created_at").eq("competition_id",competitionId).order("created_at",{ascending:true}),
   db.from("matches").select("id,competition_id,home_team_id,away_team_id,match_date,match_time,venue,home_score,away_score,status,match_number,notes").eq("competition_id",competitionId).order("match_number",{ascending:true,nullsFirst:false}).order("match_date",{ascending:true,nullsFirst:false}),
   db.from("clubs").select("id,name,logo_url,afrn_club_id")
  ]);
  if(cr.error)throw cr.error;if(tr.error)throw tr.error;if(mr.error)throw mr.error;if(clubr.error)throw clubr.error;
  const c=cr.data,teams=tr.data||[],matches=mr.data||[],clubs=clubr.data||[];
  if(!c){$("status").textContent="❌ Competition haikupatikana."; $("status").className="status err";return;}
  const cm=new Map(clubs.map(x=>[String(x.id),x]));
  const cname=id=>cm.get(String(id))?.name||"Timu";
  const played=matches.filter(m=>playedStatus(m.status));
  const pending=matches.filter(m=>!playedStatus(m.status)&&String(m.status||"").toLowerCase()!=="cancelled");
  const goals=played.reduce((s,m)=>s+(Number(m.home_score)||0)+(Number(m.away_score)||0),0);
  $("hero").innerHTML=`<div class="hero"><img class="logo" src="${esc(c.logo_url||"./afrn-logo.png")}" onerror="this.src='./afrn-logo.png'"><div><h2>📚 ${esc(c.name)}</h2><div class="meta">Season: <b>${esc(c.season||"—")}</b> · Type: <b>${esc(c.competition_type||"—")}</b> · Status: <b>${esc(c.status||"—")}</b><br>Organizer: ${esc(c.organizer||"AFRN")} · ${esc(dateText(c.start_date))} → ${esc(dateText(c.end_date))}</div></div></div>`;
  $("stats").style.display="block";
  $("stats").innerHTML=`<div class="section-title">📊 Muhtasari wa Mashindano</div><div class="stats"><div class="stat"><b>${teams.length}</b><span>VILABU</span></div><div class="stat"><b>${matches.length}</b><span>MECHI ZOTE</span></div><div class="stat"><b>${played.length}</b><span>MECHI ZILIZOCHEZWA</span></div><div class="stat"><b>${goals}</b><span>MAGOLI</span></div></div>`;
  const rows=teams.map(t=>({club_id:t.club_id,group:t.group_name||"—",name:cname(t.club_id),MP:0,W:0,D:0,L:0,GF:0,GA:0,PTS:0}));
  const map=new Map(rows.map(r=>[String(r.club_id),r]));
  for(const m of played){
   const h=map.get(String(m.home_team_id)),a=map.get(String(m.away_team_id)); if(!h||!a)continue;
   const hs=Number(m.home_score)||0,as=Number(m.away_score)||0;h.MP++;a.MP++;h.GF+=hs;h.GA+=as;a.GF+=as;a.GA+=hs;
   if(hs>as){h.W++;a.L++;h.PTS+=3}else if(hs<as){a.W++;h.L++;a.PTS+=3}else{h.D++;a.D++;h.PTS++;a.PTS++}
  }
  rows.sort((a,b)=>b.PTS-a.PTS||((b.GF-b.GA)-(a.GF-a.GA))||b.GF-a.GF||a.name.localeCompare(b.name));
  const groups=[...new Set(rows.map(r=>r.group))].sort();
  let sh='<div class="section-title">📊 Msimamo wa Competition</div>';
  for(const g of groups){
   const gr=rows.filter(r=>r.group===g); if(!gr.length)continue;
   sh+=`<div class="group-title">GROUP ${esc(g)}</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Klabu</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>`;
   sh+=gr.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.MP}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}</td><td>${r.GA}</td><td>${r.GF-r.GA}</td><td><b>${r.PTS}</b></td></tr>`).join("");
   sh+='</tbody></table></div>';
  }
  $("standings").style.display="block";$("standings").innerHTML=sh||'<div class="empty">Hakuna timu kwenye competition.</div>';
  $("results").style.display="block";
  let rh='<div class="section-title">🏟️ Matokeo na Ratiba</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Tarehe</th><th>Mechi</th><th>Matokeo</th><th>Hali</th><th>Uwanja</th></tr></thead><tbody>';
  if(!matches.length)rh+='<tr><td colspan="6" class="empty">Hakuna mechi kwenye competition hii.</td></tr>';
  else rh+=matches.map(m=>{const isP=playedStatus(m.status),cancel=String(m.status||"").toLowerCase()==="cancelled";return `<tr><td>${esc(m.match_number||"—")}</td><td>${esc(dateText(m.match_date))}<br><small>${esc(String(m.match_time||"").slice(0,5))}</small></td><td>${esc(cname(m.home_team_id))} <b>vs</b> ${esc(cname(m.away_team_id))}</td><td><b>${isP?esc(m.home_score??0)+" - "+esc(m.away_score??0):"—"}</b></td><td><span class="badge ${isP?"played":cancel?"":"pending"}">${esc(m.status||"Scheduled")}</span></td><td>${esc(m.venue||"—")}</td></tr>`}).join("");
  rh+='</tbody></table></div>'; $("results").innerHTML=rh;
  $("status").textContent=`✅ History imepakiwa: ${teams.length} vilabu · ${matches.length} mechi · ${played.length} zilizochezwa · ${pending.length} zilizobaki.`; $("status").className="status ok";
 }catch(e){console.error(e);$("status").textContent="❌ History haijapakiwa: "+(e?.message||e);$("status").className="status err";}
}
loadHistory();
</script>
</body>
</html>
