<header><div class="wrap"><b>⚽ AFRN FOOTBALL MANAGEMENT</b><div class="muted" style="color:#fff">Mashindano na historia rasmi</div></div></header>
<nav><a href="./index.html">🏠 Dashboard</a><a href="./competitions.html">🏆 Mashindano</a><a href="./matches.html">🏟️ Mechi</a></nav>
<main class="wrap"><a href="./competitions.html">← Rudi kwenye Mashindano</a><div class="muted" style="margin:8px 0 12px">📌 Hapa ndipo taarifa zote za competition hii zinaonekana. Knockout ni sehemu ya competition hii pekee.</div><section id="hero" class="card">Inapakia...</section><section id="tabs" class="card"></section><section id="content" class="card">Inapakia...</section></main>
<script>
const db = window.supabaseClient || window.supabase.createClient(
  "https://jjqhvruppafpumcthmwe.supabase.co",
  "sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G"
);
const id = new URLSearchParams(location.search).get("id");
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
let C = null, teams = [], matches = [], events = [], clubs = [], players = [], awards = [], tab = "MECHI";

const played = s => window.AFRNStandings && window.AFRNStandings.playedStatus
  ? window.AFRNStandings.playedStatus(s)
  : ["completed","finished","played","full_time","ft"].includes(String(s ?? "").trim().toLowerCase());

const name = id => (clubs.find(c => String(c.id) === String(id)) || {}).name || "Timu";

async function load(){
  if(!id){
    $("hero").innerHTML = '<div class="empty">Competition ID haipo.</div>';
    $("content").innerHTML = '<div class="empty">Fungua History kupitia ukurasa wa Mashindano.</div>';
    return;
  }

  const cr = await db.from("competitions").select("*").eq("id", id).maybeSingle();
  if(cr.error) throw cr.error;
  if(!cr.data){
    $("hero").innerHTML = '<div class="empty">Mashindano hayajapatikana.</div>';
    $("content").innerHTML = '<div class="empty">Competition haijapatikana.</div>';
    return;
  }
  C = cr.data;

  const tr = await db.from("competition_teams")
    .select("id,competition_id,club_id,group_name")
    .eq("competition_id", id);
  if(tr.error) throw tr.error;

  const mr = await db.from("matches")
    .select("*")
    .eq("competition_id", id)
    .order("match_date", {ascending:true})
    .order("match_time", {ascending:true});
  if(mr.error) throw mr.error;

  const clr = await db.from("clubs")
    .select("id,name,logo_url,afrn_club_id");
  if(clr.error) throw clr.error;
  const pr = await db.from("players")
    .select("id,club_id,first_name,middle_name,last_name,position,status,date_of_birth,jersey_number")
    .order("first_name", {ascending:true});
  if(pr.error) throw pr.error;
  const ar = await db.from("competition_awards")
    .select("*")
    .eq("competition_id", id);
  if(ar.error) throw ar.error;

  teams = tr.data || [];
  matches = mr.data || [];
  clubs = clr.data || [];
  players = pr.data || [];
  awards = ar.data || [];
  events = [];

  const matchIds = matches.map(m => m.id).filter(Boolean);
  if(matchIds.length){
    const er = await db.from("match_events")
      .select("match_id,club_id,event_type,player_id,minute,description")
      .in("match_id", matchIds);
    if(er.error) throw er.error;
    events = er.data || [];
  }

  $("hero").innerHTML = `
    <div class="hero">
      <img class="logo" src="${esc(C.logo_url || "./afrn-logo.png")}" onerror="this.style.display='none'">
      <div>
        <h2 style="margin:0">🏆 ${esc(C.name)}</h2>
        <div class="muted">${esc(C.season || "—")} · ${esc(C.format || C.competition_type || "—")} · Daraja ${esc(C.division || "—")} ·
          <span class="badge">${esc(C.status || "—")}</span>
        </div>
        <div class="muted">${esc(C.start_date || "—")} → ${esc(C.end_date || "—")}</div>
      </div>
    </div>`;

  const isLeague = String(C.competition_type || C.format || "").toLowerCase().includes("league");
  const tabs = isLeague ? ["MECHI","MSIMAMO","TIMU","MAGOLI","WAFUNGAJI","KADI","TAKWIMU","KNOCKOUT"] : ["MECHI","MAKUNDI","MSIMAMO","KNOCKOUT","TIMU","MAGOLI","WAFUNGAJI","KADI","TAKWIMU","TUZO"];
  $("tabs").innerHTML = '<div class="tabs">' +
    tabs.map(t => `<button class="tab ${t===tab?"active":""}" onclick="showTab('${t}')">${t}</button>`).join("") +
    '</div>';
  render();
}

function showTab(t){
  tab = t;
  $("tabs").querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.textContent === t));
  render();
}

function render(){
  if(tab === "MSIMAMO") standings();
  else if(tab === "MAKUNDI") groups();
  else if(tab === "TIMU") teamsView();
  else if(tab === "MECHI") matchesView();
  else if(tab === "KADI") cards();
  else if(tab === "MAGOLI") goalsReport();
  else if(tab === "WAFUNGAJI") scorers();
  else if(tab === "TAKWIMU") stats();
  else if(tab === "TUZO") awardsView();
  else if(tab === "KNOCKOUT") knockout();
}

function editHistoryMatch(matchId){ location.href="./matches.html?edit="+encodeURIComponent(matchId)+"&competition="+encodeURIComponent(id); }
function addKnockout(stage){ location.href="./matches.html?competition="+encodeURIComponent(id)+"&stage="+encodeURIComponent(stage); }

function stageOf(m){
  const z=String(m?.notes||"").match(/AFRN_STAGE=([A-Z0-9]+)/);
  return z ? z[1] : "";
}
function winnerClubId(m){
  if(!m || !played(m.status)) return null;
  const hs=Number(m.home_score||0), as=Number(m.away_score||0);
  const decision=String(m.notes||"").match(/AFRN_WINNER=(HOME|AWAY)/)?.[1];
  if(decision) return decision==="HOME" ? m.home_team_id : m.away_team_id;
  if(hs>as) return m.home_team_id;
  if(as>hs) return m.away_team_id;
  return null;
}
function competitionPodium(){
  const final=matches.filter(m=>stageOf(m)==="FINAL").sort((a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")))[0]||null;
  const third=matches.filter(m=>stageOf(m)==="3RD").sort((a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")))[0]||null;
  const champion=winnerClubId(final);
  let runnerUp=null;
  if(final && champion) runnerUp=String(final.home_team_id)===String(champion)?final.away_team_id:final.home_team_id;
  return {final,third,champion,runnerUp,thirdPlace:winnerClubId(third)};
}
function podiumHtml(){
  const p=competitionPodium();
  if(!p.champion) return '<div class="muted">🏆 Bingwa bado hajaamuliwa — subiri FAINALI ikamilike.</div>';
  return '<div style="margin-top:16px;padding:12px;background:#f7f9fc;border-radius:12px"><b>🏆 Bingwa:</b> '+esc(name(p.champion))+' &nbsp; | &nbsp; <b>🥈:</b> '+esc(name(p.runnerUp))+' &nbsp; | &nbsp; <b>🥉:</b> '+esc(name(p.thirdPlace))+'</div>';
}

let selectedMatchWeek = "ALL";

const isLeagueCompetition = () => String(C?.competition_type || C?.format || "").toLowerCase().includes("league");

function matchWeekOf(m){
  const n = Number(m?.match_week);
  if(Number.isFinite(n) && n > 0) return n;
  const z = String(m?.notes || "").match(/(?:AFRN_WEEK|WEEK|Wiki)\s*[=: -]?(\d+)/i);
  return z ? Number(z[1]) : 0;
}

function matchNumberOf(m){
  const n = Number(m?.match_number);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function addCompetitionMatch(){
  location.href="./matches.html?competition="+encodeURIComponent(id);
}

function matchesView(){
  const league = isLeagueCompetition();
  const weeks=[...new Set(matches.map(matchWeekOf).filter(n=>n>0))].sort((a,b)=>a-b);
  const visible=league && selectedMatchWeek!=="ALL"
    ? matches.filter(m=>String(matchWeekOf(m))===String(selectedMatchWeek))
    : matches;

  $("content").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0">🏟️ Mechi</h3>
      <button class="btn-primary" onclick="addCompetitionMatch()">➕ Ongeza Mechi</button>
    </div>
    ${league ? `
    <div class="card" style="margin-top:12px;padding:12px;background:#f7f9fc">
      <label style="font-weight:800">📅 Chagua Wiki / Matchday</label>
      <select id="historyWeekSelect" onchange="selectedMatchWeek=this.value;matchesView()" style="margin-top:7px;width:100%;padding:10px;border:1px solid #d9e0ea;border-radius:9px">
        <option value="ALL">Wiki zote</option>
        ${Array.from({length:34},(_,i)=>i+1).map(w=>`<option value="${w}" ${String(selectedMatchWeek)===String(w)?"selected":""}>Wiki ${w}</option>`).join("")}
      </select>
      ${weeks.length ? '<div class="muted" style="margin-top:7px">Wiki zenye mechi: '+weeks.join(", ")+'</div>' : '<div class="muted" style="margin-top:7px">Bado hakuna Wiki yenye mechi zilizohifadhiwa.</div>'}
    </div>` : ""}
    ${visible.length ? `
    <div class="table-wrap"><table><thead><tr>
      <th>${league ? "Wiki" : "Mechi #"}</th><th>Tarehe</th><th>Mechi</th><th>Uwanja</th><th>Matokeo</th><th>Hali</th>
    </tr></thead><tbody>
      ${visible.map((m,i) => `<tr>
        <td><b>${league ? (matchWeekOf(m)>0 ? "Wiki "+matchWeekOf(m) : "—") : (matchNumberOf(m)>0 ? matchNumberOf(m) : "—")}</b></td>
        <td>${esc(m.match_date || "—")}<br><span class="muted">${esc(m.match_time || "")}</span></td>
        <td>${esc(name(m.home_team_id))} vs ${esc(name(m.away_team_id))}</td>
        <td>${esc(m.venue || "—")}</td>
        <td><b>${played(m.status) ? esc(m.home_score ?? 0)+" - "+esc(m.away_score ?? 0) : "—"}</b></td>
        <td>${esc(m.status || "Scheduled")}<br><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit</button><br><button class="small-btn event-primary" style="margin-top:6px" onclick="openCompetitionEventEditor('${esc(m.id)}')">⚽ Wafungaji/Kadi</button></td>
      </tr>`).join("")}
    </tbody></table></div>`
    : '<div class="empty">'+(league ? 'Hakuna mechi kwenye Wiki hii.' : 'Hakuna mechi zilizohifadhiwa kwenye mashindano haya.')+'</div>'}`;
}

function groups(){
  const gs = [...new Set(teams.map(t => t.group_name).filter(Boolean))].sort();
  $("content").innerHTML = gs.length
    ? gs.map(g => `<div style="margin-bottom:16px"><h3>GROUP ${esc(g)}</h3>
        ${teams.filter(t => t.group_name === g).map(t => `<div style="padding:9px;border-bottom:1px solid #eee">${esc(name(t.club_id))}</div>`).join("")}
      </div>`).join("")
    : '<div class="empty">Hakuna makundi.</div>';
}

function teamsView(){
  $("content").innerHTML = '<h3>👥 Timu</h3>' +
    teams.map(t => `<div style="padding:10px;border-bottom:1px solid #eee">
      <b>${esc(name(t.club_id))}</b>
      <div class="muted">Group ${esc(t.group_name || "—")}</div>
    </div>`).join("");
}

function standings(){
  if(!window.AFRNStandings){
    $("content").innerHTML = '<div class="empty">Engine ya msimamo haijapakia.</div>';
    return;
  }
  const rows = window.AFRNStandings.buildStandings({teams,matches,events,clubName:name})
    .map(r => {
      const clubId = clubs.find(c => String(c.name||"") === String(r.name||""))?.id;
      const teamEvents = events.filter(e => String(e.club_id||"") === String(clubId||""));
      const reds = teamEvents.filter(e => /red|nyekundu/i.test(String(e.event_type||""))).length;
      const yellows = teamEvents.filter(e => /yellow|njano/i.test(String(e.event_type||""))).length;
      return {...r, _reds: reds, _yellows: yellows};
    })
    .slice().sort((a,b) =>
      (Number(b.PTS)||0)-(Number(a.PTS)||0) ||
      (Number(b.GF)||0)-(Number(a.GF)||0) ||
      (Number(a.GA)||0)-(Number(b.GA)||0) ||
      (Number(a._reds)||0)-(Number(b._reds)||0) ||
      (Number(a._yellows)||0)-(Number(b._yellows)||0)
    );
  window.afrnCurrentStandingsRows = rows;
  const today = new Date();
  const todayStr = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  $("content").innerHTML = `
    <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <h3 style="margin:0">📊 Msimamo Rasmi</h3>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="small-btn event-primary" onclick="downloadStandingsPDF()">⬇️ Pakua PDF</button>
        <button class="small-btn" style="background:#e7f7ef;color:#087443" onclick="downloadStandingsWord()">⬇️ Pakua Word</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0">
      <label for="standingsDate" style="font-weight:800">TAREHE YA RIPOTI:</label>
      <input id="standingsDate" type="date" value="${todayStr}" style="padding:8px;border:1px solid #ccd5e2;border-radius:8px">
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>KLABU</th><th>PTS</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th>
    </tr></thead><tbody>
    ${rows.map((r,i) => `<tr><td>${i+1}</td><td><div style="display:flex;align-items:center;gap:8px"><img src="${esc(clubs.find(x=>String(x.id)===String(r.club_id))?.logo_url||'')}" alt="" style="width:28px;height:28px;object-fit:contain;border-radius:50%;border:1px solid #d9e1ec" onerror="this.style.display='none'"><b>${esc(r.name)}</b></div></td><td><b>${r.PTS}</b></td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${Number(r.GF)||0}-${Number(r.GA)||0}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="muted" style="margin-top:9px">Mpangilio rasmi: Pointi → magoli ya kufunga → magoli ya kufungwa → kadi nyekundu chache → kadi za njano chache → sarafu ikiwa bado sare.</div>`;
}

function standingsReportDate(){
  const v=document.getElementById("standingsDate")?.value;
  if(!v) return "________________";
  const p=v.split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : v;
}
function standingsReportRows(){
  return (window.afrnCurrentStandingsRows||[]).map((r,i)=>({
    "#":i+1,"KLABU":r.name,"PTS":Number(r.PTS)||0,"MP":Number(r.P)||0,
    "W":Number(r.W)||0,"D":Number(r.D)||0,"L":Number(r.L)||0,
    "GD":(Number(r.GF)||0)+"-"+(Number(r.GA)||0)
  }));
}
async function downloadStandingsWord(){
  try{
    const data=standingsReportRows();
    const safe=v=>String(v??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
    let logoHtml='<b>AFRN</b>';
    try{
      const logo=new Image();logo.src=new URL("./IMG-20260319-WA0093.jpg",window.location.href).href;
      await new Promise((resolve,reject)=>{logo.onload=resolve;logo.onerror=reject;});
      const cv=document.createElement("canvas");cv.width=logo.naturalWidth||logo.width;cv.height=logo.naturalHeight||logo.height;
      cv.getContext("2d").drawImage(logo,0,0);
      logoHtml='<img src="'+cv.toDataURL("image/jpeg",0.9)+'" width="75" height="75">';
    }catch(_){}
    const headers=["#","KLABU","PTS","MP","W","D","L","GD"];
    const wordClubLogos=new Map();
    await Promise.all((window.afrnCurrentStandingsRows||[]).map(async r=>{
      const club=clubs.find(x=>String(x.id)===String(r.club_id));
      if(!club?.logo_url)return;
      try{
        const im=new Image();im.crossOrigin="anonymous";im.src=club.logo_url;
        await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;});
        const cv=document.createElement("canvas");cv.width=im.naturalWidth||im.width;cv.height=im.naturalHeight||im.height;
        cv.getContext("2d").drawImage(im,0,0);
        wordClubLogos.set(String(r.club_id),cv.toDataURL("image/png"));
      }catch(_){}
    }));
    const tableRows=data.map((r,i)=>{
      const source=(window.afrnCurrentStandingsRows||[])[i];
      const img=wordClubLogos.get(String(source?.club_id));
      const logo=img?'<img src="'+img+'" style="width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:7px"> ':"";
      return "<tr>"+headers.map(h=>h==="KLABU"?'<td style="text-align:left">'+logo+safe(r[h])+"</td>":"<td>"+safe(r[h])+"</td>").join("")+"</tr>";
    }).join("");
    const html='<!DOCTYPE html><html><head><meta charset="utf-8"><style>@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;color:#071a33;font-size:12pt}h1,h2,p{text-align:center;margin:5px}h1{font-size:19pt}h2{font-size:15pt}table{border-collapse:collapse;width:100%;margin-top:12px;font-size:12pt}th{background:#071a33;color:white}th,td{border:1px solid #9aa7b5;padding:4px 6px;text-align:center;line-height:1.05}td:nth-child(2){text-align:left}.logos{display:flex;justify-content:space-between;align-items:center}tr{page-break-inside:avoid}</style></head><body><div class="logos">'+logoHtml+logoHtml+'</div><h1>AFRN FOOTBALL MANAGEMENT</h1><h2>MSIMAMO WA '+safe(String(C?.name||"MASHINDANO").toUpperCase()+" "+String(C?.season||""))+'</h2><p><b>TAREHE: '+safe(standingsReportDate())+'</b></p><table><thead><tr>'+headers.map(h=>"<th>"+h+"</th>").join("")+'</tr></thead><tbody>'+tableRows+'</tbody></table><p style="margin-top:20px;font-size:10px">AFRN FOOTBALL MANAGEMENT | MSIMAMO RASMI</p></body></html>';
    const blob=new Blob(["\ufeff",html],{type:"application/msword;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const slug=String(C?.name||"mashindano").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"mashindano";
    const filename="AFRN-Msimamo-"+slug+".doc";
    showReportDownloadLink(url,filename,"Word");
    const a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);
    try{a.click();}catch(downloadError){console.warn("Upakuaji wa moja kwa moja umezuiwa; tumia kiungo kinachoonekana.",downloadError);}
    a.remove();
    setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(_){}},10*60*1000);
  }catch(e){alert("Imeshindikana kupakua Word: "+e.message);}
}
async function downloadStandingsPDF(){
  let pdfWindow=null;try{pdfWindow=window.open("about:blank","_blank")}catch(_){}
  try{

function knockout(){
  const stageNames = {
    PRELIM:"PRELIMINARY", R16:"HATUA YA 16 BORA", QF:"ROBO FAINALI",
    SF:"NUSU FAINALI", "3RD":"MCHUJO WA NAFASI YA 3", FINAL:"FINALI"
  };
  const order = {PRELIM:0,R16:1,QF:2,SF:3,"3RD":4,FINAL:5};
  const groups = {};
  matches.forEach(m => {
    const z = String(m.notes || "").match(/AFRN_STAGE=([A-Z0-9]+)/);
    if(z) (groups[z[1]] ||= []).push(m);
  });
  const keys = Object.keys(groups).sort((a,b) => (order[a] ?? 99) - (order[b] ?? 99));
  if(!keys.length){
    $("content").innerHTML = '<div class="empty"><h3>⚔️ Knockout</h3><p>Hakuna mechi za knockout zilizotengenezwa.</p></div>';
    return;
  }
  let html = `<h3>⚔️ KNOCKOUT</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="btn-primary" onclick="addKnockout('FINAL')">➕ Ongeza FAINALI</button><button class="secondary small-btn" onclick="addKnockout('3RD')">➕ Ongeza MSHINDI WA 3</button></div>`;
  keys.forEach(stage => {
    const rows = groups[stage].slice().sort((a,b) => {
      const aa = Number(String(a.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      const bb = Number(String(b.notes || "").match(/AFRN_SLOT=(\\d+)/)?.[1] || 999);
      return aa - bb;
    });
    html += `<div style="margin:16px 0"><h3>${esc(stageNames[stage] || stage)}</h3>`;
    rows.forEach((m,i) => {
      const result = played(m.status) ? `${esc(m.home_score ?? 0)} - ${esc(m.away_score ?? 0)}` : "vs";
      html += `<div style="padding:12px;border:1px solid #e1e6ee;border-radius:12px;margin:8px 0">
        <div class="muted">MECHI #${esc(m.match_number || i+1)} · ${esc(m.match_date || "—")} ${esc(m.match_time || "")}</div>
        <b>${esc(name(m.home_team_id))}</b> <strong style="margin:0 8px">${result}</strong> <b>${esc(name(m.away_team_id))}</b>
        <div class="muted">Hali: ${esc(m.status || "scheduled")}${m.notes && /AFRN_DECISION=PENALTIES/.test(m.notes) ? " · 🥅 Ushindi kwa penalti" : ""}</div>
        <div style="margin-top:9px"><button class="secondary small-btn" onclick="editHistoryMatch('${esc(m.id)}')">✏️ Edit Mechi</button></div>
      </div>`;
    });
    html += "</div>";
  });
  $("content").innerHTML = html;
}

function playerLabel(p){ return [p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ") || "Mchezaji"; }
function playerAge(p){
  if(!p.date_of_birth) return 999;
  const d=new Date(p.date_of_birth), now=new Date();
  let age=now.getFullYear()-d.getFullYear();
  const md=now.getMonth()-d.getMonth();
  if(md<0 || (md===0 && now.getDate()<d.getDate())) age--;
  return age;
}
function competitionPlayerStats(){
  const map=new Map();
  players.forEach(p=>map.set(String(p.id),{p,apps:0,goals:0,yellow:0,red:0,clean:0,club:p.club_id}));
  const byMatch=new Map();
  matches.forEach(m=>byMatch.set(String(m.id),m));
  events.forEach(e=>{
    const s=map.get(String(e.player_id)); if(!s) return;
    const t=String(e.event_type||"").toLowerCase();
    if(t==="goal") s.goals++;
    if(t.includes("yellow")) s.yellow++;
    if(t.includes("red")) s.red++;
    if(t==="lineup_starting" || t==="lineup_substitute") s.apps++;
  });
  // Clean sheets are credited to lineup players in goalkeeper/defender positions.
  matches.filter(m=>played(m.status)).forEach(m=>{
    const hs=Number(m.home_score||0), as=Number(m.away_score||0);
    const lineupFor=clubId=>events.filter(e=>String(e.match_id)===String(m.id)&&String(e.club_id)===String(clubId)&&String(e.event_type||"").toLowerCase().startsWith("lineup_")&&e.player_id).map(e=>String(e.player_id));
    if(hs===0) lineupFor(m.away_team_id).forEach(pid=>{const p=players.find(x=>String(x.id)===pid),s=map.get(pid);if(s&&p&&/goalkeeper|keeper|kipa|defender|defence|beki|centre back|full back/i.test(String(p.position||"")))s.clean++;});
    if(as===0) lineupFor(m.home_team_id).forEach(pid=>{const p=players.find(x=>String(x.id)===pid),s=map.get(pid);if(s&&p&&/goalkeeper|keeper|kipa|defender|defence|beki|centre back|full back/i.test(String(p.position||"")))s.clean++;});
  });
  return [...map.values()].filter(s=>s.apps>0 || s.goals>0);
}
function automaticAwards(){
  const ss=competitionPlayerStats();
  const score=(s)=>s.goals*5+s.apps+s.clean*2-s.yellow*0.5-s.red*2;
  const top=(arr,fn)=>arr.slice().sort((a,b)=>fn(b)-fn(a))[0]||null;
  const topScorer=top(ss,s=>s.goals);
  const keepers=ss.filter(s=>/goalkeeper|keeper|kipa/i.test(String(s.p.position||"")));
  const defenders=ss.filter(s=>/defender|defence|beki|centre back|full back/i.test(String(s.p.position||"")));
  const young=ss.filter(s=>playerAge(s.p)<23);
  const mvp=top(ss,score);
  const bestKeeper=top(keepers,s=>s.clean*5+s.apps+s.goals*2-s.yellow);
  const bestDefender=top(defenders,s=>s.clean*4+s.apps+s.goals*3-s.yellow-s.red*2);
  const bestYoung=top(young,s=>score(s));
  const p=competitionPodium();
  return {
    MVP:mvp, TOP_SCORER:topScorer, BEST_GOALKEEPER:bestKeeper,
    BEST_DEFENDER:bestDefender, BEST_YOUNG_PLAYER:bestYoung,
    BEST_COACH:null, champion:p.champion
  };
}

function reportScorerRows(){
  const tally=new Map();
  events.filter(e=>String(e.event_type||"").toLowerCase()==="goal"&&e.player_id).forEach(e=>{
    const pid=String(e.player_id),p=players.find(x=>String(x.id)===pid);
    if(!p)return;
    const row=tally.get(pid)||{player:p,clubId:e.club_id||p.club_id,count:0};
    row.count++;tally.set(pid,row);
  });
  return [...tally.values()].sort((a,b)=>b.count-a.count||playerLabel(a.player).localeCompare(playerLabel(b.player)));
}

function scorers(){

<script>
/* AFRN — Competition Team & Division Manager */
(function(){
  const esc2=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const divName=d=>({'1':'DARAJA LA I','2':'DARAJA LA II','3':'DARAJA LA III','4':'DARAJA LA IV'}[String(d)]||'—');
  async function adminCheck(){
    try{
      const u=await db.auth.getUser(); const uid=u.data?.user?.id;
      if(!uid)return false;
      const p=await db.from('profiles').select('role').eq('id',uid).maybeSingle();
      return ['super_admin','superadmin','admin','administrator','afrn_admin','secretary_general'].includes(String(p.data?.role||'').toLowerCase());
    }catch(e){return false}
  }
  async function manager(){
    if(!C||!id)return;
    const admin=await adminCheck();
    const clubRows=(await db.from('clubs').select('id,name,afrn_club_id,division,zone,status,logo_url').order('name')).data||[];
    const currentIds=new Set(teams.map(t=>String(t.club_id)));
    const division=String(C.division||'');
    const eligible=clubRows.filter(c=>{
      const d=String(c.division||'').trim().toUpperCase();
      return !division || ({I:'1',II:'2',III:'3',IV:'4'}[d]||d)===division;
    });
    let html='<h3>👥 Timu za Mashindano</h3>';
    html+='<div style="padding:12px;background:#f7f9fc;border:1px solid #d9e0ea;border-radius:12px;margin-bottom:12px">';
    html+='<b>🏷️ Daraja la mashindano</b>';
    html+='<div class="muted" style="margin:5px 0 9px">Chagua daraja. Mfumo utaleta klabu za daraja hilo tu.</div>';
    if(admin){
      html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
      html+='<select id="afrnCompetitionDivision" style="flex:1;min-width:190px;padding:10px;border:1px solid #ccd5e2;border-radius:9px"><option value="">Chagua Daraja</option><option value="1">DARAJA LA I</option><option value="2">DARAJA LA II</option><option value="3">DARAJA LA III</option><option value="4">DARAJA LA IV</option></select>';
      html+='<button class="primary" id="saveCompetitionDivision">💾 Hifadhi Daraja</button></div>';
    }else{
      html+='<b style="color:#0d47a1">'+(division?divName(division):'Daraja halijawekwa')+'</b>';
    }
    html+='</div>';
    html+='<div style="padding:12px;background:#fff;border:1px solid #d9e0ea;border-radius:12px;margin-bottom:12px">';
    html+='<b>➕ Ongeza timu</b><div class="muted" style="margin:5px 0 9px">Timu tayari kwenye mashindano hazitaonekana tena.</div>';
    if(admin){
      if(!division) html+='<div class="empty">Kwanza hifadhi <b>Daraja la mashindano</b>, kisha orodha ya timu za daraja hilo itaonekana hapa.</div>';
      else if(!eligible.filter(c=>!currentIds.has(String(c.id))).length) html+='<div class="empty">Hakuna klabu nyingine katika '+divName(division)+'.</div>';
      else html+='<div style="display:grid;gap:8px">'+eligible.filter(c=>!currentIds.has(String(c.id))).map(c=>'<div style="display:flex;align-items:center;gap:9px;padding:9px;border:1px solid #edf0f4;border-radius:10px"><div style="flex:1"><b>'+esc2(c.name)+'</b><div class="muted">'+esc2(c.afrn_club_id||'—')+' · '+divName(c.division)+'</div></div><button class="primary small-btn" onclick="window.afrnAddCompetitionTeam(\''+esc2(c.id)+'\')">➕ Ongeza</button></div>').join('')+'</div>';
    }else html+='<div class="muted">Ni Admin pekee anayeweza kuongeza timu.</div>';
    html+='</div>';
    html+='<div style="margin-top:10px"><b>✅ Timu zilizopo: '+teams.length+'</b></div>';
    if(!teams.length) html+='<div class="empty" style="margin-top:8px">Hakuna timu bado. Ongeza timu hapo juu.</div>';
    else html+='<div style="display:grid;gap:8px;margin-top:8px">'+teams.map(t=>{const c=clubRows.find(x=>String(x.id)===String(t.club_id));return '<div style="display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #e1e6ee;border-radius:10px"><div style="flex:1"><b>'+esc2(c?.name||name(t.club_id))+'</b><div class="muted">'+esc2(c?.afrn_club_id||'—')+' · '+divName(c?.division||division)+(t.group_name?' · Group '+esc2(t.group_name):'')+'</div></div>'+(admin?'<button class="secondary small-btn" onclick="window.afrnRemoveCompetitionTeam(\''+esc2(t.id)+'\')">🗑 Ondoa</button>':'')+'</div>'}).join('')+'</div>';
    if(!String(C.competition_type||C.format||'').toLowerCase().includes('league') && admin && teams.length){
      html+='<div style="margin-top:14px;padding:10px;background:#fffaf0;border:1px solid #f0d58a;border-radius:10px"><b>📌 Makundi</b><div class="muted">Baada ya kuongeza timu, tumia sehemu ya Makundi kwenye Mashindano kuzipanga A–H.</div></div>';
    }
    $("content").innerHTML=html;
    const ds=$("afrnCompetitionDivision"); if(ds){ds.value=division; $("saveCompetitionDivision").onclick=async()=>{const v=ds.value;if(!v){alert("⚠️ Chagua daraja.");return;}const r=await db.from("competitions").update({division:v}).eq("id",id);if(r.error){alert("❌ "+r.error.message);return;}C.division=v;alert("✅ Daraja limehifadhiwa: "+divName(v));manager();};}
  }
  window.afrnAddCompetitionTeam=async function(clubId){
    const d=String(C.division||''); if(!d){alert("⚠️ Kwanza weka Daraja la mashindano.");return;}
    const c=await db.from('clubs').select('id,division').eq('id',clubId).maybeSingle();
    if(c.error) return alert("❌ "+c.error.message);
    const cd=String(c.data?.division||'').trim().toUpperCase(); const normalized={I:'1',II:'2',III:'3',IV:'4'}[cd]||cd;
    if(normalized!==d){alert("❌ Timu hii si ya "+divName(d)+".");return;}
    const x=await db.from('competition_teams').insert({competition_id:id,club_id:clubId,group_name:null});
    if(x.error){alert("❌ Imeshindikana kuongeza timu: "+x.error.message);return;}
    const tr=await db.from('competition_teams').select('id,competition_id,club_id,group_name').eq('competition_id',id); teams=tr.data||[];
    manager();
  };
  window.afrnRemoveCompetitionTeam=async function(rowId){
    if(!confirm("Ondoa timu hii kwenye mashindano?"))return;
    const r=await db.from('competition_teams').delete().eq('id',rowId);
    if(r.error){alert("❌ "+r.error.message);return;}
    const tr=await db.from('competition_teams').select('id,competition_id,club_id,group_name').eq('competition_id',id); teams=tr.data||[];
    manager();
  };
  const oldShowTab=window.showTab;
  window.showTab=function(t){oldShowTab(t);if(t==='TIMU')manager();};
  const oldRender=window.render;
  window.render=function(){oldRender();if(tab==='TIMU')manager();};
  window.addEventListener('load',()=>setTimeout(()=>{if(tab==='TIMU')manager();},0));
})();
</script>
<script>
function eventIsPerson(type){return String(type||"").startsWith("coach_")||String(type||"").startsWith("supporter_");}
function eventTypeLabel(type){return ({goal:"Goli",own_goal:"O.G. (Own Goal)",assist:"Assist",yellow_card:"Kadi ya njano — mchezaji",red_card:"Kadi nyekundu — mchezaji",coach_yellow_card:"Kadi ya njano — kocha",coach_red_card:"Kadi nyekundu — kocha",supporter_yellow_card:"Kadi ya njano — shabiki",supporter_red_card:"Kadi nyekundu — shabiki"})[type]||type;}
function openCompetitionEventEditor(matchId){
 const m=matches.find(x=>String(x.id)===String(matchId));if(!m){alert("Mechi haijapatikana.");return;}
 const home=clubs.find(c=>String(c.id)===String(m.home_team_id)),away=clubs.find(c=>String(c.id)===String(m.away_team_id));
 document.getElementById("competitionEventOverlay")?.remove();
 const finished=played(m.status),hs=Math.max(0,Number(m.home_score)||0),as=Math.max(0,Number(m.away_score)||0);
 const scoreIsZeroZero=hs===0&&as===0;
 const teamPlayers=clubId=>players.filter(p=>String(p.club_id)===String(clubId)&&String(p.status||"").toLowerCase()!=="inactive");
 const playerOptions=clubId=>'<option value="">Chagua mchezaji</option>'+teamPlayers(clubId).map(p=>'<option value="'+esc(p.id)+'">'+esc([p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ")||"Mchezaji")+(p.jersey_number!=null?' · #'+esc(p.jersey_number):"")+'</option>').join("");
 const goalRow=(clubId,opponentClubId,n,index)=>'<div class="event-modal-grid compGoalRow" style="padding:10px;border:1px solid #e1e6ee;border-radius:10px;margin:8px 0"><div style="grid-column:1/-1"><label><input type="checkbox" class="compGoalOwnGoal" data-club="'+esc(clubId)+'" data-opponent="'+esc(opponentClubId)+'" onchange="toggleCompetitionOwnGoal('+index+')" style="width:auto;margin-right:6px">🥅 Goli la kujifunga (Own Goal)</label></div><div id="compGoalNormal_'+index+'"><label>⚽ Goli '+n+' — Mfungaji *</label><select class="compGoalScorer" data-club="'+esc(clubId)+'">'+playerOptions(clubId)+'</select><div style="margin-top:8px"><label>🅰️ Assist (si lazima)</label><select class="compGoalAssist" data-club="'+esc(clubId)+'">'+playerOptions(clubId)+'</select></div></div><div id="compGoalOwnWrap_'+index+'" style="display:none"><label>🥅 Mchezaji aliyejifunga *</label><select class="compOwnGoalPlayer" data-club="'+esc(opponentClubId)+'">'+playerOptions(opponentClubId)+'</select><div class="muted">Goli litaongezwa kwa '+esc(name(clubId))+'; mchezaji huyu hataongezwa kwenye wafungaji bora.</div></div></div>';
 const existing=events.filter(e=>String(e.match_id)===String(matchId)&&(/goal|assist|yellow|red/i.test(String(e.event_type||""))));
 const oldHtml=existing.length?existing.map(e=>'<div style="padding:7px 0;border-bottom:1px solid #edf0f4"><b>'+esc(eventTypeLabel(e.event_type))+'</b> · '+esc(name(e.club_id))+' · Dakika '+esc(e.minute||"—")+(e.description?'<div class="muted">'+esc(e.description)+'</div>':'')+'</div>').join(""):'<div class="muted">Bado hakuna goli au kadi zilizohifadhiwa.</div>';
 const cardOptions='<option value="yellow_card">🟨 Kadi ya njano — mchezaji</option><option value="red_card">🟥 Kadi nyekundu — mchezaji</option><option value="coach_yellow_card">🟨 Kadi ya njano — kocha</option><option value="coach_red_card">🟥 Kadi nyekundu — kocha</option><option value="supporter_yellow_card">🟨 Kadi ya njano — shabiki</option><option value="supporter_red_card">🟥 Kadi nyekundu — shabiki</option>';
 let h='<div class="event-overlay" id="competitionEventOverlay" onclick="if(event.target===this)this.remove()"><section class="event-modal" role="dialog" aria-modal="true">';
 h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h3 style="margin:0 0 5px">⚽ Wafungaji na Kadi</h3><b>'+esc(home?.name||"Timu ya nyumbani")+' vs '+esc(away?.name||"Timu ya ugenini")+'</b><div class="muted" style="margin-top:5px">'+esc(m.match_date||"—")+' · Matokeo: '+(finished?hs+" - "+as:"Bado")+'</div></div><button class="small-btn" onclick="document.getElementById(\'competitionEventOverlay\').remove()">✖ Funga</button></div>';
 h+=finished?'':'<div class="event-warning" style="padding:10px;border-radius:9px;margin-top:12px">⚠️ Hifadhi baada ya hali ya mechi kuwa Finished.</div>';
 if(scoreIsZeroZero){
   h+='<div style="margin-top:12px;padding:12px;border-radius:10px;background:#f7f9fc"><b>⚽ Mechi imeisha 0 - 0</b><div class="muted" style="margin-top:5px">Hakuna sehemu ya goli au assist. Unaweza kurekodi kadi pekee.</div></div>';
 }else{
   h+='<div style="margin-top:12px"><h4 style="margin:0 0 5px">⚽ Wafungaji kulingana na matokeo</h4><div class="muted">Kila goli lina mfungaji mmoja na assist moja tu ya hiari. Usichague mchezaji yuleyule kama mfungaji na assist wa goli hilo hilo.</div>';
   for(let i=1;i<=hs;i++)h+=goalRow(m.home_team_id,m.away_team_id,i+' — '+(home?.name||'Nyumbani'),i);
   for(let i=1;i<=as;i++)h+=goalRow(m.away_team_id,m.home_team_id,i+' — '+(away?.name||'Ugenini'),hs+i);
   h+='<div><label>Dakika za magoli (si lazima, weka dakika kwa kila goli kwa mpangilio)</label><input id="compGoalMinutes" placeholder="Mfano: 12, 45, 78" maxlength="100"></div>';
   h+='<button class="small-btn event-primary" style="margin-top:10px" '+(finished?'':'disabled')+' onclick="saveCompetitionGoals(\''+esc(m.id)+'\')">💾 Hifadhi Wafungaji na Assist</button></div>';
 }
 h+='<hr style="border:0;border-top:1px solid #e5eaf1;margin:16px 0"><h4 style="margin:0 0 8px">🟨🟥 Rekodi kadi</h4><div class="event-modal-grid"><div><label>Aina ya kadi/tukio</label><select id="compEventType" onchange="updateCompetitionEventFields()">'+cardOptions+'</select></div><div><label>Timu</label><select id="compEventClub" onchange="updateCompetitionEventPlayers()"><option value="'+esc(m.home_team_id)+'">'+esc(home?.name||"Timu ya nyumbani")+'</option><option value="'+esc(m.away_team_id)+'">'+esc(away?.name||"Timu ya ugenini")+'</option></select></div><div id="compEventPlayerWrap"><label>Mchezaji</label><select id="compEventPlayer"></select><button type="button" class="small-btn" style="margin-top:7px" onclick="toggleNewCompetitionPlayer()">➕ Ongeza mchezaji hayupo kwenye orodha</button><div id="newCompetitionPlayerBox" style="display:none;margin-top:10px;padding:12px;border:1px solid #dfe5ec;border-radius:9px;background:#f7faff"><b>Usajili wa mchezaji mpya</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px"><div><label>Jina la kwanza *</label><input id="newCompPlayerFirst" maxlength="80" placeholder="Jina la kwanza"></div><div><label>Jina la mwisho *</label><input id="newCompPlayerLast" maxlength="80" placeholder="Jina la mwisho"></div><div><label>Jina la kati</label><input id="newCompPlayerMiddle" maxlength="80" placeholder="Jina la kati"></div><div><label>Namba ya jezi</label><input id="newCompPlayerJersey" type="number" min="1" max="999" placeholder="Mfano: 10"></div><div style="grid-column:1/-1"><label>Nafasi ya mchezaji</label><input id="newCompPlayerPosition" maxlength="80" placeholder="Mfano: Mshambuliaji"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="small-btn event-primary" onclick="addCompetitionEventPlayer()">💾 Sajili na Chagua Mchezaji</button><button type="button" class="small-btn" onclick="toggleNewCompetitionPlayer(false)">Ghairi</button></div></div></div><div id="compEventPersonWrap" style="display:none"><label>Jina la kocha/shabiki (si lazima)</label><input id="compEventPerson" maxlength="160" placeholder="Jina si lazima"></div><div><label>Dakika (si lazima)</label><input id="compEventMinute" type="number" min="1" max="130" placeholder="Mfano: 67"></div><div><label>Maelezo (si lazima)</label><input id="compEventNotes" maxlength="500" placeholder="Maelezo au ushahidi"></div></div>';
 h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="small-btn event-primary" '+(finished?'':'disabled')+' onclick="saveCompetitionEvent(\''+esc(m.id)+'\')">💾 Hifadhi Kadi</button></div>';
 h+='<hr style="border:0;border-top:1px solid #e5eaf1;margin:16px 0"><h4 style="margin:0 0 8px">Matukio yaliyohifadhiwa kwenye mechi hii</h4><div id="compEventExisting">'+oldHtml+'</div></section></div>';
 document.body.insertAdjacentHTML("beforeend",h);updateCompetitionEventFields();
}
function toggleCompetitionOwnGoal(index){
 const own=document.querySelector('.compGoalOwnGoal[data-club]')&&[...document.querySelectorAll('.compGoalOwnGoal')].find(x=>String(x.getAttribute('onchange')||'').includes('('+index+')'));
 const checked=!!own?.checked,normal=document.getElementById('compGoalNormal_'+index),ownWrap=document.getElementById('compGoalOwnWrap_'+index);
 if(normal)normal.style.display=checked?'none':'block';
 if(ownWrap)ownWrap.style.display=checked?'block':'none';
}
async function saveCompetitionGoals(matchId){
 try{
  const m=matches.find(x=>String(x.id)===String(matchId));if(!m)throw new Error("Mechi haijapatikana.");
  if(!played(m.status))throw new Error("Kwanza weka hali ya mechi kuwa Finished.");
  const hs=Math.max(0,Number(m.home_score)||0),as=Math.max(0,Number(m.away_score)||0);
  if(hs===0&&as===0)throw new Error("Mechi ya 0 - 0 haina magoli ya kurekodi.");
  const goalRows=[...document.querySelectorAll(".compGoalRow")];
  if(goalRows.length!==hs+as)throw new Error("Idadi ya sehemu za magoli haiendani na matokeo.");
  const rows=[];
  goalRows.forEach((row)=>{
    const ownToggle=row.querySelector(".compGoalOwnGoal"),own=!!ownToggle?.checked;
    const clubId=ownToggle?.dataset.club||row.querySelector(".compGoalScorer")?.dataset.club;
    const scorerSel=row.querySelector(".compGoalScorer"),assistSel=row.querySelector(".compGoalAssist");
    if(own){
      const ownPlayerId=row.querySelector(".compOwnGoalPlayer")?.value||"";
      if(!ownPlayerId)throw new Error("Chagua mchezaji aliyejifunga.");
      const p=players.find(x=>String(x.id)===String(ownPlayerId));
      if(!p||String(p.club_id)!==String(ownToggle.dataset.opponent))throw new Error("Mchezaji aliyejifunga lazima awe wa timu pinzani.");
      rows.push({clubId,player:p,assist:null,ownGoal:true});
      return;
    }
    const playerId=scorerSel?.value||"",assistId=assistSel?.value||"";
    if(!playerId)throw new Error("Chagua mfungaji kwa kila goli.");
    const p=players.find(x=>String(x.id)===String(playerId));
    if(!p||String(p.club_id)!==String(clubId))throw new Error("Mfungaji lazima awe wa timu husika.");
    if(assistId&&assistId===playerId)throw new Error("Mfungaji hawezi kuwa assist wa goli lake mwenyewe.");
    let ap=null;
    if(assistId){ap=players.find(x=>String(x.id)===String(assistId));if(!ap||String(ap.club_id)!==String(clubId))throw new Error("Assist lazima awe mchezaji wa timu hiyo hiyo.");}
    rows.push({clubId,player:p,assist:ap,ownGoal:false});
  });
  const minuteText=(document.getElementById("compGoalMinutes")?.value||"").trim();
  const minutes=minuteText?minuteText.split(",").map(x=>x.trim()):[];
  if(minutes.some(x=>x&&!/^\d+$/.test(x)||x&&(+x<1||+x>130)))throw new Error("Dakika za goli lazima ziwe kati ya 1 na 130.");
  if(minutes.length&&minutes.length!==rows.length)throw new Error("Weka dakika moja kwa kila goli au acha sehemu ya dakika wazi.");
  const payload=[];
  rows.forEach((r,i)=>{
    const minute=minutes[i]?Number(minutes[i]):null;
    const who="Mchezaji: "+[r.player.first_name,r.player.middle_name,r.player.last_name].filter(Boolean).join(" ");
    if(r.ownGoal){
      payload.push({match_id:matchId,player_id:r.player.id,club_id:r.clubId,event_type:"own_goal",minute,description:[who,"Goli la kujifunga — limehesabiwa kwa timu pinzani","Imethibitishwa na msimamizi"].join(" | ")});
      return;
    }
    payload.push({match_id:matchId,player_id:r.player.id,club_id:r.clubId,event_type:"goal",minute,description:[who,"Imethibitishwa na msimamizi"].join(" | ")});
    if(r.assist)payload.push({match_id:matchId,player_id:r.assist.id,club_id:r.clubId,event_type:"assist",minute,description:["Assist kwa goli la "+[r.player.first_name,r.player.middle_name,r.player.last_name].filter(Boolean).join(" "),"Imethibitishwa na msimamizi"].join(" | ")});
  });
  const del=await db.from("match_events").delete().eq("match_id",matchId).in("event_type",["goal","assist","own_goal"]);
  if(del.error)throw del.error;
  const ins=await db.from("match_events").insert(payload);
  if(ins.error)throw ins.error;
  alert("✅ Magoli, magoli ya kujifunga na assist zimehifadhiwa kulingana na matokeo.");
  await load();openCompetitionEventEditor(matchId);
 }catch(e){console.error(e);alert("❌ Imeshindikana kuhifadhi wafungaji: "+e.message);}
}
function updateCompetitionEventPlayers(){
 const sel=document.getElementById("compEventPlayer"),club=document.getElementById("compEventClub");if(!sel||!club)return;
 const available=players.filter(p=>String(p.club_id)===String(club.value)&&String(p.status||"").toLowerCase()!=="inactive");
 sel.innerHTML='<option value="">Chagua mchezaji</option>'+available.map(p=>'<option value="'+esc(p.id)+'">'+esc([p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ")||"Mchezaji")+(p.jersey_number!=null?' · #'+esc(p.jersey_number):"")+'</option>').join("");
}
function toggleNewCompetitionPlayer(show){
 const box=document.getElementById("newCompetitionPlayerBox");if(!box)return;
 box.style.display=(show===false||box.style.display==="block")&&show!==true?"none":"block";
 if(box.style.display==="block")document.getElementById("newCompPlayerFirst")?.focus();
}
async function addCompetitionEventPlayer(){
 try{
  const clubId=document.getElementById("compEventClub")?.value||"";
  const first=document.getElementById("newCompPlayerFirst")?.value.trim()||"";
  const last=document.getElementById("newCompPlayerLast")?.value.trim()||"";
  const middle=document.getElementById("newCompPlayerMiddle")?.value.trim()||"";
  const jerseyText=document.getElementById("newCompPlayerJersey")?.value.trim()||"";
  const position=document.getElementById("newCompPlayerPosition")?.value.trim()||"";
  if(!clubId)throw new Error("Chagua timu kwanza.");
  if(!first||!last)throw new Error("Jaza jina la kwanza na jina la mwisho.");
  if(jerseyText&&(!Number.isInteger(Number(jerseyText))||Number(jerseyText)<1||Number(jerseyText)>999))throw new Error("Namba ya jezi iwe kati ya 1 na 999.");
  const payload={club_id:clubId,first_name:first,last_name:last};
  if(middle)payload.middle_name=middle;
  if(jerseyText)payload.jersey_number=Number(jerseyText);
  if(position)payload.position=position;
  const result=await db.from("players").insert(payload).select("id,club_id,first_name,middle_name,last_name,position,status,date_of_birth,jersey_number").single();
  if(result.error)throw result.error;
  players.push(result.data);
  players.sort((a,b)=>String(a.first_name||"").localeCompare(String(b.first_name||"")));
  updateCompetitionEventPlayers();
  const sel=document.getElementById("compEventPlayer");if(sel)sel.value=String(result.data.id);
  ["newCompPlayerFirst","newCompPlayerLast","newCompPlayerMiddle","newCompPlayerJersey","newCompPlayerPosition"].forEach(id=>{const el=document.getElementById(id);if(el)el.value=""});
  const box=document.getElementById("newCompetitionPlayerBox");if(box)box.style.display="none";
  alert("✅ Mchezaji amesajiliwa kwenye timu na amechaguliwa kwa tukio hili.");
 }catch(e){console.error(e);alert("❌ Imeshindikana kusajili mchezaji: "+(e.message||e));}
}
async function saveCompetitionEvent(matchId){
 try{
  const m=matches.find(x=>String(x.id)===String(matchId));if(!m)throw new Error("Mechi haijapatikana.");
  if(!played(m.status))throw new Error("Kwanza weka hali ya mechi kuwa Finished.");
  const type=document.getElementById("compEventType").value,clubId=document.getElementById("compEventClub").value;
  const playerId=document.getElementById("compEventPlayer")?.value||"",personName=document.getElementById("compEventPerson")?.value.trim()||"";
  const minuteText=document.getElementById("compEventMinute").value,notes=document.getElementById("compEventNotes").value.trim();
  if(!clubId)throw new Error("Chagua timu.");
  if(![String(m.home_team_id),String(m.away_team_id)].includes(String(clubId)))throw new Error("Timu hiyo si sehemu ya mechi hii.");
  if(minuteText&&(!Number.isInteger(Number(minuteText))||Number(minuteText)<1||Number(minuteText)>130))throw new Error("Dakika lazima iwe kati ya 1 na 130.");
  let player=null;
  if(!eventIsPerson(type)){if(!playerId)throw new Error("Chagua mchezaji.");player=players.find(p=>String(p.id)===String(playerId));if(!player||String(player.club_id)!==String(clubId))throw new Error("Mchezaji si wa timu uliyochagua.");}
  if(personName.length>160)throw new Error("Jina limezidi herufi 160.");
  const playerName=player?[player.first_name,player.middle_name,player.last_name].filter(Boolean).join(" "):"";
  const who=eventIsPerson(type)?((type.startsWith("coach_")?"Kadi kwa kocha":"Kadi kwa shabiki")+(personName?" — "+personName:"")):("Mchezaji: "+playerName+(player?.jersey_number!=null?" | Namba ya jezi: "+player.jersey_number:""));
  const eventMinute=minuteText?Number(minuteText):null;
  const eventDescription=[notes,who,"Imethibitishwa na msimamizi"].filter(Boolean).join(" | ");
  // Zuia kuhifadhi tukio lilelile mara mbili, hasa kubofya Hifadhi mara nyingi.
  const duplicateQuery=db.from("match_events").select("id").eq("match_id",matchId).eq("club_id",clubId).eq("event_type",type);
  if(player?.id)duplicateQuery.eq("player_id",player.id);else duplicateQuery.is("player_id",null);
  if(eventMinute===null)duplicateQuery.is("minute",null);else duplicateQuery.eq("minute",eventMinute);
  duplicateQuery.eq("description",eventDescription);
  const duplicateCheck=await duplicateQuery.limit(1);
  if(duplicateCheck.error)throw duplicateCheck.error;
  if(duplicateCheck.data?.length)throw new Error("Tukio hili tayari limehifadhiwa kwenye mechi hii. Hakuna haja ya kuliongeza tena.");
  const result=await db.from("match_events").insert({match_id:matchId,player_id:player?.id||null,club_id:clubId,event_type:type,minute:eventMinute,description:eventDescription});
  if(result.error)throw result.error;
  alert("✅ "+eventTypeLabel(type)+" limehifadhiwa.");await load();openCompetitionEventEditor(matchId);
 }catch(e){console.error(e);alert("❌ Imeshindikana kuhifadhi tukio: "+e.message);}
}
