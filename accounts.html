<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFRN — Account Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#edf4ff}.n{font-size:28px;font-weight:900}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:9px;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:9px;background:#0d47a1;color:#fff;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.danger{background:#b42318}.secondary{background:#667085}.test{background:#344054}.edit{background:#7c3aed}.row{border:1px solid #e1e7ef;border-radius:12px;padding:14px;margin-top:10px}.muted{color:#667085;font-size:13px}.msg{padding:11px;border-radius:9px;margin:10px 0}.ok{background:#ecfdf3;color:#027a48}.err{background:#fff0f0;color:#b42318}.status{font-size:13px;margin-top:8px;white-space:pre-wrap}.loading{background:#fff8e6;color:#9a6700}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalBox{background:#fff;border-radius:15px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalActions{margin-top:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>⚽ AFRN FOOTBALL MANAGEMENT</strong><div>Account Management — Super Admin</div></header>
<main>
<div id="msg" style="display:none"></div>
<section class="grid">
<div class="stat">👑 Super Admin<div class="n" id="superCount">—/1</div></div>
<div class="stat">🏢 Admin AFRN<div class="n" id="adminCount">—/2</div></div>
<div class="stat">⚽ Club Accounts<div class="n" id="clubCount">—</div></div>
</section>
<section class="card">
<h2>➕ Tengeneza Account</h2>
<button type="button" class="test" id="testBtn">🔌 Test Edge Function</button>
<div id="testStatus" class="status loading">⏳ Inasubiri test...</div>
<form id="form">
<label>Jina kamili</label><input id="name" required>
<label>Email</label><input id="email" type="email" required>
<label>Password</label><input id="password" type="password" minlength="8" required>
<label>Aina ya Account</label>
<select id="role"><option value="afrn_admin">Admin AFRN</option><option value="club_admin">Account ya Klabu</option></select>
<div id="clubWrap" style="display:none"><label>Klabu</label><select id="club"></select></div>
<button id="createBtn" type="submit">➕ Tengeneza Account</button>
</form>
</section>
<section class="card"><h2>👥 Accounts</h2><div id="list"><div class="msg loading">⏳ Inapakia Accounts...</div></div></section>
</main>
<div class="modal" id="editModal">
  <div class="modalBox">
    <h2>✏️ Hariri Account</h2>
    <div id="editMsg" class="msg err" style="display:none"></div>
    <input type="hidden" id="editId">
    <label>Jina kamili</label><input id="editName" required>
    <label>Aina ya Account</label>
    <select id="editRole"><option value="afrn_admin">Admin AFRN</option><option value="club_admin">Account ya Klabu</option></select>
    <div id="editClubWrap" style="display:none"><label>Klabu</label><select id="editClub"></select></div>
    <div class="modalActions">
      <button type="button" class="secondary" onclick="closeEdit()">Ghairi</button>
      <button type="button" class="edit" id="saveEditBtn">💾 Hifadhi Mabadiliko</button>
    </div>
  </div>
</div>
<script>
(function(){'use strict';
const URL='https://jjqhvruppafpumcthmwe.supabase.co';
const KEY='sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G';
const c=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), norm=x=>String(x||'').toLowerCase().replace(/[ -]/g,'_');
const esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
function show(t,ok=false){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block'}
function clearMsg(){const m=$('msg');m.textContent='';m.style.display='none';m.className=''}
function timeout(ms){return new Promise((_,r)=>setTimeout(()=>r(new Error('Timeout: muunganisho umechukua zaidi ya sekunde 15.')),ms))}
async function safe(p){return Promise.race([p,timeout(15000)])}
async function token(){const {data,error}=await safe(c.auth.getSession());if(error)throw new Error('Session: '+error.message);const t=data?.session?.access_token;if(!t)throw new Error('Hujalogin au session imekwisha. Rudi Login kisha ingia tena.');return t}
async function identity(){const t=await token();const {data,error}=await safe(c.auth.getUser(t));if(error||!data?.user)throw new Error('Session si halali. Ingia tena.');const p=await safe(c.from('profiles').select('id,full_name,role,club_id').eq('id',data.user.id).maybeSingle());if(p.error)throw new Error('Profile: '+p.error.message);if(!p.data)throw new Error('Profile ya Super Admin haijapatikana.');if(norm(p.data.role)!=='super_admin')throw new Error('Account hii si Super Admin.');return{user:data.user,profile:p.data}}
async function edge(fn,body){await token();const {data,error}=await safe(c.functions.invoke(fn,{body:body||{}}));if(error){let msg=error.message||String(error);if(error.context?.status)msg+=' (HTTP '+error.context.status+')';throw new Error(msg)}if(data?.error)throw new Error(data.error);return data||{}}
async function health(){const r=await safe(fetch(URL+'/functions/v1/afrn-create-account',{method:'GET',headers:{apikey:KEY,'x-client-info':'afrn-account-management'}}));let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d||{}}
async function loadClubs(target='club'){const r=await safe(c.from('clubs').select('id,name,afrn_club_id').order('name'));if(r.error)throw new Error('Clubs: '+r.error.message);$(target).innerHTML=(r.data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.afrn_club_id||'')}</option>`).join('');return r.data||[]}
let accounts=[];
async function load(){clearMsg();const list=$('list');list.innerHTML='<div class="msg loading">⏳ Inapakia Accounts...</div>';try{await identity();const d=await edge('afrn-list-accounts',{});const a=Array.isArray(d.accounts)?d.accounts:(Array.isArray(d.data)?d.data:[]);accounts=a;$('superCount').textContent=a.filter(x=>norm(x.role)==='super_admin').length+'/1';$('adminCount').textContent=a.filter(x=>norm(x.role)==='afrn_admin').length+'/2';$('clubCount').textContent=a.filter(x=>norm(x.role)==='club_admin').length;list.innerHTML=a.map(x=>`<div class="row"><b>${esc(x.full_name||'—')}</b><br><span class="muted">${esc(x.email||'Email haionyeshwi kwenye profile')} · ${esc(x.role||'—')}${x.club_name?' · '+esc(x.club_name):''}</span><br>${norm(x.role)!=='super_admin'?`<button class="edit" onclick="editAccount('${esc(x.id)}')">✏️ Hariri</button><button class="secondary" onclick="resetAccount('${esc(x.id)}')">🔑 Reset Password</button><button class="danger" onclick="deleteAccount('${esc(x.id)}')">🗑️ Futa</button>`:'<small>👑 Akaunti kuu</small>'}</div>`).join('')||'<p>Hakuna accounts.</p>';}catch(e){list.innerHTML=`<div class="msg err">❌ ${esc(e.message||e)}</div><button class="secondary" onclick="load()">🔄 Jaribu tena</button>`;show('❌ '+(e.message||e))}}
$('testBtn').onclick=async()=>{const b=$('testBtn');b.disabled=true;b.textContent='⏳ Inapima...';$('testStatus').className='status loading';$('testStatus').textContent='⏳ Inawasiliana...';try{const d=await health();$('testStatus').className='status';$('testStatus').textContent='✅ INAFANYA KAZI\nStatus: '+(d.status||'ACTIVE')+'\nVersion: '+(d.version||'?');clearMsg()}catch(e){$('testStatus').className='status err';$('testStatus').textContent='❌ HAIJAFIKIWA\n'+e.message;show('❌ '+e.message)}finally{b.disabled=false;b.textContent='🔌 Test Edge Function'}};
async function toggleRole(roleId,clubWrapId,clubId){const isClub=$(roleId).value==='club_admin';$(clubWrapId).style.display=isClub?'block':'none';$(clubId).required=isClub;if(isClub&&!$(clubId).options.length)await loadClubs(clubId)}
$('role').onchange=async()=>{try{await toggleRole('role','clubWrap','club')}catch(e){show('❌ '+e.message)}};
$('form').onsubmit=async e=>{e.preventDefault();const b=$('createBtn');b.disabled=true;b.textContent='⏳ Inatengeneza...';clearMsg();try{const role=$('role').value,d={full_name:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value,role};if(role==='club_admin'){d.club_id=$('club').value;if(!d.club_id)throw new Error('Chagua klabu kwanza.')}await edge('afrn-create-account',d);show('✅ Account imetengenezwa kikamilifu.',true);e.target.reset();$('clubWrap').style.display='none';$('club').required=false;await load()}catch(x){show('❌ '+(x.message||x))}finally{b.disabled=false;b.textContent='➕ Tengeneza Account'}};
window.editAccount=async id=>{try{const a=accounts.find(x=>String(x.id)===String(id));if(!a)throw new Error('Account haijapatikana.');if(norm(a.role)==='super_admin')throw new Error('Akaunti kuu ya Super Admin haiwezi kuhaririwa hapa.');$('editId').value=a.id;$('editName').value=a.full_name||'';$('editRole').value=norm(a.role)==='club_admin'?'club_admin':'afrn_admin';$('editClub').innerHTML='';await loadClubs('editClub');$('editClub').value=a.club_id||'';await toggleRole('editRole','editClubWrap','editClub');$('editMsg').style.display='none';$('editModal').style.display='flex'}catch(e){show('❌ '+e.message)}};
window.closeEdit=()=>{$('editModal').style.display='none'};
$('editRole').onchange=async()=>{try{await toggleRole('editRole','editClubWrap','editClub')}catch(e){$('editMsg').textContent='❌ '+e.message;$('editMsg').style.display='block'}};
$('saveEditBtn').onclick=async()=>{const b=$('saveEditBtn');const id=$('editId').value;const role=$('editRole').value;const name=$('editName').value.trim();const club_id=role==='club_admin'?$('editClub').value:null;if(!name)return alert('Weka jina kamili.');if(role==='club_admin'&&!club_id)return alert('Chagua klabu kwanza.');b.disabled=true;b.textContent='⏳ Inahifadhi...';$('editMsg').style.display='none';try{await edge('afrn-update-account',{user_id:id,full_name:name,role,club_id});closeEdit();show('✅ Account imehaririwa kikamilifu.',true);await load()}catch(e){$('editMsg').textContent='❌ '+e.message;$('editMsg').style.display='block'}finally{b.disabled=false;b.textContent='💾 Hifadhi Mabadiliko'}};
window.resetAccount=async id=>{const p=prompt('Weka password mpya (angalau herufi 8):');if(!p)return;if(p.length<8)return alert('Password iwe angalau herufi 8.');try{await edge('afrn-reset-account',{user_id:id,password:p});show('✅ Password imebadilishwa.',true);await load()}catch(e){show('❌ '+e.message)}};
window.deleteAccount=async id=>{if(!confirm('Futa account hii? Hatua hii haiwezi kurudishwa.'))return;try{await edge('afrn-delete-account',{user_id:id});show('✅ Account imefutwa.',true);await load()}catch(e){show('❌ '+e.message)}};
(async()=>{clearMsg();try{await identity();await loadClubs();await load()}catch(e){$('list').innerHTML=`<div class="msg err">❌ ${esc(e.message||e)}</div><button class="secondary" onclick="location.reload()">🔄 Reload</button>`;show('❌ '+(e.message||e))}})();
})();
</script>
</body></html>
