<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Account Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#edf4ff}.n{font-size:28px;font-weight:900}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:9px;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:9px;background:#0d47a1;color:#fff;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.danger{background:#b42318}.secondary{background:#667085}.row{border:1px solid #e1e7ef;border-radius:12px;padding:14px;margin-top:10px}.muted{color:#667085;font-size:13px}.msg{padding:11px;border-radius:9px;margin:10px 0}.ok{background:#ecfdf3;color:#027a48}.err{background:#fff0f0;color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>⚽ AFRN FOOTBALL MANAGEMENT</strong><div>Account Management — Super Admin</div></header><main><div id="msg" style="display:none"></div><section class="grid"><div class="stat">👑 Super Admin<div class="n" id="superCount">0/1</div></div><div class="stat">🏢 Admin AFRN<div class="n" id="adminCount">0/2</div></div><div class="stat">⚽ Club Accounts<div class="n" id="clubCount">0</div></div></section><section class="card"><h2>➕ Tengeneza Account</h2><form id="form"><label>Jina kamili</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><label>Aina ya Account</label><select id="role"><option value="afrn_admin">Admin AFRN</option><option value="club_admin">Account ya Klabu</option></select><div id="clubWrap" style="display:none"><label>Klabu</label><select id="club"></select></div><button id="createBtn" type="submit">➕ Tengeneza Account</button></form></section><section class="card"><h2>👥 Accounts</h2><div id="list">Inapakia...</div></section></main><script>
const c=window.supabaseClient,$=id=>document.getElementById(id);function norm(r){return String(r||'').toLowerCase().replace(/[ -]/g,'_')}function show(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');$('msg').style.display='block'}function wait(p,ms=25000){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Muunganisho umechukua muda mrefu. Jaribu tena.')),ms))])}
async function me(){const a=await wait(c.auth.getUser());if(a.error||!a.data.user){location.href='login.html';return null}const p=await wait(c.from('profiles').select('*').eq('id',a.data.user.id).maybeSingle());if(p.error)throw p.error;if(!p.data||norm(p.data.role)!=='super_admin'){location.href='index.html';return null}return {user:a.data.user,profile:p.data}}
async function call(fn,body){const r=await wait(c.functions.invoke(fn,{body:body||{}}));if(r.error){let msg=r.error.message||'Edge Function error';if(r.error.context){try{const d=await r.error.context.json();msg=d.error||msg}catch(_){}}throw new Error(msg)}if(r.data?.error)throw new Error(r.data.error);return r.data}
async function loadClubs(){const r=await wait(c.from('clubs').select('id,name,afrn_club_id').order('name'));if(r.error)throw r.error;$('club').innerHTML=(r.data||[]).map(x=>`<option value="${x.id}">${x.name} — ${x.afrn_club_id||''}</option>`).join('')}
async function load(){try{await me();const r=await wait(c.from('profiles').select('id,full_name,phone,role,club_id,created_at').order('created_at'));if(r.error)throw r.error;const cr=await wait(c.from('clubs').select('id,name,afrn_club_id'));if(cr.error)throw cr.error;const cm=new Map((cr.data||[]).map(x=>[String(x.id),x]));const a=r.data||[];$('superCount').textContent=a.filter(x=>norm(x.role)==='super_admin').length+'/1';$('adminCount').textContent=a.filter(x=>norm(x.role)==='afrn_admin').length+'/2';$('clubCount').textContent=a.filter(x=>norm(x.role)==='club_admin').length;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));$('list').innerHTML=a.map(x=>`<div class="row"><b>${esc(x.full_name||'—')}</b><br><span class="muted">${esc(x.phone||'Email haionyeshwi kwenye profile')} · ${esc(x.role||'—')}${cm.get(String(x.club_id||''))?' · '+esc(cm.get(String(x.club_id)).name):''}</span><br>${norm(x.role)!=='super_admin'?`<button class="secondary" onclick="resetAccount('${x.id}')">🔑 Reset Password</button><button class="danger" onclick="deleteAccount('${x.id}')">🗑️ Futa</button>`:'<small>👑 Akaunti kuu</small>'}</div>`).join('')||'<p>Hakuna accounts.</p>'}catch(e){$('list').innerHTML='<div class="msg err">❌ '+(e.message||e)+'</div><button class="secondary" onclick="load()">🔄 Jaribu tena</button>'}}
$('role').onchange=()=>{const x=$('role').value==='club_admin';$('clubWrap').style.display=x?'block':'none';$('club').required=x};
$('form').onsubmit=async e=>{e.preventDefault();const b=$('createBtn');b.disabled=true;b.textContent='⏳ Inatengeneza...';try{const role=$('role').value,d={full_name:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value,role};if(role==='club_admin')d.club_id=$('club').value;if(role==='club_admin'&&!d.club_id)throw new Error('Chagua klabu kwanza.');await call('afrn-create-account',d);show('✅ Account imetengenezwa kikamilifu. Email inaweza kutumika kuingia bila namba ya simu.',true);e.target.reset();$('clubWrap').style.display='none';$('club').required=false;await load()}catch(x){show('❌ '+(x.message||x))}finally{b.disabled=false;b.textContent='➕ Tengeneza Account'}};
window.resetAccount=async id=>{const p=prompt('Weka password mpya (angalau herufi 8):');if(!p)return;try{await call('afrn-reset-account',{user_id:id,password:p});show('✅ Password imebadilishwa.',true);await load()}catch(e){show('❌ '+(e.message||e))}};window.deleteAccount=async id=>{if(!confirm('Futa account hii? Hatua hii haiwezi kurudishwa.'))return;try{await call('afrn-delete-account',{user_id:id});show('✅ Account imefutwa.',true);await load()}catch(e){show('❌ '+(e.message||e))}};
(async()=>{try{await me();await loadClubs();await load()}catch(e){show('❌ '+(e.message||e));$('list').textContent='Imeshindwa kupakia Accounts.'}})();
</script></body></html>
