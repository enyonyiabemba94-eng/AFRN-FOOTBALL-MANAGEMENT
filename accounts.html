<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Account Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#edf4ff}.n{font-size:28px;font-weight:900}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:9px;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:9px;background:#0d47a1;color:#fff;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.danger{background:#b42318}.secondary{background:#667085}.success{background:#16803c}.row{border:1px solid #e1e7ef;border-radius:12px;padding:14px;margin-top:10px}.muted{color:#667085;font-size:13px}.msg{padding:11px;border-radius:9px;margin:10px 0;display:none}.ok{background:#ecfdf3;color:#027a48}.err{background:#fff0f0;color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>⚽ AFRN FOOTBALL MANAGEMENT</strong><div>Account Management — Super Admin</div></header><main><div id="msg" class="msg"></div><section class="grid"><div class="stat">👑 Super Admin<div class="n" id="superCount">0/1</div></div><div class="stat">🏢 Admin AFRN<div class="n" id="adminCount">0/2</div></div><div class="stat">⚽ Club Accounts<div class="n" id="clubCount">0</div></div></section><section class="card"><h2>➕ Tengeneza Account</h2><form id="form"><label>Jina kamili</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><label>Aina ya Account</label><select id="role"><option value="afrn_admin">Admin AFRN</option><option value="club_admin">Account ya Klabu</option></select><div id="clubWrap" style="display:none"><label>Klabu</label><select id="club"></select></div><button>➕ Tengeneza Account</button></form></section><section class="card"><h2>👥 Accounts</h2><div id="list">Inapakia...</div></section></main><script>const c=window.supabaseClient,msg=document.getElementById('msg');let clubs=[];function show(t,ok=false){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}function norm(r){return String(r||'').toLowerCase().replace(/[ -]/g,'_')}async function profile(){const {data:{user}}=await c.auth.getUser();if(!user){location.href='login.html';return null}const {data:p}=await c.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p||norm(p.role)!=='super_admin'){location.href='index.html';return null}return p}async function call(fn,body){const r=await c.functions.invoke(fn,{body});if(r.error)throw r.error;const d=r.data||{};if(d.error)throw new Error(d.error);return d}async function load(){try{const p=await profile();if(!p)return;const d=await call('afrn-list-accounts',{});const a=Array.isArray(d)?d:(Array.isArray(d.accounts)?d.accounts:(Array.isArray(d.data)?d.data:[]));const s=a.filter(x=>norm(x.role)==='super_admin').length,ad=a.filter(x=>norm(x.role)==='afrn_admin').length,cl=a.filter(x=>norm(x.role)==='club_admin').length;document.getElementById('superCount').textContent=s+'/1';document.getElementById('adminCount').textContent=ad+'/2';document.getElementById('clubCount').textContent=cl;document.getElementById('list').innerHTML=a.map(x=>`<div class="row"><b>${x.full_name||'—'}</b><br><span class="muted">${x.email||x.phone||'—'} · ${x.role||'—'}${x.club_name?' · '+x.club_name:''}</span><br>${norm(x.role)!=='super_admin'?`<button class="secondary" onclick="reset('${x.id}')">🔑 Reset Password</button><button class="danger" onclick="del('${x.id}')">🗑️ Futa</button>`:'<small>👑 Akaunti kuu</small>'}</div>`).join('')||'<p>Hakuna accounts.</p>'}catch(e){show('❌ '+(e.message||e))}}document.getElementById('role').onchange=()=>document.getElementById('clubWrap').style.display=document.getElementById('role').value==='club_admin'?'block':'none';async function clubsLoad(){const r=await c.from('clubs').select('id,name,afrn_club_id').order('name');if(r.error){show('❌ Imeshindwa kupakia klabu: '+r.error.message);return}clubs=r.data||[];document.getElementById('club').innerHTML=clubs.map(x=>`<option value="${x.id}">${x.name} — ${x.afrn_club_id||''}</option>`).join('')}document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const role=document.getElementById('role').value;const d={full_name:name.value.trim(),email:email.value.trim(),password:password.value,role};if(role==='club_admin')d.club_id=club.value;await call('afrn-create-account',d);show('✅ Account imetengenezwa.',true);e.target.reset();document.getElementById('clubWrap').style.display='none';await load()}catch(x){show('❌ '+(x.message||x))}}async function reset(id){const p=prompt('Weka password mpya (angalau herufi 8):');if(!p)return;try{await call('afrn-reset-account',{user_id:id,password:p});show('✅ Password imebadilishwa.',true)}catch(e){show('❌ '+(e.message||e))}}async function del(id){if(!confirm('Futa account hii? Hatua hii haiwezi kurudishwa.'))return;try{await call('afrn-delete-account',{user_id:id});show('✅ Account imefutwa.',true);await load()}catch(e){show('❌ '+(e.message||e))}}(async()=>{await profile();await clubsLoad();await load()})();</script></body></html>
