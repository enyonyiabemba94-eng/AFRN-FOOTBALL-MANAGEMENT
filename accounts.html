<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Account Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#071a33;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#edf4ff}.n{font-size:28px;font-weight:900}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:9px;box-sizing:border-box}button{display:inline-block;padding:11px 14px;border:0;border-radius:9px;background:#0d47a1;color:#fff;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.danger{background:#b42318}.secondary{background:#667085}.test{background:#344054}.row{border:1px solid #e1e7ef;border-radius:12px;padding:14px;margin-top:10px}.muted{color:#667085;font-size:13px}.msg{padding:11px;border-radius:9px;margin:10px 0}.ok{background:#ecfdf3;color:#027a48}.err{background:#fff0f0;color:#b42318}.status{font-size:13px;margin-top:8px;white-space:pre-wrap}.loading{background:#fff8e6;color:#9a6700}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>⚽ AFRN FOOTBALL MANAGEMENT</strong><div>Account Management — Super Admin</div></header><main><div id="msg" style="display:none"></div><section class="grid"><div class="stat">👑 Super Admin<div class="n" id="superCount">—/1</div></div><div class="stat">🏢 Admin AFRN<div class="n" id="adminCount">—/2</div></div><div class="stat">⚽ Club Accounts<div class="n" id="clubCount">—</div></div></section><section class="card"><h2>➕ Tengeneza Account</h2><button type="button" class="test" id="testBtn">🔌 Test Edge Function</button><div id="testStatus" class="status loading">⏳ Inasubiri test...</div><form id="form"><label>Jina kamili</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><label>Aina ya Account</label><select id="role"><option value="afrn_admin">Admin AFRN</option><option value="club_admin">Account ya Klabu</option></select><div id="clubWrap" style="display:none"><label>Klabu</label><select id="club"></select></div><button id="createBtn" type="submit">➕ Tengeneza Account</button></form></section><section class="card"><h2>👥 Accounts</h2><div id="list"><div class="msg loading">⏳ Inapakia Accounts...</div></div></section></main><script>
(function(){'use strict';
const c=window.supabaseClient,$=id=>document.getElementById(id);
/* These are the same public browser credentials already used by supabase-config.js. */
const SUPABASE_URL='https://jjqhvruppafpumcthmwe.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G';
function norm(r){return String(r||'').toLowerCase().replace(/[ -]/g,'_')}
function show(t,ok=false){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block'}
function wait(p,ms=15000){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Timeout: muunganisho umechukua zaidi ya sekunde 15.')),ms))])}
async function getIdentity(){if(!c)throw new Error('Supabase client haijaanzishwa.');const s=await wait(c.auth.getSession());const user=s?.data?.session?.user;if(!user)throw new Error('Hujalogin au session imekwisha. Rudi Login kisha ingia tena.');const p=await wait(c.from('profiles').select('id,full_name,role,club_id').eq('id',user.id).maybeSingle());if(p.error)throw new Error('Profile: '+p.error.message);if(!p.data)throw new Error('Profile ya Super Admin haijapatikana.');if(norm(p.data.role)!=='super_admin')throw new Error('Account hii si Super Admin.');return{user,profile:p.data}}
async function edgeHealth(){const u=SUPABASE_URL+'/functions/v1/afrn-create-account?forceFunctionRegion=eu-west-1';const r=await wait(fetch(u,{method:'GET',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'x-client-info':'afrn-account-management'}}));let d=null;try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d?.error||('HTTP '+r.status));return d}
async function call(fn,body){const s=await wait(c.auth.getSession());const token=s?.data?.session?.access_token;if(!token)throw new Error('Hujalogin.');const u=SUPABASE_URL+'/functions/v1/'+fn+'?forceFunctionRegion=eu-west-1';const r=await wait(fetch(u,{method:'POST',headers:{Authorization:'Bearer '+token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json','x-client-info':'afrn-account-management'},body:JSON.stringify(body||{})}));let d=null;try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d?.error||('Edge Function HTTP '+r.status));if(d?.error)throw new Error(d.error);return d}
async function loadClubs(){const r=await wait(c.from('clubs').select('id,name,afrn_club_id').order('name'));if(r.error)throw r.error;$('club').innerHTML=(r.data||[]).map(x=>'<option value="'+x.id+'">'+String(x.name).replace(/</g,'&lt;')+' — '+String(x.afrn_club_id||'')+'</option>').join('')}
async function load(){const list=$('list');list.innerHTML='<div class="msg loading">⏳ Inapakia Accounts...</div>';try{await getIdentity();const r=await wait(c.from('profiles').select('id,full_name,phone,role,club_id,created_at').order('created_at'));if(r.error)throw new Error('Profiles: '+r.error.message);const cr=await wait(c.from('clubs').select('id,name,afrn_club_id'));if(cr.error)throw cr.error;const cm=new Map((cr.data||[]).map(x=>[String(x.id),x]));const a=r.data||[];$('superCount').textContent=a.filter(x=>norm(x.role)==='super_admin').length+'/1';$('adminCount').textContent=a.filter(x=>norm(x.role)==='afrn_admin').length+'/2';$('clubCount').textContent=a.filter(x=>norm(x.role)==='club_admin').length;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));list.innerHTML=a.map(x=>'<div class="row"><b>'+esc(x.full_name||'—')+'</b><br><span class="muted">'+esc(x.phone||'Email haionyeshwi kwenye profile')+' · '+esc(x.role||'—')+(cm.get(String(x.club_id||''))?' · '+esc(cm.get(String(x.club_id)).name):'')+'</span><br>'+(norm(x.role)!=='super_admin'?'<button class="secondary" onclick="resetAccount(\''+x.id+'\')">🔑 Reset Password</button><button class="danger" onclick="deleteAccount(\''+x.id+'\')">🗑️ Futa</button>':'<small>👑 Akaunti kuu</small>')+'</div>').join('')||'<p>Hakuna accounts.</p>'}catch(e){list.innerHTML='<div class="msg err">❌ '+String(e.message||e)+'</div><button class="secondary" onclick="load()">🔄 Jaribu tena</button>';show('❌ '+String(e.message||e))}}
$('testBtn').onclick=async function(){const b=this;b.disabled=true;b.textContent='⏳ Inapima...';$('testStatus').className='status loading';$('testStatus').textContent='⏳ Inawasiliana...';try{const d=await edgeHealth();$('testStatus').className='status';$('testStatus').textContent='✅ INAFANYA KAZI\nStatus: '+(d?.status||'ACTIVE')+'\nVersion: '+(d?.version||'?');show('✅ Edge Function inapatikana.',true)}catch(e){$('testStatus').className='status err';$('testStatus').textContent='❌ HAIJAFIKIWA\n'+(e.message||e);show('❌ Edge Function: '+(e.message||e))}finally{b.disabled=false;b.textContent='🔌 Test Edge Function'}};
$('role').onchange=function(){const x=$('role').value==='club_admin';$('clubWrap').style.display=x?'block':'none';$('club').required=x};
$('form').onsubmit=async function(e){e.preventDefault();const b=$('createBtn');b.disabled=true;b.textContent='⏳ Inatengeneza...';try{const role=$('role').value,d={full_name:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value,role};if(role==='club_admin')d.club_id=$('club').value;if(role==='club_admin'&&!d.club_id)throw new Error('Chagua klabu kwanza.');await call('afrn-create-account',d);show('✅ Account imetengenezwa kikamilifu.',true);this.reset();$('clubWrap').style.display='none';$('club').required=false;await load()}catch(x){show('❌ '+(x.message||x))}finally{b.disabled=false;b.textContent='➕ Tengeneza Account'}};
window.resetAccount=async function(id){const p=prompt('Weka password mpya (angalau herufi 8):');if(!p)return;try{await call('afrn-reset-account',{user_id:id,password:p});show('✅ Password imebadilishwa.',true);await load()}catch(e){show('❌ '+(e.message||e))}};
window.deleteAccount=async function(id){if(!confirm('Futa account hii? Hatua hii haiwezi kurudishwa.'))return;try{await call('afrn-delete-account',{user_id:id});show('✅ Account imefutwa.',true);await load()}catch(e){show('❌ '+(e.message||e))}};
(async function(){try{await getIdentity();await loadClubs();await load()}catch(e){$('list').innerHTML='<div class="msg err">❌ '+String(e.message||e)+'</div><button class="secondary" onclick="location.reload()">🔄 Reload</button>';show('❌ '+String(e.message||e))}})();
})();
</script></body></html>
