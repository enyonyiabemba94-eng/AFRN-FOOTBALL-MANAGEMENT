<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN - Club Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><style>body{margin:0;background:#f4f7fb;font-family:Arial;color:#172033}main{max-width:760px;margin:auto;padding:14px}.back{border:0;background:#fff;padding:10px 13px;border-radius:11px;font-weight:800}.hero{margin-top:12px;background:linear-gradient(135deg,#06152b,#0d47a1);color:#fff;border-radius:20px;padding:20px;display:flex;align-items:center;gap:14px}.logo{width:78px;height:78px;object-fit:contain;background:#fff;border-radius:16px}.title{font-size:21px;font-weight:900}.muted{opacity:.8;font-size:11px;margin-top:4px}.section{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 3px 12px #14213d10}.section h3{margin:0 0 10px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#f7f9fc;border-radius:10px;padding:10px;font-size:12px}.item b{display:block;color:#667085;font-size:10px;margin-bottom:3px}@media(max-width:520px){.title{font-size:18px}}</style></head><body><main><button class="back" onclick="history.length>1?history.back():location.href='./clubs.html'">← Rudi</button><div id="app"><div class="section">⏳ Inapakia klabu...</div></div></main><script>const db=window.supabaseClient||window.db,id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){if(!db||!id)return;const {data:c,error}=await db.from('clubs').select('*').eq('id',id).maybeSingle();if(error||!c){app.innerHTML='<div class="section">❌ Klabu haikupatikana.</div>';return}app.innerHTML=`<div class="hero">${c.logo_url?`<img class="logo" src="${esc(c.logo_url)}">`:'<div class="logo" style="display:grid;place-items:center;font-size:35px">⚽</div>'}<div><div class="title">${esc(c.name)}</div><div class="muted">AFRN Club ID: ${esc(c.afrn_club_id||c.club_code||'—')}</div><div class="muted">${esc(c.division||'—')} · ${esc(c.status||'—')}</div></div></div><div class="section"><h3>🖼️ Logo ya Klabu</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input id="logoFile" type="file" accept="image/*" style="flex:1;min-width:220px;padding:10px;border:1px solid #d9e1ec;border-radius:10px;background:#fff"><button id="saveLogo" style="border:0;border-radius:10px;padding:11px 14px;font-weight:800;background:#0d47a1;color:#fff">Hifadhi Logo</button></div><div style="margin-top:10px;text-align:center"><img id="logoPreview" src="" alt="Logo preview" style="display:none;width:90px;height:90px;object-fit:contain;border-radius:14px;background:#f7f9fc;padding:6px"></div><div id="logoMsg" style="margin-top:8px;font-size:12px"></div></div><div class="section"><h3>🏛️ Taarifa Rasmi za Klabu</h3><div class="grid"><div class="item"><b>Division</b>${esc(c.division||'—')}</div><div class="item"><b>Zone</b>${esc(c.zone||'—')}</div><div class="item"><b>Mwaka wa kuanzishwa</b>${esc(c.founded_year||'—')}</div><div class="item"><b>AFRN Club ID</b>${esc(c.afrn_club_id||'—')}</div><div class="item"><b>Simu</b>${esc(c.phone||'—')}</div><div class="item"><b>Email</b>${esc(c.email||c.mail||'—')}</div></div></div>`;const logoFile=document.getElementById("logoFile"),logoPreview=document.getElementById("logoPreview"),saveLogo=document.getElementById("saveLogo");if(c.logo_url){logoPreview.src=c.logo_url;logoPreview.style.display="inline-block"}if(logoFile)logoFile.onchange=()=>{const f=logoFile.files&&logoFile.files[0];if(!f)return;if(!f.type.startsWith("image/")){logoFile.value="";return}const u=URL.createObjectURL(f);logoPreview.src=u;logoPreview.style.display="inline-block"};if(saveLogo)saveLogo.onclick=async()=>{const msg=document.getElementById("logoMsg"),f=logoFile.files&&logoFile.files[0];if(!f){msg.textContent="⚠️ Chagua picha ya logo kwanza.";return}msg.textContent="Inapakia logo...";saveLogo.disabled=true;try{const ext=(f.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"")||"png";const path="clubs/logos/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;const up=await db.storage.from("AFRN CLUB PHOTOS").upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;const pub=db.storage.from("AFRN CLUB PHOTOS").getPublicUrl(path);const url=pub.data.publicUrl;const {error}=await db.from("clubs").update({logo_url:url}).eq("id",id);if(error)throw error;msg.textContent="✅ Logo imehifadhiwa.";setTimeout(()=>location.reload(),500)}catch(e){msg.textContent="❌ "+(e.message||"Imeshindikana kupakia logo.");saveLogo.disabled=false}};}load()</script><script src="./afrn-club-record.js"></script>
<script src="./afrn-player-photo-global.js"></script>
</body></html>
