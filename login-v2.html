<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Ingia</title><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a}.card{max-width:430px;margin:50px auto;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 30px #0002}h1{text-align:center;font-size:22px;margin:0 0 8px}.sub{text-align:center;font-size:12px;font-weight:bold;color:#667085;margin-bottom:25px}label{display:block;font-weight:bold;margin:15px 0 7px}input{display:block;width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}button{display:block;width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#0b5ed7;color:white;font-weight:bold;font-size:16px}.forgot{background:white;color:#0b5ed7;margin-top:8px}.msg{margin-top:14px;padding:12px;border-radius:9px;display:none}</style></head><body><div class="card"><h1>⚽ AFRN FOOTBALL MANAGEMENT</h1><div class="sub">SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</div><form id="f"><label>Email</label><input id="email" type="email" placeholder="Weka email" autocomplete="username" required><label>Password</label><input id="password" type="password" placeholder="Weka password" autocomplete="current-password" required><button id="login" type="submit">🔐 Ingia kwenye App</button></form><button class="forgot" id="forgot" type="button">🔑 Umesahau password? Tuma link ya kubadilisha</button><div id="msg" class="msg"></div><div style="text-align:center;margin-top:18px;color:#667085">⚽ AFRN Football App</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=20260928"></script><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('login'),m=document.getElementById('msg'),c=window.supabaseClient;b.disabled=true;b.textContent='Inaingia...';m.style.display='none';if(!c){m.textContent='❌ Supabase haijaunganishwa.';m.style.display='block';b.disabled=false;b.textContent='🔐 Ingia kwenye App';return}try{const {data,error}=await c.auth.signInWithPassword({email:document.getElementById('email').value.trim().toLowerCase(),password:document.getElementById('password').value});if(error)throw error;if(!data.session)throw new Error('Session haikupatikana.');location.href='./app.html'}catch(x){m.textContent='❌ Login imekataa: '+x.message;m.style.display='block';b.disabled=false;b.textContent='🔐 Ingia kwenye App'}});document.getElementById('forgot').onclick=async()=>{const c=window.supabaseClient,e=document.getElementById('email').value.trim().toLowerCase(),m=document.getElementById('msg');if(!e){m.textContent='⚠️ Weka email yako kwanza.';m.style.display='block';return}try{const {error}=await c.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname.replace(/login-v2\.html$/,'')+'reset-password.html'});if(error)throw error;m.textContent='✅ Link ya kubadilisha password imetumwa kwenye email yako.';m.style.display='block'}catch(x){m.textContent='❌ '+x.message;m.style.display='block'}};</script>
<script src="./afrn-player-photo-global.js"></script>
</body></html>
