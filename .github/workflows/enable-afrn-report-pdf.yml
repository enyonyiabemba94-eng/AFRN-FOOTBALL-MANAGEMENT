name: Enable AFRN Report PDF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[report-pdf]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reports PDF export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          if 'afrn-report-pdf.js' not in s:
              s=s.replace('</body>','<script src="./afrn-report-pdf.js?v=20260907"></script>\n</body>')
          s=s.replace('🖨️ Print / PDF','🖨️ Print / PDF')
          if 'data-afrn-pdf' not in s:
              s=s.replace('<button class="secondary" onclick="printReport()">🖨️ Print / PDF</button>','<button class="secondary" onclick="printReport()">🖨️ Print / PDF</button><button class="gold" data-afrn-pdf>📥 PDF Halisi</button>')
          p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet -- reports.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git commit -m 'feat: enable real AFRN report PDF [report-pdf]'
          git push