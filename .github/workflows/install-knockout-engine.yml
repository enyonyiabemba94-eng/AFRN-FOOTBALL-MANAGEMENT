name: Install AFRN Knockout Engine
on:
  push:
    paths:
      - 'afrn-knockout-engine.js'
      - 'afrn-league-engine.js'
      - 'afrn-r16-schedule.js'
      - '.github/workflows/install-knockout-engine.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install competition script tags
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('competitions.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="./afrn-knockout-engine.js"></script>',
              '<script src="./afrn-league-engine.js?v=20260911"></script>',
              '<script src="./afrn-r16-schedule.js?v=20260911"></script>'
          ]
          marker='</body>'
          changed=False
          for tag in tags:
              if tag not in s:
                  if marker in s:
                      s=s.replace(marker, tag+'\n'+marker, 1)
                  else:
                      s += '\n'+tag+'\n'
                  changed=True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitions.html
          git diff --cached --quiet || git commit -m 'Install AFRN R16 schedule'
          git push
