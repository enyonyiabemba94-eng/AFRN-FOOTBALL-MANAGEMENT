name: Install AFRN Knockout Engine
on:
  push:
    paths:
      - 'afrn-knockout-engine.js'
      - '.github/workflows/install-knockout-engine.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('competitions.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./afrn-knockout-engine.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, tag+'\n'+marker, 1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitions.html
          git diff --cached --quiet || git commit -m 'Install AFRN knockout engine'
          git push