name: Install AFRN Competition Engine
on:
  push:
    paths:
      - 'afrn-competition-engine.js'
      - 'afrn-group-standings-name-fix.js'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AFRN competition scripts into competitions page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('competitions.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="./afrn-competition-engine.js"></script>',
            '<script src="./afrn-group-standings-name-fix.js?v=20260911"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitions.html
          git diff --cached --quiet || git commit -m 'Install AFRN group standings name fix'
          git push
