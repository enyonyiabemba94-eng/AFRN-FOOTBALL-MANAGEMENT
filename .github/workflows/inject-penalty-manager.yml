name: Inject AFRN Penalty Manager

on:
  push:
    branches: [main]
    paths:
      - 'afrn-penalty-shootout.js'
      - '.github/workflows/inject-penalty-manager.yml'
      - 'competitions.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject penalty script into competitions page
        shell: python
        run: |
          from pathlib import Path
          p = Path('competitions.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./afrn-penalty-shootout.js?v=20260911"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('competitions.html: </body> not found')
              s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit injected script tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Connect knockout penalty shootout manager"
            git push
          fi
