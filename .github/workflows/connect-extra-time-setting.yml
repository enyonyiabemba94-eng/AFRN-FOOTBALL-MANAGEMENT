name: Connect Extra Time Setting

on:
  push:
    paths:
      - 'afrn-extra-time-setting.js'
      - 'afrn-period-breakdown.js'
      - 'afrn-penalty-shootout.js'
      - 'afrn-knockout-fixtures.js'
      - '.github/workflows/connect-extra-time-setting.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('competitions.html')
          s = p.read_text(encoding='utf-8')
          anchor = '<script src="./afrn-penalty-shootout.js"></script>'
          if anchor not in s:
              anchor = '<script src="./afrn-knockout-engine.js"></script>'
              if anchor not in s:
                  raise SystemExit('Knockout engine script anchor not found')
              s = s.replace(anchor, anchor + '\n<script src="./afrn-penalty-shootout.js?v=20260911"></script>', 1)
          tags = [
              '<script src="./afrn-extra-time-setting.js?v=20260911"></script>',
              '<script src="./afrn-period-breakdown.js?v=20260911"></script>',
              '<script src="./afrn-knockout-fixtures.js?v=20260911"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace(anchor, anchor + '\n' + tag, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add knockout fixture date time and venue manager"
            git push
          fi

# Connector trigger marker after competitions.html recovery.
