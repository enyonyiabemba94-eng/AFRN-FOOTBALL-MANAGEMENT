name: Install Free Agent player approval UI

on:
  push:
    branches: [main]
    paths:
      - 'afrn-free-agent-player-approval.js'
      - 'afrn-player-photo-global.js'
      - '.github/workflows/install-free-agent-player-approval.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('afrn-player-photo-global.js')
          text=p.read_text(encoding='utf-8')
          marker='AFRN_FREE_AGENT_PLAYER_APPROVAL_LOADER'
          if marker not in text:
              text += '''\n\n/* AFRN_FREE_AGENT_PLAYER_APPROVAL_LOADER */\n(()=>{const load=()=>{if(!/players\\.html$/i.test(location.pathname)||window.__AFRN_FREE_AGENT_PLAYER_APPROVAL_LOADER__)return;window.__AFRN_FREE_AGENT_PLAYER_APPROVAL_LOADER__=true;const s=document.createElement('script');s.src='./afrn-free-agent-player-approval.js?v=20260911';s.async=false;(document.head||document.documentElement).appendChild(s)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(load,700));else setTimeout(load,700)})();\n'''
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afrn-player-photo-global.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load Free Agent player approval UI'
          git push