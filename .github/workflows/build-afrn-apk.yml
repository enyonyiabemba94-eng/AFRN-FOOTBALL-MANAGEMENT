name: Build AFRN APK

on:
  push:
    paths:
      - 'android-app/**'
      - 'IMG-20260319-WA0093.jpg'
      - '.github/workflows/build-afrn-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare AFRN launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android-app/app/src/main/res/drawable
          cp IMG-20260319-WA0093.jpg android-app/app/src/main/res/drawable/afrn_logo.jpg
          file android-app/app/src/main/res/drawable/afrn_logo.jpg

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/afrn-ci-release.jks" \
            -storepass afrn-ci-password \
            -keypass afrn-ci-password \
            -alias afrn-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AFRN Football Management, OU=AFRN, O=AFRN, L=Kasulu, ST=Kigoma, C=TZ"

      - name: Build signed release APK
        working-directory: android-app
        run: |
          gradle --no-daemon assembleRelease \
            -PAFRN_STORE_FILE="$GITHUB_WORKSPACE/afrn-ci-release.jks" \
            -PAFRN_STORE_PASSWORD=afrn-ci-password \
            -PAFRN_KEY_ALIAS=afrn-release \
            -PAFRN_KEY_PASSWORD=afrn-ci-password

      - name: Verify APK signature
        run: |
          APK=$(find android-app/app/build/outputs -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFRN-Football-Management-APK
          path: android-app/app/build/outputs/**/*.apk
          if-no-files-found: error
