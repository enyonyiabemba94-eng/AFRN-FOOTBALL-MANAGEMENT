name: Build AFRN APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-afrn-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - name: Locate APK
        run: |
          echo "APK files produced:"
          find android-app/app/build/outputs -type f -name '*.apk' -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFRN-Football-Management-APK
          path: android-app/app/build/outputs/**/*.apk
          if-no-files-found: error
