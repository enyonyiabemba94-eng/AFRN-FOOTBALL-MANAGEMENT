name: Fix Transfer Script Parser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair embedded script tags
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('transfers.html')
          x = p.read_text(encoding='utf-8')

          m = re.search(r'function\s+downloadContract\s*\(\s*\)', x)
          if not m:
              raise SystemExit('downloadContract() not found')

          t = re.search(r'(?:const|let|var)\s+html\s*=\s*`', x[m.start():])
          if not t:
              raise SystemExit('contract HTML template not found')
          s = m.start() + t.end()

          e = re.search(r'`\s*;\s*const\s+blob\s*=\s*new\s+Blob', x[s:], re.S)
          if not e:
              raise SystemExit('contract HTML template end not found')
          end = s + e.start()

          template = x[s:end]
          fixed = template.replace('</script>', '<\\/script>')
          if fixed != template:
              p.write_text(x[:s] + fixed + x[end:], encoding='utf-8')
              print('FIXED embedded script closing tags')
          else:
              print('ALREADY SAFE')

      - name: Validate transfer page
        shell: python
        run: |
          from pathlib import Path
          import re
          x = Path('transfers.html').read_text(encoding='utf-8')
          m = re.search(r'function\s+downloadContract\s*\(\s*\)', x)
          assert m, 'downloadContract() missing'
          t = re.search(r'(?:const|let|var)\s+html\s*=\s*`', x[m.start():])
          assert t, 'contract template missing'
          s = m.start() + t.end()
          e = re.search(r'`\s*;\s*const\s+blob\s*=\s*new\s+Blob', x[s:], re.S)
          assert e, 'contract template end missing'
          template = x[s:s+e.start()]
          assert '</script>' not in template, 'Unescaped </script> remains inside contract template'
          assert '<\\/script>' in template, 'Escaped closing script tag not found'
          print('TRANSFER PARSER PASS')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfers.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'fix: escape embedded transfer contract script tags'
            git push
          fi
