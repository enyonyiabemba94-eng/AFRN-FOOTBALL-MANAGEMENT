name: Fix AFRN Player Photo Picker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-photo-picker:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[photo-picker-fix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add reliable photo picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('players.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="afrn-player-photo-picker-fix">'
          if marker in s:
              print('Photo picker fix already installed')
              raise SystemExit(0)

          script = r'''<script id="afrn-player-photo-picker-fix">
          (() => {
            function install() {
              const input = document.getElementById('photoFile');
              if (!input || input.dataset.afrnPickerReady === '1') return;
              input.dataset.afrnPickerReady = '1';

              const box = input.closest('.photo-upload-box');
              if (box && !document.getElementById('choosePhotoBtn')) {
                const button = document.createElement('button');
                button.type = 'button';
                button.id = 'choosePhotoBtn';
                button.className = 'primary';
                button.textContent = '📷 Chagua Picha kutoka Simu/Computer';
                button.style.cssText = 'width:100%;margin-bottom:9px;padding:13px;font-size:14px;';
                input.parentNode.insertBefore(button, input);

                button.addEventListener('click', (event) => {
                  event.preventDefault();
                  event.stopPropagation();
                  input.click();
                });
              }

              input.style.display = 'block';
              input.style.width = '100%';
              input.style.minHeight = '46px';
              input.style.cursor = 'pointer';
              input.setAttribute('aria-label', 'Chagua picha ya mchezaji');

              const label = input.closest('.photo-upload-box')?.querySelector('label');
              if (label) {
                label.style.cursor = 'pointer';
                label.addEventListener('click', (event) => {
                  if (event.target !== input) input.click();
                });
              }
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', install);
            } else {
              install();
            }
            new MutationObserver(install).observe(document.documentElement, {childList:true, subtree:true});
            [100, 500, 1000, 2500].forEach(ms => setTimeout(install, ms));
          })();
          </script>'''

          pos = s.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('players.html has no </body> marker')
          s = s[:pos] + '\n' + script + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          print('Reliable photo picker inserted')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: reliable player photo picker [photo-picker-fix]"
            git push
          fi
