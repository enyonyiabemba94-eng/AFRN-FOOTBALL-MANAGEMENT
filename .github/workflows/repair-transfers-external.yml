name: Repair Transfers External Runtime

on:
  push:
    branches: [main]
    paths:
      - 'transfers.html'
      - '.github/workflows/repair-transfers-external.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move Transfers runtime outside HTML parser and refresh asset
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('transfers.html')
          js = Path('transfers-runtime.js')
          x = page.read_text(encoding='utf-8')

          marker = '/* =========================================================\n   AFRN FOOTBALL MANAGEMENT\n   TRANSFER + CONTRACT + PLAYER LICENCE\n========================================================= */'
          start_marker = x.find(marker)
          if start_marker >= 0:
              script_start = x.rfind('<script>', 0, start_marker + 1)
              global_script = '<script src="./afrn-player-photo-global.js"></script>'
              global_pos = x.find(global_script, start_marker)
              if script_start < 0 or global_pos < 0:
                  raise SystemExit('Transfers inline runtime boundaries not found')
              script_end = x.rfind('</script>', script_start, global_pos)
              if script_end < 0:
                  raise SystemExit('Main script closing tag not found')
              runtime = x[start_marker:script_end]
              js.write_text(runtime + '\n', encoding='utf-8')
              x = x[:script_start] + '<script src="./transfers-runtime.js?v=20260907"></script>' + x[script_end + len('</script>'):]
          else:
              x = re.sub(r'<script\s+src=["\']\./transfers-runtime\.js(?:\?[^"\']*)?["\']\s*></script>', '<script src="./transfers-runtime.js?v=20260907"></script>', x, flags=re.I)

          if '<script src="./transfers-runtime.js?v=20260907"></script>' not in x:
              raise SystemExit('Transfers runtime script tag missing after repair')

          page.write_text(x, encoding='utf-8')
          print('Transfers runtime is external and cache-busted')

      - name: Verify parser-safe Transfers page
        shell: python
        run: |
          from pathlib import Path
          import re
          x = Path('transfers.html').read_text(encoding='utf-8')
          js = Path('transfers-runtime.js').read_text(encoding='utf-8')
          assert '<script src="./transfers-runtime.js?v=20260907"></script>' in x
          assert 'function downloadContract' in js
          assert 'const html = `' in js
          assert '</script>' not in js.lower()
          assert '</body>' in x.lower()
          print('PASS: Transfers HTML parser-safe; runtime external; cache-busted')

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transfers.html transfers-runtime.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: externalize and refresh transfers runtime'
            git push
          fi
