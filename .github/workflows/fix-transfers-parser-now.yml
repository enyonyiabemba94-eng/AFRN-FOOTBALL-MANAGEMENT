name: Fix Transfers Parser Now

on:
  push:
    paths:
      - 'transfers.html'
      - '.github/workflows/fix-transfers-parser-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair embedded script closing tags and force fresh deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('transfers.html')
          x=p.read_text(encoding='utf-8')
          m=re.search(r'function\s+downloadContract\s*\(\s*\)',x)
          if not m:
              raise SystemExit('downloadContract() not found')
          start=m.start()
          body=x.find('</body>',start)
          if body<0:
              raise SystemExit('</body> not found')
          region=x[start:body]
          last=region.rfind('</script>')
          if last<0:
              raise SystemExit('outer </script> not found')
          js=region[:last]
          tail=region[last:]
          fixed=js.replace('</script>','<\\/script>')+tail
          changed = fixed != region
          if changed:
              x=x[:start]+fixed+x[body:]
          marker='<!-- AFRN TRANSFERS PARSER FIX DEPLOYED -->'
          if marker not in x:
              x=x.replace('</head>', marker+'\n</head>', 1)
              changed=True
          if changed:
              p.write_text(x,encoding='utf-8')
              print('FIXED: transfers parser checked and deployment marker added.')
          else:
              print('OK: transfers parser safe and marker already present.')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          x=Path('transfers.html').read_text(encoding='utf-8')
          m=re.search(r'function\s+downloadContract\s*\(\s*\)',x)
          assert m, 'downloadContract() not found'
          body=x.find('</body>',m.start())
          assert body>=0, '</body> not found'
          region=x[m.start():body]
          last=region.rfind('</script>')
          assert last>=0, 'outer </script> not found'
          assert '</script>' not in region[:last], 'unescaped embedded </script> remains'
          assert '<!-- AFRN TRANSFERS PARSER FIX DEPLOYED -->' in x
          print('PASS: Transfers JavaScript parser is safe and deployment marker is present.')
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transfers.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'fix: repair transfers parser and force fresh deployment'
            git push
          fi
