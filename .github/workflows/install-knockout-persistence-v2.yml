name: Install AFRN Knockout Persistence Bridge v4
on:
  push:
    paths:
      - 'afrn-knockout-persistence-v2.js'
      - '.github/workflows/install-knockout-persistence-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bridge v4
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('competitions.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'\n?<script src="\./afrn-knockout-persistence-v2\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="./afrn-knockout-persistence-v2.js?v=20260911-v4"></script>'
          marker='<script src="./afrn-knockout-engine.js"></script>'
          if marker in s:
              s=s.replace(marker, marker+'\n'+tag, 1)
          elif tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitions.html
          git diff --cached --quiet || git commit -m 'Install AFRN knockout persistence bridge v4'
          git push
