name: Install AFRN Knockout Persistence Bridge v2
on:
  push:
    paths:
      - 'afrn-knockout-persistence-v2.js'
      - '.github/workflows/install-knockout-persistence-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('competitions.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./afrn-knockout-persistence-v2.js?v=20260911"></script>'
          if tag not in s:
              marker='<script src="./afrn-knockout-engine.js"></script>'
              s=s.replace(marker, marker+'\n'+tag, 1) if marker in s else s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitions.html
          git diff --cached --quiet || git commit -m 'Install persistent Group Stage to R16 bridge'
          git push
