name: Repair AFRN Reports Loading
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[reports-loading-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Reports Supabase loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2</script>', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js</script>')
          s=s.replace('https://unpkg.com/@supabase/supabase-js@2</script>', 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js</script>')
          s=s.replace('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js/dist/umd/supabase.js', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- reports.html; then
            echo 'No Reports loader patch needed.'
            exit 0
          fi
          git add reports.html
          git commit -m 'fix: use Supabase UMD build in Reports [reports-loading-fix]'
          git push
