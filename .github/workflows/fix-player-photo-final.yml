name: Fix AFRN Player Photo Upload Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'players.html'
      - 'transfers.html'
      - '.github/workflows/fix-player-photo-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair player photo helper and transfer HTML parser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('players.html')
          s = p.read_text(encoding='utf-8')
          helper = r'''
<script>
/* AFRN: shared Supabase client fallback for player photo uploads */
if (typeof window.getSupabaseClient !== 'function') {
  window.getSupabaseClient = function () {
    if (window.supabaseClient && typeof window.supabaseClient.from === 'function') return window.supabaseClient;
    if (window.supabase && typeof window.supabase.from === 'function') return window.supabase;
    if (typeof db !== 'undefined' && db && typeof db.from === 'function') return db;
    return null;
  };
}
</script>
'''
          if 'window.getSupabaseClient = function' not in s:
              s = s.replace('</body>', helper + '\n</body>', 1) if '</body>' in s else s + '\n' + helper
          p.write_text(s, encoding='utf-8')

          # Fix only literal closing-script tags inside the JavaScript
          # generated by downloadContract(). Keep the real outer </script>.
          t = Path('transfers.html')
          x = t.read_text(encoding='utf-8')
          start = x.find('function downloadContract(){')
          body_end = x.find('</body>', start) if start >= 0 else -1
          if start >= 0 and body_end >= 0:
              region = x[start:body_end]
              last_close = region.rfind('</script>')
              if last_close >= 0:
                  js_region = region[:last_close]
                  tail = region[last_close:]
                  fixed = js_region.replace('</script>', '<\\/script>') + tail
                  if fixed != region:
                      x = x[:start] + fixed + x[body_end:]
                      t.write_text(x, encoding='utf-8')
                      print('Fixed literal </script> tags inside downloadContract().')
                  else:
                      print('No unescaped literal </script> remained in downloadContract().')
              else:
                  print('Could not find the real closing script tag.')
          else:
              raise SystemExit('downloadContract() or </body> not found')
          PY

      - name: Verify transfer parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          x = Path('transfers.html').read_text(encoding='utf-8')
          start = x.find('function downloadContract(){')
          body_end = x.find('</body>', start)
          assert start >= 0 and body_end >= 0
          region = x[start:body_end]
          last_close = region.rfind('</script>')
          assert last_close >= 0, 'real closing script tag missing'
          assert '</script>' not in region[:last_close], 'unescaped </script> remains inside JS'
          assert '<\\/script>' in region[:last_close], 'escaped script tag not found'
          print('PASS: transfers.html JavaScript parser is safe.')
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add players.html transfers.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "fix: repair transfer page script parser"
            git push
          fi
