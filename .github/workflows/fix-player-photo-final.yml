name: Fix AFRN Player Photo Upload Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'players.html'
      - '.github/workflows/fix-player-photo-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix undefined getSupabaseClient reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('players.html')
          s = p.read_text(encoding='utf-8')
          old = 'const sb = getSupabaseClient();'
          new = 'const sb = db;'
          count = s.count(old)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print(f'Replaced {count} undefined getSupabaseClient references.')
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add players.html
          if git diff --cached --quiet; then
            echo "No player photo client change needed."
          else
            git commit -m "Fix undefined Supabase client in player photo upload"
            git push
          fi
