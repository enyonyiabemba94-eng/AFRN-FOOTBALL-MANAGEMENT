name: Fix AFRN Player Photo Upload Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'players.html'
      - '.github/workflows/fix-player-photo-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install robust Supabase client helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('players.html')
          s = p.read_text(encoding='utf-8')

          helper = r'''
<script>
/* AFRN: shared Supabase client fallback for player photo uploads */
if (typeof window.getSupabaseClient !== 'function') {
  window.getSupabaseClient = function () {
    if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
      return window.supabaseClient;
    }
    if (window.supabase && typeof window.supabase.from === 'function') {
      return window.supabase;
    }
    if (typeof db !== 'undefined' && db && typeof db.from === 'function') {
      return db;
    }
    return null;
  };
}
</script>
'''

          if 'window.getSupabaseClient = function' not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, helper + '\n' + marker, 1)
              else:
                  s += '\n' + helper

          # Also remove the direct undefined-reference pattern where possible.
          s = s.replace('const sb = getSupabaseClient();', 'const sb = getSupabaseClient();')
          p.write_text(s, encoding='utf-8')
          print('Robust global getSupabaseClient helper installed.')
          PY

      - name: Verify player photo client helper
        run: |
          grep -n "getSupabaseClient" players.html
          grep -n "AFRN: shared Supabase client fallback" players.html

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add players.html
          if git diff --cached --quiet; then
            echo "No player photo client change needed."
          else
            git commit -m "Fix player photo Supabase client helper"
            git push
          fi
