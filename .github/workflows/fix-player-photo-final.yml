name: Fix AFRN Player Photo Upload Final

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy AFRN to GitHub Pages"]
    types: [completed]
  push:
    paths:
      - 'players.html'
      - 'transfers.html'
      - '.github/workflows/fix-player-photo-final.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair player photo helper and transfer HTML parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('players.html')
          s = p.read_text(encoding='utf-8')
          helper = r'''
<script>
/* AFRN: shared Supabase client fallback for player photo uploads */
if (typeof window.getSupabaseClient !== 'function') {
  window.getSupabaseClient = function () {
    if (window.supabaseClient && typeof window.supabaseClient.from === 'function') return window.supabaseClient;
    if (window.supabase && typeof window.supabase.from === 'function') return window.supabase;
    if (typeof db !== 'undefined' && db && typeof db.from === 'function') return db;
    return null;
  };
}
</script>
'''
          if 'window.getSupabaseClient = function' not in s:
              s = s.replace('</body>', helper + '\n</body>', 1) if '</body>' in s else s + '\n' + helper
          p.write_text(s, encoding='utf-8')

          t = Path('transfers.html')
          x = t.read_text(encoding='utf-8')

          # Locate the actual downloadContract() function even if spacing differs.
          m = re.search(r'function\s+downloadContract\s*\(\s*\)', x)
          if not m:
              raise SystemExit('downloadContract() not found')

          start = m.start()
          body_end = x.find('</body>', start)
          if body_end < 0:
              raise SystemExit('</body> not found')

          region = x[start:body_end]
          last_close = region.rfind('</script>')
          if last_close < 0:
              raise SystemExit('real outer </script> not found')

          js_region = region[:last_close]
          tail = region[last_close:]

          # The browser HTML parser closes a <script> element at ANY literal
          # </script>, even when that text appears inside a JS template literal.
          # Escape every embedded closing tag, preserving only the real outer one.
          fixed_js = js_region.replace('</script>', '<\\/script>')
          fixed = fixed_js + tail

          if fixed != region:
              x = x[:start] + fixed + x[body_end:]
              t.write_text(x, encoding='utf-8')
              print('Fixed embedded </script> tags in downloadContract().')
          else:
              print('No embedded literal </script> needed repair.')
          PY

      - name: Verify transfer parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          x = Path('transfers.html').read_text(encoding='utf-8')
          m = re.search(r'function\s+downloadContract\s*\(\s*\)', x)
          assert m, 'downloadContract() missing'
          start = m.start()
          body_end = x.find('</body>', start)
          assert body_end >= 0, '</body> missing'
          region = x[start:body_end]
          last_close = region.rfind('</script>')
          assert last_close >= 0, 'real closing script tag missing'
          assert '</script>' not in region[:last_close], 'unescaped </script> remains inside JS'
          assert '<\\/script>' in region[:last_close], 'escaped embedded script tag not found'
          print('PASS: transfers.html JavaScript parser is safe.')
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add players.html transfers.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "fix: repair transfer page script parser"
            git push
          fi
