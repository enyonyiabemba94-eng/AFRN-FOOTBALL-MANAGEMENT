<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><link rel="manifest" href="./manifest.json"><title>AFRN — Ingia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px #0001}.brand{text-align:center;margin-bottom:22px}.brand h1{margin:8px 0 4px;font-size:23px}.brand p{margin:0;color:#667085;font-size:12px;font-weight:700}.logo{width:82px;height:82px;object-fit:contain;border-radius:18px;background:#071a33;padding:7px}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#0b5ed7;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.linkbtn{background:transparent;color:#0b5ed7;margin-top:8px}.msg{margin-top:14px;padding:11px;border-radius:9px;display:none}.error{background:#fff0f0;color:#b42318}.ok{background:#ecfdf3;color:#027a48}.public{text-align:center;margin-top:18px;color:#667085}</style></head><body><div class="card"><div class="brand"><img class="logo" src="./IMG-20260319-WA0093.jpg" alt="AFRN"><h1>AFRN FOOTBALL MANAGEMENT</h1><p>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</p></div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">🔐 Ingia kwenye App</button></form><button class="linkbtn" id="forgotBtn" type="button">🔑 Umesahau password?</button><div id="msg" class="msg"></div><div class="public">⚽ AFRN Football App</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const client=window.supabaseClient,msg=document.getElementById('msg');function show(text,ok=false){msg.textContent=text;msg.className='msg '+(ok?'ok':'error');msg.style.display='block'}async function route(){const {data:{user}}=await client.auth.getUser();if(user)location.href='app.html'}client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN')location.href='app.html'});route();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Inaingia...';msg.style.display='none';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){show('❌ Login imekataa: '+error.message);btn.disabled=false;btn.textContent='🔐 Ingia kwenye App'}});document.getElementById('forgotBtn').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email)return show('⚠️ Weka email yako kwanza.');const btn=document.getElementById('forgotBtn');btn.disabled=true;btn.textContent='⏳ Inatuma...';const redirect=location.origin+location.pathname.replace(/login\.html?$/i,'')+'reset-password.html';const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:redirect});btn.disabled=false;btn.textContent='🔑 Umesahau password?';if(error)return show('❌ Reset haikutumwa: '+error.message);show('✅ Link ya kubadilisha password imetumwa kwenye email hiyo.',true)});</script></body></html>
