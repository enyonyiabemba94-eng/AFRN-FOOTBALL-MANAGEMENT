<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><link rel="icon" type="image/jpeg" href="./IMG-20260319-WA0093.jpg"><link rel="apple-touch-icon" href="./IMG-20260319-WA0093.jpg"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a33"><link rel="manifest" href="./manifest.json"><title>AFRN Football App</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=20261004-authfix"></script><script src="./afrn-realtime.js" defer></script><style>:root{--navy:#071a33;--blue:#0d47a1;--gold:#f5b400;--bg:#f4f7fb;--white:#fff;--muted:#667085;--border:#e1e6ef}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033;overflow:hidden}.app{height:100dvh;display:grid;grid-template-columns:1fr;grid-template-rows:68px minmax(0,1fr) 72px;background:var(--bg)}.top{grid-column:1;grid-row:1;height:68px;background:linear-gradient(135deg,#06152b,#0d47a1);color:#fff;display:flex;align-items:center;padding:8px 16px;gap:12px;padding-top:max(8px,env(safe-area-inset-top));box-shadow:0 2px 14px #0003;z-index:5}.logo{box-shadow:0 2px 8px #0002}.brand b{font-size:16px}.brand small{font-size:10px}.content{grid-column:1;grid-row:2}.bottom{grid-column:1;grid-row:3}.logo{width:42px;height:42px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}.brand{min-width:0;flex:1}.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;font-size:10px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top button{border:0;background:#ffffff18;color:#fff;width:40px;height:40px;border-radius:12px;font-size:19px}.content{position:relative;flex:1;min-height:0;background:var(--bg);overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:var(--bg);opacity:1;transition:opacity .16s ease}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-weight:800;color:var(--navy);z-index:2;opacity:1;transition:opacity .18s ease}.loading.hide{opacity:0;pointer-events:none}.bottom{height:72px;flex:0 0 72px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:stretch;justify-content:space-around;padding:4px 4px max(4px,env(safe-area-inset-bottom));z-index:5;box-shadow:0 -3px 15px #0000000d}.navbtn{flex:1;border:0;background:transparent;color:#667085;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px}.navbtn span{font-size:21px;line-height:1}.navbtn.active{color:var(--blue);background:#edf4ff}.sheet{position:fixed;inset:0;background:#00112a66;z-index:20;display:none;align-items:flex-end}.sheet.open{display:flex}.sheet-card{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:12px 14px max(18px,env(safe-area-inset-bottom));max-height:80dvh;overflow:auto}.handle{width:42px;height:4px;border-radius:99px;background:#cbd3df;margin:0 auto 14px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet-head b{font-size:16px}.close{border:0;background:#eef2f7;border-radius:10px;width:36px;height:36px}.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.menu-item{border:1px solid var(--border);background:#f8fafc;border-radius:14px;padding:14px 8px;text-align:center;font-weight:800;font-size:11px;color:#172033}.menu-item i{font-style:normal;font-size:24px;display:block;margin-bottom:6px}.app-toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,20px);background:#071a33;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}.app-toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:800px){.app{width:100%;max-width:1440px;height:100dvh;margin:0 auto;background:#f4f7fb;grid-template-columns:235px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr);box-shadow:0 0 35px #0001}.top{grid-column:1 / -1;grid-row:1;height:76px;padding:10px 24px}.logo{width:50px;height:50px;border-radius:12px}.brand b{font-size:18px}.brand small{font-size:11px}.side{grid-column:1;grid-row:2;display:flex}.content{grid-column:2;grid-row:2;min-height:0;padding:14px 18px 18px;overflow:hidden}.content iframe{border-radius:16px;box-shadow:0 1px 8px #00000010}.bottom{display:none}.top #menuBtn{display:none}.sheet{display:none!important}.desktop-nav{display:flex}.desktop-nav .sidebtn{border:0;background:transparent;color:#667085;width:100%;padding:12px 16px;text-align:left;border-radius:12px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:12px}.desktop-nav .sidebtn span{font-size:20px;width:24px;text-align:center}.desktop-nav .sidebtn.active{background:#eaf2ff;color:var(--blue)}.desktop-nav .sidebtn:hover{background:#f0f4f9}.side-inner{width:100%;padding:18px 12px;background:#fff;border-right:1px solid var(--border);box-shadow:2px 0 8px #00000008}.side-title{font-size:11px;color:#98a2b3;font-weight:900;padding:4px 12px 10px;text-transform:uppercase;letter-spacing:.6px}.side-user{margin:0 4px 16px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#eef5ff,#f8fbff);font-size:12px;font-weight:800;color:#172033}.side-user small{display:block;color:#667085;margin-top:3px;font-weight:600}.app-toast{bottom:24px}}@media(max-width:799px){.desktop-nav{display:none}}</style></head><body><div class="app"><header class="top"><img class="logo" src="./IMG-20260319-WA0093.jpg" alt="AFRN"><div class="brand"><b id="title">AFRN Football</b><small id="subtitle">SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</small></div><button id="menuBtn" aria-label="Menu">☰</button></header><aside class="side"><div class="side-inner"><div class="side-user">⚽ AFRN FOOTBALL<small>Usimamizi wa Mpira wa Miguu</small></div><div class="side-title">MENYU KUU</div><nav class="desktop-nav"><button class="sidebtn active" data-page="index.html"><span>⌂</span>Dashboard</button><button class="sidebtn" data-page="clubs.html"><span>🏟️</span>Vilabu</button><button class="sidebtn" data-page="players.html"><span>👤</span>Wachezaji</button><button class="sidebtn" data-page="matches.html"><span>⚽</span>Mechi</button><button class="sidebtn" data-page="competitions.html"><span>🏆</span>Mashindano</button><button class="sidebtn" data-page="transfers.html"><span>↔</span>Uhamisho</button><button class="sidebtn" data-page="contracts.html"><span>📄</span>Mikataba</button><button class="sidebtn" data-page="reports.html"><span>📊</span>Ripoti</button></nav></div></aside><main class="content"><div id="loading" class="loading">⚽ Inaandaa AFRN App...</div><iframe id="screen" title="AFRN App"></iframe></main><nav class="bottom" aria-label="Navigation"><button class="navbtn active" data-page="index.html"><span>⌂</span>Home</button><button class="navbtn" data-page="players.html"><span>👤</span>Wachezaji</button><button class="navbtn" data-page="matches.html"><span>⚽</span>Mechi</button><button class="navbtn" data-page="transfers.html"><span>↔</span>Uhamisho</button><button class="navbtn" id="moreBtn"><span>☰</span>Zaidi</button></nav></div><div class="sheet" id="sheet"><div class="sheet-card"><div class="handle"></div><div class="sheet-head"><b>AFRN Football</b><button class="close" id="closeBtn">✕</button></div><div class="menu-grid"><button class="menu-item" data-page="clubs.html"><i>🏟️</i>Vilabu</button><button class="menu-item" data-page="competitions.html"><i>🏆</i>Mashindano</button><button class="menu-item" data-page="contracts.html"><i>📄</i>Mikataba</button><button class="menu-item" data-page="reports.html"><i>📊</i>Ripoti</button><button class="menu-item" data-page="players.html"><i>🔎</i>Tafuta Mchezaji</button><button class="menu-item" id="logout"><i>🚪</i>Toka</button></div></div></div><div id="toast" class="app-toast"></div><script>const db=window.supabaseClient,frame=document.getElementById('screen'),loading=document.getElementById('loading'),sheet=document.getElementById('sheet'),toast=document.getElementById('toast');let currentPage='',currentProfile=null;function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}function setActive(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}function pageTitle(p){return({'index.html':'AFRN Football','club-dashboard.html':'Klabu Dashboard','players.html':'Wachezaji','player-profile.html':'Player Profile','matches.html':'Mechi','transfers.html':'Uhamisho','clubs.html':'Vilabu','competitions.html':'Mashindano','competition-history.html':'Competition History','contracts.html':'Mikataba','reports.html':'Ripoti'})[p]||'AFRN Football'}function cleanEmbeddedPage(doc){try{const s=doc.createElement('style');s.textContent='html,body{background:#f4f7fb!important;overflow-x:hidden!important}body>header,body>nav{display:none!important}body>main{max-width:none!important;margin:0!important;padding:12px!important}body{min-height:100%!important}dialog{max-width:94vw!important}';doc.head.appendChild(s)}catch(e){}}function openPlayerProfile(id){if(!id)return;go('player-profile.html?id='+encodeURIComponent(id))}function enhancePlayers(doc){try{if(!doc||!/players\.html$/i.test(location.pathname)&&!frame.src.includes('players.html'))return;const cards=doc.querySelectorAll('.card');cards.forEach(card=>{if(card.dataset.afrnProfileReady)return;let id='';const edit=card.querySelector('[onclick*="editPlayer"]');if(edit){const m=(edit.getAttribute('onclick')||'').match(/editPlayer\(['"]([^'"]+)/);if(m)id=m[1]}if(!id)return;const actions=card.querySelector('.actions');if(actions){const b=doc.createElement('button');b.type='button';b.className='primary';b.textContent='👤 Profile';b.onclick=e=>{e.preventDefault();e.stopPropagation();window.parent.openPlayerProfile(id)};actions.insertBefore(b,actions.firstChild)}card.dataset.afrnProfileReady='1'})}catch(e){}}function go(page,options={}){if(!page)return;currentPage=page.split('?')[0];setActive(currentPage);sheet.classList.remove('open');loading.classList.remove('hide');frame.style.opacity='.35';document.getElementById('title').textContent=pageTitle(currentPage);if(!options.pop)history.pushState({page},'',location.href);frame.src='./'+page}frame.addEventListener('load',()=>{loading.classList.add('hide');frame.style.opacity='1';try{cleanEmbeddedPage(frame.contentDocument);const t=frame.contentDocument.title||'';if(t)document.getElementById('title').textContent=t.replace('AFRN Football Management - ','').replace('AFRN Football Management','AFRN Football');enhancePlayers(frame.contentDocument);const mo=new MutationObserver(()=>enhancePlayers(frame.contentDocument));mo.observe(frame.contentDocument.body,{subtree:true,childList:true});frame.contentWindow.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(!h||h.startsWith('http')||h.startsWith('#')||h.startsWith('mailto:'))return;const allowed=['index.html','club-dashboard.html','players.html','player-profile.html','matches.html','transfers.html','clubs.html','competitions.html','contracts.html','reports.html','accounts.html','competition-history.html'];const target=h.split('?')[0].split('#')[0];if(allowed.includes(target)){e.preventDefault();go(target+(h.includes('?')?h.slice(h.indexOf('?')):''))}})}catch(e){}});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('menuBtn').onclick=()=>sheet.classList.add('open');document.getElementById('moreBtn').onclick=()=>sheet.classList.add('open');document.getElementById('closeBtn').onclick=()=>sheet.classList.remove('open');sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('open')});document.getElementById('logout').onclick=async()=>{if(db)await db.auth.signOut();location.href='./login.html'};window.addEventListener('popstate',()=>{if(currentPage)frame.src='./'+currentPage});async function start(){
  try{
    if(!db){alert('❌ Supabase haijaunganishwa.');location.href='./login.html?fresh='+Date.now();return}
    let session=null,user=null;
    for(let i=0;i<5;i++){
      const s=await db.auth.getSession();
      session=s?.data?.session||null;
      user=session?.user||null;
      if(user) break;
      await new Promise(resolve=>setTimeout(resolve,400));
    }
    if(!user){
      const r=await db.auth.getUser();
      user=r?.data?.user||null;
    }
    if(!user){
      alert('❌ Session ya login haijaonekana. Tafadhali ingia tena.');
      location.replace('./login.html?fresh='+Date.now());
      return;
    }
    let p=null,lastError=null;
    for(let i=0;i<5;i++){
      const r=await db.from('profiles').select('role,club_id,full_name').eq('id',user.id).maybeSingle();
      if(r.error) lastError=r.error;
      p=r.data||null;
      if(p) break;
      await new Promise(resolve=>setTimeout(resolve,400));
    }
    if(!p){
      console.error('AFRN profile load failed',lastError);
      alert('❌ Login imefanikiwa, lakini profile ya akaunti haisomeki. Usifute akaunti. Tatizo ni ruhusa ya profile/database.');
      return;
    }
    
    currentProfile=p;
    go('index.html',{replace:true});
  }catch(e){
    console.error('AFRN app start failed',e);
    alert('❌ Hitilafu ya kufungua mfumo: '+(e?.message||e));
  }
}start();</script>
