<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AFRN Football Management - Mikataba</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

:root{
  --navy:#071a33;
  --blue:#0d47a1;
  --green:#198754;
  --red:#dc3545;
  --orange:#f59e0b;
  --gray:#667085;
  --bg:#f4f7fb;
  --white:#ffffff;
  --border:#d9e1ec;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:#172033;
}

header{
  background:var(--navy);
  color:#fff;
  padding:18px;
}

header h2,
header p{
  margin:0;
}

header p{
  margin-top:6px;
  opacity:.9;
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  padding:16px;
  margin:12px 0;
  border-radius:12px;
  box-shadow:0 2px 8px #0000000d;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
  margin:3px;
}

.primary{
  background:var(--blue);
  color:#fff;
}

.secondary{
  background:#e9eef5;
  color:#172033;
}

.danger{
  background:var(--red);
  color:#fff;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  font:inherit;
}

textarea{
  min-height:90px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}


/* ===============================
   PLAYER CARD
================================ */

.contract{
  display:grid;
  grid-template-columns:120px 1fr auto;
  gap:18px;
  align-items:center;
}


/* ===============================
   PLAYER PHOTO - SQUARE
================================ */

.photo{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #e1e7ef;
  background:#e9eef5;
  display:block;
}


/* ===============================
   PLAYER NAME
================================ */

.player-name{
  margin:0 0 10px 0;
  font-size:20px;
  font-weight:800;
}


/* ===============================
   INFORMATION
================================ */

.club-line{
  margin:6px 0;
  line-height:1.5;
}


/* ===============================
   BADGES
================================ */

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.active{
  background:#d1e7dd;
  color:#0f5132;
}

.expired{
  background:#f8d7da;
  color:#842029;
}

.loan{
  background:#fff3cd;
  color:#664d03;
}

.permanent{
  background:#dbeafe;
  color:#1e3a8a;
}


/* ===============================
   NOTICE
================================ */

.notice{
  display:none;
  padding:12px;
  border-radius:9px;
  background:#fff3cd;
  color:#664d03;
  margin-top:10px;
}


/* ===============================
   LOAN INFO
================================ */

.loan-info{
  display:none;
  padding:12px;
  background:#fff3cd;
  color:#664d03;
  border-radius:9px;
  margin-top:10px;
}


/* ===============================
   PREVIEW
================================ */

.preview{
  display:none;
  text-align:center;
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-top:10px;
}

.preview img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #e1e7ef;
  background:#e9eef5;
}


/* ===============================
   ACTIONS
================================ */

.actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  margin-top:15px;
}

.muted{
  color:var(--gray);
}

.hidden{
  display:none !important;
}


/* ===============================
   DIALOG
================================ */

dialog{
  width:min(760px,94vw);
  border:0;
  border-radius:14px;
  padding:0;
  box-shadow:0 15px 50px #0005;
}

dialog::backdrop{
  background:#0008;
}

.body{
  padding:20px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
  margin-bottom:15px;
}

.head h3{
  margin:0 0 15px;
}


/* ===============================
   MOBILE
================================ */

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .contract{
    grid-template-columns:95px 1fr;
    gap:12px;
  }

  .photo{
    width:90px;
    height:90px;
  }

  .contract .actions{
    grid-column:1/-1;
  }

  .player-name{
    font-size:18px;
  }

}

</style>

</head>

<script>


/* ===============================
   CONFIGURATION
================================ */

const TABLE =
"player_contracts";

const STORAGE_BUCKET =
"AFRN FILES";

const STORAGE_FOLDER =
"contracts";


let contracts = [];

let players = [];

let clubs = [];


const $ =
id => document.getElementById(id);


const db =
window.supabaseClient;



/* ===============================
   FALLBACK PHOTO
================================ */

const FALLBACK =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

<svg
xmlns="http://www.w3.org/2000/svg"
width="300"
height="300">

<rect
width="100%"
height="100%"
fill="#e9eef5"/>

<text
x="50%"
y="50%"
dominant-baseline="middle"
text-anchor="middle"
font-family="Arial"
font-size="22"
fill="#667085">

Picha haipo

</text>

</svg>

`);



/* ===============================
   PLAYER NAME
================================ */

function playerName(p){

  return [

    p?.first_name,
    p?.middle_name,
    p?.last_name

  ]
  .filter(Boolean)
  .join(" ")

  || "Mchezaji";

}



/* ===============================
   CLUB NAME
================================ */

function clubName(id){

  const c =
    clubs.find(
      x => String(x.id) === String(id)
    );

  return c?.name ||
    "Klabu haijawekwa";

}



/* ===============================
   GET PLAYER
================================ */

function getPlayer(id){

  return players.find(
    p => String(p.id) === String(id)
  );

}



/* ===============================
   GET PHOTO
================================ */

function getPhoto(p){

  if(
    p &&
    p.photo_url &&
    String(p.photo_url).trim()
  ){

    return p.photo_url;

  }

  return FALLBACK;

}



/* ===============================
   TODAY
================================ */

function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}



/* ===============================
   STATUS
================================ */

function contractStatus(c){

  if(

    c.end_date &&

    c.end_date < today() &&

    String(c.status).toLowerCase()
    !== "terminated"

  ){

    return "Expired";

  }

  return c.status || "Active";

}



/* ===============================
   LOAD PLAYERS
================================ */

function loadPlayers(){

  const select =
    $("playerId");

  select.innerHTML =
    `
    <option value="">
      Chagua Mchezaji
    </option>
    `;


  players.forEach(p => {

    const option =
      document.createElement("option");

    option.value =
      p.id;

    option.textContent =
      playerName(p);

    select.appendChild(option);

  });

}



/* ===============================
   LOAD CLUBS
================================ */

function loadClubs(){

  const from =
    $("fromClubId");

  const current =
    $("clubId");


  from.innerHTML =
    `
    <option value="">
      Chagua Klabu
    </option>
    `;


  current.innerHTML =
    `
    <option value="">
      Chagua Klabu
    </option>
    `;


  clubs.forEach(c => {


    const a =
      document.createElement("option");

    a.value =
      c.id;

    a.textContent =
      c.name;

    from.appendChild(a);


    const b =
      document.createElement("option");

    b.value =
      c.id;

    b.textContent =
      c.name;

    current.appendChild(b);

  });

}



/* ===============================
   PLAYER PREVIEW
================================ */

function previewPlayer(){

  const p =
    getPlayer(
      $("playerId").value
    );


  if(!p){

    $("playerPreview")
      .style.display =
      "none";

    return;

  }


  $("playerName")
    .textContent =
    playerName(p);


  $("playerPhoto")
    .src =
    getPhoto(p);


  $("playerPhoto")
    .onerror =
    function(){

      this.onerror = null;

      this.src = FALLBACK;

    };


  $("playerCurrentClub")
    .textContent =
    "Klabu ya sasa: " +
    clubName(p.club_id);


  $("playerPreview")
    .style.display =
    "block";


  if(p.club_id){

    $("fromClubId")
      .value =
      p.club_id;

  }


  checkConflict();

}



/* ===============================
   LOAN UI
================================ */

function updateLoanUI(){

  const type =
    $("registrationType").value;

  const loanBox =
    $("loanTypeBox");

  const endBox =
    $("endDateBox");

  const leagueBox =
    $("leagueBox");

  const contractNumberBox =
    $("contractNumberBox");

  const info =
    $("loanInfo");


  if(type === "Loan"){

    loanBox
      .classList
      .remove("hidden");

    info.style.display =
      "block";

    info.innerHTML =
      "ℹ️ Huu ni <b>mkopo</b>, " +
      "si uhamisho wa kudumu.";

  }

  else{

    loanBox
      .classList
      .add("hidden");

    leagueBox
      .classList
      .add("hidden");

    info.style.display =
      "none";

    $("loanType").value =
      "";

  }


  if(

    type === "Loan" &&

    $("loanType").value === "League"

  ){

    endBox
      .classList
      .add("hidden");

    $("endDate").value =
      "";

    leagueBox
      .classList
      .remove("hidden");

    contractNumberBox
      .classList
      .add("hidden");

    $("contractNumber").value =
      "";

    info.style.display =
      "block";

    info.innerHTML =
      "🏆 <b>Mkopo wa Ligi</b><br>" +
      "Mchezaji atarejea baada ya ligi " +
      "iliyochaguliwa kumalizika.";

  }

  else{

    endBox
      .classList
      .remove("hidden");

    leagueBox
      .classList
      .add("hidden");

    contractNumberBox
      .classList
      .remove("hidden");

  }

}



/* ===============================
   CONFLICT
================================ */

function checkConflict(){

  const pid =
    $("playerId").value;

  const start =
    $("startDate").value;

  const end =
    $("endDate").value;


  if(
    !pid ||
    !start ||
    !end
  ){

    $("conflictNotice")
      .style.display =
      "none";

    return;

  }


  const conflicts =
    contracts.filter(c => {

      return (

        String(c.player_id)
        === String(pid)

        &&

        start <=
        (c.end_date ||
        "9999-12-31")

        &&

        end >=
        (c.start_date ||
        "0000-01-01")

      );

    });


  if(conflicts.length){

    $("conflictNotice")
      .style.display =
      "block";

    $("conflictNotice")
      .innerHTML =
      "⚠️ <b>Mchezaji ana taarifa nyingine " +
      "inayoingiliana na kipindi hiki.</b>";

  }

  else{

    $("conflictNotice")
      .style.display =
      "none";

  }

}



/* ===============================
   LOAD DATA
================================ */

async function loadData(){

  if(!db){

    $("status").textContent =
      "❌ Supabase client haijapatikana. " +
      "Hakikisha supabase-config.js ipo.";

    return false;

  }


  const [

    playersResult,
    clubsResult

  ] = await Promise.all([

    db
      .from("players")
      .select("*"),

    db
      .from("clubs")
      .select("*")

  ]);


  if(playersResult.error){

    $("status").textContent =
      "❌ Players: " +
      playersResult.error.message;

    return false;

  }


  if(clubsResult.error){

    $("status").textContent =
      "❌ Clubs: " +
      clubsResult.error.message;

    return false;

  }


  players =
    playersResult.data || [];

  clubs =
    clubsResult.data || [];


  loadPlayers();

  loadClubs();


  $("status").textContent =
    "✅ Players: " +
    players.length +
    " • Clubs: " +
    clubs.length;


  return true;

}



/* ===============================
   LOAD CONTRACTS
================================ */

async function loadContracts(){

  const result =
    await db
      .from(TABLE)
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    $("status").textContent =
      "❌ " +
      result.error.message;

    return;

  }


  contracts =
    result.data || [];


  render();

}



/* ===============================
   RENDER
================================ */

function render(){

  const box =
    $("contractsContainer");


  if(!contracts.length){

    box.innerHTML =
      `
      <div class="card muted">
        Hakuna mikataba bado.
      </div>
      `;

    return;

  }


  box.innerHTML =

    contracts.map(c => {


      const p =
        getPlayer(c.player_id);


      const currentClub =
        clubName(c.club_id);


      const fromClub =
        clubName(c.from_club_id);


      const st =
        contractStatus(c);


      const type =
        c.registration_type ||
        "Permanent";


      const isLoan =
        String(type)
        .toLowerCase()
        === "loan";


      const loanType =
        c.loan_type || "";


      let typeBadge =

        `
        <span class="badge permanent">
          Uhamisho wa kudumu
        </span>
        `;


      if(isLoan){

        typeBadge =

          `
          <span class="badge loan">

          ${
            loanType === "League"
            ?
            "Mkopo wa Ligi"
            :
            "Mkopo wa miezi"
          }

          </span>
          `;

      }


      let dateText =

        `
        ${c.start_date || "-"}
        →
        ${c.end_date || "-"}
        `;


      if(
        isLoan &&
        loanType === "League"
      ){

        dateText =
          `
          ${c.start_date || "-"}
          → Mwisho wa ligi
          `;

      }


      return `

      <div class="card contract">


        <img

          class="photo"

          src="${getPhoto(p)}"

          alt="${playerName(p)}"

          onerror="
            this.onerror=null;
            this.src='${FALLBACK}'
          "

        >


        <div>


          <h3 class="player-name">

            ${playerName(p)}

          </h3>


          <p class="club-line">

            <b>
              Klabu anayotoka:
            </b>

            ${fromClub}

          </p>


          <p class="club-line">

            <b>
              Klabu ya sasa:
            </b>

            ${currentClub}

          </p>


          <p>

            ${typeBadge}

          </p>


          <p>

            📅

            ${dateText}

          </p>


          ${
            isLoan &&
            loanType === "League"

            ?

            `
            <p>

              🏆

              <b>Ligi:</b>

              ${c.league_name || "-"}

            </p>
            `

            :

            ""
          }


          ${
            c.contract_number

            ?

            `
            <p>

              📄

              ${c.contract_number}

            </p>
            `

            :

            ""
          }


          <span
          class="badge ${
            st.toLowerCase()
            === "expired"
            ?
            "expired"
            :
            "active"
          }">

            ${st}

          </span>


          ${
            c.contract_file_url

            ?

            `
            <a

              class="btn secondary"

              href="${c.contract_file_url}"

              target="_blank"

              rel="noopener">

              👁️ Angalia Mkataba

            </a>
            `

            :

            ""
          }


        </div>


        <div class="actions">

          <button

            class="btn danger"

            onclick="
              deleteContract('${c.id}')
            ">

            🗑️ Futa

          </button>

        </div>


      </div>

      `;

    }).join("");

}



/* ===============================
   SAVE
================================ */

async function save(e){

  e.preventDefault();


  const pid =
    $("playerId").value;


  if(!pid){

    alert(
      "Tafadhali chagua mchezaji."
    );

    return;

  }


  const type =
    $("registrationType").value;


  const loanType =
    $("loanType").value;


  const start =
    $("startDate").value;


  let end =
    $("endDate").value;


  /* MKOPO WA LIGI */

  if(
    type === "Loan" &&
    loanType === "League"
  ){

    end = null;

  }


  if(
    type !== "Loan" &&
    start &&
    end &&
    end < start
  ){

    alert(
      "Tarehe ya mwisho haiwezi " +
      "kuwa kabla ya tarehe ya kuanza."
    );

    return;

  }


  /* ===============================
     UPLOAD FILE
  ================================ */

  let fileUrl = null;


  const file =
    $("contractFile")
    .files[0];


  if(file){

    $("status")
      .textContent =
      "⏳ Inapakia mkataba...";


    const ext =
      file.name
      .split(".")
      .pop()
      .toLowerCase();


    const path =

      STORAGE_FOLDER +

      "/contract_" +

      Date.now() +

      "." +

      ext;


    const upload =

      await db
        .storage
        .from(STORAGE_BUCKET)
        .upload(

          path,

          file,

          {
            upsert:true,
            contentType:file.type
          }

        );


    if(upload.error){

      $("status")
        .textContent =
        "❌ " +
        upload.error.message;

      return;

    }


    fileUrl =

      db
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path)
        .data
        .publicUrl;

  }


  /* ===============================
     PAYLOAD
     SALARY HAIPO
  ================================ */

  const payload = {

    player_id:
      pid,

    club_id:
      $("clubId").value ||
      null,

    from_club_id:
      $("fromClubId").value ||
      null,

    contract_number:
      $("contractNumber")
      .value
      .trim() ||
      null,

    start_date:
      start ||
      null,

    end_date:
      end ||
      null,

    contract_file_url:
      fileUrl,

    registration_type:
      type,

    loan_type:

      type === "Loan"

      ?

      loanType ||
      null

      :

      null,

    league_name:

      (
        type === "Loan" &&
        loanType === "League"
      )

      ?

      $("leagueName")
      .value
      .trim() ||
      null

      :

      null,

    status:
      $("contractStatus")
      .value,

    notes:
      $("notes")
      .value
      .trim() ||
      null

  };


  const result =

    await db
      .from(TABLE)
      .insert(payload);


  if(result.error){

    $("status")
      .textContent =
      "❌ " +
      result.error.message;

    return;

  }


  $("contractDialog")
    .close();


  $("status")
    .textContent =
    "✅ Mkataba umehifadhiwa.";


  await loadContracts();

}



/* ===============================
   DELETE
================================ */

async function deleteContract(id){

  const ok =
    confirm(

      "⚠️ Una uhakika unataka kufuta " +
      "taarifa hii?\n\n" +

      "Taarifa itafutwa kwenye database."

    );


  if(!ok){
    return;
  }


  $("status")
    .textContent =
    "⏳ Inafuta...";


  const result =

    await db
      .from(TABLE)
      .delete()
      .eq("id",id);


  if(result.error){

    $("status")
      .textContent =
      "❌ Imeshindwa kufuta: " +
      result.error.message;

    return;

  }


  $("status")
    .textContent =
    "✅ Taarifa imefutwa kabisa.";


  await loadContracts();

}



/* ===============================
   SEARCH
================================ */

$("search")
.addEventListener(
  "input",
  function(){

    const q =
      this.value
      .toLowerCase()
      .trim();


    if(!q){

      render();

      return;

    }


    const filtered =
      contracts.filter(c => {


        const p =
          getPlayer(c.player_id);


        const current =
          clubName(c.club_id);


        const from =
          clubName(c.from_club_id);


        return (

          playerName(p)
          .toLowerCase()
          .includes(q)

          ||

          current
          .toLowerCase()
          .includes(q)

          ||

          from
          .toLowerCase()
          .includes(q)

        );

      });


    const original =
      contracts;


    contracts =
      filtered;


    render();


    contracts =
      original;

  }
);
