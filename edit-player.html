<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Hariri Mchezaji</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:16px;padding:16px;margin-top:12px}h2{margin-top:0}label{display:block;font-size:12px;font-weight:800;margin-bottom:10px}input,select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #d4dbe6;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.photo-box{background:#f7f9fc;border:1px dashed #c8d1df;border-radius:14px;padding:14px;margin:12px 0}.photo-box h3{margin:0 0 12px;font-size:15px}.photo-box input{margin-top:7px}.hint{font-size:11px;color:#687386;line-height:1.5;margin-top:7px}button,a.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.save{background:#0d47a1;color:white}.back{background:#e9eef6;color:#172033}.status{padding:10px;border-radius:9px;background:#eef4ff;margin-bottom:12px;font-size:13px}.err{background:#fdecec;color:#842029}@media(max-width:520px){.grid{grid-template-columns:1fr}.actions>*{width:100%;text-align:center}}</style></head>
<body><main><a class="btn back" id="back" href="./divisions.html">← Rudi</a><section class="card"><h2>✏️ Hariri Mchezaji</h2><div id="who" class="status">Inapakia taarifa za mchezaji...</div><div id="msg" class="status" style="display:none"></div>
<section class="photo-box"><h3>📷 Picha ya Mchezaji</h3><div id="currentPhotoWrap" style="display:none;margin-bottom:12px"><div class="hint">Picha ya sasa</div><img id="currentPhoto" alt="Picha ya sasa ya mchezaji" style="width:120px;height:120px;object-fit:cover;border-radius:14px;border:2px solid #e1e6ef"></div><label>Chagua picha kutoka kwenye simu<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="photoPreviewWrap" style="display:none;margin-top:10px"><div class="hint">Muonekano wa picha mpya</div><img id="photoPreview" alt="Preview ya picha mpya" style="width:140px;height:140px;object-fit:cover;border-radius:14px;border:2px solid #e1e6ef"></div><div class="hint">JPG, PNG au WEBP · Ukubwa wa juu 5 MB. Picha itahifadhiwa kwenye AFRN PLAYER PHOTOS/players.</div></section>
<form id="form"><div class="grid">
<label>Jina la kwanza *<input id="first" required></label><label>Jina la kati<input id="middle"></label><label>Jina la mwisho<input id="last"></label><label>Tarehe ya kuzaliwa<input id="dob" type="date"></label><label>Uraia<input id="nationality"></label><label>Namba ya jezi<input id="jersey" type="number" min="0"></label><label>Simu<input id="phone" type="tel"></label><label>Anwani<input id="address"></label><label>Nafasi ya mchezaji<input id="position"></label><label>Status<select id="status"><option value="active">active</option><option value="inactive">inactive</option><option value="suspended">suspended</option></select></label><label>Klabu ya sasa<select id="club"><option value="">— Free Agent / Hakuna klabu —</option></select></label><label>Status ya usajili<select id="approval"><option value="">— Haijawekwa —</option><option value="PENDING">PENDING</option><option value="APPROVED">APPROVED</option><option value="REJECTED">REJECTED</option></select></label>
</div><div class="actions"><button class="back" type="button" id="cancel">Ghairi</button><button class="save" type="submit" id="save">💾 Hifadhi Mabadiliko</button></div></form></section></main>
<script>
const db=window.supabaseClient;const id=new URLSearchParams(location.search).get('id');let player=null;let newPhotoFile=null;const PHOTO_BUCKET='AFRN PLAYER PHOTOS';
const el=x=>document.getElementById(x);
function message(s,bad){el('msg').style.display='block';el('msg').className='status'+(bad?' err':'');el('msg').textContent=s}
function resolvePhoto(value){const v=String(value||'').trim();if(!v)return '';if(v.startsWith('http://')||v.startsWith('https://'))return v;let path=v;while(path.startsWith('/'))path=path.slice(1);const upper=path.toUpperCase();if(upper.startsWith('AFRN PLAYER PHOTOS/'))path=path.slice('AFRN PLAYER PHOTOS/'.length);else if(upper.startsWith('AFRN%20PLAYER%20PHOTOS/'))path=path.slice('AFRN%20PLAYER%20PHOTOS/'.length);return db.storage.from(PHOTO_BUCKET).getPublicUrl(path).data?.publicUrl||'';}
el('photoFile').addEventListener('change',()=>{const file=el('photoFile').files?.[0];newPhotoFile=file||null;if(!file){el('photoPreviewWrap').style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){message('Chagua JPG, PNG au WEBP yenye ukubwa usiozidi 5 MB.',true);el('photoFile').value='';newPhotoFile=null;el('photoPreviewWrap').style.display='none';return}el('photoPreview').src=URL.createObjectURL(file);el('photoPreviewWrap').style.display='block';message('Picha imechaguliwa. Bonyeza Hifadhi Mabadiliko ili kuipakia.',false)});
el('back').href=id?'./player-profile.html?id='+encodeURIComponent(id):'./divisions.html';el('cancel').onclick=()=>location.href=id?'./player-profile.html?id='+encodeURIComponent(id):'./divisions.html';
async function init(){try{if(!db||!id){el('who').textContent='❌ Muunganisho au Player ID haujapatikana.';return}
const r=await db.from('players').select('*').eq('id',id).maybeSingle();if(r.error||!r.data){el('who').textContent='❌ Mchezaji hakupatikana: '+(r.error?r.error.message:'');return}player=r.data;el('who').textContent=(player.first_name||'')+' '+(player.last_name||'')+' · AFRN Player ID: '+(player.player_id_number||'—');
[['first','first_name'],['middle','middle_name'],['last','last_name'],['dob','date_of_birth'],['nationality','nationality'],['jersey','jersey_number'],['phone','phone'],['address','address'],['position','position'],['status','status'],['approval','registration_approval_status']].forEach(pair=>el(pair[0]).value=player[pair[1]]==null?'':String(player[pair[1]]));
const c=await db.from('clubs').select('id,name,division').order('name');if(c.error){message('Imeshindwa kupakia vilabu: '+c.error.message,true);return}for(const club of c.data||[]){const op=document.createElement('option');op.value=club.id;op.textContent=club.name+(club.division?' · '+club.division:'');el('club').appendChild(op)}el('club').value=player.club_id||'';const photo=resolvePhoto(player.photo_url);if(photo){el('currentPhoto').src=photo;el('currentPhotoWrap').style.display='block'}else{el('currentPhotoWrap').style.display='none'}
}catch(err){console.error('AFRN edit player load error:',err);el('who').textContent='❌ Imeshindwa kupakia taarifa: '+(err?.message||String(err));message('Angalia muunganisho wa intaneti kisha jaribu tena.',true)}
}
el('form').addEventListener('submit',async e=>{e.preventDefault();if(!player)return;const btn=el('save');btn.disabled=true;btn.textContent='Inahifadhi...';let photoPath=player.photo_url||null;if(newPhotoFile){const ext=newPhotoFile.type==='image/png'?'png':newPhotoFile.type==='image/webp'?'webp':'jpg';const safeId=String(player.player_id_number||player.id).replace(/[^a-zA-Z0-9_-]/g,'_');photoPath=`players/${safeId}-${Date.now()}.${ext}`;const up=await db.storage.from(PHOTO_BUCKET).upload(photoPath,newPhotoFile,{cacheControl:'3600',upsert:false,contentType:newPhotoFile.type});if(up.error)throw up.error}const payload={photo_url:photoPath,first_name:el('first').value.trim(),middle_name:el('middle').value.trim()||null,last_name:el('last').value.trim()||null,date_of_birth:el('dob').value||null,nationality:el('nationality').value.trim()||null,jersey_number:el('jersey').value?Number(el('jersey').value):null,phone:el('phone').value.trim()||null,address:el('address').value.trim()||null,position:el('position').value.trim()||null,status:el('status').value,club_id:el('club').value||null,registration_approval_status:el('approval').value||null};try{const r=await db.from('players').update(payload).eq('id',player.id);if(r.error)throw r.error;message('✅ Mabadiliko yamehifadhiwa. Tunafungua profile...',false);setTimeout(()=>location.href='./player-profile.html?id='+encodeURIComponent(player.id),700)}catch(err){message('❌ Hifadhi imeshindikana: '+(err.message||err),true)}finally{btn.disabled=false;btn.textContent='💾 Hifadhi Mabadiliko'}});
init();
</script>
<script src="./afrn-player-photo-global.js"></script>
</body></html>
