<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRN — Hariri Mchezaji</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:16px;padding:16px;margin-top:12px}h2{margin-top:0}label{display:block;font-size:12px;font-weight:800;margin-bottom:10px}input,select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #d4dbe6;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.save{background:#0d47a1;color:white}.back{background:#e9eef6;color:#172033}.status{padding:10px;border-radius:9px;background:#eef4ff;margin-bottom:12px;font-size:13px}.err{background:#fdecec;color:#842029}@media(max-width:520px){.grid{grid-template-columns:1fr}.actions>*{width:100%;text-align:center}}</style></head>
<body><main><a class="btn back" id="back" href="./divisions.html">← Rudi</a><section class="card"><h2>✏️ Hariri Mchezaji</h2><div id="who" class="status">Inapakia taarifa za mchezaji...</div><div id="msg" class="status" style="display:none"></div>
<form id="form"><div class="grid">
<label>Jina la kwanza *<input id="first" required></label><label>Jina la kati<input id="middle"></label><label>Jina la mwisho<input id="last"></label><label>Tarehe ya kuzaliwa<input id="dob" type="date"></label><label>Uraia<input id="nationality"></label><label>Namba ya jezi<input id="jersey" type="number" min="0"></label><label>Simu<input id="phone" type="tel"></label><label>Anwani<input id="address"></label><label>Nafasi ya mchezaji<input id="position"></label><label>Status<select id="status"><option value="active">active</option><option value="inactive">inactive</option><option value="suspended">suspended</option></select></label><label>Klabu ya sasa<select id="club"><option value="">— Free Agent / Hakuna klabu —</option></select></label><label>Status ya usajili<select id="approval"><option value="">— Haijawekwa —</option><option value="PENDING">PENDING</option><option value="APPROVED">APPROVED</option><option value="REJECTED">REJECTED</option></select></label>
</div><div class="actions"><button class="back" type="button" id="cancel">Ghairi</button><button class="save" type="submit" id="save">💾 Hifadhi Mabadiliko</button></div></form></section></main>
<script>
const db=window.supabaseClient;const id=new URLSearchParams(location.search).get('id');let player=null;
const el=x=>document.getElementById(x);
function message(s,bad){el('msg').style.display='block';el('msg').className='status'+(bad?' err':'');el('msg').textContent=s}
el('back').href=id?'./player-profile.html?id='+encodeURIComponent(id):'./divisions.html';el('cancel').onclick=()=>location.href=id?'./player-profile.html?id='+encodeURIComponent(id):'./divisions.html';
async function init(){if(!db||!id){el('who').textContent='❌ Muunganisho au Player ID haujapatikana.';return}
const r=await db.from('players').select('*').eq('id',id).maybeSingle();if(r.error||!r.data){el('who').textContent='❌ Mchezaji hakupatikana: '+(r.error?r.error.message:'');return}player=r.data;el('who').textContent=(player.first_name||'')+' '+(player.last_name||'')+' · AFRN Player ID: '+(player.player_id_number||'—');
[['first','first_name'],['middle','middle_name'],['last','last_name'],['dob','date_of_birth'],['nationality','nationality'],['jersey','jersey_number'],['phone','phone'],['address','address'],['position','position'],['status','status'],['approval','registration_approval_status']].forEach(pair=>el(pair[0]).value=player[pair[1]]==null?'':String(player[pair[1]]));
const c=await db.from('clubs').select('id,name,division').order('name');if(c.error){message('Imeshindwa kupakia vilabu: '+c.error.message,true);return}for(const club of c.data||[]){const op=document.createElement('option');op.value=club.id;op.textContent=club.name+(club.division?' · '+club.division:'');el('club').appendChild(op)}el('club').value=player.club_id||''
}
el('form').addEventListener('submit',async e=>{e.preventDefault();if(!player)return;const btn=el('save');btn.disabled=true;btn.textContent='Inahifadhi...';const payload={first_name:el('first').value.trim(),middle_name:el('middle').value.trim()||null,last_name:el('last').value.trim()||null,date_of_birth:el('dob').value||null,nationality:el('nationality').value.trim()||null,jersey_number:el('jersey').value?Number(el('jersey').value):null,phone:el('phone').value.trim()||null,address:el('address').value.trim()||null,position:el('position').value.trim()||null,status:el('status').value,club_id:el('club').value||null,registration_approval_status:el('approval').value||null};try{const r=await db.from('players').update(payload).eq('id',player.id);if(r.error)throw r.error;message('✅ Mabadiliko yamehifadhiwa. Tunafungua profile...',false);setTimeout(()=>location.href='./player-profile.html?id='+encodeURIComponent(player.id),700)}catch(err){message('❌ Hifadhi imeshindikana: '+(err.message||err),true)}finally{btn.disabled=false;btn.textContent='💾 Hifadhi Mabadiliko'}});
init();
</script></body></html>
