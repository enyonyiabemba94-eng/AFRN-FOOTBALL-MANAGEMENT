<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AFRN - Official Match Report</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --navy:#071a33;
  --blue:#0d47a1;
  --gold:#f5b400;
  --bg:#f2f5f9;
  --white:#fff;
  --text:#172033;
  --muted:#687386;
  --danger:#c62828;
  --yellow:#f5b400;
  --green:#16834b;
  --border:#dce2ea;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:linear-gradient(
    135deg,
    #06152b,
    #0d47a1
  );
  color:white;
  padding:18px;
  text-align:center;
}

header img{
  width:75px;
  height:75px;
  object-fit:contain;
  margin-bottom:8px;
}

header h1{
  margin:0;
  font-size:21px;
}

header h2{
  margin:7px 0;
  font-size:14px;
}

header p{
  margin:4px 0;
  font-size:11px;
  opacity:.85;
}

nav{
  background:white;
  padding:10px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}

nav a{
  text-decoration:none;
  white-space:nowrap;
  padding:9px 12px;
  border-radius:9px;
  color:var(--text);
  font-size:13px;
  font-weight:bold;
}

nav a.active{
  background:var(--blue);
  color:white;
}

main{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.status{
  background:white;
  border-left:4px solid var(--blue);
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:13px;
}

.status.ok{
  border-left-color:var(--green);
}

.status.err{
  border-left-color:var(--danger);
  color:var(--danger);
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

select,
input,
textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:9px;
  background:white;
  font-family:inherit;
}

.toolbar select{
  flex:1;
  min-width:220px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:var(--blue);
  color:white;
}

.gold{
  background:var(--gold);
  color:#111;
}

.secondary{
  background:#e8edf5;
  color:var(--text);
}

.danger{
  background:#fee;
  color:var(--danger);
}

.report{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 25px #00000012;
}

.report-header{
  text-align:center;
  border-bottom:3px solid var(--blue);
  padding-bottom:18px;
}

.report-logo{
  width:95px;
  height:95px;
  object-fit:contain;
  margin-bottom:8px;
}

.report-header h1{
  margin:4px 0;
  color:var(--navy);
  font-size:23px;
}

.report-header h2{
  margin:7px 0;
  color:var(--blue);
  font-size:15px;
}

.report-header p{
  margin:5px 0;
  color:var(--muted);
  font-size:12px;
}

.official-title{
  margin-top:12px;
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
}

.competition-title{
  text-align:center;
  margin:20px 0;
  font-size:17px;
  font-weight:900;
  color:var(--blue);
}

.match-score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:20px;
  align-items:center;
  text-align:center;
  margin:20px 0;
}

.team-name{
  font-size:20px;
  font-weight:900;
}

.big-score{
  font-size:32px;
  font-weight:900;
}

.vs{
  color:var(--muted);
  font-weight:bold;
}

.match-info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:20px 0;
}

.info-box{
  background:#f6f8fb;
  border-radius:10px;
  padding:11px;
  font-size:12px;
}

.info-box b{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.section{
  margin-top:25px;
}

.section-title{
  background:var(--navy);
  color:white;
  padding:11px 13px;
  border-radius:9px;
  font-size:14px;
  font-weight:900;
}

.teams-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:12px;
}

.team-card{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.team-card h3{
  margin:0;
  padding:12px;
  background:#eef4ff;
  color:var(--blue);
  font-size:15px;
}

.form-grid{
  padding:12px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.form-group label{
  display:block;
  font-size:11px;
  font-weight:bold;
  color:var(--muted);
  margin-bottom:4px;
}

.full{
  grid-column:1/-1;
}

.lineup-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

.lineup-table th,
.lineup-table td{
  padding:9px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:12px;
}

.lineup-table th{
  background:#f5f7fa;
  color:var(--muted);
}

.events-summary{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-top:12px;
}

.stat-box{
  background:#f5f7fa;
  padding:12px 6px;
  text-align:center;
  border-radius:9px;
}

.stat-box strong{
  display:block;
  font-size:20px;
}

.stat-box span{
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
}

.event{
  border-left:4px solid var(--blue);
  background:#f8fafc;
  padding:11px;
  margin-top:8px;
  border-radius:7px;
}

.event.goal{
  border-left-color:var(--green);
}

.event.yellow{
  border-left-color:var(--yellow);
}

.event.red{
  border-left-color:var(--danger);
}

.event-minute{
  font-weight:900;
  color:var(--blue);
}

.event-type{
  font-weight:bold;
}

.report-box{
  background:#f7f9fc;
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px;
  min-height:90px;
  white-space:pre-wrap;
}

.report-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.empty{
  background:white;
  border:1px dashed #cbd3df;
  padding:30px;
  text-align:center;
  border-radius:14px;
  color:var(--muted);
}

.hidden{
  display:none;
}

@media(max-width:750px){

  .teams-grid{
    grid-template-columns:1fr;
  }

  .match-info{
    grid-template-columns:1fr 1fr;
  }

  .events-summary{
    grid-template-columns:repeat(3,1fr);
  }

  .team-name{
    font-size:15px;
  }

  .big-score{
    font-size:25px;
  }

@media(max-width:500px){

  .report{
    padding:14px;

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

    gap:8px;
  }

@media print{

  body{
    background:white;
  }

  nav,
  .toolbar,
  .status,

    display:none !important;
  }

  main{
    padding:0;
    max-width:none;
  }

  .report{
    box-shadow:none;
    border:0;
  }

</style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jjqhvruppafpumcthmwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   TABLES
===================================================== */

const MATCHES_TABLE =
"matches";

const CLUBS_TABLE =
"clubs";

const COMPETITIONS_TABLE =
"competitions";

const EVENTS_TABLE =
"match_events";

const PLAYERS_TABLE =
"players";


/* =====================================================
   DATA
===================================================== */

let matches = [];

let clubs = [];

let competitions = [];

let players = [];

let events = [];


/* =====================================================
   HELPERS
===================================================== */

function $(id){

return document.getElementById(id);

}


function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}


function setStatus(message,type=""){

$("status").textContent =
message;

$("status").className =
"status " + type;

}


/* =====================================================
   CLUB NAME
===================================================== */

function clubName(id){

const club =
clubs.find(
c => String(c.id) === String(id)
);

return club
? club.name
: "Unknown Club";

}


/* =====================================================
   PLAYER NAME
===================================================== */

function playerName(id){

const player =
players.find(
p => String(p.id) === String(id)
);

if(!player){

return "Unknown Player";

}

return [

player.first_name,
player.middle_name,
player.last_name

]

.filter(Boolean)
.join(" ");

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

const {data,error} =
await db
.from(MATCHES_TABLE)
.select(`
id,
competition_id,
home_team_id,
away_team_id,
match_date,
match_time,
venue,
home_score,
away_score,
status,
referee,
match_number,
notes,
created_at
`)
.order(
"match_date",
{
ascending:false
}
);

if(error){

console.error(error);

setStatus(
"❌ Matches: " + error.message,
"err"
);

return;

}

matches =
data || [];

populateMatchSelect();

}


/* =====================================================
   MATCH SELECT
===================================================== */

function populateMatchSelect(){

const select =
$("matchSelect");

select.innerHTML = `
<option value="">
Chagua Mechi
</option>
`;

matches.forEach(match => {

const competition =
competitions.find(
c => String(c.id) ===
String(match.competition_id)
);

const text =

clubName(match.home_team_id)
+
" VS "
+
clubName(match.away_team_id)
+
" • "
+
(
match.match_date || ""
)
+
(
competition
? " • " + competition.name
: ""
);

const option =
document.createElement("option");

option.value =
match.id;

option.textContent =
text;

select.appendChild(option);

});

}


/* =====================================================
   LOAD CLUBS
===================================================== */

async function loadClubs(){

const {data,error} =
await db
.from(CLUBS_TABLE)
.select("*")
.order(
"name",
{
ascending:true
}
);

if(error){

console.error(error);

setStatus(
"❌ Clubs: " + error.message,
"err"
);

return;

}

clubs =
data || [];

}


/* =====================================================
   LOAD COMPETITIONS
===================================================== */

async function loadCompetitions(){

const {data,error} =
await db
.from(COMPETITIONS_TABLE)
.select("*")
.order(
"name",
{
ascending:true
}
);

if(error){

console.error(error);

setStatus(
"❌ Competitions: " + error.message,
"err"
);

return;

}

competitions =
data || [];

}


/* =====================================================
   LOAD PLAYERS
===================================================== */

async function loadPlayers(){

const {data,error} =
await db
.from(PLAYERS_TABLE)
.select("*");

if(error){

console.warn(
"Players table:",
error.message
);

players = [];

return;

}

players =
data || [];

}


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadEvents(matchId){

const {data,error} =
await db
.from(EVENTS_TABLE)
.select(`
id,
match_id,
player_id,
event_type,
minute,
description,
created_at
`)
.eq(
"match_id",
matchId
)
.order(
"minute",
{
ascending:true
}
);

if(error){

console.error(error);

events = [];

return;

}

events =
data || [];

}


/* =====================================================
   EVENT TYPE
===================================================== */

function eventClass(type){

const value =
String(type || "")
.toLowerCase();

if(
value.includes("goal")
){

return "goal";

}

if(
value.includes("yellow")
){

return "yellow";

}

if(
value.includes("red")
){

return "red";

}

return "";

}


/* =====================================================
   EVENT ICON
===================================================== */

function eventIcon(type){

const value =
String(type || "")
.toLowerCase();

if(value.includes("goal"))
return "⚽";

if(value.includes("yellow"))
return "🟨";

if(value.includes("red"))
return "🟥";

if(
value.includes("sub")
)
return "🔄";

if(
value.includes("penalty")
)
return "🎯";

return "📌";

}


/* =====================================================
   EVENT STATISTICS
===================================================== */

function eventStats(){

let goals = 0;

let yellow = 0;

let red = 0;

let substitutions = 0;

let penalties = 0;

let ownGoals = 0;

events.forEach(event => {

const type =
String(
event.event_type || ""
).toLowerCase();

if(
type.includes("own goal")
){

ownGoals++;

}else if(
type.includes("goal")
){

goals++;

}

if(
type.includes("yellow")
){

yellow++;

}

if(
type.includes("red")
){

red++;

}

if(
type.includes("sub")
){

substitutions++;

}

if(
type.includes("penalty")
){

penalties++;

}

});

return {
goals,
yellow,
red,
substitutions,
penalties,
ownGoals,
total:events.length
};

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(){

if(!events.length){

return `
<div class="empty">
⚽ Hakuna events zilizowekwa kwenye mechi hii.
</div>
`;

}

return events.map(event => {

const type =
event.event_type || "Event";

return `

<div class="event ${eventClass(type)}">

<div>

<span class="event-minute">
${esc(event.minute ?? "-")}'
</span>

&nbsp;

<span class="event-type">

${eventIcon(type)}
${esc(type)}

</span>

</div>

<div style="margin-top:5px;font-weight:bold;">

${esc(
playerName(event.player_id)
)}

</div>

${
event.description
?
`<div style="
margin-top:4px;
font-size:11px;
color:#687386;
">
${esc(event.description)}
</div>`
:
""
}

</div>

`;

}).join("");

}

);

matches.find(
m => String(m.id) ===
