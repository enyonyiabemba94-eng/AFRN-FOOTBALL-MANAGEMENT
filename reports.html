<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AFRN - Report Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><h1>AFRN FOOTBALL MANAGEMENT</h1><p>SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU</p><p>AFRN REPORT CENTER — OFFICIAL DOCUMENTS & STATISTICS</p></header>
<main><div id="status">⏳ Inaunganisha...</div><div id="stats"></div><div class="tabs"><button data-tab="match">🏟️ Match Report</button><button data-tab="player">👤 Player Report</button><button data-tab="club">⚽ Club Report</button><button data-tab="transfer">🔄 Transfer Report</button><button data-tab="competition">🏆 Competition</button></div>
<section id="matchPanel"><h2>🏟️ Official Match Report</h2><select id="matchSelect"><option value="">Chagua Mechi</option></select><button onclick="loadMatchReport()">📋 Fungua Ripoti</button><button onclick="window.print()">🖨️ Print / PDF</button></section>
<section id="playerPanel" hidden><h2>👤 Player Report</h2><input id="playerSearch" placeholder="Tafuta mchezaji kwa jina au AFRN Player ID"><select id="playerSelect"><option value="">Chagua Mchezaji</option></select><button onclick="loadPlayerReport()">📋 Fungua</button><div id="playerReport"></div></section>
<section id="clubPanel" hidden><h2>⚽ Club Report</h2><select id="clubSelect"><option value="">Chagua Klabu</option></select><button onclick="loadClubReport()">📋 Fungua</button><div id="clubReport"></div></section>
<section id="transferPanel" hidden><h2>🔄 Transfer Report</h2><input id="transferSearch" placeholder="Tafuta player, club au transfer number"><button onclick="renderTransfers()">🔎 Tafuta</button><div id="transferTable"></div></section>
<section id="competitionPanel" hidden><h2>🏆 Competition & Standings Report</h2><select id="competitionSelect"><option value="">Chagua Mashindano</option></select><button onclick="loadCompetitionReport()">📋 Fungua</button><div id="competitionReport"></div></section>
<section id="reportPanel" hidden><div id="reportContainer"></div></section></main>
<script>
const SUPABASE_URL='https://jjqhvruppafpumcthmwe.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let matches=[],clubs=[],players=[],competitions=[],transfers=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const fullName=p=>[p?.first_name,p?.middle_name,p?.last_name].filter(Boolean).join(' ')||p?.name||'Unknown Player';const clubName=id=>clubs.find(c=>String(c.id)===String(id))?.name||'Unknown Club';
const isPlayed=m=>['finished','completed'].includes(String(m?.status||'').trim().toLowerCase());
const photoUrl=v=>{const x=String(v??'').trim();if(!x)return '';if(/^https?:\/\//i.test(x))return x;const path=x.replace(/^\/+,'').replace(/^AFRN(?:%20| )PLAYER(?:%20| )PHOTOS\//i,'');return db.storage.from('AFRN PLAYER PHOTOS').getPublicUrl(path).data?.publicUrl||''};
function setStatus(m){$('status').textContent=m}function fillSelect(id,data,label){const s=$(id),first=s.options[0]?.text||'Chagua';s.innerHTML='';const o=document.createElement('option');o.value='';o.textContent=first;s.appendChild(o);data.forEach(x=>{const q=document.createElement('option');q.value=x.id;q.textContent=label(x);s.appendChild(q)})}
async function loadAll(){setStatus('⏳ Inapakia taarifa za AFRN...');const r=await Promise.all([db.from('clubs').select('*').order('name'),db.from('players').select('*').order('last_name'),db.from('competitions').select('*').order('name'),db.from('matches').select('*').order('match_date',{ascending:false}),db.from('transfers').select('*').order('created_at',{ascending:false})]);clubs=r[0].data||[];players=r[1].data||[];competitions=r[2].data||[];matches=r[3].data||[];transfers=r[4].data||[];r.forEach((x,i)=>{if(x.error)console.warn('Report source '+i,x.error.message)});$('stats').textContent=`Mechi: ${matches.length} | Wachezaji: ${players.length} | Vilabu: ${clubs.length} | Transfers: ${transfers.length}`;fillSelect('matchSelect',matches,m=>`${clubName(m.home_team_id)} vs ${clubName(m.away_team_id)} • ${m.match_date||''}`);fillSelect('playerSelect',players,p=>`${fullName(p)} • ${p.player_id_number||''}`);fillSelect('clubSelect',clubs,c=>c.name);fillSelect('competitionSelect',competitions,c=>c.name);renderTransfers();setStatus('✅ Report Center imeunganishwa vizuri.')}
function activate(tab){document.querySelectorAll('.tabs button').forEach(b=>b.hidden=false);['match','player','club','transfer','competition'].forEach(x=>$(x+'Panel').hidden=x!==tab);$('reportPanel').hidden=true}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>activate(b.dataset.tab));$('playerSearch').oninput=()=>{const q=$('playerSearch').value.toLowerCase().trim();[...$('playerSelect').options].forEach(o=>{if(o.value)o.hidden=q&&!o.textContent.toLowerCase().includes(q)})};
async function loadMatchReport(){const id=$('matchSelect').value;if(!id)return alert('⚠️ Chagua mechi kwanza.');const m=matches.find(x=>String(x.id)===String(id));if(!m)return;const ev=await db.from('match_events').select('id,match_id,player_id,event_type,minute,description,created_at').eq('match_id',id).order('minute');const events=ev.data||[];const comp=competitions.find(c=>String(c.id)===String(m.competition_id));$('reportPanel').hidden=false;$('reportContainer').innerHTML=`<article><h1>AFRN FOOTBALL MANAGEMENT</h1><h2>OFFICIAL MATCH REPORT</h2><h3>${esc(comp?.name||'Competition')}</h3><h2>${esc(clubName(m.home_team_id))} ${esc(m.home_score??0)} - ${esc(m.away_score??0)} ${esc(clubName(m.away_team_id))}</h2><p>Tarehe: ${esc(m.match_date||'-')} | Muda: ${esc(m.match_time||'-')} | Uwanja: ${esc(m.venue||'-')} | Mwamuzi: ${esc(m.referee||'-')}</p><h3>Events (${events.length})</h3>${events.map(e=>{const p=players.find(x=>String(x.id)===String(e.player_id)),u=photoUrl(p?.photo_url);return `<div>${u?`<img src="${esc(u)}" width="38">`:''}${esc(e.minute??'-')}' — ${esc(e.event_type||'Event')} — ${esc(fullName(p))}${e.description?` — ${esc(e.description)}`:''}</div>`}).join('')||'<p>Hakuna events.</p>'}<p><b>Notes:</b> ${esc(m.notes||'-')}</p></article>`}
async function loadPlayerReport(){const id=$('playerSelect').value;if(!id)return alert('⚠️ Chagua mchezaji kwanza.');const p=players.find(x=>String(x.id)===String(id));const cs=await db.from('player_contracts').select('*').eq('player_id',id).order('created_at',{ascending:false});const u=photoUrl(p?.photo_url);$('playerReport').innerHTML=`<article>${u?`<img src="${esc(u)}" width="85">`:''}<h2>${esc(fullName(p))}</h2><p>AFRN Player ID: <b>${esc(p.player_id_number||'-')}</b></p><p>${esc(p.position||'-')} | ${esc(p.nationality||'-')} | ${esc(clubName(p.club_id))} | ${esc(p.status||'-')}</p><h3>Contract</h3><p>${cs.data?.[0]?esc((cs.data[0].start_date||'-')+' → '+(cs.data[0].end_date||'-')+' • '+(cs.data[0].status||'Active')):'Hakuna mkataba.'}</p></article>`}
function loadClubReport(){const id=$('clubSelect').value;if(!id)return alert('⚠️ Chagua klabu kwanza.');const squad=players.filter(p=>String(p.club_id)===String(id)),played=matches.filter(m=>String(m.home_team_id)===String(id)||String(m.away_team_id)===String(id));$('clubReport').innerHTML=`<article><h2>⚽ ${esc(clubName(id))}</h2><p>Wachezaji: ${squad.length} | Mechi: ${played.length} | Mechi zilizochezwa: ${played.filter(isPlayed).length}</p><h3>SQUAD</h3>${squad.map(p=>`<div>${esc(fullName(p))} — ${esc(p.position||'-')}</div>`).join('')||'<p>Hakuna wachezaji.</p>'}</article>`}
function renderTransfers(){const q=($('transferSearch')?.value||'').toLowerCase().trim();const rows=transfers.filter(t=>{const p=players.find(x=>String(x.id)===String(t.player_id));return !q||`${t.transfer_number||''} ${fullName(p)} ${clubName(t.from_club_id)} ${clubName(t.to_club_id)}`.toLowerCase().includes(q)});$('transferTable').innerHTML=rows.map(t=>{const p=players.find(x=>String(x.id)===String(t.player_id));return `<div><b>${esc(t.transfer_number||t.id)}</b> — ${esc(fullName(p))} — ${esc(clubName(t.from_club_id))} → ${esc(clubName(t.to_club_id))} — ${esc(t.status||'-')}</div>`}).join('')||'Hakuna transfers.'}
function loadCompetitionReport(){const id=$('competitionSelect').value;if(!id)return alert('⚠️ Chagua mashindano kwanza.');const c=competitions.find(x=>String(x.id)===String(id)),ms=matches.filter(m=>String(m.competition_id)===String(id));const rows=clubs.filter(cl=>ms.some(m=>String(m.home_team_id)===String(cl.id)||String(m.away_team_id)===String(cl.id))).map(cl=>{let P=0,W=0,D=0,L=0,GF=0,GA=0;ms.filter(m=>isPlayed(m)&&(String(m.home_team_id)===String(cl.id)||String(m.away_team_id)===String(cl.id))).forEach(m=>{const h=String(m.home_team_id)===String(cl.id),a=Number(h?m.home_score:m.away_score)||0,b=Number(h?m.away_score:m.home_score)||0;P++;GF+=a;GA+=b;if(a>b)W++;else if(a===b)D++;else L++});return{n:cl.name,P,W,D,L,GF,GA,GD:GF-GA,pts:W*3+D}}).sort((a,b)=>b.pts-a.pts||b.GD-a.GD||b.GF-a.GF);$('competitionReport').innerHTML=`<article><h2>🏆 ${esc(c?.name||'Competition')}</h2><p>Mechi zote: ${ms.length} | Zilizochezwa: ${ms.filter(isPlayed).length}</p><table border="1" cellpadding="7"><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}</td><td>${r.GA}</td><td>${r.GD}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></article>`}
loadAll().catch(e=>{console.error(e);setStatus('❌ Imeshindwa kupakia: '+e.message)});
</script><script src="./afrn-player-photo-global.js"></script></body></html>
