<!DOCTYPE html>
<html lang="sw">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AFRN - Official Match Report</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --navy:#071a33;
  --blue:#0d47a1;
  --gold:#f5b400;
  --bg:#f4f7fb;
  --white:#ffffff;
  --text:#172033;
  --muted:#687386;
  --danger:#c62828;
  --success:#16834b;
  --border:#dce2ea;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(
    135deg,
    #06152b,
    #0d47a1
  );

  color:white;
  padding:16px;

  box-shadow:0 3px 12px #0003;
}

.header-inner{
  max-width:1200px;
  margin:auto;

  display:flex;
  align-items:center;
  gap:14px;
}

.afrn-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  background:white;
  border-radius:10px;
  padding:4px;
}

.header-title h1{
  margin:0;
  font-size:20px;
}

.header-title p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.9;
}

/* =========================
   NAV
========================= */

nav{
  background:white;
  padding:10px;

  display:flex;
  gap:7px;

  overflow-x:auto;

  border-bottom:1px solid var(--border);
}

nav a{
  text-decoration:none;
  white-space:nowrap;

  padding:9px 12px;

  border-radius:9px;

  color:var(--text);

  font-size:13px;
  font-weight:bold;
}

nav a.active{
  background:var(--blue);
  color:white;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

/* =========================
   STATUS
========================= */

.status{
  background:white;

  padding:12px;

  border-radius:10px;

  margin-bottom:15px;

  border-left:4px solid var(--blue);

  font-size:13px;
}

.status.ok{
  border-left-color:var(--success);
}

.status.err{
  border-left-color:var(--danger);
  color:var(--danger);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

select,
input,
textarea{
  width:100%;

  padding:11px;

  border:1px solid var(--border);

  border-radius:9px;

  background:white;

  font-family:inherit;
}

.toolbar select{
  flex:1;
  min-width:220px;
}

/* =========================
   BUTTONS
========================= */

button{
  border:0;
  border-radius:9px;

  padding:11px 15px;

  font-weight:bold;

  cursor:pointer;
}

.primary{
  background:var(--blue);
  color:white;
}

.gold{
  background:var(--gold);
  color:#111;
}

.danger{
  background:#fee;
  color:var(--danger);
}

.secondary{
  background:#e8edf5;
  color:var(--text);
}

/* =========================
   REPORT
========================= */

.report{
  background:white;

  border-radius:16px;

  box-shadow:0 5px 25px #14213d18;

  overflow:hidden;

  border:1px solid var(--border);
}

.report-header{
  text-align:center;

  padding:25px 18px 20px;

  border-bottom:4px solid var(--gold);
}

.report-header img{
  width:80px;
  height:80px;

  object-fit:contain;

  margin-bottom:8px;
}

.report-header h1{
  margin:4px 0;

  font-size:22px;

  color:var(--navy);
}

.report-header h2{
  margin:5px 0;

  font-size:16px;

  color:var(--blue);
}

.report-header p{
  margin:4px 0;

  font-weight:bold;

  font-size:13px;
}

/* =========================
   MATCH SCORE
========================= */

.match-info{
  padding:20px;
}

.competition-name{
  text-align:center;

  font-weight:bold;

  color:var(--blue);

  margin-bottom:15px;
}

.teams{
  display:grid;

  grid-template-columns:1fr auto 1fr;

  align-items:center;

  gap:20px;

  text-align:center;
}

.team-name{
  font-size:22px;

  font-weight:900;

  color:var(--navy);
}

.score{
  font-size:38px;

  font-weight:900;

  color:var(--blue);

  white-space:nowrap;
}

.team-label{
  color:var(--muted);

  font-size:11px;

  margin-top:5px;
}

/* =========================
   DETAILS
========================= */

.details{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  padding:0 20px 20px;
}

.detail{
  background:#f7f9fc;

  padding:12px;

  border-radius:10px;

  font-size:12px;
}

.detail b{
  display:block;

  color:var(--muted);

  font-size:10px;

  margin-bottom:5px;
}

/* =========================
   SECTION
========================= */

.section{
  padding:20px;

  border-top:1px solid var(--border);
}

.section-title{
  margin:0 0 14px;

  color:var(--navy);

  font-size:17px;

  display:flex;

  align-items:center;

  gap:7px;
}

/* =========================
   EVENTS
========================= */

.event{
  display:grid;

  grid-template-columns:70px 130px 1fr;

  gap:10px;

  align-items:center;

  padding:10px;

  border-bottom:1px solid #edf0f4;

  font-size:13px;
}

.event-minute{
  font-weight:bold;
  color:var(--blue);
}

.event-type{
  font-weight:bold;
}

.event-description{
  color:var(--muted);
}

.event.goal .event-type{
  color:var(--success);
}

.event.yellow .event-type{
  color:#b88600;
}

.event.red .event-type{
  color:var(--danger);
}

/* =========================
   REPORT BOX
========================= */

.report-box{
  background:#f8fafc;

  border:1px solid var(--border);

  border-radius:12px;

  padding:15px;

  min-height:100px;

  white-space:pre-wrap;

  line-height:1.6;

  font-size:13px;
}

.empty{
  color:var(--muted);

  text-align:center;

  padding:20px;
}

/* =========================
   PRINT FOOTER
========================= */

.official-footer{
  text-align:center;

  padding:20px;

  border-top:1px solid var(--border);

  font-size:11px;

  color:var(--muted);
}

.official-footer strong{
  display:block;

  color:var(--navy);

  font-size:12px;

  margin-bottom:4px;
}

/* =========================
   REPORT FORM
========================= */

.report-form{
  background:#f8fafc;

  padding:15px;

  border-radius:12px;

  border:1px solid var(--border);
}

.form-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;

  font-size:12px;

  font-weight:bold;

  margin-bottom:5px;
}

.form-actions{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .details{
    grid-template-columns:1fr 1fr;
  }

  .teams{
    gap:8px;
  }

  .team-name{
    font-size:15px;
  }

  .score{
    font-size:27px;
  }

  .event{
    grid-template-columns:50px 100px 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

}

@media(max-width:500px){

  .header-inner{
    align-items:flex-start;
  }

  .header-title h1{
    font-size:16px;
  }

  .header-title p{
    font-size:10px;
  }

  .afrn-logo{
    width:48px;
    height:48px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .teams{
    grid-template-columns:1fr;
  }

  .score{
    order:2;
  }

  .event{
    grid-template-columns:1fr;
  }

}

/* =========================
   PRINT
========================= */

@media print{

  body{
    background:white;
  }

  header,
  nav,
  .toolbar,
  #status,
  .report-form,
  .no-print{
    display:none !important;
  }

  main{
    max-width:none;
    padding:0;
  }

  .report{
    box-shadow:none;
    border:0;
  }

  .section{
    break-inside:avoid;
  }

}

</style>

</head>

<div class="toolbar no-print">

Chagua Mechi

     OFFICIAL REPORT

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jjqhvruppafpumcthmwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   TABLES
===================================================== */

const MATCHES_TABLE =
"matches";

const CLUBS_TABLE =
"clubs";

const COMPETITIONS_TABLE =
"competitions";

const EVENTS_TABLE =
"match_events";


/* =====================================================
   AFRN LOGO
===================================================== */

const AFRN_LOGO =
"./afrn-logo.png";


/* =====================================================
   DATA
===================================================== */

let matches = [];
let clubs = [];
let competitions = [];
let events = [];


/* =====================================================
   SELECTOR
===================================================== */

const $ =
id => document.getElementById(id);


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type=""
){

  $("status").textContent =
    message;

  $("status").className =
    "status " + type;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])
  );

}


/* =====================================================
   LOAD CLUBS
===================================================== */

async function loadClubs(){

  const {
    data,
    error
  } =
  await db
  .from(CLUBS_TABLE)
  .select("*")
  .order(
    "name",
    {
      ascending:true
    }
  );

  if(error){

    console.error(error);

    setStatus(
      "❌ Vilabu havijapakiwa: " +
      error.message,
      "err"
    );

    return;
  }

  clubs =
    data || [];

}


/* =====================================================
   CLUB NAME
===================================================== */

function getClubName(id){

  const club =
    clubs.find(
      c =>
      String(c.id) ===
      String(id)
    );

  return club
    ? club.name
    : "Unknown Club";

}


/* =====================================================
   LOAD COMPETITIONS
===================================================== */

async function loadCompetitions(){

  const {
    data,
    error
  } =
  await db
  .from(COMPETITIONS_TABLE)
  .select("*")
  .order(
    "name",
    {
      ascending:true
    }
  );

  if(error){

    console.error(error);

    setStatus(
      "❌ Mashindano hayajapakiwa: " +
      error.message,
      "err"
    );

    return;
  }

  competitions =
    data || [];

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

  const {
    data,
    error
  } =
  await db
  .from(MATCHES_TABLE)
  .select(`
    id,
    competition_id,
    home_team_id,
    away_team_id,
    match_date,
    match_time,
    venue,
    home_score,
    away_score,
    status,
    referee,
    match_number,
    notes,
    created_at
  `)
  .order(
    "match_date",
    {
      ascending:true,
      nullsFirst:false
    }
  );

  if(error){

    console.error(error);

    setStatus(
      "❌ Mechi hazijapakiwa: " +
      error.message,
      "err"
    );

    return;
  }

  matches =
    data || [];

  populateMatchSelect();

}


/* =====================================================
   MATCH SELECT
===================================================== */

function populateMatchSelect(){

  const select =
    $("matchSelect");

  select.innerHTML = `

    <option value="">
      Chagua Mechi
    </option>

  `;

  matches.forEach(
    match => {

      const home =
        getClubName(
          match.home_team_id
        );

      const away =
        getClubName(
          match.away_team_id
        );

      const competition =
        competitions.find(
          c =>
          String(c.id) ===
          String(match.competition_id)
        );

      const option =
        document.createElement(
          "option"
        );

      option.value =
        match.id;

      option.textContent =
        `${home} vs ${away} — ${
          competition
          ? competition.name
          : "Competition"
        }`;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadEvents(matchId){

  const {
    data,
    error
  } =
  await db
  .from(EVENTS_TABLE)
  .select("*")
  .eq(
    "match_id",
    matchId
  )
  .order(
    "minute",
    {
      ascending:true
    }
  );

  if(error){

    console.warn(
      "Match events:",
      error.message
    );

    events = [];

    return;
  }

  events =
    data || [];

}


/* =====================================================
   EVENT ICON
===================================================== */

function eventIcon(type){

  const value =
    String(type || "")
    .toLowerCase();

  if(
    value.includes("goal")
  ){
    return "⚽";
  }

  if(
    value.includes("yellow")
  ){
    return "🟨";
  }

  if(
    value.includes("red")
  ){
    return "🟥";
  }

  if(
    value.includes("sub")
  ){
    return "🔄";
  }

  if(
    value.includes("penalty")
  ){
    return "⚽";
  }

  return "📌";

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(){

  if(!events.length){

    return `
      <div class="empty">
        Hakuna events zilizowekwa kwenye mechi hii.
      </div>
    `;

  }

  return events
    .map(
      event => {

        const type =
          event.event_type ||
          event.type ||
          "Event";

        const minute =
          event.minute != null
          ? `${event.minute}'`
          : "-";

        const description =
          event.description ||
          "";

        const player =
          event.player_name ||
          "";

        return `

          <div class="event">

            <div class="event-minute">
              ${esc(minute)}
            </div>

            <div class="event-type">
              ${eventIcon(type)}
              ${esc(type)}
            </div>

            <div class="event-description">

              ${esc(player)}

              ${player && description
                ? " — "
                : ""}

              ${esc(description)}

            </div>

          </div>

        `;

      }
    )
    .join("");

}


/* =====================================================
   SHOW REPORT
===================================================== */

async function showReport(id){

  const match =
    matches.find(
      m =>
      String(m.id) ===
      String(id)
    );

  if(!match){

    return;
  }

  await loadEvents(id);

  const competition =
    competitions.find(
      c =>
      String(c.id) ===
      String(match.competition_id)
    );

  const home =
    getClubName(
      match.home_team_id
    );

  const away =
    getClubName(
      match.away_team_id
    );

  const homeScore =
    match.home_score ?? 0;

  const awayScore =
    match.away_score ?? 0;

  const stage =
    match.stage ||
    "Group Stage";

  const refereeReport =
    match.referee_report ||
    match.referee_notes ||
    "";

  const commissionerReport =
    match.commissioner_report ||
    match.commissioner_notes ||
    "";


  $("reportContainer").innerHTML = `

    <article class="report">

      <!-- REPORT HEADER -->

      <div class="report-header">

        <img
          src="${AFRN_LOGO}"
          alt="AFRN Logo">

        <h1>
          AFRN FOOTBALL MANAGEMENT
        </h1>

        <h2>
          SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU
        </h2>

        <p>
          OFFICIAL MATCH REPORT
        </p>

      </div>


      <!-- MATCH INFORMATION -->

      <div class="match-info">

        <div class="competition-name">

          🏆
          ${esc(
            competition
            ? competition.name
            : "Competition"
          )}

          <br>

          <small>
            ${esc(stage)}
          </small>

        </div>


        <div class="teams">

          <div>

            <div class="team-name">
              ${esc(home)}
            </div>

            <div class="score">
              ${esc(homeScore)}
            </div>

            <div class="team-label">
              HOME
            </div>

          </div>


          <div>
            <strong>
              VS
            </strong>
          </div>


          <div>

            <div class="team-name">
              ${esc(away)}
            </div>

            <div class="score">
              ${esc(awayScore)}
            </div>

            <div class="team-label">
              AWAY
            </div>

          </div>

        </div>

      </div>


      <!-- DETAILS -->

      <div class="details">

        <div class="detail">

          <b>
            📅 DATE
          </b>

          ${esc(
            match.match_date || "-"
          )}

        </div>


        <div class="detail">

          <b>
            ⏰ TIME
          </b>

          ${esc(
            match.match_time || "-"
          )}

        </div>


        <div class="detail">

          <b>
            🏟️ VENUE
          </b>

          ${esc(
            match.venue || "-"
          )}

        </div>


        <div class="detail">

          <b>
            👨‍⚖️ REFEREE
          </b>

          ${esc(
            match.referee || "-"
          )}

        </div>

      </div>


      <!-- EVENTS -->

      <section class="section">

        <h3 class="section-title">
          ⚽ Match Events
        </h3>

        ${renderEvents()}

      </section>


      <!-- NOTES -->

      <section class="section">

        <h3 class="section-title">
          📝 Match Notes
        </h3>

        <div class="report-box">

          ${
            esc(
              match.notes ||
              "Hakuna maelezo ya mechi."
            )
          }

        </div>

      </section>


      <!-- REFEREE REPORT -->

      <section class="section">

        <h3 class="section-title">
          👨‍⚖️ Referee Report
        </h3>

        <div class="report-box">

          ${
            refereeReport
            ? esc(refereeReport)
            : "Taarifa ya mwamuzi bado haijaingizwa."
          }

        </div>

      </section>


      <!-- COMMISSIONER REPORT -->

      <section class="section">

        <h3 class="section-title">
          👔 Commissioner Report
        </h3>

        <div class="report-box">

          ${
            commissionerReport
            ? esc(commissionerReport)
            : "Taarifa ya kamisaa bado haijaingizwa."
          }

        </div>

      </section>


      <!-- OFFICIAL FOOTER -->

      <div class="official-footer">

        <strong>
          AFRN FOOTBALL MANAGEMENT
        </strong>

        SHIRIKISHO LA MPIRA WA MIGUU KAMBINI NYARUGUSU

        <br><br>

        Official Competition & Match Record

      </div>

    </article>

  `;

}


/* =====================================================
   SELECT EVENT
===================================================== */

$("matchSelect").addEventListener(
  "change",
  function(){

    if(!this.value){

      $("reportContainer").innerHTML = `

        <div class="empty">

          Chagua mechi ili kuona
          Official Match Report.

        </div>

      `;

      return;
    }

    showReport(
      this.value
    );

  }
);


/* =====================================================
   PRINT
===================================================== */

$("printBtn").onclick =
function(){

  if(
    !$("matchSelect").value
  ){

    alert(
      "⚠️ Kwanza chagua mechi."
    );

    return;
  }

  window.print();

};


/* =====================================================
   INIT
===================================================== */

async function init(){

  try{

    await loadClubs();

    await loadCompetitions();

    await loadMatches();

    setStatus(
      "✅ AFRN imeunganishwa vizuri.",
      "ok"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Mfumo umepata hitilafu: " +
      error.message,
      "err"
    );

  }

}
