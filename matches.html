<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AFRN Football Management - Matches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --navy:#071a33;
  --blue:#0d47a1;
  --gold:#f5b400;
  --bg:#f4f7fb;
  --white:#fff;
  --text:#172033;
  --muted:#687386;
  --danger:#c62828;
  --ok:#16834b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#06152b,#0d47a1);
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 12px #0002;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.85;
}

/* NAV */

nav{
  background:white;
  padding:10px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}

nav a{
  text-decoration:none;
  white-space:nowrap;
  padding:9px 12px;
  border-radius:9px;
  color:#172033;
  font-size:13px;
  font-weight:bold;
}

nav a.active{
  background:var(--blue);
  color:white;
}

/* MAIN */

main{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

/* STATUS */

.status{
  background:white;
  padding:11px 13px;
  border-radius:10px;
  margin-bottom:15px;
  border-left:4px solid var(--blue);
  font-size:13px;
}

.status.ok{
  border-left-color:var(--ok);
}

.status.err{
  border-left-color:var(--danger);
  color:var(--danger);
}

/* TOOLBAR */

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}

.toolbar select,
.toolbar input{
  flex:1;
  min-width:180px;
  padding:12px;
  border:1px solid #d5dce7;
  border-radius:10px;
  background:white;
}

/* BUTTONS */

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:var(--blue);
  color:white;
}

.gold{
  background:var(--gold);
  color:#111;
}

.danger{
  background:#fee;
  color:var(--danger);
}

.secondary{
  background:#e8edf5;
  color:#172033;
}

/* CARD */

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 3px 15px #14213d12;
  border:1px solid #e7ebf1;
}

.match-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.match-number{
  font-size:12px;
  font-weight:bold;
  color:var(--blue);
}

.match-status{
  padding:5px 9px;
  border-radius:999px;
  background:#eef4ff;
  color:var(--blue);
  font-size:11px;
  font-weight:bold;
}

/* LOGO */

.afrn-logo{
  width:48px;
  height:48px;
  object-fit:contain;
  display:block;
  margin:auto;
}

/* MATCH */

.match{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:15px;
  text-align:center;
}

.team{
  font-weight:800;
  font-size:16px;
}

.team small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
  font-weight:normal;
}

.score{
  font-size:27px;
  font-weight:900;
  margin-top:4px;
}

.vs{
  font-size:13px;
  color:var(--muted);
  font-weight:bold;
}

/* DETAILS */

.details{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.detail{
  background:#f7f9fc;
  border-radius:9px;
  padding:9px;
  font-size:12px;
}

.detail b{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

/* FORM */

form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
}

.field{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1px solid #d4dbe6;
  border-radius:9px;
  background:white;
}

textarea.field{
  resize:vertical;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:8px;
}

/* EMPTY */

.empty{
  background:white;
  border:1px dashed #cbd3df;
  padding:30px;
  text-align:center;
  border-radius:14px;
  color:var(--muted);
}

/* DIALOG */

dialog{
  width:min(700px,94vw);
  border:0;
  border-radius:18px;
  padding:0;
  box-shadow:0 20px 60px #0005;
}

dialog::backdrop{
  background:#00112a99;
}

.modal{
  padding:18px;
}

.modal h2{
  margin:0 0 15px;
}

/* RESPONSIVE */

@media(max-width:700px){

  form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .details{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .match{
    gap:7px;
  }

  .team{
    font-size:13px;
  }

  .score{
    font-size:21px;
  }

}

</style>

</head>

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://jjqhvruppafpumcthmwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   TABLE NAMES
===================================================== */

const MATCHES_TABLE =
"matches";

const CLUBS_TABLE =
"clubs";

const COMPETITIONS_TABLE =
"competitions";


/* =====================================================
   AFRN LOGO
===================================================== */

const AFRN_LOGO =
"./afrn-logo.png";


/* =====================================================
   DATA
===================================================== */

let matches = [];

let clubs = [];

let competitions = [];


/* =====================================================
   SHORT SELECTOR
===================================================== */

const $ =
id => document.getElementById(id);


/* =====================================================
   STATUS
===================================================== */

function setStatus(message,type=""){

  $("status").textContent =
  message;

  $("status").className =
  "status " + type;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


/* =====================================================
   LOAD COMPETITIONS
===================================================== */

async function loadCompetitions(){

  const {
    data,
    error
  } =
  await db
  .from(COMPETITIONS_TABLE)
  .select("*")
  .order(
    "name",
    {
      ascending:true
    }
  );

  if(error){

    console.error(error);

    setStatus(
      "❌ Competition haijapakiwa: " +
      error.message,
      "err"
    );

    return;

  }

  competitions =
  data || [];

  renderCompetitionSelects();

}


/* =====================================================
   RENDER COMPETITIONS
===================================================== */

function renderCompetitionSelects(){

  const filter =
  $("competitionFilter");

  const form =
  $("competitionId");


  filter.innerHTML = `
    <option value="">
      Chagua Competition
    </option>
  `;


  form.innerHTML = `
    <option value="">
      Chagua Competition
    </option>
  `;


  competitions.forEach(
    competition => {

      const option1 =
      document.createElement(
        "option"
      );

      option1.value =
      competition.id;

      option1.textContent =
      competition.name;

      filter.appendChild(
        option1
      );


      const option2 =
      document.createElement(
        "option"
      );

      option2.value =
      competition.id;

      option2.textContent =
      competition.name;

      form.appendChild(
        option2
      );

    }
  );

}


/* =====================================================
   LOAD CLUBS
===================================================== */

async function loadClubs(){

  const {
    data,
    error
  } =
  await db
  .from(CLUBS_TABLE)
  .select("*")
  .order(
    "name",
    {
      ascending:true
    }
  );


  if(error){

    console.error(error);

    setStatus(
      "❌ Vilabu havijapakiwa: " +
      error.message,
      "err"
    );

    return;

  }


  clubs =
  data || [];

}


/* =====================================================
   GET CLUB NAME
===================================================== */

function getClubName(id){

  const club =
  clubs.find(
    club =>
    String(club.id) ===
    String(id)
  );


  if(!club){

    return "Unknown Club";

  }


  return club.name || "Unnamed Club";

}


/* =====================================================
   POPULATE TEAMS
===================================================== */

function populateTeams(
  homeId="",
  awayId=""
){

  const home =
  $("homeTeamId");

  const away =
  $("awayTeamId");


  home.innerHTML = `
    <option value="">
      Chagua Home Team
    </option>
  `;


  away.innerHTML = `
    <option value="">
      Chagua Away Team
    </option>
  `;


  clubs.forEach(
    club => {

      const homeOption =
      document.createElement(
        "option"
      );

      homeOption.value =
      club.id;

      homeOption.textContent =
      club.name;

      home.appendChild(
        homeOption
      );


      const awayOption =
      document.createElement(
        "option"
      );

      awayOption.value =
      club.id;

      awayOption.textContent =
      club.name;

      away.appendChild(
        awayOption
      );

    }
  );


  home.value =
  homeId || "";


  away.value =
  awayId || "";

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

  setStatus(
    "⏳ Inapakia ratiba..."
  );


  const {
    data,
    error
  } =
  await db
  .from(MATCHES_TABLE)
  .select(`
    id,
    competition_id,
    home_team_id,
    away_team_id,
    match_date,
    match_time,
    venue,
    home_score,
    away_score,
    status,
    referee,
    match_number,
    notes,
    created_at
  `)
  .order(
    "match_date",
    {
      ascending:true,
      nullsFirst:false
    }
  );


  if(error){

    console.error(error);


    setStatus(
      "❌ Ratiba haijapakiwa: " +
      error.message,
      "err"
    );


    $("matchesContainer").innerHTML = `

      <div class="empty">

        ❌ Imeshindikana kupakia mechi.

        <br><br>

        ${esc(error.message)}

      </div>

    `;

    return;

  }


  matches =
  data || [];


  renderMatches();


  setStatus(
    "✅ Supabase imeunganishwa • Mechi " +
    matches.length,
    "ok"
  );

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(){

  const competition =
  $("competitionFilter").value;

  const status =
  $("statusFilter").value;

  const search =
  $("search")
  .value
  .trim()
  .toLowerCase();


  const filtered =
  matches.filter(
    match => {

      const home =
      getClubName(
        match.home_team_id
      ).toLowerCase();


      const away =
      getClubName(
        match.away_team_id
      ).toLowerCase();


      const venue =
      String(
        match.venue || ""
      ).toLowerCase();


      const referee =
      String(
        match.referee || ""
      ).toLowerCase();


      const competitionMatch =
      !competition ||
      String(
        match.competition_id
      ) ===
      String(competition);


      const statusMatch =
      !status ||
      String(
        match.status || ""
      ) ===
      String(status);


      const searchMatch =
      !search ||

      home.includes(search) ||

      away.includes(search) ||

      venue.includes(search) ||

      referee.includes(search);


      return (
        competitionMatch &&
        statusMatch &&
        searchMatch
      );

    }
  );


  if(!filtered.length){

    $("matchesContainer").innerHTML = `

      <div class="empty">

        📅 Hakuna mechi zilizopatikana.

      </div>

    `;

    return;

  }


  $("matchesContainer").innerHTML =
  filtered
  .map(matchCard)
  .join("");

}


/* =====================================================
   MATCH CARD
===================================================== */

function matchCard(match){

  const competition =
  competitions.find(
    competition =>
    String(competition.id) ===
    String(match.competition_id)
  );


  const competitionName =
  competition
  ? competition.name
  : "Competition";


  const home =
  getClubName(
    match.home_team_id
  );


  const away =
  getClubName(
    match.away_team_id
  );


  const homeScore =
  match.home_score ?? 0;


  const awayScore =
  match.away_score ?? 0;


  return `

  <article class="card">


    <div class="match-header">


      <div>

        <img
          class="afrn-logo"
          src="${AFRN_LOGO}"
          alt="AFRN Logo"
          onerror="this.style.display='none'"
        >

        <div class="match-number">

          ${
            match.match_number
            ? "Match #" +
              esc(match.match_number)
            : "Match"
          }

        </div>

      </div>


      <div class="match-status">

        ${esc(
          match.status ||
          "Scheduled"
        )}

      </div>


    </div>


    <div style="
      text-align:center;
      font-size:12px;
      color:#687386;
      margin-bottom:12px;
    ">

      🏆 ${esc(competitionName)}

    </div>


    <div class="match">


      <div class="team">

        ${esc(home)}

        <div class="score">

          ${esc(homeScore)}

        </div>

        <small>
          HOME
        </small>

      </div>


      <div class="vs">

        VS

      </div>


      <div class="team">

        ${esc(away)}

        <div class="score">

          ${esc(awayScore)}

        </div>

        <small>
          AWAY
        </small>

      </div>


    </div>


    <div class="details">


      <div class="detail">

        <b>📅 DATE</b>

        ${esc(
          match.match_date || "-"
        )}

      </div>


      <div class="detail">

        <b>⏰ TIME</b>

        ${esc(
          match.match_time || "-"
        )}

      </div>


      <div class="detail">

        <b>🏟️ VENUE</b>

        ${esc(
          match.venue || "-"
        )}

      </div>


      <div class="detail">

        <b>👨‍⚖️ REFEREE</b>

        ${esc(
          match.referee || "-"
        )}

      </div>


    </div>


    ${
      match.notes
      ? `

        <div
          class="detail"
          style="margin-top:8px;"
        >

          <b>📝 NOTES</b>

          ${esc(match.notes)}

        </div>

      `
      : ""
    }


    <div class="form-actions">


      <button
        class="gold"
        onclick="editMatch('${esc(match.id)}')"
      >

        ✏️ Hariri

      </button>


      <button
        class="danger"
        onclick="deleteMatch('${esc(match.id)}')"
      >

        🗑️ Futa

      </button>


    </div>


  </article>

  `;

}


/* =====================================================
   ADD MATCH
===================================================== */

$("addMatchBtn").onclick =
function(){

  $("matchForm").reset();

  $("editId").value = "";

  $("homeScore").value = 0;

  $("awayScore").value = 0;

  $("matchStatus").value =
  "Scheduled";

  populateTeams();

  $("modalTitle").textContent =
  "🏟️ Ongeza Mechi";

  $("matchDialog").showModal();

};


/* =====================================================
   CANCEL
===================================================== */

$("cancelBtn").onclick =
function(){

  $("matchDialog").close();

};


/* =====================================================
   PREVENT SAME TEAM
===================================================== */

$("homeTeamId").addEventListener(
  "change",
  function(){

    if(
      this.value &&
      this.value ===
      $("awayTeamId").value
    ){

      alert(
        "⚠️ Home Team na Away Team haziwezi kuwa timu moja."
      );

      this.value = "";

    }

  }
);


$("awayTeamId").addEventListener(
  "change",
  function(){

    if(
      this.value &&
      this.value ===
      $("homeTeamId").value
    ){

      alert(
        "⚠️ Home Team na Away Team haziwezi kuwa timu moja."
      );

      this.value = "";

    }

  }
);


/* =====================================================
   SAVE MATCH
===================================================== */

$("matchForm").onsubmit =
async function(e){

  e.preventDefault();


  const editId =
  $("editId")
  .value
  .trim();


  const competitionId =
  $("competitionId")
  .value;


  const homeTeamId =
  $("homeTeamId")
  .value;


  const awayTeamId =
  $("awayTeamId")
  .value;


  if(
    !competitionId ||
    !homeTeamId ||
    !awayTeamId
  ){

    alert(
      "⚠️ Competition, Home Team na Away Team ni lazima."
    );

    return;

  }


  if(
    homeTeamId ===
    awayTeamId
  ){

    alert(
      "⚠️ Home Team na Away Team haziwezi kuwa timu moja."
    );

    return;

  }


  const payload = {

    competition_id:
    competitionId,

    home_team_id:
    homeTeamId,

    away_team_id:
    awayTeamId,

    match_date:
    $("matchDate").value ||
    null,

    match_time:
    $("matchTime").value ||
    null,

    venue:
    $("venue").value.trim() ||
    null,

    home_score:
    Number(
      $("homeScore").value || 0
    ),

    away_score:
    Number(
      $("awayScore").value || 0
    ),

    status:
    $("matchStatus").value,

    referee:
    $("referee").value.trim() ||
    null,

    match_number:
    $("matchNumber").value
    ? Number(
        $("matchNumber").value
      )
    : null,

    notes:
    $("notes").value.trim() ||
    null

  };


  $("saveBtn").disabled =
  true;


  setStatus(
    editId
    ? "⏳ Inasasisha mechi..."
    : "⏳ Inahifadhi mechi..."
  );


  let result;


  if(editId){

    result =
    await db
    .from(MATCHES_TABLE)
    .update(payload)
    .eq(
      "id",
      editId
    );

  }else{

    result =
    await db
    .from(MATCHES_TABLE)
    .insert(
      payload
    );

  }


  if(result.error){

    console.error(
      result.error
    );


    setStatus(
      "❌ Mechi haijahifadhiwa: " +
      result.error.message,
      "err"
    );


    alert(
      "❌ Mechi haijahifadhiwa:\n\n" +
      result.error.message
    );


    $("saveBtn").disabled =
    false;

    return;

  }


  $("matchDialog").close();


  $("saveBtn").disabled =
  false;


  await loadMatches();

};


/* =====================================================
   EDIT MATCH
===================================================== */

window.editMatch =
function(id){

  const match =
  matches.find(
    m =>
    String(m.id) ===
    String(id)
  );


  if(!match){

    return;

  }


  $("editId").value =
  match.id;


  $("competitionId").value =
  match.competition_id || "";


  populateTeams(
    match.home_team_id,
    match.away_team_id
  );


  $("matchDate").value =
  match.match_date || "";


  $("matchTime").value =
  match.match_time || "";


  $("venue").value =
  match.venue || "";


  $("homeScore").value =
  match.home_score ?? 0;


  $("awayScore").value =
  match.away_score ?? 0;


  $("matchStatus").value =
  match.status ||
  "Scheduled";


  $("referee").value =
  match.referee || "";


  $("matchNumber").value =
  match.match_number || "";


  $("notes").value =
  match.notes || "";


  $("modalTitle").textContent =
  "✏️ Hariri Mechi";


  $("matchDialog").showModal();

};


/* =====================================================
   DELETE MATCH
===================================================== */

window.deleteMatch =
async function(id){

  const match =
  matches.find(
    m =>
    String(m.id) ===
    String(id)
  );


  if(!match){

    return;

  }


  const home =
  getClubName(
    match.home_team_id
  );


  const away =
  getClubName(
    match.away_team_id
  );


  if(
    !confirm(
      "Futa mechi:\n\n" +
      home +
      " VS " +
      away +
      "?"
    )
  ){

    return;

  }


  setStatus(
    "⏳ Inafuta mechi..."
  );


  const {
    error
  } =
  await db
  .from(MATCHES_TABLE)
  .delete()
  .eq(
    "id",
    id
  );


  if(error){

    console.error(error);


    setStatus(
      "❌ Imeshindikana kufuta: " +
      error.message,
      "err"
    );


    alert(
      error.message
    );

    return;

  }


  await loadMatches();

};


/* =====================================================
   FILTER EVENTS
===================================================== */

$("competitionFilter")
.onchange =
renderMatches;


$("statusFilter")
.onchange =
renderMatches;


$("search")
.oninput =
renderMatches;


/* =====================================================
   INITIALIZE
===================================================== */

async function init(){

  await loadCompetitions();

  await loadClubs();

  populateTeams();

  await loadMatches();

}


/* START */

init();

</script>
