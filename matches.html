<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AFRN Football Management - Matches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --navy:#071a33;
  --blue:#0d47a1;
  --gold:#f5b400;
  --bg:#f3f6fa;
  --white:#fff;
  --text:#172033;
  --muted:#687386;
  --danger:#c62828;
  --green:#16834b;
  --yellow:#f5b400;
  --border:#dce2ea;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

/* =====================================================
   HEADER
===================================================== */

header{
  background:linear-gradient(
    135deg,
    #06152b,
    #0d47a1
  );

  color:white;

  padding:18px;

  text-align:center;

  box-shadow:0 3px 15px #0003;
}

header img{
  width:75px;
  height:75px;

  object-fit:contain;

  margin-bottom:7px;
}

header h1{
  margin:0;

  font-size:21px;
}

header h2{
  margin:7px 0 3px;

  font-size:14px;
}

header p{
  margin:4px 0 0;

  font-size:11px;

  opacity:.85;
}

/* =====================================================
   NAVIGATION
===================================================== */

nav{
  background:white;

  padding:10px;

  display:flex;

  gap:7px;

  overflow-x:auto;

  border-bottom:1px solid #ddd;
}

nav a{
  text-decoration:none;

  white-space:nowrap;

  padding:9px 12px;

  border-radius:9px;

  color:var(--text);

  font-size:13px;

  font-weight:bold;
}

nav a.active{
  background:var(--blue);

  color:white;
}

/* =====================================================
   MAIN
===================================================== */

main{
  max-width:1200px;

  margin:auto;

  padding:16px;
}

/* =====================================================
   STATUS
===================================================== */

.status{
  background:white;

  border-left:4px solid var(--blue);

  padding:12px;

  border-radius:10px;

  margin-bottom:15px;

  font-size:13px;
}

.status.ok{
  border-left-color:var(--green);
}

.status.err{
  border-left-color:var(--danger);

  color:var(--danger);
}

/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-bottom:16px;
}

.toolbar select,
.toolbar input{
  flex:1;

  min-width:190px;

  padding:12px;

  border:1px solid var(--border);

  border-radius:10px;

  background:white;
}

/* =====================================================
   BUTTONS
===================================================== */

button{
  border:0;

  border-radius:10px;

  padding:11px 15px;

  font-weight:bold;

  cursor:pointer;
}

button:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.primary{
  background:var(--blue);

  color:white;
}

.gold{
  background:var(--gold);

  color:#111;
}

.secondary{
  background:#e8edf5;

  color:var(--text);
}

.danger{
  background:#fee;

  color:var(--danger);
}

.green{
  background:var(--green);

  color:white;
}

/* =====================================================
   MATCH CARD
===================================================== */

.card{
  background:white;

  border-radius:16px;

  padding:16px;

  margin-bottom:14px;

  border:1px solid #e5eaf0;

  box-shadow:0 4px 18px #14213d12;
}

.match-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  flex-wrap:wrap;
}

.match-number{
  color:var(--blue);

  font-weight:bold;

  font-size:12px;
}

.match-status{
  background:#eef4ff;

  color:var(--blue);

  border-radius:999px;

  padding:6px 10px;

  font-size:11px;

  font-weight:bold;
}

.competition-name{
  text-align:center;

  margin:12px 0;

  color:var(--blue);

  font-weight:bold;

  font-size:13px;
}

.stage-label{
  text-align:center;

  color:var(--muted);

  font-size:12px;

  margin-bottom:12px;
}

.match{
  display:grid;

  grid-template-columns:1fr auto 1fr;

  gap:15px;

  align-items:center;

  text-align:center;
}

.team-name{
  font-size:18px;

  font-weight:900;
}

.score{
  font-size:30px;

  font-weight:900;

  margin-top:5px;
}

.vs{
  color:var(--muted);

  font-weight:bold;
}

/* =====================================================
   DETAILS
===================================================== */

.details{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  margin-top:15px;
}

.detail{
  background:#f6f8fb;

  padding:10px;

  border-radius:9px;

  font-size:12px;
}

.detail b{
  display:block;

  color:var(--muted);

  font-size:10px;

  margin-bottom:4px;
}

/* =====================================================
   FORM
===================================================== */

form{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;

  font-size:12px;

  font-weight:bold;

  margin-bottom:5px;
}

.field{
  width:100%;

  padding:11px;

  border:1px solid var(--border);

  border-radius:9px;

  background:white;

  font-family:inherit;
}

.form-actions{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:10px;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  background:white;

  border:1px dashed #cbd3df;

  padding:30px;

  text-align:center;

  border-radius:14px;

  color:var(--muted);
}

/* =====================================================
   REPORT
===================================================== */

.report{
  background:white;

  border-radius:16px;

  padding:25px;

  margin-top:25px;

  box-shadow:0 5px 25px #0002;
}

.report-header{
  text-align:center;

  border-bottom:3px solid var(--blue);

  padding-bottom:18px;
}

.report-logo{
  width:100px;

  height:100px;

  object-fit:contain;
}

.report-header h1{
  margin:5px 0;

  font-size:22px;
}

.report-header h2{
  margin:6px 0;

  color:var(--blue);

  font-size:15px;
}

.report-header p{
  margin:5px 0;

  color:var(--muted);

  font-size:12px;
}

.official-title{
  margin-top:12px;

  font-size:18px;

  font-weight:900;

  letter-spacing:1px;
}

.competition-title{
  text-align:center;

  margin:20px 0;

  font-size:17px;

  font-weight:900;

  color:var(--blue);
}

.match-score{
  display:grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  gap:20px;

  align-items:center;

  text-align:center;

  margin:20px 0;
}

.report-team{
  font-size:20px;

  font-weight:900;
}

.big-score{
  font-size:34px;

  font-weight:900;
}

.report-vs{
  color:var(--muted);

  font-weight:bold;
}

.match-info{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin:20px 0;
}

.info-box{
  background:#f6f8fb;

  border-radius:10px;

  padding:11px;

  font-size:12px;
}

.info-box b{
  display:block;

  color:var(--muted);

  font-size:10px;

  margin-bottom:4px;
}

/* =====================================================
   REPORT SECTIONS
===================================================== */

.report-section{
  margin-top:24px;
}

.report-title{
  background:var(--navy);

  color:white;

  padding:11px 13px;

  border-radius:9px;

  font-size:14px;

  font-weight:900;
}

.report-box{
  background:#f7f9fc;

  border:1px solid var(--border);

  border-radius:10px;

  padding:13px;

  margin-top:8px;

  min-height:70px;

  white-space:pre-wrap;
}

/* =====================================================
   EVENTS
===================================================== */

.event{
  border-left:4px solid var(--blue);

  background:#f8fafc;

  padding:11px;

  margin-top:8px;

  border-radius:7px;
}

.event.goal{
  border-left-color:var(--green);
}

.event.yellow{
  border-left-color:var(--yellow);
}

.event.red{
  border-left-color:var(--danger);
}

.event-minute{
  font-weight:900;

  color:var(--blue);
}

.event-type{
  font-weight:bold;
}

/* =====================================================
   STATISTICS
===================================================== */

.stats{
  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:8px;

  margin-top:12px;
}

.stat{
  background:#f5f7fa;

  padding:12px 5px;

  text-align:center;

  border-radius:9px;
}

.stat strong{
  display:block;

  font-size:20px;
}

.stat span{
  display:block;

  font-size:9px;

  color:var(--muted);

  margin-top:3px;
}

/* =====================================================
   DIALOG
===================================================== */

dialog{
  width:min(750px,94vw);

  border:0;

  border-radius:18px;

  padding:0;

  box-shadow:0 20px 60px #0005;
}

dialog::backdrop{
  background:#00112a99;
}

.modal{
  padding:18px;
}

.modal h2{
  margin:0 0 15px;
}

/* =====================================================
   REPORT ACTIONS
===================================================== */

.report-actions{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:20px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:750px){

  form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .details{
    grid-template-columns:1fr 1fr;
  }

  .match-info{
    grid-template-columns:1fr 1fr;
  }

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:500px){

  .match{
    gap:7px;
  }

  .team-name,
  .report-team{
    font-size:14px;
  }

  .score,
  .big-score{
    font-size:24px;
  }

  .report{
    padding:14px;
  }

}

/* =====================================================
   PRINT
===================================================== */

@media print{

  body{
    background:white;
  }

  header,
  nav,
  .toolbar,
  #status,
  .report-actions,
  .match-card-actions{
    display:none !important;
  }

  main{
    padding:0;

    max-width:none;
  }

  .report{
    box-shadow:none;

    margin:0;

    padding:10px;
  }

}

</style>

</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jjqhvruppafpumcthmwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_02hhRG8bgDOqSFxva8IMvQ_zWTLMa3G";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   TABLES
===================================================== */

const MATCHES_TABLE =
"matches";

const CLUBS_TABLE =
"clubs";

const COMPETITIONS_TABLE =
"competitions";

const EVENTS_TABLE =
"match_events";

const PLAYERS_TABLE =
"players";


/* =====================================================
   DATA
===================================================== */

let matches = [];

let clubs = [];

let competitions = [];

let players = [];

let events = [];


/* =====================================================
   HELPERS
===================================================== */

function $(id){

return document.getElementById(id);

}


function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}


function setStatus(message,type=""){

$("status").textContent =
message;

$("status").className =
"status " + type;

}


/* =====================================================
   CLUB NAME
===================================================== */

function clubName(id){

const club =
clubs.find(
c =>
String(c.id) ===
String(id)
);

return club
? club.name
: "Unknown Club";

}


/* =====================================================
   PLAYER NAME
===================================================== */

function playerName(id){

const player =
players.find(
p =>
String(p.id) ===
String(id)
);

if(!player){

return "Unknown Player";

}

return [

player.first_name,
player.middle_name,
player.last_name

]

.filter(Boolean)
.join(" ");

}


/* =====================================================
   LOAD CLUBS
===================================================== */

async function loadClubs(){

const {data,error} =
await db
.from(CLUBS_TABLE)
.select("*")
.order(
"name",
{
ascending:true
}
);

if(error){

console.error(error);

setStatus(
"❌ Vilabu havijapakiwa: " +
error.message,
"err"
);

return;

}

clubs =
data || [];

}


/* =====================================================
   LOAD COMPETITIONS
===================================================== */

async function loadCompetitions(){

const {data,error} =
await db
.from(COMPETITIONS_TABLE)
.select("*")
.order(
"name",
{
ascending:true
}
);

if(error){

console.error(error);

setStatus(
"❌ Competitions hazijapakiwa: " +
error.message,
"err"
);

return;

}

competitions =
data || [];

renderCompetitionSelects();

}


/* =====================================================
   COMPETITION SELECTS
===================================================== */

function renderCompetitionSelects(){

const filter =
$("competitionFilter");

const form =
$("competitionId");

filter.innerHTML = `
<option value="">
Chagua Competition
</option>
`;

form.innerHTML = `
<option value="">
Chagua Competition
</option>
`;

competitions.forEach(
competition => {

const option1 =
document.createElement("option");

option1.value =
competition.id;

option1.textContent =
competition.name;

filter.appendChild(
option1
);


const option2 =
document.createElement("option");

option2.value =
competition.id;

option2.textContent =
competition.name;

form.appendChild(
option2
);

});

}


/* =====================================================
   LOAD PLAYERS
===================================================== */

async function loadPlayers(){

const {data,error} =
await db
.from(PLAYERS_TABLE)
.select("*");

if(error){

console.warn(
"Players:",
error.message
);

players = [];

return;

}

players =
data || [];

}


/* =====================================================
   POPULATE TEAMS
===================================================== */

function populateTeams(
homeId="",
awayId=""
){

const home =
$("homeTeamId");

const away =
$("awayTeamId");


home.innerHTML = `
<option value="">
Chagua Home Team
</option>
`;

away.innerHTML = `
<option value="">
Chagua Away Team
</option>
`;


clubs.forEach(
club => {

const h =
document.createElement(
"option"
);

h.value =
club.id;

h.textContent =
club.name;

home.appendChild(h);


const a =
document.createElement(
"option"
);

a.value =
club.id;

a.textContent =
club.name;

away.appendChild(a);

});


home.value =
homeId || "";

away.value =
awayId || "";

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

setStatus(
"⏳ Inapakia ratiba..."
);


const {data,error} =
await db
.from(MATCHES_TABLE)
.select(`
id,
competition_id,
home_team_id,
away_team_id,
match_date,
match_time,
venue,
home_score,
away_score,
status,
referee,
match_number,
notes,
created_at
`)
.order(
"match_date",
{
ascending:true,
nullsFirst:false
}
);


if(error){

console.error(error);

setStatus(
"❌ Ratiba haijapakiwa: " +
error.message,
"err"
);

$("matchesContainer").innerHTML = `

<div class="empty">

❌ Imeshindikana kupakia mechi.

<br><br>

${esc(error.message)}

</div>

`;

return;

}

matches =
data || [];

renderMatches();

setStatus(
"✅ AFRN imeunganishwa • Mechi " +
matches.length,
"ok"
);

}


/* =====================================================
   FILTER
===================================================== */

function renderMatches(){

const competition =
$("competitionFilter").value;

const stage =
$("stageFilter").value;

const search =
$("search")
.value
.trim()
.toLowerCase();


const filtered =
matches.filter(
match => {

const home =
clubName(
match.home_team_id
)
.toLowerCase();

const away =
clubName(
match.away_team_id
)
.toLowerCase();

const venue =
String(
match.venue || ""
)
.toLowerCase();

const referee =
String(
match.referee || ""
)
.toLowerCase();

const notes =
String(
match.notes || ""
)
.toLowerCase();


return (

(!competition ||
String(
match.competition_id
) ===
String(competition))

&&

/*
  Stage haipo kwenye schema ya matches.
  Kwa hiyo filter hii haiwezi kutumika
  mpaka uwe na column ya stage.
*/
(!stage)

&&

(
!search ||

home.includes(search) ||

away.includes(search) ||

venue.includes(search) ||

referee.includes(search) ||

notes.includes(search)
)

/* =====================================================
   SAVE MATCH
===================================================== */

$("matchForm").onsubmit =
async function(e){

e.preventDefault();


const editId =
$("editId").value.trim();

const competitionId =
$("competitionId").value;

const homeTeamId =
$("homeTeamId").value;

const awayTeamId =
$("awayTeamId").value;


if(
!competitionId ||
!homeTeamId ||
!awayTeamId
){

alert(
"⚠️ Competition, Home Team na Away Team ni lazima."
);

return;

}


if(
homeTeamId ===
awayTeamId
){

alert(
"⚠️ Home Team na Away Team haziwezi kuwa timu moja."
);

return;

}


const payload = {

competition_id:
competitionId,

home_team_id:
homeTeamId,

away_team_id:
awayTeamId,

match_date:
$("matchDate").value ||
null,

match_time:
$("matchTime").value ||
null,

venue:
$("venue").value.trim() ||
null,

home_score:
Number(
$("homeScore").value || 0
),

away_score:
Number(
$("awayScore").value || 0
),

status:
$("matchStatus").value,

referee:
$("referee").value.trim() ||
null,

match_number:
$("matchNumber").value
?
Number(
$("matchNumber").value
)
:
null,

notes:
$("notes").value.trim() ||
null

};


$("saveBtn").disabled =
true;


setStatus(
editId
?
"⏳ Inasasisha mechi..."
:
"⏳ Inahifadhi mechi..."
);


let result;


if(editId){

result =
await db
.from(MATCHES_TABLE)
.update(payload)
.eq(
"id",
editId
);

}else{

result =
await db
.from(MATCHES_TABLE)
.insert(
payload
);

}


if(result.error){

console.error(result.error);

setStatus(
"❌ Mechi haijahifadhiwa: " +
result.error.message,
"err"
);

alert(
"❌ Mechi haijahifadhiwa:\n\n" +
result.error.message
);

$("saveBtn").disabled =
false;

return;

}


$("matchDialog").close();

$("saveBtn").disabled =
false;


await loadMatches();

};

const home =

){

);

await db
.from(MATCHES_TABLE)
.delete()
.eq(

);

);

return;

$("reportContainer").innerHTML = "";

await loadMatches();

};


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadEvents(matchId){

const {data,error} =
await db
.from(EVENTS_TABLE)
.select(`
id,
match_id,
player_id,
event_type,
minute,
description,
created_at
`)
.eq(
"match_id",
matchId
)
.order(
"minute",
{
ascending:true
}
);


if(error){

console.error(error);

events = [];

return;

}


events =
data || [];

}


/* =====================================================
   EVENT CLASS
===================================================== */

function eventClass(type){

const value =
String(type || "")
.toLowerCase();


if(
value.includes("goal")
){

return "goal";

}

if(
value.includes("yellow")
){

return "yellow";

}

if(
value.includes("red")
){

return "red";

}

return "";

}


/* =====================================================
   EVENT ICON
===================================================== */

function eventIcon(type){

const value =
String(type || "")
.toLowerCase();


if(
value.includes("goal")
){

return "⚽";

}

if(
value.includes("yellow")
){

return "🟨";

}

if(
value.includes("red")
){

return "🟥";

}

if(
value.includes("sub")
){

return "🔄";

}

if(
value.includes("penalty")
){

return "🎯";

}

return "📌";

}


/* =====================================================
   EVENT STATISTICS
===================================================== */

function eventStats(){

let goals = 0;

let yellow = 0;

let red = 0;

let substitutions = 0;

let penalties = 0;


events.forEach(
event => {

const type =
String(
event.event_type || ""
).toLowerCase();


if(
type.includes("goal")
){

goals++;

}

if(
type.includes("yellow")
){

yellow++;

}

if(
type.includes("red")
){

red++;

}

if(
type.includes("sub")
){

substitutions++;

}

if(
type.includes("penalty")
){

penalties++;

}

});


return {

goals,

yellow,

red,

substitutions,

penalties,

total:
events.length

};

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(){

if(!events.length){

return `

<div class="empty">

⚽ Hakuna events zilizowekwa kwenye mechi hii.

</div>

`;

}


return events
.map(
event => {

const type =
event.event_type ||
"Event";


return `

<div class="event ${eventClass(type)}">

<div>

<span class="event-minute">

${esc(event.minute ?? "-")}'
    
</span>

&nbsp;

<span class="event-type">

${eventIcon(type)}

${esc(type)}

</span>

</div>


<div
style="
margin-top:5px;
font-weight:bold;
">

${esc(
playerName(
event.player_id
)
)}

</div>


${
event.description
?
`
<div
style="
margin-top:4px;
font-size:11px;
color:#687386;
">

${esc(
event.description
)}

</div>
`
:
""
}

</div>

`;

})
.join("");

}
